const TEACHER_COLORS = {
  'Pavel':      {bg:'rgba(47,93,80,.13)',  border:'rgba(47,93,80,.35)',  hover:'rgba(47,93,80,.22)',  dot:'#2F5D50', text:'#1a3d30'},
  'Jelena':     {bg:'rgba(124,58,237,.1)', border:'rgba(124,58,237,.3)', hover:'rgba(124,58,237,.2)', dot:'#7c3aed', text:'#4c1d95'},
  'Elizaveta':  {bg:'rgba(37,99,235,.1)',  border:'rgba(37,99,235,.3)',  hover:'rgba(37,99,235,.2)',  dot:'#2563eb', text:'#1e3a8a'},
  'Angelina':   {bg:'rgba(219,39,119,.1)', border:'rgba(219,39,119,.3)', hover:'rgba(219,39,119,.2)', dot:'#db2777', text:'#831843'},
};
const DEFAULT_TEACHER_COLOR = {bg:'rgba(201,136,42,.09)',border:'rgba(201,136,42,.25)',hover:'rgba(201,136,42,.18)',dot:'#C9882A',text:'#92400e'};
function teacherColor(teacher) {
  if(!teacher) return DEFAULT_TEACHER_COLOR;
  const key = Object.keys(TEACHER_COLORS).find(k=>normalizeText(k)===normalizeText(teacher));
  return key ? TEACHER_COLORS[key] : DEFAULT_TEACHER_COLOR;
}

// ── ÕPILASE OTSING (autocomplete) ────────────────────────────
function StuSearch({value, onChange, onPick, students, placeholder}) {
  const [query, setQuery] = React.useState('');
  const [open, setOpen] = React.useState(false);
  const blurTimer = React.useRef(null);

  React.useEffect(()=>{ setQuery(value||''); },[value]);

  const matches = React.useMemo(()=>{
    const sorted = [...students].sort((a,b)=>normalizeText(a.name).localeCompare(normalizeText(b.name),'et'));
    const q = normalizeText(query);
    if(!q) return sorted;
    return sorted.filter(s=>
      normalizeText(s.name).includes(q)||normalizeText(s.group||'').includes(q)||normalizeText(s.subject||'').includes(q)
    );
  },[query,students]);

  const pick = student => {
    clearTimeout(blurTimer.current);
    setQuery(student.name);
    onChange(student.name);
    if(onPick) onPick(student);
    setOpen(false);
  };

  return(
    <div style={{position:'relative'}}>
      <input value={query}
        onChange={e=>{setQuery(e.target.value);onChange(e.target.value);setOpen(true);}}
        onFocus={()=>setOpen(true)}
        onBlur={()=>{blurTimer.current=setTimeout(()=>setOpen(false),200);}}
        placeholder={placeholder||'Otsi õpilast…'}
        style={{width:'100%'}} autoComplete="off"/>
      {open&&matches.length>0&&(
        <div onMouseDown={e=>e.preventDefault()} style={{
          position:'absolute',top:'calc(100% + 4px)',left:0,right:0,zIndex:200,
          background:'#fff',border:'1px solid rgba(28,43,58,.12)',borderRadius:10,
          boxShadow:'0 8px 24px rgba(28,43,58,.14)',maxHeight:240,overflowY:'auto'
        }} className="scroll">
          {matches.map(s=>(
            <button key={s.id} onMouseDown={()=>pick(s)}
              style={{width:'100%',textAlign:'left',padding:'8px 12px',border:'none',
                borderBottom:'1px solid rgba(28,43,58,.05)',background:'transparent',cursor:'pointer'}}
              onMouseEnter={e=>e.currentTarget.style.background='#F9F8F6'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <div style={{fontWeight:700,fontSize:'.84rem',color:'#1C2B3A'}}>{s.name}</div>
              <div style={{fontSize:'.7rem',color:'#42536A',marginTop:1}}>
                {[s.subject,s.level&&s.targetLevel?`${s.level}→${s.targetLevel}`:null,s.group].filter(Boolean).join(' · ')}
              </div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// ── TUNNIPLAAN ────────────────────────────────────────────────
function CalendarView({user,myStudents,schedule,groups,isAdmin,filterT,setFilterT,
  schStu,setSchStu,schDate,setSchDate,schTime,setSchTime,schTeach,setSchTeach,
  schRecurring,setSchRecurring,addSchedule,openScheduleEditor,delSchedule,markAttendance,openStudent,
  quickCompleteLesson,db,notify,logActivity,students,staffMembers=[],setSelStu,setTab,tariffAssignments=[]}) {

  const [showCanceled,setShowCanceled] = React.useState(true);
  const [weekOffset,setWeekOffset]     = React.useState(0);
  const [isCompactSchedule,setIsCompactSchedule] = React.useState(() =>
    typeof window!=='undefined'&&Boolean(window.matchMedia?.('(max-width: 767px)').matches)
  );
  const [viewMode,setViewMode]         = React.useState(()=>isCompactSchedule?'day':'week'); // 'month' | 'week' | 'day'
  const [selectedDay,setSelectedDay]   = React.useState(()=>isCompactSchedule?today():null);  // iso string for day view
  const [monthAnchor,setMonthAnchor]   = React.useState(today());
  // Popup creation (Google-style)
  const [createPopup,setCreatePopup]   = React.useState(null);  // {x,y,day,slot,anchorEl}
  const [popupStu,setPopupStu]         = React.useState('');
  const [popupStudentId,setPopupStudentId] = React.useState('');
  const [popupTeach,setPopupTeach]     = React.useState('Pavel');
  const [popupDur,setPopupDur]         = React.useState(60);
  const [popupRecurring,setPopupRecurring] = React.useState(false);
  const [popupSaving,setPopupSaving]   = React.useState(false);
  // Sidebar
  const [plannerSearch,setPlannerSearch] = React.useState('');
  const [plannerFilter,setPlannerFilter] = React.useState('all');
  // Drag & drop
  const [dragEv,setDragEv]   = React.useState(null);
  const [dragOver,setDragOver] = React.useState(null);
  const [dragging,setDragging] = React.useState(false);
  const [highlightedConflict,setHighlightedConflict] = React.useState(null);

  React.useEffect(()=>{
    if(typeof window==='undefined'||!window.matchMedia) return undefined;
    const media=window.matchMedia('(max-width: 767px)');
    const sync=()=>setIsCompactSchedule(media.matches);
    sync();
    if(media.addEventListener) media.addEventListener('change',sync);
    else media.addListener(sync);
    return()=>{
      if(media.removeEventListener) media.removeEventListener('change',sync);
      else media.removeListener(sync);
    };
  },[]);

  React.useEffect(()=>{
    if(!isCompactSchedule||viewMode!=='week') return;
    setSelectedDay(current=>current||today());
    setViewMode('day');
  },[isCompactSchedule]);

  const canManage = user.role==='teacher' || user.role==='admin';
  const teacherUidForName = React.useCallback(teacherName=>{
    const canonical=normalizeText(canonicalTeacherName(teacherName));
    if(canonical&&canonical===normalizeText(canonicalTeacherName(user.displayName||''))) return user.uid||'';
    const member=staffMembers.find(item=>
      normalizeText(canonicalTeacherName(item.displayName||item.name||''))===canonical
    );
    return member?.id||member?.uid||'';
  },[staffMembers,user]);

  // ── Week computation ─────────────────────────────────────────
  const weekStart = React.useMemo(()=>{
    const now = new Date();
    const day = now.getDay();
    const diff = day===0 ? -6 : 1-day;
    const mon = new Date(now);
    mon.setDate(now.getDate()+diff+(weekOffset*7));
    mon.setHours(0,0,0,0);
    return mon;
  },[weekOffset]);

  const weekDays = React.useMemo(()=>
    Array.from({length:7},(_,i)=>{
      const d = new Date(weekStart);
      d.setDate(weekStart.getDate()+i);
      const iso = toLocalISODate(d);
      const jsDay = d.getDay();
      const dayId = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][jsDay];
      return {
        short:["P","E","T","K","N","R","L"][jsDay],
        full: ["Pühapäev","Esmaspäev","Teisipäev","Kolmapäev","Neljapäev","Reede","Laupäev"][jsDay],
        iso, dayId,
        label: d.toLocaleDateString("et-EE",{day:"2-digit",month:"2-digit"}),
        isToday: iso===today()
      };
    })
  ,[weekStart]);

  const weekLabel = React.useMemo(()=>{
    const e = new Date(weekStart); e.setDate(weekStart.getDate()+6);
    return weekStart.toLocaleDateString("et-EE",{day:"2-digit",month:"short"})
      +" – "+e.toLocaleDateString("et-EE",{day:"2-digit",month:"short",year:"numeric"});
  },[weekStart]);

  // ── Day view date ─────────────────────────────────────────────
  const dayViewDate = React.useMemo(()=>{
    if(selectedDay) return selectedDay;
    return today();
  },[selectedDay]);

  const dayViewObj = React.useMemo(()=>{
    const d = new Date(dayViewDate);
    const jsDay = d.getDay();
    const dayId = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][jsDay];
    return {
      iso:dayViewDate, dayId,
      label:d.toLocaleDateString("et-EE",{weekday:'long',day:"2-digit",month:"long"}),
      isToday:dayViewDate===today()
    };
  },[dayViewDate]);

  const mobileWeekDays = React.useMemo(()=>{
    const anchor=new Date(`${dayViewDate}T12:00:00`);
    const day=anchor.getDay();
    const monday=new Date(anchor);
    monday.setDate(anchor.getDate()+(day===0?-6:1-day));
    return Array.from({length:7},(_,index)=>{
      const date=new Date(monday);
      date.setDate(monday.getDate()+index);
      const iso=toLocalISODate(date);
      return {
        iso,
        short:['E','T','K','N','R','L','P'][index],
        day:date.getDate(),
        isToday:iso===today(),
        selected:iso===dayViewDate
      };
    });
  },[dayViewDate]);

  const monthDays = React.useMemo(()=>calendarMonthGrid(monthAnchor),[monthAnchor]);
  const monthTitle = React.useMemo(()=>calendarMonthLabel(monthAnchor),[monthAnchor]);

  // ── Filter schedule ───────────────────────────────────────────
  const filteredSch = React.useMemo(()=>{
    const linkedStudentNames = myStudents.map(s=>normalizeText(s.name));
    const linkedGroups = myStudents.map(s=>normalizeText(s.group)).filter(Boolean);
    const myStudentIds = new Set(myStudents.map(s=>s.id));
    const groupEvents = (groups||[]).flatMap(group=>
      (group.lessons||[]).map(lesson=>{
        const assignedStudents=(group.students||[]).filter(studentId=>{
          const saved=group.studentLessonMap?.[studentId];
          return Array.isArray(saved)?saved.includes(lesson.id):true;
        });
        return {
          id:`group-${group.id}-${lesson.id}`,groupId:group.id,groupLessonId:lesson.id,isGroup:true,
          teacher:group.teacher||'Kõik',studentName:group.name,date:lesson.date||'',
          day:lesson.day||'Mon',time:lesson.time||'09:00',duration:lesson.duration||60,
          status:lesson.status||'Planeeritud',recurring:lesson.recurring!==false,
          startDate:lesson.startDate||today(),attendance:lesson.attendance||{},
          occurrenceStatuses:lesson.occurrenceStatuses||{},
          students:assignedStudents,groupMembers:assignedStudents
        };
      })
    );
    let list = canManage
      ?(isAdmin
          ?(filterT==="Kõik"||!filterT?[...schedule,...groupEvents]:[
              ...schedule.filter(s=>canonicalTeacherName(s.teacher)===canonicalTeacherName(filterT)),
              ...groupEvents.filter(s=>canonicalTeacherName(s.teacher)===canonicalTeacherName(filterT)||s.teacher==='Kõik')
            ])
          :[...schedule.filter(s=>teacherMatches(s.teacher,user.displayName)),...groupEvents]
        )
      :schedule.filter(s=>{
          const target=normalizeText(s.studentName);
          return linkedStudentNames.includes(target)||linkedGroups.includes(target);
        }).concat(groupEvents.filter(ev=>
          (ev.students||[]).some(id=>myStudentIds.has(id))||
          (!(ev.students||[]).length&&linkedGroups.includes(normalizeText(ev.studentName)))
        ));
    if(!showCanceled) list=list.filter(s=>s.status!=="Tühistatud");
    return list;
  },[schedule,groups,myStudents,filterT,showCanceled,canManage,isAdmin,user]);

  const eventsOnDate = React.useCallback(
    dayIso=>calendarEventsForDate(filteredSch,dayIso)
      .sort((left,right)=>String(left.time||'').localeCompare(String(right.time||''))),
    [filteredSch]
  );

  const eventsForDaySlot = (slot, dayIso) =>
    eventsOnDate(dayIso).filter(event=>event.time===slot);

  const calendarSlots = React.useMemo(()=>[
    ...new Set([
      ...TIMES,
      ...filteredSch.map(event=>event.time).filter(time=>/^\d{1,2}:\d{2}$/.test(time||''))
    ])
  ].sort((left,right)=>left.localeCompare(right)),[filteredSch]);

  const DAY_TIMELINE_START=7*60;
  const DAY_SLOT_HEIGHT=18;
  const DAY_PIXELS_PER_MINUTE=DAY_SLOT_HEIGHT/15;
  const dayTimelineHeight=TIMES.length*DAY_SLOT_HEIGHT;
  const dayTimelineLayout=React.useMemo(
    ()=>calendarLayoutDayEvents(filteredSch,dayViewObj.iso,{
      startMinute:DAY_TIMELINE_START,
      endMinute:DAY_TIMELINE_START+(TIMES.length*15),
      pixelsPerMinute:DAY_PIXELS_PER_MINUTE
    }),
    [filteredSch,dayViewObj.iso]
  );

  // ── Occupied slots (week view) ────────────────────────────────
  const occupiedSlots = React.useMemo(()=>{
    const has = slot=>weekDays.some(day=>eventsForDaySlot(slot,day.iso).length>0);
    return calendarSlots.filter(has);
  },[filteredSch,weekDays]);

  // ── Week stats ────────────────────────────────────────────────
  const weekStats = React.useMemo(()=>{
    let total=0,done=0,canceled=0,absent=0,planned=0,revenue=0;
    occupiedSlots.forEach(slot=>{
      weekDays.forEach(day=>{
        eventsForDaySlot(slot,day.iso).forEach(ev=>{
          total++;
          if(ev.status==='Toimunud') done++;
          else if(ev.status==='Tühistatud') canceled++;
          else if(['Puudus_p','Puudus_eta'].includes(ev.status)) absent++;
          else planned++;
          const stu=students.find(s=>s.id===ev.studentId||normalizeText(s.name)===normalizeText(ev.studentName));
          const assignment=tariffAssignmentForDate(tariffAssignments,stu?.id,day.iso);
          if(['Planeeritud','Nihutatud','Toimunud'].includes(ev.status||'Planeeritud')){
            revenue+=Math.max(0,Number(assignment?.unitPrice)||Number(stu?.lessonPrice)||0);
          }
        });
      });
    });
    return {total,done,canceled,absent,planned,revenue};
  },[occupiedSlots,weekDays,students,tariffAssignments]);

  const monthStats = React.useMemo(()=>{
    let total=0,done=0,canceled=0,absent=0,planned=0,revenue=0;
    monthDays.filter(day=>day.inMonth).forEach(day=>{
      eventsOnDate(day.iso).forEach(event=>{
        total++;
        if(event.status==='Toimunud') done++;
        else if(event.status==='Tühistatud') canceled++;
        else if(['Puudus_p','Puudus_eta'].includes(event.status)) absent++;
        else planned++;
        const student=students.find(item=>
          item.id===event.studentId||normalizeText(item.name)===normalizeText(event.studentName)
        );
        const assignment=tariffAssignmentForDate(tariffAssignments,student?.id,day.iso);
        if(['Planeeritud','Nihutatud','Toimunud'].includes(event.status||'Planeeritud')){
          revenue+=Math.max(0,Number(assignment?.unitPrice)||Number(student?.lessonPrice)||0);
        }
      });
    });
    return {total,done,canceled,absent,planned,revenue};
  },[monthDays,eventsOnDate,students,tariffAssignments]);

  // ── Planner rows ──────────────────────────────────────────────
  const weekEventList = React.useMemo(
    ()=>filteredSch.filter(event=>weekDays.some(day=>calendarEventOccursOnDate(event,day.iso))),
    [filteredSch,weekDays]
  );

  const visibleConflictRows = React.useMemo(()=>{
    const dates=viewMode==='month'
      ?monthDays.filter(day=>day.inMonth).map(day=>day.iso)
      :viewMode==='day'
        ?[dayViewObj.iso]
        :weekDays.map(day=>day.iso);
    return scheduleConflictRows(filteredSch,dates);
  },[viewMode,monthDays,dayViewObj.iso,weekDays,filteredSch]);
  const visibleConflictCount=visibleConflictRows.length;

  const focusConflict=React.useCallback(row=>{
    if(!row?.date||!row?.eventIds?.length) return;
    setHighlightedConflict({date:row.date,eventIds:row.eventIds,key:row.key});
    setSelectedDay(row.date);
    setViewMode('day');
    setTimeout(()=>{
      const target=[...document.querySelectorAll('[data-calendar-event-id]')]
        .find(element=>row.eventIds.includes(element.getAttribute('data-calendar-event-id')));
      target?.scrollIntoView?.({behavior:'smooth',block:'center'});
    },120);
  },[]);

  const todayPendingLessons = React.useMemo(()=>
    eventsOnDate(today()).filter(event=>!event.isGroup&&event.status==='Planeeritud')
  ,[eventsOnDate]);

  const plannerTeacher = React.useMemo(()=>{
    if(isAdmin&&filterT&&filterT!=="Kõik") return canonicalTeacherName(filterT);
    return canonicalTeacherName(user.displayName||'');
  },[isAdmin,filterT,user]);

  const plannerRows = React.useMemo(()=>{
    const match=(ev,s)=>{
      const en=normalizeText(ev.studentName),sn=normalizeText(s.name),sg=normalizeText(s.group);
      return ev.studentId===s.id||(ev.students||[]).includes(s.id)||en===sn||(!!sg&&en===sg);
    };
    const q=normalizeText(plannerSearch);
    return myStudents
      .filter(s=>s.active!==false)
      .filter(s=>!plannerTeacher||teacherMatches(s.teacher,plannerTeacher))
      .map(s=>{
        const tw=weekEventList.filter(ev=>match(ev,s)&&ev.status!=="Tühistatud");
        const target=parseInt(s.weeklyLessons||s.lessonsPerWeek||0,10)||0;
        return {student:s,lessonsThisWeek:tw,target,left:target?Math.max(target-tw.length,0):null};
      })
      .filter(row=>{
        if(q&&!normalizeText(row.student.name).includes(q)) return false;
        if(plannerFilter==="empty") return row.lessonsThisWeek.length===0;
        if(plannerFilter==="under") return row.target>0&&row.lessonsThisWeek.length<row.target;
        return true;
      })
      .sort((a,b)=>{
        const am=a.target>0?(a.left||0):(a.lessonsThisWeek.length===0?1:0);
        const bm=b.target>0?(b.left||0):(b.lessonsThisWeek.length===0?1:0);
        return bm-am||normalizeText(a.student.name).localeCompare(normalizeText(b.student.name),'et');
      });
  },[myStudents,plannerTeacher,weekEventList,plannerSearch,plannerFilter]);

  // ── Drag & drop ───────────────────────────────────────────────
  const handleDragStart = React.useCallback((e,ev,dayIso,slot)=>{
    if(!canManage||ev.source==='gcal'||ev.isGroup) return;
    e.dataTransfer.effectAllowed='move';
    setDragEv({ev,sourceDay:dayIso,sourceSlot:slot});
    setDragging(true);
  },[canManage]);
  const handleDragEnd = React.useCallback(()=>{setDragging(false);setDragEv(null);setDragOver(null);},[]);
  const handleDrop = React.useCallback(async(e,targetIso,targetSlot)=>{
    e.preventDefault();setDragOver(null);setDragging(false);
    if(!dragEv?.ev?.id) return;
    const {ev}=dragEv;
    if(ev.source==='gcal'||ev.isGroup){
      notify('Google’i ja grupitunde muudetakse nende algallikas.');
      setDragEv(null);
      return;
    }
    if(ev.recurring&&!ev.date){
      openScheduleEditor({
        ...ev,
        occurrenceDate:dragEv.sourceDay,
        requestedMoveDate:targetIso,
        requestedMoveTime:targetSlot
      });
      notify('Vali, kas muuta ainult seda tundi või kogu sarja.');
      setDragEv(null);
      return;
    }
    const dayId=calendarDayIdForDate(targetIso);
    const candidate={
      ...ev,
      date:ev.date?targetIso:'',
      day:dayId,
      time:targetSlot
    };
    const conflicts=findScheduleConflicts(filteredSch,candidate,targetIso,{excludeId:ev.id});
    try{
      const patch=ev.date
        ?{date:targetIso,day:dayId,time:targetSlot,status:ev.status==='Tühistatud'?ev.status:'Planeeritud',teacherUid:ev.teacherUid||teacherUidForName(ev.teacher),updatedAtIso:new Date().toISOString()}
        :{day:dayId,time:targetSlot,teacherUid:ev.teacherUid||teacherUidForName(ev.teacher),updatedAtIso:new Date().toISOString()};
      await window._db.collection('schedule').doc(ev.id).update(patch);
      if(logActivity) await logActivity('schedule.moved','Tõsteti tund kalendris',{
        scheduleId:ev.id,studentId:ev.studentId||'',studentName:ev.studentName||'',
        fromDate:dragEv.sourceDay,fromTime:dragEv.sourceSlot,toDate:targetIso,toTime:targetSlot,
        conflictCount:conflicts.length
      });
      notify(conflicts.length
        ?scheduleConflictWarning(conflicts,'Tund tõsteti ümber')
        :`✓ ${ev.studentName} → ${targetSlot}`);
    }catch{notify('⚠ Liigutamine ebaõnnestus');}
    setDragEv(null);
  },[dragEv,notify,filteredSch,logActivity,teacherUidForName,openScheduleEditor]);

  // ── Popup create (Google-style) ───────────────────────────────
  const openCreatePopup = React.useCallback((e,dayIso,slot,student=null)=>{
    e.stopPropagation();
    setCreatePopup({dayIso,slot});
    setPopupStu(student?.name||'');
    setPopupStudentId(student?.id||'');
    setPopupTeach(isAdmin?(filterT&&filterT!=='Kõik'?filterT:'Pavel'):canonicalTeacherName(user.displayName)||'Pavel');
    setPopupDur(60);
    setPopupRecurring(false);
  },[isAdmin,filterT,user]);

  const openPlannerStudentPopup = React.useCallback((event,student)=>{
    const visibleDates=viewMode==='month'
      ?monthDays.filter(day=>day.inMonth).map(day=>day.iso)
      :viewMode==='day'
        ?[dayViewObj.iso]
        :weekDays.map(day=>day.iso);
    const target=calendarQuickLessonSlot(visibleDates,{
      preferredDate:viewMode==='day'?dayViewObj.iso:''
    });
    openCreatePopup(event,target.dayIso,target.slot,student);
  },[viewMode,monthDays,dayViewObj.iso,weekDays,openCreatePopup]);

  const saveFromPopup = React.useCallback(async()=>{
    if(!createPopup||!popupStu) return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(createPopup.dayIso||'')||!/^\d{2}:\d{2}$/.test(createPopup.slot||'')){
      notify('⚠ Vali tunni kuupäev ja kellaaeg.');
      return;
    }
    const selectedStudent=myStudents.find(student=>
      student.id===popupStudentId||normalizeText(student.name)===normalizeText(popupStu)
    );
    if(!selectedStudent){
      notify('⚠ Vali õpilane nimekirjast, et tund seotaks tema kontoga.');
      return;
    }
    setPopupSaving(true);
    const {dayIso,slot}=createPopup;
    const payload=buildSchedulePayload({
      teacher:popupTeach,
      teacherUid:teacherUidForName(popupTeach),
      studentId:selectedStudent.id,
      studentName:selectedStudent.name,
      date:dayIso,
      day:calendarDayIdForDate(dayIso),
      time:slot,
      duration:popupDur,
      recurring:popupRecurring
    });
    const conflictDates=popupRecurring
      ?Array.from({length:12},(_,index)=>{
          const date=new Date(`${dayIso}T12:00:00`);
          date.setDate(date.getDate()+(index*7));
          return toLocalISODate(date);
        })
      :[dayIso];
    const conflicts=conflictDates.flatMap(dateIso=>findScheduleConflicts(filteredSch,payload,dateIso));
    try{
      const created=await window._db.collection('schedule').add(payload);
      if(logActivity) await logActivity('schedule.created','Lisati tund kalendrisse',{
        scheduleId:created.id,studentId:selectedStudent.id,studentName:selectedStudent.name,
        teacher:popupTeach,date:dayIso,time:slot,recurring:popupRecurring,
        conflictCount:conflicts.length
      });
      notify(conflicts.length
        ?scheduleConflictWarning(conflicts,'Tund lisati')
        :`✓ Tund lisatud: ${selectedStudent.name} ${slot}`);
      setCreatePopup(null);
    }catch{notify('⚠ Lisamine ebaõnnestus');}
    setPopupSaving(false);
  },[createPopup,popupStu,popupStudentId,popupTeach,popupDur,popupRecurring,notify,myStudents,filteredSch,logActivity,teacherUidForName]);

  // ── Teacher color ─────────────────────────────────────────────
  const tColor=t=>{
    if(!t) return DEFAULT_TEACHER_COLOR;
    const key=Object.keys(TEACHER_COLORS).find(k=>normalizeText(k)===normalizeText(t));
    return key?TEACHER_COLORS[key]:DEFAULT_TEACHER_COLOR;
  };

  // ── Duration → row height (px) ────────────────────────────────
  const durToHeight = dur => Math.max(18,Math.round((dur/15)*DAY_SLOT_HEIGHT)-4);

  // ── Event card renderer ───────────────────────────────────────
  const renderEvent = (ev, dayIso, slot, isDayView=false) => {
    const st=ev.status||'Planeeritud';
    const tc=tColor(ev.teacher);
    const isDraggingThis=dragEv?.ev?.id===ev.id;
    const dur=ev.duration||60;
    const height=isDayView?durToHeight(dur):undefined;
    const linkedStu=!canManage?myStudents.find(s=>{
      const target=normalizeText(ev.studentName);
      return normalizeText(s.name)===target||normalizeText(s.group)===target||(ev.students||[]).includes(s.id);
    }):null;
    const attendanceKey=linkedStu?`${linkedStu.id}_${dayIso}`:'';
    const attendanceStatus=attendanceKey?ev.attendance?.[attendanceKey]?.status:'';
    const conflicts=findScheduleConflicts(filteredSch,ev,dayIso,{excludeId:ev.id});
    const isExternal=ev.source==='gcal';
    const canMove=canManage&&!isExternal&&!ev.isGroup;
    const isConflictHighlighted=highlightedConflict?.date===dayIso
      &&highlightedConflict.eventIds?.includes(String(ev.id));

    return(
      <div key={ev.id+dayIso}
        data-calendar-event-id={String(ev.id)}
        draggable={canMove}
        onDragStart={e=>{e.stopPropagation();handleDragStart(e,ev,dayIso,slot);}}
        onDragEnd={handleDragEnd}
        onClick={e=>{e.stopPropagation();canManage&&openScheduleEditor({...ev,occurrenceDate:dayIso});}}
        style={{
          fontSize:".73rem",
          padding:isDayView?"6px 10px":"3px 6px",
          borderRadius:isDayView?8:5,
          cursor:canManage?"pointer":"default",
          background:st==='Tühistatud'?"rgba(239,68,68,.06)":tc.bg,
          borderLeft:`3px solid ${st==='Tühistatud'?'#ef4444':tc.dot}`,
          border:`0.5px solid ${st==='Tühistatud'?'rgba(239,68,68,.15)':tc.border}`,
          borderLeftWidth:3,
          opacity:isDraggingThis?.3:st==="Tühistatud"?.5:1,
          userSelect:'none',transition:"background .12s",
          position:"relative",
          boxShadow:isConflictHighlighted?'0 0 0 3px rgba(220,38,38,.42), 0 5px 18px rgba(220,38,38,.18)':undefined,
          ...(isDayView?{minHeight:height,display:"flex",flexDirection:"column",gap:2}:{})
        }}
        onMouseEnter={e=>{if(canManage&&!isDraggingThis)e.currentTarget.style.background=tc.hover;}}
        onMouseLeave={e=>{e.currentTarget.style.background=st==='Tühistatud'?"rgba(239,68,68,.06)":tc.bg;}}>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:2}}>
          <span style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",
            whiteSpace:isDayView?"normal":"nowrap",
            color:st==="Tühistatud"?"#991b1b":tc.text,flex:1,minWidth:0,
            textDecoration:st==="Tühistatud"?"line-through":"none",
            lineHeight:1.3,fontSize:isDayView?".84rem":".73rem"}}>
            {ev.studentName}
          </span>
          {canManage&&!isExternal&&!ev.isGroup&&(
            <button onClick={e=>{e.stopPropagation();delSchedule(ev.id,e);}}

                width:12,height:12,display:"flex",alignItems:"center",justifyContent:"center"}}
              className="ev-del-btn"
              onMouseEnter={e=>{e.currentTarget.style.color="#ef4444";e.stopPropagation();}}

        </div>

        <div style={{fontSize:".6rem",color:tc.dot,display:"flex",gap:3,alignItems:'center',lineHeight:1.2}}>
          {!ev.date&&<span style={{opacity:.5}}>↻</span>}
          {isExternal&&<span title="Imporditud Google Calendarist">G</span>}
          {!isExternal&&ev.gcalSyncStatus==='synced'&&<span title="Google Calendariga sünkroonitud" style={{color:'#166534',fontWeight:800}}>G✓</span>}
          {!isExternal&&ev.gcalSyncStatus==='error'&&<span title={googleCalendarErrorGuidance(ev.gcalSyncError)||'Google Calendari sünkroonimine vajab tähelepanu'} style={{color:'#dc2626',fontWeight:800}}>G!</span>}
          {!isExternal&&ev.gcalSyncStatus==='queued'&&<span title="Google Calendarisse saatmise ootel" style={{color:'#C9882A',fontWeight:800}}>G…</span>}
          {conflicts.length>0&&<span title="Kalendris on kattuv tund" style={{color:'#dc2626',fontWeight:800}}>⚠</span>}
          {isDayView&&<span>{slot} – {calendarAddMinutes(slot,dur)} · {dur}min</span>}
          {(isAdmin&&(filterT==='Kõik'||!filterT))&&!isDayView&&<span style={{fontWeight:600,opacity:.75}}>{ev.teacher}</span>}
          {st==="Toimunud"&&<span style={{color:'#166534',fontWeight:700}}>✓</span>}
          {st==='Puudus_p'&&<span style={{color:'#A96E1A',fontWeight:700}}>Hoiatatud puudumine</span>}
          {st==='Puudus_eta'&&<span style={{color:'#991b1b',fontWeight:700}}>Teatamata puudumine</span>}
          {st==='Nihutatud'&&<span style={{color:'#C9882A',fontWeight:600}}>Nihut.</span>}
          {st==='Tühistatud'&&<span style={{color:'#dc2626',fontWeight:600}}>Tüh.</span>}
        </div>

        {isDayView&&(
          <div style={{marginTop:2,fontSize:".72rem",color:"#42536A"}}>
            {ev.teacher&&<span>Õp. {ev.teacher}</span>}
          </div>
        )}

        {canManage&&!ev.isGroup&&st==='Planeeritud'&&dayIso<=today()&&quickCompleteLesson&&(
          <button type="button" className="calendar-quick-complete"
            onClick={async event=>{
              event.stopPropagation();
              await quickCompleteLesson({...ev,occurrenceDate:dayIso});
            }}>
            <i className="fa-solid fa-check"/> Märgi toimunuks
          </button>
        )}

        {!canManage&&linkedStu&&ev.id&&st!=="Tühistatud"&&(
          <div style={{display:"flex",gap:3,marginTop:4,flexWrap:"wrap"}}>
            <button onClick={e=>{e.stopPropagation();markAttendance(ev,attendanceKey,"coming");}}
              className="btn btn-pine btn-sm"
              style={{padding:"2px 5px",fontSize:".58rem",opacity:attendanceStatus==="coming"?1:.8}}>Tuleb</button>
            <button onClick={e=>{e.stopPropagation();markAttendance(ev,attendanceKey,"absent");}}

              style={{padding:"2px 5px",fontSize:".58rem",opacity:attendanceStatus==="absent"?1:.8}}>Ei tule</button>
          </div>
        )}
      </div>
    );
  };

  // ── Slot cell renderer ────────────────────────────────────────
  const renderSlotCell = (slot, dayIso, dayId, isDayView=false) => {
    const evs=eventsForDaySlot(slot,dayIso);
    const isDropTarget=dragOver&&dragOver.day===dayIso&&dragOver.slot===slot;
    return(
      <div
        onDragOver={e=>{if(canManage&&dragging){e.preventDefault();setDragOver({day:dayIso,slot});}}}
        onDragLeave={()=>setDragOver(null)}
        onDrop={e=>handleDrop(e,dayIso,slot)}
        onClick={evs.length===0&&canManage?(e)=>openCreatePopup(e,dayIso,slot):undefined}
        style={{
          padding:3,borderLeft:"0.5px solid rgba(28,43,58,.05)",
          minHeight:isDayView?48:38,
          display:"flex",flexDirection:"column",gap:2,
          background:isDropTarget?"rgba(47,93,80,.1)":(dayIso===today()?"rgba(201,136,42,.02)":"transparent"),
          outline:isDropTarget?"1.5px dashed #2F5D50":"none",
          cursor:evs.length===0&&canManage?"pointer":"default",
          transition:"background .1s",position:"relative"
        }}>
        {evs.length===0&&canManage&&(
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
            color:"rgba(47,93,80,.0)",fontSize:".65rem",fontWeight:600,transition:"color .15s",borderRadius:3,pointerEvents:"none"}}
            className="slot-add-hint">+</div>
        )}
        {evs.map(ev=>renderEvent(ev,dayIso,slot,isDayView))}
      </div>
    );
  };

  const missingCount=plannerRows.filter(r=>r.lessonsThisWeek.length===0).length;

  // ── Day navigation ────────────────────────────────────────────
  const goToPrevDay=()=>{const d=new Date(dayViewDate);d.setDate(d.getDate()-1);setSelectedDay(toLocalISODate(d));};
  const goToNextDay=()=>{const d=new Date(dayViewDate);d.setDate(d.getDate()+1);setSelectedDay(toLocalISODate(d));};

  return(
    <div className="fade-in" style={{display:"flex",flexDirection:"column",gap:14}}>

      {/* ── Header ── */}
      <div className="calendar-header" style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div>
          <h1 style={{fontSize:"1.7rem"}}>Tunniplaan</h1>
          <div style={{fontSize:".84rem",color:"#42536A",marginTop:3,display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
            {viewMode==='month'&&<>
              <span style={{fontWeight:600,textTransform:'capitalize'}}>{monthTitle}</span>
              <span style={{color:"#d1d5db"}}>·</span>
              <strong>{monthStats.total} tundi</strong>
              {monthStats.revenue>0&&<span style={{color:'#2F5D50',fontWeight:600}}>· {monthStats.revenue}€</span>}
            </>}
            {viewMode==='week'&&<>
              <span>{weekLabel}</span>
              <span style={{color:"#d1d5db"}}>·</span>
              <strong>{weekStats.total} tundi</strong>
              {weekStats.done>0&&<span style={{color:'#166534'}}>· {weekStats.done} toimunud</span>}
              {weekStats.absent>0&&<span style={{color:'#A96E1A'}}>· {weekStats.absent} puudumist</span>}
              {weekStats.canceled>0&&<span style={{color:'#dc2626'}}>· {weekStats.canceled} tüh.</span>}
              {weekStats.revenue>0&&<span style={{color:'#2F5D50',fontWeight:600}}>· {weekStats.revenue}€</span>}
            </>}
            {viewMode==='day'&&<span style={{fontWeight:600,color:dayViewObj.isToday?'#C9882A':'#1C2B3A'}}>{dayViewObj.label}</span>}
            {visibleConflictCount>0&&(
              <button type="button" onClick={()=>focusConflict(visibleConflictRows[0])}
                style={{border:'none',background:'transparent',padding:0,color:'#dc2626',fontWeight:700,cursor:'pointer',fontFamily:'inherit',fontSize:'inherit'}}>
                · ⚠ {visibleConflictCount} kattuvust · näita esimest
              </button>
            )}
          </div>
        </div>
        <div className="calendar-controls" style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          {/* View toggle */}
          <div style={{display:"flex",background:"rgba(28,43,58,.07)",borderRadius:10,padding:3,gap:2}}>
            {[['month','Kuu'],['week','Nädal'],['day','Päev']].map(([v,l])=>(
              <button key={v} onClick={()=>setViewMode(v)}
                style={{padding:"5px 14px",borderRadius:8,border:"none",cursor:"pointer",fontFamily:"inherit",
                  fontSize:".8rem",fontWeight:600,

            <button onClick={()=>setMonthAnchor(anchor=>calendarShiftMonth(anchor,-1))} className="btn btn-ghost btn-sm">← Eelmine</button>
            <button onClick={()=>setMonthAnchor(today())} className="btn btn-sm"
              style={{background:monthAnchor.slice(0,7)===today().slice(0,7)?"#1C2B3A":"#fff",
                color:monthAnchor.slice(0,7)===today().slice(0,7)?"#fff":"#1C2B3A",
                border:"1.5px solid "+(monthAnchor.slice(0,7)===today().slice(0,7)?"#1C2B3A":"rgba(28,43,58,.15)")}}>Täna</button>
            <button onClick={()=>setMonthAnchor(anchor=>calendarShiftMonth(anchor,1))} className="btn btn-ghost btn-sm">Järgmine →</button>
          </>}
          {viewMode==='week'&&<>
            <button onClick={()=>setWeekOffset(w=>w-1)} className="btn btn-ghost btn-sm">← Eelmine</button>
            <button onClick={()=>setWeekOffset(0)} className="btn btn-sm"
              style={{background:weekOffset===0?"#1C2B3A":"#fff",color:weekOffset===0?"#fff":"#1C2B3A",
                border:"1.5px solid "+(weekOffset===0?"#1C2B3A":"rgba(28,43,58,.15)")}}>Täna</button>
            <button onClick={()=>setWeekOffset(w=>w+1)} className="btn btn-ghost btn-sm">Järgmine →</button>

          {viewMode==='day'&&<>

        </div>
      </div>

      <div className="calendar-mobile-days" aria-label="Vali nädalapäev">

            onClick={()=>{setSelectedDay(day.iso);setViewMode('day');}}
            className={day.selected?'is-selected':''}
            aria-label={new Date(`${day.iso}T12:00:00`).toLocaleDateString('et-EE',{weekday:'long',day:'numeric',month:'long'})}
            aria-pressed={day.selected}>
            <span>{day.short}</span>
            <strong className={day.isToday?'is-today':''}>{day.day}</strong>
          </button>
        ))}
      </div>

      {/* ── Teacher pills ── */}
      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
        {isAdmin&&(
          <>
            <span style={{fontSize:".7rem",fontWeight:700,color:"#9ca3af"}}>Õpetaja:</span>
            {[...Object.keys(TEACHER_COLORS),'Kõik'].map(t=>{
              const col=tColor(t);
              const active=(t==='Kõik'&&(!filterT||filterT==='Kõik'))||canonicalTeacherName(filterT)===canonicalTeacherName(t);
              return(
                <button key={t} onClick={()=>setFilterT(t)}
                  style={{padding:'3px 11px',borderRadius:999,
                    border:'1.5px solid '+(active?col.dot:'rgba(28,43,58,.1)'),
                    background:active?col.bg:'transparent',color:active?col.text:'#42536A',
                    cursor:'pointer',fontFamily:'inherit',fontSize:'.74rem',fontWeight:active?700:400,transition:'all .12s'}}>
                  {t}
                </button>
              );
            })}
            <div style={{width:1,height:14,background:'rgba(28,43,58,.12)'}}/>
          </>
        )}
        {!isAdmin&&<span style={{padding:'3px 11px',borderRadius:999,
          background:tColor(user.displayName).bg,color:tColor(user.displayName).text,
          border:'1.5px solid '+tColor(user.displayName).dot,fontSize:'.74rem',fontWeight:700}}>
          {user.displayName}
        </span>}
        <label style={{display:"flex",alignItems:"center",gap:5,fontSize:".74rem",color:"#42536A",cursor:"pointer"}}>
          <input type="checkbox" checked={showCanceled} onChange={e=>setShowCanceled(e.target.checked)} style={{width:"auto"}}/>
          Tühistatud
        </label>
      </div>

      {/* ── Google Calendar widget ── */}
      {canManage&&<GCalSettings user={user} notify={notify}/>}

      {/* ── Create popup (Google-style) ── */}
      {createPopup&&(
        <>
          <div style={{position:'fixed',inset:0,zIndex:299}} onClick={()=>setCreatePopup(null)}/>
          <div style={{position:'fixed',top:'50%',left:'50%',transform:'translate(-50%,-50%)',
            zIndex:300,background:'#fff',borderRadius:16,padding:20,width:320,
            boxShadow:'0 8px 40px rgba(0,0,0,.18)',border:'1px solid rgba(28,43,58,.1)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <div>
                <div style={{fontWeight:700,fontSize:'.9rem'}}>📅 Lisa tund</div>
                <div style={{fontSize:'.76rem',color:'#42536A',marginTop:2}}>
                  {new Date(createPopup.dayIso).toLocaleDateString('et-EE',{weekday:'short',day:'2-digit',month:'short'})} · {createPopup.slot}
                </div>
              </div>
              <button onClick={()=>setCreatePopup(null)}
                style={{background:'rgba(28,43,58,.07)',border:'none',borderRadius:8,width:28,height:28,
                  cursor:'pointer',fontSize:'.9rem',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 110px',gap:8}}>
                <label style={{fontSize:'.72rem',color:'#42536A'}}>
                  Kuupäev
                  <input type="date" value={createPopup.dayIso}
                    onChange={event=>setCreatePopup(current=>({...current,dayIso:event.target.value}))}
                    style={{marginTop:4}}/>
                </label>
                <label style={{fontSize:'.72rem',color:'#42536A'}}>
                  Kellaaeg
                  <select value={createPopup.slot}
                    onChange={event=>setCreatePopup(current=>({...current,slot:event.target.value}))}
                    style={{marginTop:4}}>
                    {TIMES.map(time=><option key={time} value={time}>{time}</option>)}
                  </select>
                </label>
              </div>
              <StuSearch value={popupStu}
                onChange={value=>{
                  setPopupStu(value);
                  const exact=myStudents.find(student=>normalizeText(student.name)===normalizeText(value));
                  setPopupStudentId(exact?.id||'');
                }}
                onPick={student=>setPopupStudentId(student.id)}
                students={myStudents.filter(s=>s.active!==false)} placeholder="Otsi õpilast…"/>
              {isAdmin&&(
                <select value={popupTeach} onChange={e=>setPopupTeach(e.target.value)}>
                  {TEACHERS.map(t=><option key={t}>{t}</option>)}
                </select>
              )}
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:'.72rem',color:'#42536A',marginBottom:4}}>Kestus</div>
                  <select value={popupDur} onChange={e=>setPopupDur(Number(e.target.value))}>
                    {[30,45,60,90,120].map(d=><option key={d} value={d}>{d} min</option>)}
                  </select>
                </div>
                <label style={{display:'flex',alignItems:'center',gap:5,fontSize:'.76rem',color:'#42536A',cursor:'pointer',marginTop:16}}>
                  <input type="checkbox" checked={popupRecurring} onChange={e=>setPopupRecurring(e.target.checked)} style={{width:'auto'}}/>
                  Korduv
                </label>
              </div>
              <button onClick={saveFromPopup}
                disabled={!popupStu||!createPopup.dayIso||!createPopup.slot||popupSaving}
                className="btn btn-pine"
                style={{width:'100%',opacity:(!popupStu||!createPopup.dayIso||!createPopup.slot||popupSaving)?0.5:1}}>
                {popupSaving?'Salvestab…':'✓ Kinnita tund'}
              </button>
            </div>
          </div>
        </>
      )}

      {/* ── Main area ── */}
      <div className="calendar-layout" style={{display:"flex",gap:14,alignItems:"flex-start"}}>

        {/* ── Calendar ── */}
        <div className="calendar-main" style={{flex:1,minWidth:0}}>
          <div className="card" style={{overflow:"hidden"}}>
            <div className="scroll" style={{overflowX:"auto"}}>
              <div className={viewMode==='day'?'calendar-grid-inner is-day':'calendar-grid-inner'} style={{minWidth:viewMode==='day'?400:720}}>

                {/* ── MONTH VIEW ── */}
                {viewMode==='month'&&<>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',background:'#EFEDE7',
                    borderBottom:'1px solid rgba(28,43,58,.1)'}}>
                    {['E','T','K','N','R','L','P'].map(day=>(
                      <div key={day} style={{padding:'9px 6px',textAlign:'center',fontSize:'.7rem',
                        fontWeight:800,color:'#42536A',borderLeft:'1px solid rgba(28,43,58,.05)'}}>
                        {day}
                      </div>
                    ))}
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
                    {monthDays.map(day=>{
                      const dayEvents=eventsOnDate(day.iso);
                      return(
                        <div key={day.iso}
                          onClick={canManage?(event)=>openCreatePopup(event,day.iso,'09:00'):undefined}
                          style={{minHeight:112,padding:6,borderRight:'1px solid rgba(28,43,58,.06)',
                            borderBottom:'1px solid rgba(28,43,58,.06)',
                            background:day.isToday?'rgba(201,136,42,.06)':day.inMonth?'#fff':'rgba(239,237,231,.35)',
                            opacity:day.inMonth?1:.55,cursor:canManage?'pointer':'default'}}>
                          <button onClick={event=>{
                              event.stopPropagation();
                              setSelectedDay(day.iso);
                              setViewMode('day');
                            }}
                            style={{width:28,height:28,borderRadius:999,border:'none',
                              background:day.isToday?'#C9882A':'transparent',
                              color:day.isToday?'#fff':'#42536A',fontWeight:800,cursor:'pointer'}}>
                            {day.day}
                          </button>
                          <div style={{display:'flex',flexDirection:'column',gap:3,marginTop:3}}>
                            {dayEvents.slice(0,3).map(event=>{
                              const color=tColor(event.teacher);
                              const conflicts=findScheduleConflicts(filteredSch,event,day.iso,{excludeId:event.id});
                              return(
                                <button key={`${event.id}-${day.iso}`}
                                  onClick={click=>{
                                    click.stopPropagation();
                                    if(canManage) openScheduleEditor({...event,occurrenceDate:day.iso});
                                  }}
                                  title={`${event.time} · ${event.studentName}`}
                                  style={{border:`1px solid ${conflicts.length?'rgba(220,38,38,.35)':color.border}`,
                                    borderLeft:`3px solid ${conflicts.length?'#dc2626':color.dot}`,
                                    borderRadius:5,background:color.bg,color:color.text,
                                    padding:'3px 5px',fontSize:'.65rem',fontWeight:700,textAlign:'left',
                                    overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
                                    cursor:canManage?'pointer':'default'}}>
                                  {conflicts.length?'⚠ ':''}{event.time} {event.studentName}
                                </button>
                              );
                            })}
                            {dayEvents.length>3&&(
                              <button onClick={event=>{
                                  event.stopPropagation();
                                  setSelectedDay(day.iso);
                                  setViewMode('day');

                                style={{border:'none',background:'transparent',color:'#42536A',
                                  textAlign:'left',fontSize:'.65rem',fontWeight:700,cursor:'pointer'}}>
                                + {dayEvents.length-3} veel
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </>}

                {/* ── WEEK VIEW ── */}
                {viewMode==='week'&&<>
                  <div style={{display:"grid",gridTemplateColumns:"46px repeat(7,1fr)",
                    background:"#EFEDE7",borderBottom:"1px solid rgba(28,43,58,.1)"}}>
                    <div style={{padding:"8px",textAlign:"center",fontSize:".64rem",fontWeight:700,color:"#9ca3af"}}>Kell</div>
                    {weekDays.map(d=>(
                      <div key={d.iso}
                        onClick={()=>{setViewMode('day');setSelectedDay(d.iso);}}
                        style={{padding:"8px 4px",textAlign:"center",
                          borderLeft:"1px solid rgba(28,43,58,.08)",
                          background:d.isToday?"rgba(201,136,42,.07)":"transparent",
                          cursor:"pointer",transition:"background .1s"}}
                        onMouseEnter={e=>e.currentTarget.style.background=d.isToday?"rgba(201,136,42,.12)":"rgba(28,43,58,.04)"}
                        onMouseLeave={e=>e.currentTarget.style.background=d.isToday?"rgba(201,136,42,.07)":"transparent"}>
                        <div style={{fontSize:".7rem",fontWeight:700,color:d.isToday?"#C9882A":"#1C2B3A"}}>{d.short}</div>

                      </div>

                    <div style={{padding:"40px",textAlign:"center",color:"#42536A",fontSize:".88rem"}}>
                      Sellel nädalal tunde ei ole.

                    const prev=occupiedSlots[si-1];
                    const gapH=prev?(parseInt(slot)-parseInt(prev)):(parseInt(slot)-7);
                    return(
                      <React.Fragment key={slot}>
                        {gapH>1&&(
                          <div style={{display:"grid",gridTemplateColumns:"46px repeat(7,1fr)",

                            borderTop:"0.5px solid rgba(28,43,58,.04)",borderBottom:"0.5px solid rgba(28,43,58,.04)"}}>
                            <div style={{display:"flex",alignItems:"center",justifyContent:"center",
                              fontSize:".6rem",color:"#B0A898",fontFamily:"monospace",
                              background:"rgba(239,237,231,.5)",borderRight:"1px solid rgba(28,43,58,.04)"}}>···</div>
                            {weekDays.map(d=><div key={d.iso} style={{borderLeft:"0.5px solid rgba(28,43,58,.03)"}}/>)}
                          </div>

                  {/* Add empty slots below for quick add */}
                  {canManage&&TIMES.filter(t=>!occupiedSlots.includes(t)).slice(0,3).map(slot=>(
                    <div key={'empty-'+slot} style={{display:"grid",gridTemplateColumns:"46px repeat(7,1fr)",

                      <div style={{display:"flex",alignItems:"center",justifyContent:"center",
                        fontSize:".68rem",fontFamily:"monospace",color:"rgba(156,163,175,.5)",

                        {slot}
                      </div>
                      {weekDays.map(day=>(
                        <div key={day.iso}
                          onClick={e=>openCreatePopup(e,day.iso,slot)}

                            minHeight:32,cursor:"pointer",position:"relative",
                            background:day.isToday?"rgba(201,136,42,.01)":"transparent"}}
                          onMouseEnter={e=>e.currentTarget.style.background="rgba(47,93,80,.04)"}
                          onMouseLeave={e=>e.currentTarget.style.background=day.isToday?"rgba(201,136,42,.01)":"transparent"}>

                {/* ── DAY VIEW ── */}

                    background:"#EFEDE7",borderBottom:"1px solid rgba(28,43,58,.1)"}}>

                    <div style={{padding:"10px 14px",borderLeft:"1px solid rgba(28,43,58,.08)",
                      background:dayViewObj.isToday?"rgba(201,136,42,.07)":"transparent"}}>

                        <div key={slot} style={{position:'absolute',top:index*4*DAY_SLOT_HEIGHT-7,left:0,right:0,

                      revenue:dayEvs.reduce((sum,ev)=>{
                        const stu=students.find(s=>s.id===ev.studentId||normalizeText(s.name)===normalizeText(ev.studentName));
                        const assignment=tariffAssignmentForDate(tariffAssignments,stu?.id,dayViewObj.iso);
                        return sum+(['Planeeritud','Nihutatud','Toimunud'].includes(ev.status||'Planeeritud')
                          ?Math.max(0,Number(assignment?.unitPrice)||Number(stu?.lessonPrice)||0)

                  : weekStats;
                return [
                  {l:'Tunde kokku',v:stats.total,c:'#1C2B3A'},
                  {l:'Toimunud',v:stats.done,c:'#166534'},
                  {l:'Planeeritud',v:stats.planned,c:'#1d4ed8'},
                  {l:'Puudumised',v:stats.absent||0,c:'#A96E1A'},
                  {l:'Tühistatud',v:stats.canceled,c:'#dc2626'},

                ].map(s=>(
