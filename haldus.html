function InvoicesView({invoices,payments,paymentLineAllocations=[],myStudents,parents,schedule,students,lessons,isAdmin,tariffs=[],tariffAssignments=[],packageProducts=[],studentPackages=[],packageLedger=[],createTariffVersion,assignStudentTariff,createPackageProduct,issueStudentPackage,adjustStudentPackage,invStu,setInvStu,invAmt,setInvAmt,invDesc,setInvDesc,invRef,setInvRef,invDue,setInvDue,addInvoice,recordPayment,savePaymentLineAllocation,uploadPaymentDocument,openPaymentDocument,markPaid,unmarkPaid,voidPayment,resolveInvoiceOverpayment,creditInvoiceLessonLine,openCreditNotePdf,sendCreditNoteEmail,deleteInvoice,printInvoice,updateInvoiceReference,updateInvoiceDue,sendInvoiceEmail,sendInvoiceReminder,sendMonthlyInvoiceReminders,invoiceEmailBusy}) {
  const unpaidAmt=invoices.filter(i=>i.status==='Ootel').reduce((sum,inv)=>sum+invoiceFinancialSummary(inv).balance,0);
  const paid=invoices.filter(i=>i.status==='Makstud');
  const [statsPeriod,setStatsPeriod] = React.useState('current');
  const [paymentDocumentBusy,setPaymentDocumentBusy] = React.useState('');
  const [lineAllocationDraft,setLineAllocationDraft] = React.useState(null);
  const currentAllocationForPayment=payment=>payment?.lineAllocationId
    ?paymentLineAllocations.find(item=>item.id===payment.lineAllocationId)||null
    :null;
  const allocationHistoryForPayment=payment=>paymentLineAllocations
    .filter(item=>item.paymentId===payment?.id)
    .sort((a,b)=>Number(b.version||0)-Number(a.version||0));
  const attachPaymentFile=async(payment,file,input)=>{
    if(!file||!uploadPaymentDocument) return;
    setPaymentDocumentBusy(payment.id);
    try{
      await uploadPaymentDocument(payment,file);
    }finally{
      setPaymentDocumentBusy('');
      if(input) input.value='';
    }
  };

  // Period boundaries
  const now = new Date();
  const periodStart = React.useMemo(()=>{
    if(statsPeriod==='current'){
      return new Date(now.getFullYear(),now.getMonth(),1).toISOString().split('T')[0];
    }else if(statsPeriod==='next'){
      return new Date(now.getFullYear(),now.getMonth()+1,1).toISOString().split('T')[0];
    }else{ // both
      return new Date(now.getFullYear(),now.getMonth(),1).toISOString().split('T')[0];
    }
  },[statsPeriod]);
  const periodEnd = React.useMemo(()=>{
    if(statsPeriod==='current'){
      return new Date(now.getFullYear(),now.getMonth()+1,0).toISOString().split('T')[0];
    }else if(statsPeriod==='next'){
      return new Date(now.getFullYear(),now.getMonth()+2,0).toISOString().split('T')[0];
    }else{
      return new Date(now.getFullYear(),now.getMonth()+2,0).toISOString().split('T')[0];
    }
  },[statsPeriod]);

  // Helper: get all dates for a schedule event in period
  const getEventDatesInPeriod = React.useCallback((ev)=>{
    const dates = [];
    if(ev.date){
      if(ev.date>=periodStart && ev.date<=periodEnd) dates.push(ev.date);
    } else if(ev.recurring && ev.startDate && ev.day){
      // Weekly recurring — enumerate weeks in period
      const dayMap = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
      const targetDay = dayMap[ev.day];
      const start = new Date(Math.max(new Date(ev.startDate),new Date(periodStart)));
      const end = new Date(periodEnd);
      const d = new Date(start);
      // Advance to first occurrence of targetDay
      while(d.getDay()!==targetDay && d<=end) d.setDate(d.getDate()+1);
      while(d<=end){
        const dateIso=d.toISOString().split('T')[0];
        if(!(ev.excludedDates||[]).includes(dateIso)) dates.push(dateIso);
        d.setDate(d.getDate()+7);
      }
    }
    return dates;
  },[periodStart,periodEnd]);

  const scheduledLessonPrice = React.useCallback((student,date)=>{
    const assignment=tariffAssignmentForDate(tariffAssignments,student?.id,date);
    return Math.max(0,Number(assignment?.unitPrice)||Number(student?.lessonPrice)||0);
  },[tariffAssignments]);

  // Expected income: scheduled lessons × dated tariff (legacy lessonPrice as fallback)
  const expectedIncome = React.useMemo(()=>{
    if(!isAdmin) return null;
    let total = 0;
    const byStudent = {};
    (schedule||[]).forEach(ev=>{
      if(ev.status==='Tühistatud') return;
      const stu = (students||[]).find(s=>
        s.id===ev.studentId ||
        (s.name||'').toLowerCase()===(ev.studentName||'').toLowerCase()
      );
      if(!stu) return;
      const dates = getEventDatesInPeriod(ev);
      const prices=dates.map(date=>scheduledLessonPrice(stu,date)).filter(price=>price>0);
      const price=prices.reduce((sum,item)=>sum+item,0);
      if(price<=0) return;
      total += price;
      if(!byStudent[stu.id]) byStudent[stu.id]={name:stu.name,count:0,prices:[],teacher:stu.teacher||'—',total:0};
      byStudent[stu.id].count += prices.length;
      byStudent[stu.id].prices.push(...prices);
      byStudent[stu.id].total += price;
    });
    return {
      total,
      byStudent:Object.values(byStudent)
        .map(item=>({...item,priceLabel:[...new Set(item.prices)].map(money).join(' / ')}))
        .sort((a,b)=>b.total-a.total)
    };
  },[schedule,students,isAdmin,getEventDatesInPeriod,scheduledLessonPrice]);

  // Teacher stats
  const teacherStats = React.useMemo(()=>{
    if(!isAdmin) return null;
    const byTeacher = {};
    (schedule||[]).forEach(ev=>{
      if(ev.status==='Tühistatud') return;
      const teacher = ev.teacher||'Määramata';
      if(!byTeacher[teacher]) byTeacher[teacher]={teacher,planned:0,done:0,revenue:0};
      const dates = getEventDatesInPeriod(ev);
      if(ev.status==='Toimunud') byTeacher[teacher].done += dates.length;
      else byTeacher[teacher].planned += dates.length;
      // revenue
      const stu = (students||[]).find(s=>
        s.id===ev.studentId ||
        (s.name||'').toLowerCase()===(ev.studentName||'').toLowerCase()
      );
      if(stu) byTeacher[teacher].revenue += dates.reduce((sum,date)=>sum+scheduledLessonPrice(stu,date),0);
    });
    return Object.values(byTeacher).sort((a,b)=>b.planned+b.done-(a.planned+a.done));
  },[schedule,students,isAdmin,getEventDatesInPeriod,scheduledLessonPrice]);

  const periodLabel = statsPeriod==='current'
    ? now.toLocaleDateString('et-EE',{month:'long',year:'numeric'})
    : statsPeriod==='next'
      ? new Date(now.getFullYear(),now.getMonth()+1,1).toLocaleDateString('et-EE',{month:'long',year:'numeric'})
      : now.toLocaleDateString('et-EE',{month:'long',year:'numeric'})+' + '+new Date(now.getFullYear(),now.getMonth()+1,1).toLocaleDateString('et-EE',{month:'long',year:'numeric'});

  const [invoiceFilter,setInvoiceFilter] = React.useState('all');
  const [invoiceSearch,setInvoiceSearch] = React.useState('');
  const [invoiceMonth,setInvoiceMonth] = React.useState('all');
  const [invoicePartyFilter,setInvoicePartyFilter] = React.useState('all');
  const invoiceMonths=React.useMemo(()=>[...new Set((invoices||[])
    .map(invoice=>String(invoice.date||invoice.issuedAt||invoice.createdAt||'').slice(0,7))
    .filter(value=>/^\d{4}-\d{2}$/.test(value))
  )].sort((a,b)=>b.localeCompare(a)),[invoices]);
  const visibleInvoices = React.useMemo(()=>{
    const query=normalizeText(invoiceSearch);
    return invoices.filter(invoice=>{
      if(invoiceFilter==='pending'&&invoice.status!=='Ootel') return false;
      if(invoiceFilter==='paid'&&invoice.status!=='Makstud') return false;
      if(invoiceFilter==='reported'&&!(invoice.parentPaymentStatus==='submitted'&&invoice.status!=='Makstud')) return false;
      const invoiceDate=String(invoice.date||invoice.issuedAt||invoice.createdAt||'').slice(0,7);
      if(invoiceMonth!=='all'&&invoiceDate!==invoiceMonth) return false;
      const partyType=invoice.targetType==='parent'||invoice.parentInvoice===true||(!invoice.studentId&&(invoice.parentUid||invoice.parentEmail))?'parent':'student';
      if(invoicePartyFilter!=='all'&&partyType!==invoicePartyFilter) return false;
      if(query&&!normalizeText(`${invoice.num||invoice.number||''} ${invoicePartyLabel(invoice)} ${invoice.studentName||''} ${invoice.parentName||''} ${invoice.payerName||''} ${invoice.studentEmail||''} ${invoice.parentEmail||''} ${invoice.payerEmail||''} ${invoice.desc||invoice.description||''} ${invoice.reference||invoice.paymentReference||''}`).includes(query)) return false;
      return true;
    });
  },[invoiceFilter,invoiceSearch,invoiceMonth,invoicePartyFilter,invoices]);
  const [invoiceTargetType,setInvoiceTargetType] = React.useState('student');
  const [tariffName,setTariffName] = React.useState('');
  const [tariffPrice,setTariffPrice] = React.useState('');
  const [tariffEffectiveFrom,setTariffEffectiveFrom] = React.useState(today());
  const [tariffSaving,setTariffSaving] = React.useState(false);
  const [invoiceTariffId,setInvoiceTariffId] = React.useState('');
  const [invoiceTariffFrom,setInvoiceTariffFrom] = React.useState(today());
  const [tariffAssignmentSaving,setTariffAssignmentSaving] = React.useState(false);
  const [packageName,setPackageName] = React.useState('');
  const [packageCredits,setPackageCredits] = React.useState('');
  const [packagePrice,setPackagePrice] = React.useState('');
  const [packageEffectiveFrom,setPackageEffectiveFrom] = React.useState(today());
  const [packageProductSaving,setPackageProductSaving] = React.useState(false);
  const [invoicePackageProductId,setInvoicePackageProductId] = React.useState('');
  const [invoicePackageIssuedAt,setInvoicePackageIssuedAt] = React.useState(today());
  const [packageIssueSaving,setPackageIssueSaving] = React.useState(false);
  const [packageAdjustmentId,setPackageAdjustmentId] = React.useState('');
  const [packageAdjustmentDirection,setPackageAdjustmentDirection] = React.useState('debit');
  const [packageAdjustmentCredits,setPackageAdjustmentCredits] = React.useState('');
  const [packageAdjustmentReason,setPackageAdjustmentReason] = React.useState('');
  const [packageAdjustmentSaving,setPackageAdjustmentSaving] = React.useState(false);
  const [invoiceParentQuery,setInvoiceParentQuery] = React.useState('');
  const [invoiceParentId,setInvoiceParentId] = React.useState('');
  const [invoiceLessonSelection,setInvoiceLessonSelection] = React.useState({
    studentId:'',
    selectedIds:[],
    availableIds:[]
  });
  const activeInvoiceStudents = React.useMemo(
    ()=>(myStudents||[]).filter(s=>s.active!==false),
    [myStudents]
  );
  const activeInvoiceParents = React.useMemo(
    ()=>(parents||[]).filter(parent=>parent&&parent.id&&parent.active!==false),
    [parents]
  );
  const selectedInvoiceStudent = activeInvoiceStudents.find(s=>s.id===invStu);
  const selectedInvoiceParent = activeInvoiceParents.find(parent=>parent.id===invoiceParentId);
  const availableTariffs = React.useMemo(
    ()=>(tariffs||[])
      .filter(tariff=>tariff.status==='active'&&tariff.billingModel==='per_lesson')
      .sort((a,b)=>`${b.effectiveFrom||''}:${b.createdAt||''}`.localeCompare(`${a.effectiveFrom||''}:${a.createdAt||''}`)),
    [tariffs]
  );
  const selectedTariffVersion=availableTariffs.find(tariff=>tariff.id===invoiceTariffId)||null;
  const availablePackageProducts = React.useMemo(
    ()=>(packageProducts||[])
      .filter(product=>product.status==='active'&&product.productType==='lesson_package')
      .sort((a,b)=>`${b.effectiveFrom||''}:${b.createdAt||''}`.localeCompare(`${a.effectiveFrom||''}:${a.createdAt||''}`)),
    [packageProducts]
  );
  const selectedPackageProduct=availablePackageProducts.find(product=>product.id===invoicePackageProductId)||null;
  const selectedStudentTariffAssignments = React.useMemo(
    ()=>(tariffAssignments||[])
      .filter(assignment=>assignment.studentId===selectedInvoiceStudent?.id)
      .sort((a,b)=>`${b.effectiveFrom||''}:${b.createdAt||''}`.localeCompare(`${a.effectiveFrom||''}:${a.createdAt||''}`)),
    [tariffAssignments,selectedInvoiceStudent?.id]
  );
  const currentStudentTariff = selectedInvoiceStudent
    ? tariffAssignmentForDate(tariffAssignments,selectedInvoiceStudent.id,today())
    : null;
  const selectedStudentPackages = React.useMemo(
    ()=>(studentPackages||[])
      .filter(studentPackage=>studentPackage.studentId===selectedInvoiceStudent?.id)
      .sort((a,b)=>`${b.issuedAt||''}:${b.createdAt||''}`.localeCompare(`${a.issuedAt||''}:${a.createdAt||''}`)),
    [studentPackages,selectedInvoiceStudent?.id]
  );
  const selectedStudentPackageIds = React.useMemo(
    ()=>new Set(selectedStudentPackages.map(studentPackage=>studentPackage.id)),
    [selectedStudentPackages]
  );
  const selectedStudentPackageLedger = React.useMemo(
    ()=>(packageLedger||[])
      .filter(entry=>selectedStudentPackageIds.has(entry.studentPackageId))
      .sort((a,b)=>`${b.createdAt||''}:${b.id||''}`.localeCompare(`${a.createdAt||''}:${a.id||''}`)),
    [packageLedger,selectedStudentPackageIds]
  );
  const selectedStudentPackageKey=selectedStudentPackages.map(item=>item.id).join('|');
  React.useEffect(()=>{
    if(!selectedStudentPackages.some(item=>item.id===packageAdjustmentId)){
      setPackageAdjustmentId(selectedStudentPackages[0]?.id||'');
    }
  },[selectedInvoiceStudent?.id,selectedStudentPackageKey,packageAdjustmentId]);
  const saveTariffVersion = async()=>{
    const price=Number(String(tariffPrice).replace(',','.'));
    if(!tariffName.trim()||!Number.isFinite(price)||price<=0||!tariffEffectiveFrom) return;
    setTariffSaving(true);
    const created=await createTariffVersion?.({
      name:tariffName.trim(),
      unitPrice:price,
      effectiveFrom:tariffEffectiveFrom
    });
    if(created){setTariffName('');setTariffPrice('');setInvoiceTariffId(created.id);}
    setTariffSaving(false);
  };
  const saveStudentTariffAssignment = async()=>{
    if(!selectedInvoiceStudent?.id||!invoiceTariffId||!invoiceTariffFrom) return;
    setTariffAssignmentSaving(true);
    const assigned=await assignStudentTariff?.({
      studentId:selectedInvoiceStudent.id,
      tariffId:invoiceTariffId,
      effectiveFrom:invoiceTariffFrom
    });
    if(assigned) setInvoiceTariffId('');
    setTariffAssignmentSaving(false);
  };
  const savePackageProduct = async()=>{
    const credits=Number(packageCredits);
    const price=Number(String(packagePrice).replace(',','.'));
    if(!packageName.trim()||!Number.isInteger(credits)||credits<=0||!Number.isFinite(price)||price<=0||!packageEffectiveFrom) return;
    setPackageProductSaving(true);
    const created=await createPackageProduct?.({
      name:packageName.trim(),
      lessonCredits:credits,
      totalPrice:price,
      effectiveFrom:packageEffectiveFrom
    });
    if(created){
      setPackageName('');
      setPackageCredits('');
      setPackagePrice('');
      setInvoicePackageProductId(created.id);
    }
    setPackageProductSaving(false);
  };
  const saveStudentPackage = async()=>{
    if(!selectedInvoiceStudent?.id||!invoicePackageProductId||!invoicePackageIssuedAt) return;
    setPackageIssueSaving(true);
    const issued=await issueStudentPackage?.({
      studentId:selectedInvoiceStudent.id,
      packageProductId:invoicePackageProductId,
      issuedAt:invoicePackageIssuedAt
    });
    if(issued){
      setInvoicePackageProductId('');
      setPackageAdjustmentId(issued.id);
    }
    setPackageIssueSaving(false);
  };
  const savePackageAdjustment = async()=>{
    const credits=Number(packageAdjustmentCredits);
    if(!packageAdjustmentId||!Number.isInteger(credits)||credits<=0||!packageAdjustmentReason.trim()) return;
    setPackageAdjustmentSaving(true);
    const adjusted=await adjustStudentPackage?.({
      studentPackageId:packageAdjustmentId,
      creditsDelta:packageAdjustmentDirection==='credit'?credits:-credits,
      reason:packageAdjustmentReason.trim()
    });
    if(adjusted){
      setPackageAdjustmentCredits('');
      setPackageAdjustmentReason('');
    }
    setPackageAdjustmentSaving(false);
  };
  const [invoiceStudentQuery,setInvoiceStudentQuery] = React.useState('');
  React.useEffect(()=>{
    if(selectedInvoiceStudent){
      setInvoiceStudentQuery(selectedInvoiceStudent.name||'');
    }else if(!invStu){
      setInvoiceStudentQuery('');
    }
  },[selectedInvoiceStudent?.id,invStu]);
  const filteredInvoiceStudents = React.useMemo(()=>{
    const q = normalizeText(invoiceStudentQuery);
    if(!q) return activeInvoiceStudents.slice(0,8);
    return activeInvoiceStudents
      .filter(s=>normalizeText(`${s.name||''} ${s.parentName||''} ${s.email||''} ${s.phone||''}`).includes(q))
      .slice(0,8);
  },[activeInvoiceStudents,invoiceStudentQuery]);
  const filteredInvoiceParents = React.useMemo(()=>{
    const q = normalizeText(invoiceParentQuery);
    if(!q) return activeInvoiceParents.slice(0,8);
    return activeInvoiceParents
      .filter(parent=>normalizeText(`${parentDisplayName(parent)} ${parent.email||''} ${parent.phone||''} ${parent.childName||''}`).includes(q))
      .slice(0,8);
  },[activeInvoiceParents,invoiceParentQuery]);
  const invoiceStudentCandidate = selectedInvoiceStudent || (invoiceStudentQuery.trim()&&filteredInvoiceStudents.length===1 ? filteredInvoiceStudents[0] : null);
  const invoiceParentCandidate = selectedInvoiceParent || (invoiceParentQuery.trim()&&filteredInvoiceParents.length===1 ? filteredInvoiceParents[0] : null);
  const invoiceTargetReady = invoiceTargetType==='parent' ? Boolean(invoiceParentCandidate?.id) : Boolean(invoiceStudentCandidate?.id);
  const invoiceTargetName = invoiceTargetType==='parent'
    ? (invoiceParentCandidate ? parentDisplayName(invoiceParentCandidate) : '')
    : (invoiceStudentCandidate?.name||'');
  const invoiceBillableLessons = invoiceTargetType==='student'&&invoiceStudentCandidate
    ? billableLessonsForStudent(lessons,invoiceStudentCandidate)
    : [];
  const invoiceBillableLessonIds = invoiceBillableLessons.map(lesson=>lesson.id);
  const invoiceBillableLessonKey = invoiceBillableLessonIds.join('|');
  React.useEffect(()=>{
    const studentId=invoiceTargetType==='student' ? (invoiceStudentCandidate?.id||'') : '';
    setInvoiceLessonSelection(previous=>{
      if(!studentId) return previous.studentId ? {studentId:'',selectedIds:[],availableIds:[]} : previous;
      if(previous.studentId!==studentId){
        return {studentId,selectedIds:invoiceBillableLessonIds,availableIds:invoiceBillableLessonIds};
      }
      const availableSet=new Set(invoiceBillableLessonIds);
      const previouslyAvailable=new Set(previous.availableIds);
      const selectedIds=[
        ...previous.selectedIds.filter(id=>availableSet.has(id)),
        ...invoiceBillableLessonIds.filter(id=>!previouslyAvailable.has(id))
      ].filter((id,index,list)=>list.indexOf(id)===index);
      if(
        selectedIds.join('|')===previous.selectedIds.join('|')
        && invoiceBillableLessonKey===previous.availableIds.join('|')
      ) return previous;
      return {studentId,selectedIds,availableIds:invoiceBillableLessonIds};
    });
  },[invoiceTargetType,invoiceStudentCandidate?.id,invoiceBillableLessonKey]);
  const selectedLessonIdSet = new Set(
    invoiceLessonSelection.studentId===invoiceStudentCandidate?.id
      ? invoiceLessonSelection.selectedIds
      : []
  );
  const selectedBillableLessons = invoiceBillableLessons.filter(lesson=>selectedLessonIdSet.has(lesson.id));
  const setAllInvoiceLessons = selected => {
    const studentId=invoiceStudentCandidate?.id||'';
    setInvoiceLessonSelection({
      studentId,
      selectedIds:selected ? invoiceBillableLessonIds : [],
      availableIds:invoiceBillableLessonIds
    });
  };
  const toggleInvoiceLesson = lessonId => {
    const studentId=invoiceStudentCandidate?.id||'';
    setInvoiceLessonSelection(previous=>{
      const selectedIds=previous.studentId===studentId ? previous.selectedIds : invoiceBillableLessonIds;
      const nextIds=selectedIds.includes(lessonId)
        ? selectedIds.filter(id=>id!==lessonId)
        : invoiceBillableLessonIds.filter(id=>selectedIds.includes(id)||id===lessonId);
      return {studentId,selectedIds:nextIds,availableIds:invoiceBillableLessonIds};
    });
  };
  const invoiceDraft = invoiceDraftForStudent(
    invoiceTargetType==='student'?invoiceStudentCandidate:null,
    invAmt,
    invDesc,
    invoiceTargetType==='student'?selectedBillableLessons:null,
    tariffAssignments
  );
  const chooseInvoiceStudent = student => {
    setInvStu(student?.id||'');
    setInvoiceStudentQuery(student?.name||'');
  };
  const chooseInvoiceParent = parent => {
    setInvoiceParentId(parent?.id||'');
    setInvoiceParentQuery(parent ? parentDisplayName(parent) : '');
  };
  const switchInvoiceTarget = type => {
    setInvoiceTargetType(type);
    setInvoiceStep(1);
    if(type==='student'){
      chooseInvoiceParent(null);
    }else{
      chooseInvoiceStudent(null);
    }
  };
  const updateInvoiceStudentQuery = value => {
    setInvoiceStudentQuery(value);
    const q = normalizeText(value);
    const exact = activeInvoiceStudents.find(s=>normalizeText(s.name)===q);
    setInvStu(exact?.id||'');
  };
  const updateInvoiceParentQuery = value => {
    setInvoiceParentQuery(value);
    const q = normalizeText(value);
    const exact = activeInvoiceParents.find(parent=>normalizeText(parentDisplayName(parent))===q || normalizeText(parent.email)===q);
    setInvoiceParentId(exact?.id||'');
  };
  const [invoiceStep,setInvoiceStep] = React.useState(1);
  const [lastCreatedInvoice,setLastCreatedInvoice] = React.useState(null);
  const invoiceReady = Boolean(invoiceTargetReady && invoiceDraft.amount);
  const invoiceReferencePreview = String(invRef||'').trim() || 'Uue arve number';
  const invoiceDuePreview = String(invDue||'').trim() || invoiceDueDate();
  const invoiceSteps = [
    {id:1,label:'Saaja',done:invoiceTargetReady},
    {id:2,label:'Summa',done:Boolean(invoiceDraft.amount)},
    {id:3,label:'Tähtaeg',done:Boolean(invoiceDuePreview)},
    {id:4,label:'Selgitus',done:Boolean(invoiceReferencePreview)},
    {id:5,label:'Eelvaade',done:invoiceReady}
  ];
  const invoiceCanGoNext = invoiceStep===1
    ? invoiceTargetReady
    : invoiceStep===2
      ? Boolean(invoiceDraft.amount)
      : invoiceStep===3
        ? Boolean(invoiceDuePreview)
        : true;
  const createInvoiceFromWizard = async()=>{
    if(!invoiceTargetReady){setInvoiceStep(1);return;}
    if(!invoiceDraft.amount){setInvoiceStep(2);return;}
    const created = invoiceTargetType==='parent'
      ? await addInvoice(null,{targetType:'parent',parent:invoiceParentCandidate})
      : await addInvoice(invoiceStudentCandidate.id,{
          targetType:'student',
          lessonIds:invoiceDraft.manualProvided ? undefined : invoiceDraft.lessonIds
        });
    if(created) setLastCreatedInvoice(created);
    setInvoiceStudentQuery('');
    setInvoiceParentQuery('');
    setInvoiceParentId('');
    setInvoiceStep(1);
  };
  const invoiceMailMeta = invoiceMailStatusMeta;
  return(
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:20}}>
      <h1 style={{fontSize:'1.7rem'}}>Arved</h1>

      {false&&isAdmin&&(
        <CollapsibleCard id="invoice-tariffs" title="Tariifide versioonid"
          subtitle="Uus hind loob uue versiooni. Varasemad arved ja tariifid ei muutu."
          badge={availableTariffs.length}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10,alignItems:'end'}}>
            <div>
              <div style={{fontSize:'.72rem',fontWeight:800,color:'#42536A',marginBottom:5}}>Tariifi nimi</div>
              <input value={tariffName} onChange={e=>setTariffName(e.target.value)} placeholder="Nt Individuaaltund"/>
            </div>
            <div>
              <div style={{fontSize:'.72rem',fontWeight:800,color:'#42536A',marginBottom:5}}>Hind (€)</div>
              <input type="number" min="0.01" step="0.01" value={tariffPrice} onChange={e=>setTariffPrice(e.target.value)} placeholder="30"/>
            </div>
            <div>
              <div style={{fontSize:'.72rem',fontWeight:800,color:'#42536A',marginBottom:5}}>Kehtib alates</div>
              <input type="date" value={tariffEffectiveFrom} onChange={e=>setTariffEffectiveFrom(e.target.value)}/>
            </div>
            <button type="button" className="btn btn-pine" onClick={saveTariffVersion}
              disabled={tariffSaving||!tariffName.trim()||!tariffPrice||!tariffEffectiveFrom}>
              {tariffSaving?'Salvestan…':'Loo versioon'}
            </button>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14}}>
            {availableTariffs.length===0&&(
              <span style={{fontSize:'.8rem',color:'#42536A'}}>Tariife pole veel loodud. Õpilase vana tunni hind töötab edasi varuvariandina.</span>
            )}
            {availableTariffs.slice(0,8).map(tariff=>(
              <span key={tariff.id} style={{padding:'7px 10px',borderRadius:10,background:'#F9F8F6',border:'1px solid rgba(28,43,58,.08)',fontSize:'.78rem'}}>
                <strong>{tariff.name}</strong> · {money(tariff.unitPrice)}€/tund · alates {fmtDate(tariff.effectiveFrom)}
              </span>
            ))}
          </div>
        </CollapsibleCard>
      )}

      {isAdmin&&(
        <CollapsibleCard id="invoice-package-products" title="Tunnipakettide versioonid"
          subtitle="Paketi maht ja hind salvestatakse muutumatu tootena. Õpilase jääk elab eraldi liikumiste registris."
          badge={availablePackageProducts.length}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(145px,1fr))',gap:10,alignItems:'end'}}>
            <div>
              <div style={{fontSize:'.72rem',fontWeight:800,color:'#42536A',marginBottom:5}}>Paketi nimi</div>
              <input value={packageName} onChange={e=>setPackageName(e.target.value)} placeholder="Nt 10 individuaaltundi"/>
            </div>
            <div>
              <div style={{fontSize:'.72rem',fontWeight:800,color:'#42536A',marginBottom:5}}>Tundide arv</div>
              <input type="number" min="1" max="500" step="1" value={packageCredits} onChange={e=>setPackageCredits(e.target.value)} placeholder="10"/>
            </div>
            <div>
              <div style={{fontSize:'.72rem',fontWeight:800,color:'#42536A',marginBottom:5}}>Paketi hind (€)</div>
              <input type="number" min="0.01" step="0.01" value={packagePrice} onChange={e=>setPackagePrice(e.target.value)} placeholder="250"/>
            </div>
            <div>
              <div style={{fontSize:'.72rem',fontWeight:800,color:'#42536A',marginBottom:5}}>Kehtib alates</div>
              <input type="date" value={packageEffectiveFrom} onChange={e=>setPackageEffectiveFrom(e.target.value)}/>
            </div>
            <button type="button" className="btn btn-pine" onClick={savePackageProduct}
              disabled={packageProductSaving||!packageName.trim()||!packageCredits||!packagePrice||!packageEffectiveFrom}>
              {packageProductSaving?'Salvestan…':'Loo pakett'}
            </button>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14}}>
            {availablePackageProducts.length===0&&(
              <span style={{fontSize:'.8rem',color:'#42536A'}}>Pakette pole veel loodud. Õpilase vana paketiloendur töötab edasi varuvariandina.</span>
            )}
            {availablePackageProducts.slice(0,8).map(product=>(
              <span key={product.id} style={{padding:'7px 10px',borderRadius:10,background:'#F9F8F6',border:'1px solid rgba(28,43,58,.08)',fontSize:'.78rem'}}>
                <strong>{product.name}</strong> · {product.lessonCredits} tundi · {money(product.price)}€ · alates {fmtDate(product.effectiveFrom)}
              </span>
            ))}
          </div>
        </CollapsibleCard>
      )}

      {/* Main invoice stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:12}}>
        {[{l:'Maksmata',v:unpaidAmt+'€',c:'#dc2626',bg:'#fee2e2',n:invoices.filter(i=>i.status==='Ootel').length+' arvet'},
          {l:'Makstud',v:paid.reduce((a,i)=>a+i.amount,0)+'€',c:'#166534',bg:'#dcfce7',n:paid.length+' arvet'},
          ...(isAdmin&&expectedIncome?[{l:'Oodatav tulu',v:expectedIncome.total+'€',c:'#1d4ed8',bg:'#dbeafe',n:periodLabel}]:[])
        ].map(s=>(
          <div key={s.l} className="card" style={{padding:'18px 20px',background:s.bg,borderColor:'transparent'}}>
            <div style={{fontSize:'1.8rem',fontWeight:700,color:s.c}}>{s.v}</div>
            <div style={{fontSize:'.75rem',color:s.c+'99',marginTop:4}}>{s.l}</div>
            <div style={{fontSize:'.72rem',color:s.c+'88',marginTop:2}}>{s.n}</div>
          </div>
        ))}
	      </div>

	      {lastCreatedInvoice&&(
	        <div className="card" style={{padding:22,border:'1px solid rgba(47,93,80,.22)',background:'#f7fffb',display:'flex',flexDirection:'column',gap:16}}>
	          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,flexWrap:'wrap'}}>
	            <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
	              <div style={{width:42,height:42,borderRadius:12,background:'#2F5D50',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
	                <i className="fa-solid fa-check"/>
	              </div>
	              <div>
	                <h3 style={{color:'#2F5D50',marginBottom:4}}>Arve loodud</h3>
	                <div style={{fontSize:'.86rem',color:'#42536A'}}>
	                  Pere näeb seda arvet oma kabinetis. Kontrolli PDF-i või märgi makstuks, kui raha on juba laekunud.
	                </div>
	              </div>
	            </div>
	            <button type="button" onClick={()=>setLastCreatedInvoice(null)} className="btn btn-ghost btn-sm" title="Peida">
	              <i className="fa-solid fa-xmark"/>
	            </button>
	          </div>
	          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(145px,1fr))',gap:10}}>
		            {[
		              ['Arve',lastCreatedInvoice.num],
		              ['Saaja',invoicePartyLabel(lastCreatedInvoice)],
		              ['Summa',money(lastCreatedInvoice.amount)+'€'],
	              ['Tähtaeg',invoicePaymentTermsLabel(lastCreatedInvoice.due)],
	              ['Selgitus',lastCreatedInvoice.paymentReference||lastCreatedInvoice.num]
	            ].map(([label,value])=>(
	              <div key={label} style={{padding:'10px 12px',borderRadius:12,background:'#fff',border:'1px solid rgba(47,93,80,.1)'}}>
	                <div style={{fontSize:'.7rem',fontWeight:800,color:'#42536A',textTransform:'uppercase',letterSpacing:'.08em'}}>{label}</div>
	                <div style={{fontWeight:800,color:'#1C2B3A',marginTop:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={String(value||'')}>{value||'—'}</div>
	              </div>
	            ))}
	          </div>
	          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
	            <button type="button" onClick={()=>printInvoice(lastCreatedInvoice)} className="btn btn-pine btn-sm">
	              <i className="fa-solid fa-file-pdf"/> Ava PDF
	            </button>
	            {sendInvoiceEmail&&(
	              <button type="button" onClick={()=>sendInvoiceEmail(lastCreatedInvoice)} className="btn btn-ghost btn-sm"
	                disabled={invoiceEmailBusy===`invoice:${lastCreatedInvoice.id}`}
	                style={{opacity:invoiceEmailBusy===`invoice:${lastCreatedInvoice.id}` ? .6 : 1}}>
	                <i className="fa-solid fa-envelope"/> {invoiceEmailBusy===`invoice:${lastCreatedInvoice.id}`?'Saadan...':'Saada e-postiga'}
	              </button>
	            )}
	            {lastCreatedInvoice.status!=='Makstud'&&(
	              <button type="button" onClick={async()=>{await markPaid(lastCreatedInvoice.id);setLastCreatedInvoice({...lastCreatedInvoice,status:'Makstud'});}} className="btn btn-ghost btn-sm">
	                <i className="fa-solid fa-circle-check"/> Märgi makstuks
	              </button>
	            )}
	            <button type="button" onClick={()=>setInvoiceFilter('pending')} className="btn btn-ghost btn-sm">
	              Ava maksmata arved
	            </button>
	            <button type="button" onClick={()=>{setLastCreatedInvoice(null);setInvoiceStep(1);}} className="btn btn-ghost btn-sm">
	              Loo järgmine arve
	            </button>
	          </div>
	        </div>
	      )}

	      {/* Period stats for admin */}
	      {isAdmin&&(
        <div className="card" style={{padding:22}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap',marginBottom:18}}>
            <div>
              <h3>📊 Statistika: {periodLabel}</h3>
              <div style={{fontSize:'.82rem',color:'#42536A',marginTop:4}}>Planeeritud tunnid ja oodatav tulu kalendri põhjal.</div>
            </div>
            <div style={{display:'flex',gap:8}}>
              {[['current','See kuu'],['next','Järgmine kuu'],['both','Mõlemad']].map(([id,label])=>(
                <button key={id} onClick={()=>setStatsPeriod(id)}
                  className={`btn btn-sm ${statsPeriod===id?'btn-dark':'btn-ghost'}`}>
                  {label}
                </button>
              ))}
            </div>
          </div>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>

                  <div style={{fontSize:'.84rem',color:'#42536A',marginTop:4}}>See tekst läheb pangaülekande selgitusse. Tühjana kasutame arve numbrit.</div>
                </div>
                <input value={invRef} onChange={e=>setInvRef(e.target.value)}

                <div style={{padding:'10px 12px',borderRadius:12,background:'#fff',border:'1px solid rgba(28,43,58,.08)',fontSize:'.82rem',color:'#42536A'}}>

                </div>
              </React.Fragment>
            )}

            {invoiceStep===5&&(
              <React.Fragment>
                <div>
                  <div style={{fontSize:'.76rem',fontWeight:800,color:'#42536A',textTransform:'uppercase',letterSpacing:'.08em'}}>5. Eelvaade</div>
                  <div style={{fontSize:'.84rem',color:'#42536A',marginTop:4}}>Kontrolli üle. Pärast loomist näeb pere arvet oma kabinetis.</div>
	                </div>
	                <div style={{padding:14,borderRadius:14,background:'#fff',border:'1px solid rgba(28,43,58,.08)',display:'grid',gap:8,fontSize:'.86rem'}}>
	                  <div><strong>Saaja:</strong> {invoiceTargetName||'Valimata'} <span style={{color:'#42536A'}}>({invoiceTargetType==='parent'?'lapsevanem':'õpilane'})</span></div>
	                  <div><strong>Summa:</strong> {invoiceDraft.amount?money(invoiceDraft.amount)+'€':'Puudub'}</div>
	                  <div><strong>Kirjeldus:</strong> {invoiceDraft.desc||'Keeletunnid'}</div>

            <div style={{display:'flex',justifyContent:'space-between',gap:10,flexWrap:'wrap',marginTop:'auto'}}>

	            </div>
	            <div style={{display:'grid',gap:8,fontSize:'.84rem',color:'#42536A'}}>

            const financial = invoiceFinancialSummary(inv);

	                <div style={{fontWeight:600,fontSize:'.9rem'}}>{inv.num} · {invoicePartyLabel(inv)}</div>

                                  <button onClick={()=>openCreditNotePdf(correction.creditNoteId)} className="btn btn-ghost btn-sm"

                                    style={{padding:'2px 7px',fontSize:'.66rem',opacity:invoiceEmailBusy===`credit-pdf:${correction.creditNoteId}` ? .6 : 1}}>
                                    <i className="fa-solid fa-file-pdf"/> {invoiceEmailBusy===`credit-pdf:${correction.creditNoteId}`?'Laen...':'PDF'}
                                  </button>
                                )}
                                {correction?.creditNoteId&&sendCreditNoteEmail&&(
                                  <button onClick={()=>sendCreditNoteEmail(correction.creditNoteId)} className="btn btn-ghost btn-sm"
                                    disabled={invoiceEmailBusy===`credit-email:${correction.creditNoteId}`}
                                    style={{padding:'2px 7px',fontSize:'.66rem',opacity:invoiceEmailBusy===`credit-email:${correction.creditNoteId}` ? .6 : 1}}>
                                    <i className="fa-solid fa-envelope"/> {invoiceEmailBusy===`credit-email:${correction.creditNoteId}`?'Saadan...':'Saada'}
                                  </button>
                                )}
                              </React.Fragment>
                            : isAdmin&&creditInvoiceLessonLine&&(
                              <button onClick={()=>creditInvoiceLessonLine(inv,line)} className="btn btn-ghost btn-sm" style={{padding:'2px 7px',fontSize:'.66rem'}}>
                                Parandusarve
                              </button>
                            )}
                        </div>
                      );
                    })}
                  </div>
                )}
                <div style={{fontSize:'.78rem',color:'#42536A',marginTop:3}}>Selgitus: <strong style={{color:'#1C2B3A'}}>{inv.paymentReference||inv.num}</strong></div>
                {mailMeta&&(
                  <div style={{fontSize:'.76rem',color:mailMeta.color,marginTop:4,fontWeight:700}}>
                    <i className="fa-solid fa-envelope" style={{marginRight:5}}/> {mailMeta.text}
