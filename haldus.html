                  </div>
                )}
                {inv.parentPaymentStatus==='submitted'&&inv.status!=='Makstud'&&(
                  <div style={{fontSize:'.78rem',color:'#1d4ed8',marginTop:4}}>
                    Vanem teavitas maksest {fmtDate(inv.parentPaymentSubmittedAt)} · {PAYMENT_METHODS.find(method=>method.id===(inv.parentPaymentMethod||'bank'))?.label || 'Pangaülekanne'}
                  </div>
                )}
                {(financial.paid>0||invoicePaymentHistory.length>0)&&(
                  <div style={{marginTop:4}}>
                    <div style={{fontSize:'.78rem',color:financial.overpaid>0?'#7c3aed':'#166534',fontWeight:700}}>
                      Laekunud {money(financial.paid)}€ · jääk {money(financial.balance)}€
                      {financial.overpaid>0&&<> · ettemaks {money(financial.overpaid)}€</>}
                      {invoicePayments.length>0&&<span style={{fontWeight:500,color:'#42536A'}}> · {invoicePayments.length} makset</span>}
                      {financial.paymentStatus==='legacy_paid'&&<span style={{fontWeight:500,color:'#42536A'}}> · vana märge</span>}
                    </div>
                    {invoicePaymentHistory.slice().sort((a,b)=>String(b.paidAt||b.createdAt).localeCompare(String(a.paidAt||a.createdAt))).slice(0,10).map(payment=>(
                      <div key={payment.id} style={{fontSize:'.72rem',color:'#64748b',marginTop:6,padding:'7px 9px',border:'1px solid rgba(28,43,58,.08)',borderRadius:9}}>
                        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                          <span>
                            {fmtDate(payment.paidAt||payment.createdAt)} · {money(paymentFinancialSummary(payment).net)}€
                            {paymentFinancialSummary(payment).resolved>0&&<> <s>{money(paymentFinancialSummary(payment).gross)}€</s> · {money(paymentFinancialSummary(payment).resolved)}€ avansiks</>}
                            {' · '}{payment.method==='credit'?'Avanss':PAYMENT_METHODS.find(method=>method.id===payment.method)?.label||payment.method||'Makse'}
                            {payment.reference&&<> · {payment.reference}</>}
                          </span>
                          {payment.status==='voided'&&<span className="badge" style={{background:'#fee2e2',color:'#991b1b'}}>Tühistatud</span>}
                          {isAdmin&&voidPayment&&payment.status!=='voided'&&paymentFinancialSummary(payment).net>0&&(
                            <button onClick={()=>voidPayment(payment)} className="btn btn-red btn-sm" style={{padding:'2px 7px',fontSize:'.66rem'}}>Tühista see</button>
                          )}
                          {isAdmin&&savePaymentLineAllocation&&payment.status!=='voided'&&paymentFinancialSummary(payment).net>0&&Array.isArray(inv.lines)&&inv.lines.some(line=>line.lessonId)&&(
                            <button onClick={()=>setLineAllocationDraft({invoice:inv,payment})}
                              className="btn btn-pine btn-sm" style={{padding:'2px 7px',fontSize:'.66rem'}}>
                              <i className="fa-solid fa-list-check"/>
                              {currentAllocationForPayment(payment)
                                ?` Muuda jaotust · v${currentAllocationForPayment(payment).version}`
                                :' Jaga tundidele'}
                            </button>
                          )}
                          {isAdmin&&uploadPaymentDocument&&payment.status!=='voided'&&(
                            <label className="btn btn-ghost btn-sm" style={{padding:'2px 7px',fontSize:'.66rem',cursor:paymentDocumentBusy===payment.id?'wait':'pointer',opacity:paymentDocumentBusy===payment.id?0.6:1}}>
                              <i className="fa-solid fa-paperclip"/> {paymentDocumentBusy===payment.id?'Laen...':'Lisa maksekorraldus'}
                              <input type="file" accept=".pdf,image/jpeg,image/png,image/webp" hidden disabled={paymentDocumentBusy===payment.id}
                                onChange={event=>attachPaymentFile(payment,event.target.files?.[0],event.currentTarget)}/>
                            </label>
                          )}
                        </div>
                        {Array.isArray(payment.documents)&&payment.documents.length>0&&(
                          <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:6}}>
                            {payment.documents.map(document=>(
                              <button key={document.id||document.storagePath} onClick={()=>openPaymentDocument&&openPaymentDocument(document)}
                                className="btn btn-ghost btn-sm" style={{padding:'3px 7px',fontSize:'.65rem'}}>
                                <i className={`fa-solid ${document.contentType==='application/pdf'?'fa-file-pdf':'fa-file-image'}`}/>
                                {document.fileName||'Maksekorraldus'}
                              </button>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                <span style={{fontWeight:700}}>
                  {financial.credited>0&&<><s style={{color:'#94a3b8',fontWeight:500}}>{money(financial.originalAmount)}€</s>{' → '}</>}
                  {money(financial.amount)}€
                </span>
                {inv.status==='Krediteeritud'
                  ? <span className="badge" style={{background:'#ede9fe',color:'#6d28d9'}}>Krediteeritud</span>
                  : inv.status==='Makstud'
                  ?<>
                    <span className="badge" style={{background:'#dcfce7',color:'#166534'}}>✓ Makstud</span>
                    <button onClick={()=>unmarkPaid(inv.id)} className="btn btn-red btn-sm">Tühista kõik</button>
                  </>
                  :<><span className="badge" style={{background:'#fef3c7',color:'#92400e'}}>Ootel</span>
                    {isAdmin&&<button onClick={()=>recordPayment(inv)} className="btn btn-pine btn-sm">Lisa makse</button>}
                  </>}
                {inv.parentPaymentStatus==='submitted'&&inv.status!=='Makstud'&&<span className="badge" style={{background:'#dbeafe',color:'#1d4ed8'}}>Vanem teavitas maksest</span>}
                {financial.overpaid>0&&isAdmin&&resolveInvoiceOverpayment&&(
                  <button onClick={()=>resolveInvoiceOverpayment(inv)} className="btn btn-amber btn-sm">Vii ettemaksuks</button>
                )}
                <button onClick={()=>updateInvoiceReference(inv)} className="btn btn-ghost btn-sm">Muuda selgitust</button>
                {updateInvoiceDue&&<button onClick={()=>updateInvoiceDue(inv)} className="btn btn-ghost btn-sm">Muuda tähtaega</button>}
                {sendInvoiceEmail&&(
                  <button onClick={()=>sendInvoiceEmail(inv)} className="btn btn-ghost btn-sm"
                    disabled={invoiceEmailBusy===`invoice:${inv.id}`}
                    style={{opacity:invoiceEmailBusy===`invoice:${inv.id}` ? .65 : 1}}>
                    <i className="fa-solid fa-envelope"/> {invoiceEmailBusy===`invoice:${inv.id}`?'Saadan...':'Saada e-post'}
                  </button>
                )}
                {sendInvoiceReminder&&inv.status!=='Makstud'&&(
                  <button onClick={()=>sendInvoiceReminder(inv)} className="btn btn-ghost btn-sm"
                    disabled={invoiceEmailBusy===`reminder:${inv.id}`}
                    style={{opacity:invoiceEmailBusy===`reminder:${inv.id}` ? .65 : 1}}>
                    <i className="fa-solid fa-bell"/> {invoiceEmailBusy===`reminder:${inv.id}`?'Saadan...':'Meeldetuletus'}
                  </button>
                )}
                <button onClick={()=>deleteInvoice(inv)} className="btn btn-red btn-sm">Kustuta</button>
                <button onClick={()=>printInvoice(inv)} className="btn btn-ghost btn-sm"><i className="fa-solid fa-print"/> Arve vaade</button>
              </div>
            </div>
            );
          })
        }
      </div>
      {lineAllocationDraft&&(
        <PaymentLineAllocationModal
          invoice={lineAllocationDraft.invoice}
          payment={lineAllocationDraft.payment}
          currentAllocation={currentAllocationForPayment(lineAllocationDraft.payment)}
          allocationHistory={allocationHistoryForPayment(lineAllocationDraft.payment)}
          onSave={savePaymentLineAllocation}
          onClose={()=>setLineAllocationDraft(null)}/>
      )}
    </div>
  );
}

// ── TUNNI MODAL ───────────────────────────────────────────────
// ── ACCOUNTING INVOICE REGISTER ───────────────────────────────
function LessonPaymentRegisterPanel({month,lessons,invoices,payments,paymentLineAllocations,students=[],tariffAssignments=[],openInvoices,openReconciliation,voidPayment,addInvoice,updateLessonBillingDisposition}) {
  const [status,setStatus]=React.useState('all');
  const [search,setSearch]=React.useState('');
  const [actionBusy,setActionBusy]=React.useState('');
  const register=React.useMemo(()=>lessonPaymentRegister({
    lessons,
    invoices,
    payments,
    paymentLineAllocations,
    month
  }),[lessons,invoices,payments,paymentLineAllocations,month]);
  const paymentById=React.useMemo(()=>
    new Map((payments||[]).filter(payment=>payment?.id).map(payment=>[String(payment.id),payment]))
  ,[payments]);
  const visibleRows=React.useMemo(()=>{
    const query=normalizeText(search);
    return register.rows.filter(row=>{
      if(status!=='all'&&row.status!==status) return false;
      if(query&&!normalizeText(`${row.studentName} ${row.teacher} ${row.topic} ${row.invoiceNum} ${row.invoiceId} ${row.lessonId} ${(row.paymentAllocations||[]).map(item=>item.paymentId).join(' ')}`).includes(query)) return false;
      return true;
    });
  },[register.rows,status,search]);
  const moneyCents=value=>`${accountingAmount(value).toFixed(2)} €`;
  const expectedCentsForRow=React.useCallback(row=>{
    if(row.amountCents) return row.amountCents;
    if(row.status!=='unbilled') return 0;
    const student=students.find(item=>item.id===row.studentId);
    const assignment=tariffAssignmentForDate(tariffAssignments,row.studentId,row.date);
    return Math.round(Math.max(0,Number(assignment?.unitPrice)||Number(student?.lessonPrice)||0)*100);
  },[students,tariffAssignments]);
  const unbilledExpectedCents=visibleRows
    .filter(row=>row.status==='unbilled')
    .reduce((sum,row)=>sum+expectedCentsForRow(row),0);
  const downloadCsv=()=>{
    const csv=lessonPaymentRegisterCsv({...register,rows:visibleRows.map(row=>{
      const expectedCents=expectedCentsForRow(row);
      return row.status==='unbilled'&&expectedCents
        ?{...row,amountCents:expectedCents,balanceCents:expectedCents,pricingEstimate:true}
        :row;
    })});
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.download=`keelesepp-tundide-maksete-register-${month}.csv`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  };
  const createLessonInvoice=async row=>{
    if(!addInvoice||!row?.studentId||!row?.lessonId) return;
    if(!window.confirm(`Koostan ${row.studentName} tunnile ${fmtDate(row.date)} eraldi arve. Jätkan?`)) return;
    setActionBusy(`invoice-${row.lessonId}`);
    try{ await addInvoice(row.studentId,{lessonIds:[row.lessonId]}); }
    finally{ setActionBusy(''); }
  };
  const decideLessonBilling=async(row,nextStatus)=>{
    if(!updateLessonBillingDisposition||!row?.lessonId) return;
    setActionBusy(`${nextStatus}-${row.lessonId}`);
    try{ await updateLessonBillingDisposition(row.lessonId,nextStatus); }
    finally{ setActionBusy(''); }
  };
  const statusMeta={
    paid:{bg:'#dcfce7',color:'#166534'},
    paid_direct:{bg:'#dcfce7',color:'#166534'},
    partial:{bg:'#fef3c7',color:'#92400e'},
    invoiced_unpaid:{bg:'#fee2e2',color:'#991b1b'},
    unbilled:{bg:'#ffedd5',color:'#9a3412'},
    package_covered:{bg:'#dbeafe',color:'#1d4ed8'},
    free:{bg:'#ecfdf5',color:'#166534'},
    cancelled:{bg:'#f3f4f6',color:'#42536A'},
    written_off:{bg:'#f3f4f6',color:'#4b5563'},
    credited:{bg:'#e0f2fe',color:'#075985'},
    legacy_invoice:{bg:'#fef3c7',color:'#92400e'},
    not_billable:{bg:'#f3f4f6',color:'#64748b'}
  };
  const summaryCards=[
    {label:'Tunde perioodis',value:register.summary.lessonCount,note:`${register.summary.exactLinkedCount} täpse ID-seosega`,color:'#1C2B3A'},
    {label:'Makstud',value:register.summary.paidCount+register.summary.directPaidCount,note:moneyCents(register.summary.paidCents),color:'#166534'},
    {label:'Osaliselt',value:register.summary.partialCount,note:'makse katab osa tunni hinnast',color:'#92400e'},
    {label:'Arvel · tasumata',value:register.summary.invoicedUnpaidCount,note:`jääk koos osalistega ${moneyCents(register.summary.balanceCents)}`,color:'#991b1b'},
    {label:'Arveldamata',value:register.summary.unbilledCount,note:unbilledExpectedCents?`eeldatav ${moneyCents(unbilledExpectedCents)}`:'hind vajab määramist',color:'#9a3412'},
    {label:'Paketist kaetud',value:register.summary.packageCount,note:'eraldi paketiliikumine',color:'#1d4ed8'}
  ];
  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div className="card" style={{padding:16,background:'#eef6f2',border:'1px solid rgba(47,93,80,.18)'}}>
        <div style={{fontWeight:800}}>Kuidas osaline makse seotakse tunniga?</div>
        <div style={{fontSize:'.76rem',color:'#42536A',marginTop:4,lineHeight:1.55}}>
          Uute maksete puhul saab administraator määrata täpsed tunniread. Iga parandus loob uue muutumatu
          kuupäeva ja põhjusega versiooni. Vanadel maksetel, millel täpset jaotust veel pole, säilib
          migratsiooniturvaline FIFO-arvutus: kõigepealt kaetakse varaseim arverida.
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10}}>
        {summaryCards.map(card=>(
          <div key={card.label} className="card" style={{padding:14}}>
            <div style={{fontSize:'.65rem',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em',color:'#64748b'}}>{card.label}</div>
            <div style={{fontFamily:'Fraunces,Georgia,serif',fontSize:'1.45rem',fontWeight:700,color:card.color,marginTop:5}}>{card.value}</div>
            <div style={{fontSize:'.68rem',color:'#64748b',marginTop:2}}>{card.note}</div>
          </div>
        ))}
      </div>

      {register.issues.length>0&&(
        <div className="card" style={{padding:0,overflow:'hidden',border:'1px solid rgba(220,38,38,.2)'}}>
          <div style={{padding:'13px 15px',background:'#fff7ed',display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,flexWrap:'wrap'}}>
      <div>
              <div style={{fontWeight:800}}>Tunniarvestuse kontroll</div>
              <div style={{fontSize:'.72rem',color:'#64748b'}}>{register.summary.errorCount} viga · {register.summary.attentionCount} pärand- või paketikirjet</div>
            </div>
            <div style={{display:'flex',gap:6}}>
              <button onClick={openInvoices} className="btn btn-ghost btn-sm">Arved</button>
              <button onClick={openReconciliation} className="btn btn-amber btn-sm">Maksete sobitamine</button>
            </div>
          </div>
          <div style={{maxHeight:230,overflowY:'auto'}}>
            {register.issues.map((issue,index)=>(
              <div key={`${issue.type}-${issue.lessonId||issue.invoiceId||index}-${index}`} style={{padding:'10px 15px',borderTop:'1px solid rgba(28,43,58,.07)',display:'flex',gap:9}}>
                <i className={`fa-solid ${issue.severity==='error'?'fa-triangle-exclamation':'fa-circle-info'}`}
                  style={{color:issue.severity==='error'?'#dc2626':'#C9882A',marginTop:2}}/>
                <div>
                  <div style={{fontWeight:700,fontSize:'.78rem'}}>{issue.title}</div>
                  <div style={{fontSize:'.7rem',color:'#64748b',marginTop:2}}>{issue.detail}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="card" style={{overflow:'hidden'}}>
        <div style={{padding:14,borderBottom:'1px solid rgba(28,43,58,.08)',display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <input value={search} onChange={event=>setSearch(event.target.value)}
            placeholder="Otsi õpilase, õpetaja, tunni, arve või ID järgi…" style={{flex:1,minWidth:250}}/>
          <select value={status} onChange={event=>setStatus(event.target.value)} style={{width:205}}>
            <option value="all">Kõik finantsstaatused</option>
            <option value="paid">Makstud</option>
            <option value="paid_direct">Makstud ilma arveta</option>
            <option value="partial">Osaliselt makstud</option>
            <option value="invoiced_unpaid">Arvel · tasumata</option>
            <option value="unbilled">Arveldamata</option>
            <option value="package_covered">Paketist kaetud</option>
            <option value="free">Tasuta</option>
            <option value="cancelled">Tühistatud · tasuta</option>
            <option value="written_off">Mahakantud</option>
            <option value="credited">Krediteeritud</option>
            <option value="legacy_invoice">Vana arve · seos puudub</option>
          </select>
          <button onClick={downloadCsv} className="btn btn-pine btn-sm"><i className="fa-solid fa-file-csv"/> Ekspordi tunnid</button>
        </div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:1300}}>
            <thead>
              <tr style={{background:'#F9F8F6',fontSize:'.66rem',textTransform:'uppercase',letterSpacing:'.05em',color:'#64748b'}}>
                {['Kuupäev','Õpilane / tund','Arve','Hind','Kaetud','Jääk','Makse','Seose täpsus','Staatus','Toimingud'].map(label=>(
                  <th key={label} style={{padding:'10px 11px',textAlign:['Hind','Kaetud','Jääk'].includes(label)?'right':'left'}}>{label}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {visibleRows.map(row=>{
                const meta=statusMeta[row.status]||statusMeta.not_billable;
                const isAbsence=['Puudus_p','Puudus_eta'].includes(row.lessonStatus);
                const canInvoice=row.status==='unbilled'&&(
                  row.lessonStatus==='Toimunud'||row.rawLesson?.billingStatus==='late_cancel_billable'
                );
                const rowBusy=actionBusy.endsWith(`-${row.lessonId}`);
                const expectedCents=expectedCentsForRow(row);
                const displayAmountCents=row.amountCents||expectedCents;
                const displayBalanceCents=row.balanceCents||(row.status==='unbilled'?expectedCents:0);
                return(
                  <tr key={row.lessonId} style={{borderTop:'1px solid rgba(28,43,58,.07)',fontSize:'.76rem'}}>
                    <td style={{padding:'11px',verticalAlign:'top',whiteSpace:'nowrap'}}>{fmtDate(row.date)}</td>
                    <td style={{padding:'11px',verticalAlign:'top'}}>
                      <div style={{fontWeight:800}}>{row.studentName}</div>
                      <div style={{fontSize:'.68rem',color:'#64748b',marginTop:2}}>{row.topic||'Teema puudub'}{row.teacher?` · ${row.teacher}`:''}</div>
                      <div title={row.lessonId} style={{fontFamily:'monospace',fontSize:'.62rem',color:'#94a3b8',marginTop:3,maxWidth:170,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{row.lessonId}</div>
                    </td>
                    <td style={{padding:'11px',verticalAlign:'top'}}>
                      <div style={{fontWeight:700}}>{row.invoiceNum||'—'}</div>
                      {row.invoiceId&&<div title={row.invoiceId} style={{fontFamily:'monospace',fontSize:'.62rem',color:'#94a3b8',marginTop:3,maxWidth:120,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{row.invoiceId}</div>}
                    </td>
                    <td style={{padding:'11px',verticalAlign:'top',textAlign:'right',fontFamily:'monospace',fontWeight:700}}>
                      {displayAmountCents?moneyCents(displayAmountCents):'—'}
                      {row.status==='unbilled'&&displayAmountCents>0&&<div style={{fontFamily:'inherit',fontSize:'.6rem',color:'#64748b'}}>eeldatav</div>}
                      {row.status==='unbilled'&&!displayAmountCents&&<div style={{fontFamily:'inherit',fontSize:'.6rem',color:'#991b1b'}}>hind puudub</div>}
                    </td>
                    <td style={{padding:'11px',verticalAlign:'top',textAlign:'right',fontFamily:'monospace',fontWeight:700,color:'#166534'}}>{row.paidCents?moneyCents(row.paidCents):'—'}</td>
                    <td style={{padding:'11px',verticalAlign:'top',textAlign:'right',fontFamily:'monospace',fontWeight:700,color:displayBalanceCents?'#991b1b':'#42536A'}}>{displayBalanceCents?moneyCents(displayBalanceCents):'—'}</td>
                    <td style={{padding:'11px',verticalAlign:'top'}}>
                      {row.paymentAllocations.length>0
                        ? <div>
                            {row.paymentAllocations.map(item=>{
                              const payment=paymentById.get(String(item.paymentId||''));
                              return <div key={`${item.paymentId}-${item.amountCents}`} style={{fontSize:'.67rem',marginBottom:5}}>
                                <div>{fmtDate(item.paidAt)} · {moneyCents(item.amountCents)} · {item.source==='bank'?'Pank':item.source==='credit'?'Ettemakse':item.source||'Muu'}</div>
                                {item.paymentId&&<div title={item.paymentId} style={{fontFamily:'monospace',fontSize:'.6rem',color:'#94a3b8',maxWidth:150,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{item.paymentId}</div>}
                                {row.status==='paid_direct'&&payment&&payment.status!=='voided'&&(
                                  <button onClick={()=>voidPayment&&voidPayment(payment)}
                                    className="btn btn-red btn-sm" style={{padding:'3px 7px',fontSize:'.62rem',marginTop:4}}>
                                    Tühista otsemakse
                                  </button>
                                )}
                              </div>
                            })}
                          </div>
                        : row.status==='paid_direct'
                          ? <span className="badge" style={{background:'#dcfce7',color:'#166534'}}>Otsemakse</span>
                        : row.status==='package_covered'
                          ? <span style={{color:'#1d4ed8',fontWeight:700}}>{row.packageName||'Paketiliikumine'}</span>
                          : <span style={{color:'#94a3b8'}}>—</span>}
                    </td>
                    <td style={{padding:'11px',verticalAlign:'top'}}>
                      {row.linkExact
                        ? <span className="badge" style={{background:'#dcfce7',color:'#166534'}}>ID-seos täpne</span>
                        : row.status==='paid_direct'&&row.paymentAllocations.some(item=>paymentById.has(String(item.paymentId||'')))
                          ? <span className="badge" style={{background:'#dcfce7',color:'#166534'}}>Otsemakse ID-seos</span>
                        : row.status==='package_covered'
                          ? <span className="badge" style={{background:'#dbeafe',color:'#1d4ed8'}}>Paketikirje</span>
                          : <span className="badge" style={{background:'#fef3c7',color:'#92400e'}}>Pole tõendatud</span>}
                      {row.allocationMethod==='invoice_fifo_v1'&&row.status==='partial'&&(
                        <div style={{fontSize:'.63rem',color:'#92400e',marginTop:4}}>Osaline · FIFO</div>
                      )}
                      {row.allocationMethod.includes('explicit_invoice_lines_v1')&&(
                        <div style={{fontSize:'.63rem',color:'#166534',marginTop:4}}>Täpne maksejaotus</div>
                      )}
                    </td>
                    <td style={{padding:'11px',verticalAlign:'top'}}>
                      <span className="badge" style={{background:meta.bg,color:meta.color}}>{lessonPaymentStatusLabel(row.status)}</span>
                    </td>
                    <td style={{padding:'11px',verticalAlign:'top',minWidth:190}}>
                      {row.status==='unbilled'?(
                        <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                          {canInvoice&&(
                            <button type="button" className="btn btn-pine btn-sm"
                              disabled={rowBusy||!row.studentId}
                              onClick={()=>createLessonInvoice(row)}
                              title={!row.studentId?'Õpilase ID puudub — paranda esmalt andmeseos':''}>
                              {actionBusy===`invoice-${row.lessonId}`?<i className="fa-solid fa-spinner fa-spin"/>:<i className="fa-solid fa-file-invoice"/>} Arve
                            </button>
                          )}
                          {isAbsence&&row.rawLesson?.billingStatus!=='late_cancel_billable'&&(
                            <button type="button" className="btn btn-amber btn-sm" disabled={rowBusy}
                              onClick={()=>decideLessonBilling(row,'late_cancel_billable')}>Tasuline</button>
                          )}
                          <button type="button" className="btn btn-ghost btn-sm" disabled={rowBusy}
                            onClick={()=>decideLessonBilling(row,isAbsence?'cancelled_on_time':'free')}>Tasuta</button>
                          <button type="button" className="btn btn-ghost btn-sm" disabled={rowBusy}
                            onClick={()=>decideLessonBilling(row,'written_off')}>Kanna maha</button>
                        </div>
                      ):<span style={{color:'#94a3b8'}}>—</span>}
                    </td>
                  </tr>
                );
              })}
              {visibleRows.length===0&&(
                <tr><td colSpan="10" style={{padding:34,textAlign:'center',color:'#94a3b8'}}>Selles perioodis sobivaid tunde ei ole.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function FinancialPeriodControlPanel({
  control,
  period,
  reviewFinancialPeriod,
  openInvoices,
  openReconciliation,
  openLessonRegister
}) {
  const [busy,setBusy]=React.useState(false);
  const storedSummary=period?.lastReviewSummary||{};
  const comparisonKeys=[
    'paymentCount','paymentsCents','bankTransactionCount','bankReceivedCents',
    'bankUnappliedCents','lessonCount','exactLessonLinkCount','unbilledLessonCount',
    'blockingIssueCount'
  ];
  const reviewMatches=Boolean(period?.lastReviewId)
    && comparisonKeys.every(key=>Number(storedSummary[key]||0)===Number(control.summary[key]||0));
  const reviewedAt=period?.lastReviewedAt
    ? new Date(period.lastReviewedAt).toLocaleString('et-EE',{dateStyle:'medium',timeStyle:'short'})
    : '';
  const reviewer=period?.lastReviewedBy?.name||period?.lastReviewedBy?.email||'administraator';
  const severityMeta={
    error:{icon:'fa-triangle-exclamation',color:'#991b1b',bg:'#fff1f2',label:'Vastuolu'},
    attention:{icon:'fa-circle-exclamation',color:'#92400e',bg:'#fffbeb',label:'Vajab otsust'},
    warning:{icon:'fa-clock-rotate-left',color:'#475569',bg:'#f8fafc',label:'Vana kirje'}
  };
  const confirmReview=async()=>{
    if(!control.canReview||busy) return;
    if(!window.confirm('Kinnita selle kuu arvete, maksete, pangatehingute ja tundide finantskontroll?')) return;
    setBusy(true);
    try{ await reviewFinancialPeriod(control.month); }
    finally{ setBusy(false); }
  };
  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div className="card" style={{
        padding:18,
        border:`1px solid ${control.canReview?'rgba(22,101,52,.2)':'rgba(153,27,27,.18)'}`,
        background:control.canReview?'#f0fdf4':'#fff7f7'
      }}>
        <div style={{display:'flex',justifyContent:'space-between',gap:16,alignItems:'center',flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:'.7rem',fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',color:control.canReview?'#166534':'#991b1b'}}>
              {control.canReview?'Kontroll on kinnitamiseks valmis':'Enne kinnitamist lahenda vastuolud'}
            </div>
            <div style={{fontFamily:'Fraunces,Georgia,serif',fontSize:'1.35rem',fontWeight:700,marginTop:5}}>
              {control.summary.blockingIssueCount} blokeerivat kirjet
            </div>
            <div style={{fontSize:'.75rem',color:'#64748b',marginTop:4}}>
              {control.summary.errorCount} tehnilist vastuolu · {control.summary.attentionCount} finantsotsust · {control.summary.warningCount} vana hoiatust
            </div>
          </div>
          <button onClick={confirmReview} disabled={!control.canReview||busy} className="btn btn-pine"
            style={{opacity:(!control.canReview||busy)?0.6:1,cursor:(!control.canReview||busy)?'not-allowed':'pointer'}}>
            <i className={`fa-solid ${busy?'fa-spinner fa-spin':'fa-shield-check'}`}/>
            {busy?'Kontrollin serveris…':period?.lastReviewId?'Kinnita uus kontroll':'Kinnita kuu kontroll'}
          </button>
        </div>
        <div style={{marginTop:12,padding:'10px 12px',borderRadius:10,background:'rgba(255,255,255,.7)',fontSize:'.72rem',color:'#42536A'}}>
          Server loeb finantskirjed uuesti ja loob muutumatu kontrollversiooni. See ei lukusta veel perioodi ega muuda ühtegi arvet, makset või tundi.
        </div>
      </div>

      {period?.lastReviewId&&(
        <div className="card" style={{padding:16,border:`1px solid ${reviewMatches?'rgba(22,101,52,.2)':'rgba(201,136,42,.3)'}`}}>
          <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'center',flexWrap:'wrap'}}>
            <div>
              <div style={{fontWeight:800}}>
                <i className={`fa-solid ${reviewMatches?'fa-circle-check':'fa-rotate'}`} style={{color:reviewMatches?'#166534':'#C9882A',marginRight:7}}/>
                Kontrollversioon {period.reviewVersion||1}
              </div>
              <div style={{fontSize:'.74rem',color:'#64748b',marginTop:4}}>
                {reviewedAt} · {reviewer} · ID {period.lastReviewId}
              </div>
            </div>
            <span className="badge" style={{background:reviewMatches?'#dcfce7':'#fef3c7',color:reviewMatches?'#166534':'#92400e'}}>
              {reviewMatches?'Koond vastab praegustele andmetele':'Koond on pärast kontrolli muutunud'}
            </span>
          </div>
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:12}}>
        {control.checklist.map(item=>(
          <div key={item.id} className="card" style={{padding:15}}>
            <div style={{display:'flex',gap:9,alignItems:'flex-start'}}>
              <i className={`fa-solid ${item.ready?'fa-circle-check':'fa-circle-xmark'}`}
                style={{color:item.ready?'#166534':'#991b1b',marginTop:2}}/>
              <div>
                <div style={{fontWeight:800,fontSize:'.82rem'}}>{item.label}</div>
                <div style={{fontSize:'.72rem',color:'#64748b',marginTop:3}}>{item.value}</div>
              </div>
            </div>
          </div>
        ))}
      </div>

      {control.issues.length>0?(
        <div className="card" style={{overflow:'hidden'}}>
          <div style={{padding:'14px 16px',borderBottom:'1px solid rgba(28,43,58,.08)',display:'flex',justifyContent:'space-between',gap:10,alignItems:'center',flexWrap:'wrap'}}>
            <div>
              <div style={{fontWeight:800}}>Kontrolli tööjärjekord</div>
              <div style={{fontSize:'.73rem',color:'#64748b',marginTop:2}}>Paranda ülalt alla; hoiatused ei takista kinnitamist.</div>
            </div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              <button onClick={openLessonRegister} className="btn btn-ghost btn-sm">Tunnid ↔ maksed</button>
              <button onClick={openReconciliation} className="btn btn-ghost btn-sm">Maksete sobitamine</button>
              <button onClick={openInvoices} className="btn btn-ghost btn-sm">Arved</button>
            </div>
          </div>
          <div>
            {control.issues.slice(0,100).map((issue,index)=>{
              const meta=severityMeta[issue.severity]||severityMeta.warning;
              return(
                <div key={`${issue.type}-${issue.entityId||issue.lessonId||issue.invoiceId||index}`}
                  style={{padding:'11px 16px',borderTop:index?'1px solid rgba(28,43,58,.07)':'none',display:'flex',gap:10,alignItems:'flex-start',background:meta.bg}}>
                  <i className={`fa-solid ${meta.icon}`} style={{color:meta.color,marginTop:2}}/>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',gap:7,alignItems:'center',flexWrap:'wrap'}}>
                      <span style={{fontWeight:800,fontSize:'.8rem'}}>{issue.title||issue.type}</span>
                      <span className="badge" style={{background:'#fff',color:meta.color}}>{meta.label}</span>
                    </div>
                    <div style={{fontSize:'.72rem',color:'#64748b',marginTop:3}}>{issue.detail||'Kontrolli seotud finantskirjet.'}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ):(
        <div className="card" style={{padding:24,textAlign:'center'}}>
          <i className="fa-solid fa-shield-check" style={{fontSize:'1.7rem',color:'#166534'}}/>
          <div style={{fontFamily:'Fraunces,Georgia,serif',fontSize:'1.2rem',fontWeight:700,marginTop:10}}>Kõik kontrollid läbitud</div>
          <div style={{fontSize:'.75rem',color:'#64748b',marginTop:4}}>Kuu kontrolli võib serveris kinnitada.</div>
        </div>
      )}
    </div>
  );
}

function PaymentAllocationQueuePanel({queue,onOpen,onConfirmBatch,batchBusy}) {
  const [filter,setFilter]=React.useState('work');
  const [search,setSearch]=React.useState('');
  const [selected,setSelected]=React.useState([]);
  const eligibleRows=React.useMemo(
    ()=>queue.rows.filter(row=>row.status==='needs_confirmation'&&row.confidence==='high'),
    [queue.rows]
  );
  const eligibleIds=React.useMemo(()=>new Set(eligibleRows.map(row=>row.paymentId)),[eligibleRows]);
  React.useEffect(()=>{
    setSelected(current=>current.filter(paymentId=>eligibleIds.has(paymentId)));
  },[eligibleIds]);
  const selectedRows=eligibleRows.filter(row=>selected.includes(row.paymentId));
  const toggleSelected=paymentId=>setSelected(current=>
    current.includes(paymentId)
      ?current.filter(id=>id!==paymentId)
      :[...current,paymentId]
  );
  const confirmSelected=async()=>{
    if(!selectedRows.length||batchBusy) return;
    if(!window.confirm(`Kinnitada ${selectedRows.length} kõrge kindlusega maksejaotust? Iga jaotus kontrollitakse serveris eraldi.`)) return;
    const result=await onConfirmBatch(selectedRows);
    if(!result) return;
    setSelected(result.failedPaymentIds||[]);
    window.alert(result.failed
      ?`Kinnitatud ${result.saved}. Kontrolli ebaõnnestunud jaotusi: ${result.failed}.`
      :`Kõik ${result.saved} maksejaotust on kinnitatud.`);
  };
  const rows=React.useMemo(()=>{
    const query=normalizeText(search);
    return queue.rows.filter(row=>{
      if(filter==='work'&&row.status==='exact') return false;
      if(filter==='confirm'&&row.status!=='needs_confirmation') return false;
      if(filter==='attention'&&!['invalid','incomplete','attention','unsupported'].includes(row.status)) return false;
      if(filter==='exact'&&row.status!=='exact') return false;
      return !query||normalizeText(`${row.invoiceNum} ${row.payer} ${row.paymentId} ${row.reason}`).includes(query);
    });
  },[queue.rows,filter,search]);
  const statusMeta={
    needs_confirmation:{label:'Kinnita ettepanek',bg:'#eff6ff',color:'#1d4ed8',icon:'fa-wand-magic-sparkles'},
    incomplete:{label:'Jaotus pooleli',bg:'#fffbeb',color:'#92400e',icon:'fa-circle-half-stroke'},
    attention:{label:'Summa ei mahu',bg:'#fff1f2',color:'#991b1b',icon:'fa-triangle-exclamation'},
    invalid:{label:'Vigane versiooniviit',bg:'#fee2e2',color:'#991b1b',icon:'fa-link-slash'},
    unsupported:{label:'Pärandarve',bg:'#f3f4f6',color:'#42536A',icon:'fa-box-archive'},
    exact:{label:'Täpselt jaotatud',bg:'#ecfdf5',color:'#166534',icon:'fa-shield-check'}
  };
  const confidenceMeta={
    high:{label:'Kõrge kindlus',bg:'#dcfce7',color:'#166534'},
    medium:{label:'Keskmine kindlus',bg:'#fef3c7',color:'#92400e'},
    low:{label:'Madal kindlus',bg:'#ffedd5',color:'#9a3412'},
    confirmed:{label:'Kinnitatud',bg:'#dcfce7',color:'#166534'},
    none:{label:'Ettepanek puudub',bg:'#f3f4f6',color:'#64748b'}
  };
  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:10}}>
        {[
          ['Vajavad kinnitamist',queue.summary.needsConfirmationCount,'#1d4ed8','#eff6ff'],
          ['Vajavad tähelepanu',queue.summary.attentionCount,'#991b1b','#fff1f2'],
          ['Kõrge kindlusega',queue.summary.highConfidenceCount,'#166534','#ecfdf5'],
          ['Täpselt jaotatud',queue.summary.exactCount,'#166534','#f0fdf4']
        ].map(([label,value,color,bg])=>(
          <div key={label} className="card" style={{padding:15,background:bg}}>
            <div style={{fontSize:'.66rem',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em',color:'#64748b'}}>{label}</div>
            <div style={{fontFamily:'Fraunces,Georgia,serif',fontSize:'1.55rem',fontWeight:700,color,marginTop:5}}>{value}</div>
          </div>
        ))}
      </div>
      {eligibleRows.length>0&&(
        <div className="card" style={{padding:14,background:'#ecfdf5',border:'1px solid rgba(22,101,52,.16)'}}>
          <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'center',flexWrap:'wrap'}}>
            <div>
              <div style={{fontWeight:800,color:'#166534'}}>Turvaline paketkinnitus</div>
              <div style={{fontSize:'.72rem',color:'#42536A',marginTop:3}}>
                Valida saab ainult täielikud kõrge kindlusega ettepanekud. Server kontrollib summasid ja vaba tunnijääki uuesti.
              </div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
              <button onClick={()=>setSelected(selected.length===eligibleRows.length?[]:eligibleRows.map(row=>row.paymentId))}
                className="btn btn-ghost btn-sm" disabled={batchBusy}>
                {selected.length===eligibleRows.length?'Tühista valik':'Vali kõik'} · {eligibleRows.length}
              </button>
              <button onClick={confirmSelected} className="btn btn-pine btn-sm" disabled={!selectedRows.length||batchBusy}
                style={{opacity:(!selectedRows.length||batchBusy)?.55:1}}>
                <i className="fa-solid fa-shield-check"/> {batchBusy?'Kontrollin…':`Kinnita valitud · ${selectedRows.length}`}
              </button>
            </div>
          </div>
        </div>
      )}
      <div className="card" style={{padding:14}}>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <input value={search} onChange={event=>setSearch(event.target.value)}
            placeholder="Otsi arve, maksja või makse ID järgi…" style={{flex:1,minWidth:230}}/>
          {[
            ['work','Tööjärjekord'],
            ['confirm','Kinnitamata'],
            ['attention','Tähelepanu'],
            ['exact','Kinnitatud'],
            ['all','Kõik']
          ].map(([id,label])=>(
            <button key={id} onClick={()=>setFilter(id)} className={filter===id?'btn btn-dark btn-sm':'btn btn-ghost btn-sm'}>{label}</button>
          ))}
        </div>
      </div>
      {rows.map(row=>{
        const meta=statusMeta[row.status]||statusMeta.attention;
        const confidence=confidenceMeta[row.confidence]||confidenceMeta.none;
        const canOpen=!['invalid','unsupported'].includes(row.status);
        const canBatch=eligibleIds.has(row.paymentId);
        return(
          <div key={row.paymentId} className="card" style={{padding:0,overflow:'hidden',border:`1px solid ${meta.color}22`}}>
            <div style={{padding:'14px 16px',display:'flex',justifyContent:'space-between',gap:14,alignItems:'flex-start',flexWrap:'wrap'}}>
              <div style={{minWidth:220,flex:1}}>
                <div style={{display:'flex',gap:7,alignItems:'center',flexWrap:'wrap'}}>
                  {canBatch&&(
                    <input type="checkbox" checked={selected.includes(row.paymentId)}
                      onChange={()=>toggleSelected(row.paymentId)} disabled={batchBusy}
                      aria-label={`Vali makse ${row.paymentId}`} style={{width:'auto'}}/>
                  )}
                  <strong>{row.invoiceNum} · {row.payer}</strong>
                  <span className="badge" style={{background:meta.bg,color:meta.color}}>
                    <i className={`fa-solid ${meta.icon}`}/> {meta.label}
                  </span>
                  <span className="badge" style={{background:confidence.bg,color:confidence.color}}>{confidence.label}</span>
                </div>
                <div style={{fontSize:'.72rem',color:'#64748b',marginTop:5}}>
                  {fmtDate(row.paidAt)} · makse {money(accountingAmount(row.paymentCents))} € · ID {row.paymentId}
                </div>
                <div style={{fontSize:'.74rem',color:'#42536A',marginTop:7}}>{row.reason}</div>
                {row.referenceEvidence?.matched&&(
                  <div style={{fontSize:'.7rem',color:'#166534',marginTop:4}}>
                    <i className="fa-solid fa-receipt"/> Pangaselgituse arveviide kinnitatud
                  </div>
                )}
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                {row.history.length>0&&<span style={{fontSize:'.7rem',color:'#64748b'}}>{row.history.length} versiooni</span>}
                {canOpen&&(
                  <button onClick={()=>onOpen(row)} className={row.status==='exact'?'btn btn-ghost btn-sm':'btn btn-pine btn-sm'}>
                    {row.status==='exact'?'Ava ajalugu':row.currentAllocation?'Paranda jaotust':'Kontrolli ja kinnita'}
                  </button>
                )}
              </div>
            </div>
            {row.suggestedLines.length>0&&row.status!=='exact'&&(
              <div style={{padding:'10px 16px',background:'#F9F8F6',borderTop:'1px solid rgba(28,43,58,.07)'}}>
                <div style={{fontSize:'.66rem',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em',color:'#64748b'}}>Süsteemi ettepanek</div>
                <div style={{display:'flex',gap:7,flexWrap:'wrap',marginTop:7}}>
                  {row.suggestedLines.map(line=>(
                    <span key={line.lessonId} style={{padding:'6px 8px',borderRadius:8,background:'#fff',border:'1px solid rgba(28,43,58,.08)',fontSize:'.7rem'}}>
                      {fmtDate(line.lessonDate)} · {line.description||'Tund'} · <strong>{money(accountingAmount(line.allocatedAmountCents))} €</strong>
                    </span>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      })}
      {rows.length===0&&(
        <div className="card" style={{padding:34,textAlign:'center',color:'#64748b'}}>
          <i className="fa-solid fa-circle-check" style={{fontSize:'1.5rem',color:'#166534'}}/>
          <div style={{fontWeight:800,marginTop:9}}>Selles vaates pole makseid</div>
        </div>
      )}
    </div>
  );
}

function AccountingRegisterView({invoices,payments,paymentLineAllocations,bankTransactions,payerCredits,lessons,students,tariffAssignments,financialPeriods,reviewFinancialPeriod,savePaymentLineAllocation,openInvoices,openReconciliation,openPaymentDocument,voidPayment,addInvoice,updateLessonBillingDisposition,notify}) {
  const [month,setMonth]=React.useState(()=>today().slice(0,7));
  const [registerMode,setRegisterMode]=React.useState('invoices');
  const [status,setStatus]=React.useState('all');
  const [search,setSearch]=React.useState('');
  const [allocationDraft,setAllocationDraft]=React.useState(null);
  const [allocationBatchBusy,setAllocationBatchBusy]=React.useState(false);
  const register=React.useMemo(()=>accountingRegister({
    invoices,
    payments,
    bankTransactions,
    payerCredits,
    month
  }),[invoices,payments,bankTransactions,payerCredits,month]);
  const periodControl=React.useMemo(()=>financialPeriodControl({
    invoices,
    payments,
    bankTransactions,
    payerCredits,
    lessons,
    paymentLineAllocations,
    month
  }),[invoices,payments,paymentLineAllocations,bankTransactions,payerCredits,lessons,month]);
  const period=React.useMemo(()=>
    (financialPeriods||[]).find(item=>(item.month||item.id)===month)||null
  ,[financialPeriods,month]);
  const allocationQueue=React.useMemo(()=>paymentAllocationQueue({
    invoices,
    payments,
    paymentLineAllocations,
    month
  }),[invoices,payments,paymentLineAllocations,month]);
  const confirmAllocationBatch=async rows=>{
    if(allocationBatchBusy||!rows.length) return null;
    setAllocationBatchBusy(true);
    const result={saved:0,failed:0,failedPaymentIds:[]};
    for(const row of rows){
      const saved=await savePaymentLineAllocation(row.payment,{
        allocations:row.suggestedLines.map(line=>({
          lessonId:line.lessonId,
          amount:accountingAmount(line.allocatedAmountCents)
        })),
        effectiveDate:today(),
        reason:'Kõrge kindlusega süsteemiettepanek kinnitatud paketina',
        requestId:financeRequestId('lineallocationbatch'),
        silent:true
      });
      if(saved) result.saved+=1;
      else{
        result.failed+=1;
        result.failedPaymentIds.push(row.paymentId);
      }
    }
    setAllocationBatchBusy(false);
    return result;
  };
  const visibleRows=React.useMemo(()=>{
    const query=normalizeText(search);
    return register.rows.filter(row=>{
      if(status!=='all'&&row.status!==status) return false;
      if(query&&!normalizeText(`${row.number} ${row.payer} ${row.description} ${(row.paymentSourceLabels||[]).join(' ')} ${(row.paymentDocuments||[]).map(document=>`${document.fileName||''} ${document.id||''}`).join(' ')}`).includes(query)) return false;
      return true;
    });
  },[register.rows,status,search]);
  const selectedMonthLabel=React.useMemo(()=>{
    const parsed=new Date(`${month}-01T12:00:00`);
    return Number.isNaN(parsed.getTime())
      ? month
      : parsed.toLocaleDateString('et-EE',{month:'long',year:'numeric'});
  },[month]);
  const moveMonth=delta=>{
    const parsed=new Date(`${month}-01T12:00:00`);
    parsed.setMonth(parsed.getMonth()+delta);
    setMonth(toLocalISODate(parsed).slice(0,7));
  };
  const downloadCsv=()=>{
    const csv=accountingRegisterCsv({...register,rows:visibleRows});
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.download=`keelesepp-arvete-register-${month}.csv`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  };
  const statusMeta={
    paid:{bg:'#dcfce7',color:'#166534'},
    partial:{bg:'#fef3c7',color:'#92400e'},
    unpaid:{bg:'#f3f4f6',color:'#42536A'},
    overdue:{bg:'#fee2e2',color:'#991b1b'},
    overpaid:{bg:'#ede9fe',color:'#6d28d9'},
    credited:{bg:'#e0f2fe',color:'#075985'}
  };
  const moneyCents=value=>`${accountingAmount(value).toFixed(2)} €`;
  const summaryCards=[
    {label:'Väljastatud arveid',value:moneyCents(register.summary.issuedCents),note:`${register.summary.invoiceCount} arvet`,color:'#1C2B3A',bg:'#fff'},
    {label:'Arvetele kantud',value:moneyCents(register.summary.paymentsAppliedCents),note:`${register.summary.paymentCount} maksekirjet sel kuul`,color:'#166534',bg:'#ecfdf5'},
    {label:'Pangalaekumised',value:moneyCents(register.summary.bankReceivedCents),note:`${register.summary.bankTransactionCount} sobitatud tehingut`,color:'#1d4ed8',bg:'#eff6ff'},
    {label:'Arvete jääk',value:moneyCents(register.summary.outstandingCents),note:'valitud kuul väljastatud arvetel',color:'#991b1b',bg:'#fff1f2'},
    {label:'Avatud ettemaksed',value:moneyCents(register.summary.openCreditCents),note:`${register.summary.openCreditCount} aktiivset jääki`,color:'#6d28d9',bg:'#f5f3ff'}
  ];
  return(
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:18}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:14,alignItems:'flex-end',flexWrap:'wrap'}}>
        <div>
          <h1 style={{fontSize:'1.7rem'}}>Raamatupidamine</h1>
          <p style={{color:'#64748b',fontSize:'.88rem',marginTop:3}}>
            {registerMode==='invoices'
              ?'Arvete ja laekumiste register'
              :registerMode==='lessons'
                ?'Tundide ja maksete täpne kontroll'
                :registerMode==='allocations'
                ?'Maksete täpse tunnijaotuse tööjärjekord'
                  :registerMode==='control'
                    ?'Kuu finantskontroll ja kinnitatud kontrollversioon'
                    :'Raamatupidamise eksport, kuu lukustamine ja parandused'}
          </p>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <button onClick={()=>moveMonth(-1)} className="btn btn-ghost btn-sm"><i className="fa-solid fa-chevron-left"/> Eelmine</button>
          <input type="month" value={month} onChange={event=>setMonth(event.target.value)}
            style={{width:155,fontWeight:700}}/>
          <button onClick={()=>moveMonth(1)} className="btn btn-ghost btn-sm">Järgmine <i className="fa-solid fa-chevron-right"/></button>
          {registerMode==='invoices'&&<button onClick={downloadCsv} className="btn btn-pine btn-sm"><i className="fa-solid fa-file-csv"/> Ekspordi CSV</button>}
        </div>
      </div>

      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <button onClick={()=>setRegisterMode('invoices')} className={registerMode==='invoices'?'btn btn-dark btn-sm':'btn btn-ghost btn-sm'}>
          <i className="fa-solid fa-file-invoice"/> Arvete register
        </button>
        <button onClick={()=>setRegisterMode('lessons')} className={registerMode==='lessons'?'btn btn-dark btn-sm':'btn btn-ghost btn-sm'}>
          <i className="fa-solid fa-link"/> Tunnid ↔ maksed
        </button>
        <button onClick={()=>setRegisterMode('allocations')} className={registerMode==='allocations'?'btn btn-dark btn-sm':'btn btn-ghost btn-sm'}>
          <i className="fa-solid fa-list-check"/> Maksejaotused
          {(allocationQueue.summary.needsConfirmationCount+allocationQueue.summary.attentionCount)>0&&(
            <span className="badge" style={{marginLeft:4,background:'#fef3c7',color:'#92400e'}}>
              {allocationQueue.summary.needsConfirmationCount+allocationQueue.summary.attentionCount}
            </span>
          )}
        </button>
        <button onClick={()=>setRegisterMode('control')} className={registerMode==='control'?'btn btn-dark btn-sm':'btn btn-ghost btn-sm'}>
          <i className="fa-solid fa-shield-check"/> Kuu kontroll
          {periodControl.summary.blockingIssueCount>0&&(
            <span className="badge" style={{marginLeft:4,background:'#fee2e2',color:'#991b1b'}}>{periodControl.summary.blockingIssueCount}</span>
          )}
        </button>
        <button onClick={()=>setRegisterMode('closure')} className={registerMode==='closure'?'btn btn-dark btn-sm':'btn btn-ghost btn-sm'}>
          <i className="fa-solid fa-lock"/> Kuu sulgemine
          {period?.status==='closed'&&<span className="badge" style={{marginLeft:4,background:'#dcfce7',color:'#166534'}}>Suletud</span>}
        </button>
      </div>

      <div className="card" style={{padding:16,background:'#1C2B3A',color:'#fff'}}>
        <div style={{fontSize:'.72rem',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:800,color:'rgba(255,255,255,.55)'}}>Valitud periood</div>
        <div style={{fontFamily:'Fraunces,Georgia,serif',fontSize:'1.4rem',marginTop:3,textTransform:'capitalize'}}>{selectedMonthLabel}</div>
        <div style={{fontSize:'.75rem',color:'rgba(255,255,255,.65)',marginTop:5}}>
          {registerMode==='invoices'
            ?'Arved kuuluvad perioodi väljastamise kuupäeva järgi. Laekumised kuuluvad perioodi makse kuupäeva järgi; seetõttu võivad laekumised sisaldada varasemate arvete tasumisi.'
            :registerMode==='lessons'
              ?'Tunnid kuuluvad perioodi toimumise kuupäeva järgi. Iga rida kontrollib tunni ID-d, arverida, makseid, paketikatet ja allesjäänud summat.'
              :registerMode==='allocations'
                ?'Süsteem pakub jaotust ainult aktiivse makse, arve muutumatute tunniridade ja allesjäänud summade põhjal. Ettepanek ei muutu finantskirjeks enne administraatori kinnitust.'
                :registerMode==='control'
                  ?'Kuu kontroll ühendab tundide finantsotsused, arveread, aktiivsed maksekirjed ja pangatehingute jaotuse. Kinnitamine loob muutumatu serveripoolse kontrollversiooni.'
                  :'Sulgemine kontrollib lisaks kuludokumente ja töötasu, arhiveerib raamatupidamise ekspordi ning lukustab perioodi finantskuupäevad.'}

            <div style={{fontSize:'.68rem',fontWeight:800,textTransform:'uppercase',letterSpacing:'.07em',color:'#64748b'}}>{card.label}</div>
            <div style={{fontFamily:'Fraunces,Georgia,serif',fontSize:'1.55rem',fontWeight:700,color:card.color,marginTop:7}}>{card.value}</div>
            <div style={{fontSize:'.7rem',color:'#64748b',marginTop:3}}>{card.note}</div>

          <div style={{padding:'14px 16px',background:'#fffbeb',display:'flex',justifyContent:'space-between',gap:10,alignItems:'center',flexWrap:'wrap'}}>

                <div>

                  <div style={{fontSize:'.74rem',color:'#64748b',marginTop:2}}>{issue.detail}</div>
                </div>
              </div>

          </div>
        </div>
      )}

      <div className="card" style={{overflow:'hidden'}}>
        <div style={{padding:14,borderBottom:'1px solid rgba(28,43,58,.08)',display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <input value={search} onChange={event=>setSearch(event.target.value)}

          <select value={status} onChange={event=>setStatus(event.target.value)} style={{width:190}}>
            <option value="all">Kõik staatused</option>

            <option value="partial">Osaliselt makstud</option>
            <option value="unpaid">Tasumata</option>
            <option value="overdue">Tähtaja ületanud</option>
            <option value="overpaid">Enammakstud</option>

          </select>
          <button onClick={openInvoices} className="btn btn-ghost btn-sm">Ava arvete väljastamine</button>
        </div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:940}}>
            <thead>
              <tr style={{background:'#F9F8F6',fontSize:'.68rem',textTransform:'uppercase',letterSpacing:'.06em',color:'#64748b'}}>
