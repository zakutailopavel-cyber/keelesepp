const invoiceFinancialSummary = inv => {
  const originalAmount = Math.max(0,Number(inv?.amount)||0);
  const amount = inv?.effectiveAmount!==undefined
    ? Math.max(0,Number(inv.effectiveAmount)||0)
    : originalAmount;
  const legacyPaid = inv?.status==='Makstud' && inv?.paidAmount===undefined;
  const paid = legacyPaid ? amount : Math.max(0,Number(inv?.paidAmount)||0);
  return {
    amount,
    originalAmount,
    credited:Math.max(0,Number(inv?.creditedAmount)||originalAmount-amount),
    paid,
    balance:Math.max(0,amount-paid),
    overpaid:Math.max(0,Number(inv?.overpaidAmount)||paid-amount),
    paymentStatus:inv?.paymentStatus || (legacyPaid?'legacy_paid':paid>0?'partial':'unpaid')
  };
};
const paymentFinancialSummary = payment => {
  const gross = Math.max(0,Number(payment?.amount)||0);
  const resolved = Math.max(0,Number(payment?.resolvedAmount)||0);
  return {gross,resolved,net:Math.max(0,gross-resolved)};
};

  return null;
};
const billableLessonsForStudent = (lessonRecords,student) => {
  const studentId = typeof student==='string' ? student : student?.id;
  const candidates = (lessonRecords||[])
    .filter(lesson=>
      lesson.studentId===studentId &&
      (
        (
          lesson.status==='Toimunud' &&
          (!lesson.billingStatus||lesson.billingStatus==='unbilled') &&
          lesson.packageAccountingSource!=='package_ledger_v1' &&
          lesson.packageConsumptionStatus!=='consumed'
        )
        || lesson.billingStatus==='late_cancel_billable'
      ) &&
      !lesson.invoiceId
    )
    .sort((a,b)=>`${a.date||''}:${a.id||''}`.localeCompare(`${b.date||''}:${b.id||''}`));
  if(typeof student==='string'||!student) return candidates;
  const explicit = candidates.filter(lesson=>
    lesson.billingStatus==='unbilled'||lesson.billingStatus==='late_cancel_billable'
  );
  const legacy = candidates.filter(lesson=>!lesson.billingStatus);
  const hasLegacyCounter = Object.prototype.hasOwnProperty.call(student,'lessonsSinceInvoice');
  const legacyCount = hasLegacyCounter
    ? Math.max(0,(Number(student.lessonsSinceInvoice)||0)-explicit.length)
    : legacy.length;
  const selectedLegacy = legacy.slice(Math.max(0,legacy.length-legacyCount));
  return [...explicit,...selectedLegacy]
    .filter((lesson,index,list)=>list.findIndex(item=>item.id===lesson.id)===index)
    .sort((a,b)=>`${a.date||''}:${a.id||''}`.localeCompare(`${b.date||''}:${b.id||''}`));
};
const tariffAssignmentForDate = (assignments,studentId,date) => (assignments||[])
  .filter(assignment=>
    assignment.studentId===studentId
    && assignment.effectiveFrom<=date
    && (!assignment.effectiveUntil||date<=assignment.effectiveUntil)
  )
  .sort((a,b)=>`${b.effectiveFrom||''}:${b.createdAt||''}:${b.id||''}`.localeCompare(`${a.effectiveFrom||''}:${a.createdAt||''}:${a.id||''}`))[0]||null;
const invoiceDraftForStudent = (student, amountInput='', descInput='', lessonRecords=null, tariffAssignments=[]) => {
  const billableLessons = Array.isArray(lessonRecords) ? lessonRecords : null;
  const lessons = billableLessons ? billableLessons.length : Math.max(0, Number(student?.lessonsSinceInvoice)||0);
  const legacyLessonPrice = Math.max(0, Number(student?.lessonPrice)||0);
  const pricedLessons = billableLessons
    ? billableLessons.map(lesson=>{
        const assignment=tariffAssignmentForDate(tariffAssignments,student?.id,lesson.date);
        const lessonPrice=Math.max(0,Number(assignment?.unitPrice)||legacyLessonPrice);
        return {
          lessonId:lesson.id,
          lessonPrice,
          tariffName:assignment?.tariffName||'',
          tariffAssignmentId:assignment?.id||'',
          pricingSource:assignment?'tariff_assignment':'legacy_student_price'
        };
      })
    : Array.from({length:lessons},()=>({
        lessonId:'',
        lessonPrice:legacyLessonPrice,
        tariffName:'',
        tariffAssignmentId:'',
        pricingSource:'legacy_student_price'
      }));
  const autoAmount = pricedLessons.length&&pricedLessons.every(item=>item.lessonPrice>0)
    ? Math.round(pricedLessons.reduce((sum,item)=>sum+item.lessonPrice,0)*100)/100
    : 0;
  const uniquePrices=[...new Set(pricedLessons.map(item=>item.lessonPrice).filter(price=>price>0))];
  const lessonPrice=uniquePrices.length===1?uniquePrices[0]:0;
  const lessonPricesById=Object.fromEntries(pricedLessons.filter(item=>item.lessonId).map(item=>[item.lessonId,item.lessonPrice]));
  const tariffNamesById=Object.fromEntries(pricedLessons.filter(item=>item.lessonId).map(item=>[item.lessonId,item.tariffName]));
  const tariffCount=pricedLessons.filter(item=>item.pricingSource==='tariff_assignment').length;
  const pricingMode=tariffCount===pricedLessons.length&&pricedLessons.length
    ? 'tariff_assignments_v1'
    : tariffCount>0?'mixed_tariff_legacy_v1':'legacy_student_price';
  const manualProvided = String(amountInput??'').trim()!=='';
  const manualAmount = manualProvided ? (Number(String(amountInput).replace(',','.'))||0) : 0;
  // Если сумма введена явно (в т.ч. «0» или мусор) — автосумма НЕ подставляется
  // молча: ноль остановит создание счёта с предупреждением, а не выставит
  // неожиданную сумму за спиной у администратора.
  const amount = manualProvided ? manualAmount : autoAmount;
  const autoDesc = lessons>0&&autoAmount>0
    ? lessonPrice>0
      ? `${lessons} keeletundi x ${money(lessonPrice)}€`
      : `${lessons} keeletundi tariifide järgi`
    : 'Keeletunnid';
  const desc = String(descInput||'').trim()||autoDesc;
  return {
    lessons,
    lessonPrice,
    autoAmount,
    manualProvided,
    manualAmount,
    amount,
    desc,
    hasAuto:autoAmount>0,
    lessonIds:billableLessons ? billableLessons.map(lesson=>lesson.id) : [],
    lessonPricesById,
    tariffNamesById,
    pricingMode
  };
};
function CollapsibleCard({id,title,subtitle,badge,children,defaultCollapsed=false,style={},bodyStyle={},titleColor='#1C2B3A'}) {
  const storageKey = `keelesepp:collapse:${id}`;
  const [collapsed,setCollapsed] = React.useState(()=>{
    try{
      const saved = window.localStorage.getItem(storageKey);
      if(saved!==null) return saved==='1';
    }catch(e){}
    return Boolean(defaultCollapsed);
  });
  const toggle = () => {
    setCollapsed(prev=>{
      const next = !prev;
      try{window.localStorage.setItem(storageKey,next?'1':'0');}catch(e){}
      return next;
    });
  };
  return (
    <div className="card" style={{padding:0,overflow:'hidden',...style}}>
      <button type="button" onClick={toggle} aria-expanded={!collapsed}
        style={{width:'100%',display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,flexWrap:'wrap',padding:24,border:'none',background:'transparent',font:'inherit',textAlign:'left',cursor:'pointer'}}>
        <div style={{minWidth:0,flex:1}}>
          <h3 style={{color:titleColor,marginBottom:subtitle?4:0}}>{title}</h3>
          {subtitle&&<div style={{fontSize:'.84rem',color:'#42536A',marginTop:4}}>{subtitle}</div>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',justifyContent:'flex-end'}}>
          {badge}
          <span className="badge" style={{background:'rgba(28,43,58,.06)',color:'#42536A',border:'1px solid rgba(28,43,58,.08)'}}>
            {collapsed?'Näita':'Peida'} <i className={`fa-solid ${collapsed?'fa-chevron-down':'fa-chevron-up'}`} style={{fontSize:'.68rem',marginLeft:4}}/>
          </span>
        </div>
      </button>
      {!collapsed&&<div style={{padding:'0 24px 24px',...bodyStyle}}>{children}</div>}
    </div>
  );
}
const getLessonAttachments = lesson => {
  const list = Array.isArray(lesson?.attachments) ? lesson.attachments.filter(att=>att&&(att.url||att.name)) : [];
  const legacyUrl = lesson?.fileUrl || lesson?.attachmentUrl || lesson?.attachment?.url || '';
  const legacyName = lesson?.fileName || lesson?.attachmentName || lesson?.attachment?.name || '';
  const legacy = legacyUrl ? [{url:legacyUrl,name:legacyName||'Tunni fail'}] : [];
  const urls = new Set(list.map(att=>att.url).filter(Boolean));
  return [...list,...legacy.filter(att=>!urls.has(att.url))];
};
function LessonDetailsPanel({lesson,homeworkItems=[]}) {
  if(!lesson) return null;
  const attachments = getLessonAttachments(lesson);
  const relatedHomework = Array.isArray(homeworkItems) ? homeworkItems.filter(Boolean) : [];
  const detailRows = [
    {label:'Mida tegime tunnis',value:lesson.covered,icon:'fa-list-check'},
    {label:'Uued sõnad ja väljendid',value:lesson.newWords,icon:'fa-book-open'},
    {label:'Grammatika',value:lesson.grammar,icon:'fa-spell-check'},
    {label:'Järgmiseks korraks',value:lesson.nextNotes,icon:'fa-bullseye'},
    {label:'Õpetaja kommentaar',value:lesson.comment,icon:'fa-message'}
  ].filter(row=>String(row.value||'').trim());
  const statusLabel = lesson.status==='Toimunud' ? 'Toimunud' : lesson.status==='Puudus_p' ? 'Puudus põhjusega' : lesson.status==='Puudus_eta' ? 'Puudus' : (lesson.status||'Planeeritud');
  return (
    <div style={{margin:'0 0 12px 50px',padding:'14px 16px',borderRadius:14,background:'#F9F8F6',border:'1px solid rgba(47,93,80,.16)',display:'flex',flexDirection:'column',gap:12}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'flex-start',flexWrap:'wrap'}}>
        <div>
          <div style={{fontSize:'.76rem',fontWeight:800,color:'#42536A',textTransform:'uppercase',letterSpacing:'.08em'}}>Tunni kokkuvõte</div>
          <div style={{fontWeight:800,color:'#1C2B3A',marginTop:4}}>{lesson.topic||'Tund'}</div>
          <div style={{fontSize:'.78rem',color:'#42536A',marginTop:3}}>Õp. {lesson.teacher||'—'} · {fmtDate(lesson.date)}</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',justifyContent:'flex-end'}}>
          <span className="badge" style={{background:'#dcfce7',color:'#166534'}}>{statusLabel}</span>
          {(()=>{const meta=lessonBillingStatusMeta(lesson);return meta?<span className="badge" style={{background:meta.bg,color:meta.color}}>{meta.label}</span>:null;})()}
          {lesson.status==='Toimunud'&&lesson.grade>0&&<span className="badge" style={{background:'rgba(201,136,42,.12)',color:'#A96E1A'}}>Hinne {lesson.grade}</span>}
          {lesson.duration&&<span className="badge" style={{background:'#e0f2fe',color:'#075985'}}>{lesson.duration} min</span>}

      {detailRows.length===0&&attachments.length===0&&relatedHomework.length===0&&(
        <div style={{fontSize:'.82rem',color:'#42536A'}}>Õpetaja ei ole selle tunni kohta veel detailset päevikukannet lisanud.</div>

      {detailRows.map(row=>(
        <div key={row.label} style={{display:'grid',gridTemplateColumns:'22px 150px 1fr',gap:8,alignItems:'start'}}>
          <i className={`fa-solid ${row.icon}`} style={{color:'#2F5D50',fontSize:'.78rem',marginTop:2}}/>

          <div style={{fontSize:'.84rem',color:'#1C2B3A',lineHeight:1.45,whiteSpace:'pre-wrap'}}>{row.value}</div>

      {relatedHomework.length>0&&(
        <div style={{padding:'10px 12px',borderRadius:12,background:'#fff',border:'1px solid rgba(124,58,237,.14)',display:'flex',flexDirection:'column',gap:8}}>

            <i className="fa-solid fa-book-open"/> Kodutöö pärast tundi
          </div>
          {relatedHomework.map(hw=>(
            <div key={hw.id||hw.task} style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'flex-start',fontSize:'.82rem'}}>

            </a>
          ))}
        </div>
      )}
    </div>
  );
}

// ── PROGRESSIGRAAFIK ─────────────────────────────────────────
function ProgressChart({data}) {
  const ref = useRef(null);
  useEffect(()=>{
    if(!ref.current||data.length<2) return;
    const sorted=[...data].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const ch=new Chart(ref.current.getContext('2d'),{
      type:'line',
      data:{labels:sorted.map(d=>fmtDate(d.date)),datasets:[{
        data:sorted.map(d=>d.grade),borderColor:'#C9882A',backgroundColor:'rgba(201,136,42,0.07)',
        borderWidth:2.5,tension:0.4,fill:true,pointBackgroundColor:'#2F5D50',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:5
      }]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{y:{min:1,max:5,ticks:{stepSize:1}},x:{grid:{display:false}}}}
    });
    return ()=>ch.destroy();
  },[data]);
  if(data.length<2) return <div style={{textAlign:'center',padding:'30px 0',color:'#42536A',fontSize:'.88rem'}}>Graafiku jaoks vajatakse vähemalt 2 tundi ✨</div>;
  return <div style={{height:200}}><canvas ref={ref}/></div>;
}

// ── AUTH SCREEN ───────────────────────────────────────────────
function AuthScreen({onLogin}) {
  const [mode,setMode]   = useState(()=>{
    try{
      const params = new URLSearchParams(window.location.search);
      const route = (params.get('mode') || window.location.hash.replace('#','')).toLowerCase();
      return ['register','registreeru','signup','loo-konto'].includes(route) ? 'register' : 'login';
    }catch(e){
      return 'login';
    }
  });
  const [role,setRole]   = useState('parent');
  const [name,setName]   = useState('');
  const [email,setEmail] = useState('');
  const [pass,setPass]   = useState('');
  const [pass2,setPass2] = useState('');
  const [child,setChild] = useState('');
  const [parentTeacher,setParentTeacher] = useState('Pavel');
  const [code,setCode]   = useState('');
  const [studentCardId,setStudentCardId] = useState('');
  const [acceptedTerms,setAcceptedTerms] = useState(false);
  const [err,setErr]     = useState('');
  const [info,setInfo]   = useState('');
  const [busy,setBusy]   = useState(false);
  const reset = m=>{setMode(m);setErr('');setInfo('');setPass('');setPass2('');setAcceptedTerms(false);};

  const googleLogin = async()=>{
    if(mode==='register'&&!acceptedTerms){setErr('Konto loomiseks nõustu kasutustingimustega.');return;}
    setErr('');setBusy(true);
    try{
      const res=await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      const u=res.user;
      const snap=await db.collection('users').doc(u.uid).get();
      if(snap.exists){
        const profile = {uid:u.uid,displayName:u.displayName,email:u.email,...snap.data()};
        try{
          await ensureStudentRecord(u, profile);
          await ensureParentStudentRecords(u, profile);
        }catch(syncErr){
          console.warn('Profile sync after Google login failed:', syncErr);
        }
        onLogin(profile);
      }
      else{
        const ud={role:'parent',displayName:u.displayName,email:u.email,childName:'',preferredTeacher:'Pavel',createdAt:today(),termsAcceptedAt:new Date().toISOString(),termsVersion:'2025-08-10'};
        await db.collection('users').doc(u.uid).set(ud);
        try{
          await ensureParentStudentRecords(u, {uid:u.uid,...ud});
        }catch(syncErr){
          console.warn('Parent student bootstrap after Google signup failed:', syncErr);
        }
        onLogin({uid:u.uid,...ud});
      }
    }catch(e){setErr('Google sisselogimine ebaõnnestus.');}
    setBusy(false);
  };

  const emailLogin = async()=>{
    if(!email||!pass){setErr('Täida kõik väljad');return;}
    setErr('');setBusy(true);
    try{
      const res=await auth.signInWithEmailAndPassword(email,pass);
      const snap=await db.collection('users').doc(res.user.uid).get();
      if(snap.exists){
        const profile = {uid:res.user.uid,displayName:res.user.displayName||email,...snap.data()};
        try{
          await ensureStudentRecord(res.user, profile);
          await ensureParentStudentRecords(res.user, profile);
        }catch(syncErr){
          console.warn('Profile sync after email login failed:', syncErr);
        }
        onLogin(profile);
      }
      else{
        await auth.signOut();
        setErr('Konto profiil puudub. Palun võta ühendust kooli administraatoriga.');
      }
    }catch(e){
      const m={'auth/user-not-found':'Kasutajat ei leitud','auth/wrong-password':'Vale parool','auth/invalid-credential':'Vale e-post või parool'};
      setErr(m[e.code]||e.message);
    }
    setBusy(false);
  };

  const register = async()=>{
    if(!name.trim()||!email.trim()||!pass){setErr('Täida kõik kohustuslikud väljad');return;}
    if(pass!==pass2){setErr('Paroolid ei ühti');return;}
    if(pass.length<6){setErr('Parool peab olema vähemalt 6 tähemärki');return;}
    if(!['parent','student'].includes(role)){setErr('Õpetaja ja administraatori kontod loob administraator.');return;}
    if(!acceptedTerms){setErr('Konto loomiseks nõustu kasutustingimustega.');return;}
    setErr('');setBusy(true);
    try{
      const res=await auth.createUserWithEmailAndPassword(email,pass);
      const ud={role,displayName:name,email,childName:role==='parent'?child:'',preferredTeacher:role==='parent'?parentTeacher:'',createdAt:today(),termsAcceptedAt:new Date().toISOString(),termsVersion:'2025-08-10'};
      try{
        await res.user.updateProfile({displayName:name});
        await db.collection('users').doc(res.user.uid).set(ud);
      }catch(profileError){
        await res.user.delete().catch(()=>null);
        throw profileError;
      }
      try{
        if(ud.role==='student'){
          // 1. If student provided their card ID — link directly
          if(studentCardId){
            const cardSnap = await db.collection('students').doc(studentCardId).get();
            if(cardSnap.exists){
              await db.collection('students').doc(studentCardId).update({
                studentUid: res.user.uid,
                linkedUserId: res.user.uid,
                email: email||cardSnap.data().email||'',
                updatedAt: today()
              });
              console.log('Linked by ID to card:', studentCardId);
            } else {
              // ID not found — create new
              await ensureStudentRecord(res.user, ud);
            }
          } else {
            // 2. Try to find existing card by email or name
            const existingByEmail = email ? await db.collection('students').where('email','==',email).limit(1).get() : {empty:true};
            const existingByName = name ? await db.collection('students').where('name','==',name.trim()).limit(1).get() : {empty:true};
            const existingDoc = (!existingByEmail.empty && existingByEmail.docs[0])
              || (!existingByName.empty && existingByName.docs[0])
              || null;
            if(existingDoc){
              await db.collection('students').doc(existingDoc.id).update({
                studentUid: res.user.uid,
                linkedUserId: res.user.uid,
                email: email||existingDoc.data().email||'',
                updatedAt: today()
              });
              console.log('Auto-linked to existing card:', existingDoc.id);
            } else {
              await ensureStudentRecord(res.user, ud);
            }
          }
        } else {
          await ensureStudentRecord(res.user, ud);
          await ensureParentStudentRecords(res.user, ud);
        }
      }catch(syncErr){
        console.warn('Profile sync after registration failed:', syncErr);
      }
      onLogin({uid:res.user.uid,...ud});
    }catch(e){
      const m={'auth/email-already-in-use':'See e-post on juba registreeritud','auth/invalid-email':'Vigane e-post'};
      setErr(m[e.code]||e.message);
    }
    setBusy(false);
  };

  const forgot = async()=>{
    if(!email){setErr('Sisesta oma e-posti aadress');return;}
    setBusy(true);
    try{await auth.sendPasswordResetEmail(email);setInfo('Taastamislink saadetud aadressile '+email);setErr('');}
    catch(e){setErr(e.message);}
    setBusy(false);
  };

  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:16,
      background:'linear-gradient(135deg,#1C2B3A 0%,#2F5D50 100%)'}}>
      <div style={{background:'#FBFAF8',borderRadius:24,padding:'40px 36px',width:'100%',maxWidth:420,boxShadow:'0 32px 80px rgba(0,0,0,.3)'}}>
        <div style={{textAlign:'center',marginBottom:32}}>
          <div style={{fontFamily:'Fraunces,Georgia,serif',fontSize:'2rem',fontWeight:600}}>
            Keele<span style={{color:'#C9882A'}}>Sepp</span>
          </div>
          <div style={{fontSize:'.82rem',color:'#42536A',marginTop:4}}>
            {mode==='login'?'Sisselogimine':mode==='register'?'Uue konto loomine':'Parooli taastamine'}
          </div>
        </div>

        {mode==='register'&&(
          <div style={{display:'flex',background:'#EFEDE7',borderRadius:12,padding:4,marginBottom:20,gap:3}}>
            {[{id:'parent',l:'Lapsevanem'},{id:'student',l:'Õpilane'}].map(r=>(
              <button key={r.id} onClick={()=>setRole(r.id)}
                style={{flex:1,padding:'8px 4px',borderRadius:9,border:'none',cursor:'pointer',fontWeight:600,fontSize:'.78rem',
                  background:role===r.id?'#1C2B3A':'transparent',color:role===r.id?'#fff':'#42536A'}}>
                {r.l}
              </button>
            ))}
          </div>
        )}

        <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:16}}>
          {mode==='register'&&<input value={name} onChange={e=>setName(e.target.value)} placeholder="Täisnimi *"/>}
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&mode==='login'&&emailLogin()}
            placeholder="E-posti aadress *"/>
          {mode!=='forgot'&&<input type="password" value={pass} onChange={e=>setPass(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&mode==='login'&&emailLogin()}
            placeholder="Parool *"/>}
          {mode==='register'&&<>
            <input type="password" value={pass2} onChange={e=>setPass2(e.target.value)} placeholder="Korda parooli *"/>
            {role==='parent'&&<>
              <input value={child} onChange={e=>setChild(e.target.value)} placeholder="Lapse nimi"/>
              <select value={parentTeacher} onChange={e=>setParentTeacher(e.target.value)}>
                {TEACHERS.map(t=><option key={t} value={t}>Õpetaja: {t}</option>)}
              </select>
            </>}
            {role==='student'&&<>
              <input value={studentCardId} onChange={e=>setStudentCardId(e.target.value.trim())}
                placeholder="Õpilase ID (valikuline — kui sul on olemas)"
                style={{fontFamily:'monospace',fontSize:'.85rem'}}/>
              {studentCardId&&<div style={{fontSize:'.75rem',color:'#2F5D50',padding:'4px 8px',background:'rgba(47,93,80,.08)',borderRadius:8}}>
                ✓ Konto seotakse olemasoleva õpilase kaardiga
              </div>}
            </>}
          </>}
        </div>

        {mode==='register'&&(
          <label style={{display:'flex',alignItems:'flex-start',gap:10,fontSize:'.78rem',lineHeight:1.45,color:'#42536A',marginBottom:14,textAlign:'left'}}>
            <input type="checkbox" checked={acceptedTerms} onChange={e=>setAcceptedTerms(e.target.checked)}
              style={{width:18,height:18,marginTop:1,flex:'0 0 auto',accentColor:'#2F5D50'}}/>
            <span>Olen läbi lugenud ja nõustun <a href="/tingimused/" target="_blank" rel="noopener noreferrer" style={{color:'#2F5D50',fontWeight:700}}>kasutustingimustega</a> ning olen tutvunud <a href="/privaatsus/" target="_blank" rel="noopener noreferrer" style={{color:'#2F5D50',fontWeight:700}}>privaatsuspoliitikaga</a>.</span>
          </label>
        )}

        {err&&<div style={{background:'#fee2e2',color:'#991b1b',borderRadius:10,padding:'10px 14px',fontSize:'.84rem',marginBottom:14}}>{err}</div>}
        {info&&<div style={{background:'#dcfce7',color:'#166534',borderRadius:10,padding:'10px 14px',fontSize:'.84rem',marginBottom:14}}>{info}</div>}

        {mode==='login'&&<button onClick={emailLogin} disabled={busy} className="btn btn-dark" style={{width:'100%',marginBottom:10,borderRadius:12,padding:'13px'}}>{busy?'Laeb…':'Sisene e-postiga'}</button>}
        {mode==='register'&&<button onClick={register} disabled={busy} className="btn btn-dark" style={{width:'100%',marginBottom:10,borderRadius:12,padding:'13px'}}>{busy?'Laeb…':'Loo konto'}</button>}
        {mode==='forgot'&&<button onClick={forgot} disabled={busy} className="btn btn-pine" style={{width:'100%',marginBottom:10,borderRadius:12,padding:'13px'}}>{busy?'Laeb…':'Saada taastamislink'}</button>}

        <button onClick={googleLogin} disabled={busy}
          style={{width:'100%',padding:'12px',borderRadius:12,border:'1.5px solid rgba(28,43,58,.15)',background:'#fff',cursor:'pointer',
            display:'flex',alignItems:'center',justifyContent:'center',gap:10,fontWeight:600,fontSize:'.9rem'}}>
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
            <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
            <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
            <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
          </svg>
          {mode==='register'?'Registreeru Google\'iga':'Sisene Google\'iga'}
        </button>

        <div style={{marginTop:20,textAlign:'center',fontSize:'.82rem',color:'#42536A'}}>
          {mode==='login'&&<>
            <span>Pole kontot? </span>
            <button onClick={()=>reset('register')} style={{color:'#C9882A',fontWeight:700,background:'none',border:'none',cursor:'pointer'}}>Registreeru</button>
            <span style={{color:'#d1d5db'}}> · </span>
            <button onClick={()=>reset('forgot')} style={{color:'#42536A',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>Unustasid parooli?</button>
          </>}
          {mode!=='login'&&<button onClick={()=>reset('login')} style={{color:'#C9882A',fontWeight:700,background:'none',border:'none',cursor:'pointer'}}>← Tagasi sisselogimisele</button>}
        </div>
      </div>
    </div>
  );
}

// ── DASHBOARD ────────────────────────────────────────────────
// TÄHTIS: kõik komponendid on App-ist VÄLJAS — see lahendab "iga täht uuendab lehte" probleemi
function Dashboard({user,myStudents,lessons,schedule,invoices,homework,
  tasks,staffMembers,unreadMessages,markMessagesRead,setSelStu:_setSelStu,setTab:_setTab,submitParentPayment,notify,
  newWsResults,markWsSeen,
  nName,setNName,nParentName,setNParentName,nEmail,setNEmail,nPhone,setNPhone,
  nLevel,setNLevel,nTarget,setNTarget,nPkg,setNPkg,
  nSubject,setNSubject,nGrade,setNGrade,nGroup,setNGroup,
  nTeach,setNTeach,addStudent,
  groupOptions,
  taskTitle,setTaskTitle,taskAssignee,setTaskAssignee,taskDue,setTaskDue,taskPriority,setTaskPriority,taskCategory,setTaskCategory,
  addTask,toggleTask,deleteTask,replyTask,markTaskRepliesSeen,openLessonEditor,isAdmin,isStaff,parentAlerts,createMissingParentStudents,markParentChecked,setTab,setSelStu,tariffAssignments=[]}) {
  const [expandedLessonId,setExpandedLessonId] = React.useState('');
  const [parentDashboardMode,setParentDashboardMode] = React.useState('family');
  const unpaidAmt = invoices.filter(i=>i.status==='Ootel').reduce((a,i)=>a+invoiceFinancialSummary(i).balance,0);
  const pendingHw = homework.filter(h=>h.status==='Ootel'&&myStudents.some(s=>s.id===h.studentId)).length;
  const openTasks = tasks.filter(t=>t.status!=='done');
  const taskStaffOptions = [...new Set([
    ...TEACHERS,
    ...(staffMembers||[]).map(member=>member.displayName||member.email),
    user.displayName
  ].filter(Boolean).map(canonicalTeacherName))];
  const teacherScope = canonicalTeacherName(user.displayName);
  const todaySchedule = schedule.filter(event=>scheduleEventOccursOnDate(event,today()));
  const todaySch  = isAdmin
    ? todaySchedule.length
    : todaySchedule.filter(s=>teacherMatches(s.teacher,user.displayName)).length;
  const currentStu= !isStaff?myStudents[0]:null;
  const doneLess  = currentStu?lessons.filter(l=>(l.studentId===currentStu.id||l.studentName?.toLowerCase()===currentStu.name?.toLowerCase())&&l.status==='Toimunud'):[];
  const stuLessons= currentStu?lessons.filter(l=>l.studentId===currentStu.id||l.studentName?.toLowerCase()===currentStu.name?.toLowerCase()):[];
  const linkedStudentNames = myStudents.map(s=>normalizeText(s.name));
  const visibleLessons = isStaff
    ? (isAdmin ? lessons : lessons.filter(l=>canonicalTeacherName(l.teacher)===teacherScope))
    : lessons.filter(l=>
        myStudents.some(s=>s.id===l.studentId) ||
        linkedStudentNames.includes(normalizeText(l.studentName))
      );
  const parentOwnStudyStudents = hasUserRole(user,'parent') ? myStudents.filter(student=>isOwnStudentRecord(student,user)) : [];
  const parentFamilyStudents = parentOwnStudyStudents.length
    ? myStudents.filter(student=>!isOwnStudentRecord(student,user))
    : myStudents;
  const parentFocusStudents = parentDashboardMode==='self' && parentOwnStudyStudents.length
    ? parentOwnStudyStudents
    : (parentFamilyStudents.length ? parentFamilyStudents : myStudents);
  const parentFocusIds = new Set(parentFocusStudents.map(student=>student.id));

              const priorityBg = task.priority==='high' ? '#fee2e2' : task.priority==='low' ? '#f3f4f6' : '#dbeafe';
              const categoryLabels = {general:'Üldine',parent:'Lapsevanem',payment:'Arved',lesson:'Tunnid',technical:'Tehniline'};
              return(
                <div key={task.id} style={{
                  display:'grid',gridTemplateColumns:'auto 1fr auto',gap:12,alignItems:'center',
                  padding:'11px 12px',borderRadius:12,border:'1px solid rgba(28,43,58,.08)',
                  background:done?'rgba(243,244,246,.55)':overdue?'#fff7ed':'#fff'
                }}>
                  <button onClick={()=>toggleTask(task)} title={done?'Märgi aktiivseks':'Märgi tehtuks'} style={{
                    width:30,height:30,borderRadius:999,border:'1.5px solid rgba(28,43,58,.16)',
                    background:done?'#2F5D50':'#fff',color:done?'#fff':'#42536A',cursor:'pointer'
                  }}>
                    <i className={`fa-solid ${done?'fa-check':'fa-circle'}`} style={{fontSize:done?'.8rem':'.55rem'}}/>
                  </button>

                    <div style={{fontWeight:700,textDecoration:done?'line-through':'none',opacity:done ? .65 : 1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                      {task.title}
                    </div>
                    <div style={{fontSize:'.76rem',color:'#42536A',marginTop:4}}>
                      {task.assignedTo||'Määramata'} · {categoryLabels[task.category]||'Üldine'} · tähtaeg: {task.dueDate?fmtDate(task.dueDate):'puudub'} · lisas {task.createdByName||'—'}
                    </div>
                    {(task.replies||[]).length>0&&(
                      <div style={{fontSize:'.74rem',color:'#1d4ed8',marginTop:4}}>
                        💬 {task.replies.length} vastust · viimane: {task.lastReplyBy||'—'}
                      </div>
                    )}
                  </div>
                  <div style={{display:'flex',gap:8,alignItems:'center',justifyContent:'flex-end',flexWrap:'wrap'}}>
                    <span className="badge" style={{background:priorityBg,color:priorityColor}}>
                      {task.priority==='high'?'Kiire':task.priority==='low'?'Madal':'Tavaline'}
                    </span>
                    {overdue&&<span className="badge" style={{background:'#fee2e2',color:'#991b1b'}}>Hilinenud</span>}
                    {(isAdmin||task.createdByUid===user.uid)&&(
                      <button onClick={()=>deleteTask(task)} className="btn btn-ghost btn-sm" title="Kustuta">
                        <i className="fa-solid fa-trash"/>
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </CollapsibleCard>
      )}

      {isStaff&&(
        <CollapsibleCard
          id="dashboard-add-student"
          title="➕ Lisa uus õpilane"
          subtitle="Ava ainult siis, kui lisad uut õpilast või kontakti."
          defaultCollapsed={true}
          badge={<span className="badge" style={{background:'#f3f4f6',color:'#42536A'}}>vorm</span>}
        >
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(185px,1fr))',gap:10,marginBottom:12}}>
            <input value={nName}  onChange={e=>setNName(e.target.value)}  placeholder="Lapse nimi *"/>
            <input value={nParentName} onChange={e=>setNParentName(e.target.value)} placeholder="Vanema nimi"/>
            <input value={nEmail} onChange={e=>setNEmail(e.target.value)} type="email" placeholder="E-post"/>
            <input value={nPhone} onChange={e=>setNPhone(e.target.value)} placeholder="Telefon +372…"/>
            <select value={nLevel}  onChange={e=>setNLevel(e.target.value)}>{LEVELS.map(l=><option key={l} value={l}>Tase: {l}</option>)}</select>
            <select value={nTarget} onChange={e=>setNTarget(e.target.value)}>{LEVELS.slice(1).map(l=><option key={l} value={l}>Siht: {l}</option>)}</select>
            <select value={nSubject} onChange={e=>setNSubject(e.target.value)}>
              {SUBJECTS.map(subject=><option key={subject} value={subject}>{subject}</option>)}

                    <div style={{fontSize:'.75rem',color:'#42536A'}}>{l.studentName} · {fmtDate(l.date)}</div>

          })

      </CollapsibleCard>
    </div>
  );
}

function TasksView({user,tasks,staffMembers,taskTitle,setTaskTitle,taskAssignee,setTaskAssignee,
  taskDue,setTaskDue,taskPriority,setTaskPriority,taskCategory,setTaskCategory,addTask,toggleTask,deleteTask,replyTask,markTaskRepliesSeen,isAdmin}) {
  const [taskFilter,setTaskFilter] = React.useState('open');
  const [taskSearch,setTaskSearch] = React.useState('');
  const [taskReplies,setTaskReplies] = React.useState({});
  const taskStaffOptions = [...new Set([
    ...TEACHERS,
    ...(staffMembers||[]).map(member=>member.displayName||member.email),
    user.displayName
  ].filter(Boolean).map(canonicalTeacherName))];
  const categoryLabels = {general:'Üldine',parent:'Lapsevanem',payment:'Arved',lesson:'Tunnid',technical:'Tehniline'};
  const openTasks = tasks.filter(t=>t.status!=='done');
  const overdueTasks = tasks.filter(t=>t.status!=='done' && t.dueDate && t.dueDate<today());
  const filteredTasks = tasks.filter(task=>{
    if(taskFilter==='open' && task.status==='done') return false;
    if(taskFilter==='overdue' && !(task.status!=='done' && task.dueDate && task.dueDate<today())) return false;
    if(taskFilter==='done' && task.status!=='done') return false;
    if(taskFilter==='created' && task.createdByUid!==user.uid) return false;
    if(taskFilter.startsWith('cat:') && (task.category||'general')!==taskFilter.slice(4)) return false;
    const q = normalizeText(taskSearch);
    if(!q) return true;
    return normalizeText(task.title).includes(q)
      || normalizeText(task.assignedTo).includes(q)
      || normalizeText(task.createdByName).includes(q)
      || normalizeText(categoryLabels[task.category]||'').includes(q);
  });

  return(
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:24}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14,flexWrap:'wrap'}}>
        <div>
          <h1 style={{fontSize:'1.7rem'}}>Ülesanded</h1>
          <div style={{color:'#42536A',fontSize:'.88rem',marginTop:4}}>Tööde nimekiri õpetajatele ja administraatoritele.</div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <span className="badge" style={{background:'#dbeafe',color:'#1d4ed8'}}>{openTasks.length} aktiivset</span>
          <span className="badge" style={{background:overdueTasks.length?'#fee2e2':'#dcfce7',color:overdueTasks.length?'#991b1b':'#166534'}}>{overdueTasks.length} hilinenud</span>
        </div>
      </div>

      <div className="card" style={{padding:24}}>
        <h3 style={{marginBottom:14}}>Lisa ülesanne</h3>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10,marginBottom:14}}>
          <input value={taskTitle} onChange={e=>setTaskTitle(e.target.value)} placeholder="Mida on vaja teha?"/>
          <select value={taskAssignee} onChange={e=>setTaskAssignee(e.target.value)}>
            {taskStaffOptions.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
          <input value={taskDue} onChange={e=>setTaskDue(e.target.value)} type="date"/>
          <select value={taskPriority} onChange={e=>setTaskPriority(e.target.value)}>
            <option value="normal">Tavaline</option>
            <option value="high">Kiire</option>
            <option value="low">Madal</option>
          </select>
          <select value={taskCategory} onChange={e=>setTaskCategory(e.target.value)}>
            <option value="general">Üldine</option>
            <option value="parent">Lapsevanem</option>
            <option value="payment">Arved</option>
            <option value="lesson">Tunnid</option>
            <option value="technical">Tehniline</option>
          </select>
        </div>
        <button onClick={addTask} className="btn btn-pine" style={{width:'100%'}}><i className="fa-solid fa-plus"/> Lisa ülesanne</button>
      </div>

      <div className="card" style={{padding:24}}>
        <div style={{display:'flex',gap:10,alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',marginBottom:16}}>
          <input value={taskSearch} onChange={e=>setTaskSearch(e.target.value)} placeholder="Otsi ülesannet, inimest või kategooriat..." style={{maxWidth:360}}/>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {[['open','Aktiivsed'],['overdue','Hilinenud'],['done','Tehtud'],['created','Minu loodud'],['all','Kõik']].map(([id,label])=>(
              <button key={id} onClick={()=>setTaskFilter(id)} className={`btn btn-sm ${taskFilter===id?'btn-dark':'btn-ghost'}`}>{label}</button>
            ))}
          </div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
          {Object.entries(categoryLabels).map(([id,label])=>(
            <button key={id} onClick={()=>setTaskFilter('cat:'+id)} className={`btn btn-sm ${taskFilter==='cat:'+id?'btn-amber':'btn-ghost'}`}>{label}</button>
          ))}
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {filteredTasks.length===0&&<div style={{textAlign:'center',padding:'28px 10px',color:'#42536A'}}>Ülesandeid ei leitud.</div>}
          {[...filteredTasks].sort((a,b)=>{
            if((a.status==='done') !== (b.status==='done')) return a.status==='done'?1:-1;
            return String(a.dueDate||'9999-12-31').localeCompare(String(b.dueDate||'9999-12-31'));
          }).map(task=>{
            const done = task.status==='done';
            const overdue = task.dueDate && task.dueDate<today() && !done;
            const replies = task.replies||[];
            const unread = task.lastReplyAt && task.lastReplyByUid!==user.uid && !(task.lastReplySeenBy||[]).includes(user.uid);
            const priorityColor = task.priority==='high' ? '#991b1b' : task.priority==='low' ? '#42536A' : '#1d4ed8';
            const priorityBg = task.priority==='high' ? '#fee2e2' : task.priority==='low' ? '#f3f4f6' : '#dbeafe';
            return(
              <div key={task.id} style={{padding:'13px 14px',borderRadius:12,border:unread?'1px solid #bfdbfe':'1px solid rgba(28,43,58,.08)',background:done?'rgba(243,244,246,.55)':unread?'#eff6ff':overdue?'#fff7ed':'#fff'}}>
                <div style={{display:'grid',gridTemplateColumns:'auto 1fr auto',gap:12,alignItems:'center'}}>
                  <button onClick={()=>toggleTask(task)} title={done?'Märgi aktiivseks':'Märgi tehtuks'} style={{width:32,height:32,borderRadius:999,border:'1.5px solid rgba(28,43,58,.16)',background:done?'#2F5D50':'#fff',color:done?'#fff':'#42536A',cursor:'pointer'}}>
                    <i className={`fa-solid ${done?'fa-check':'fa-circle'}`} style={{fontSize:done?'.8rem':'.55rem'}}/>
                  </button>
                  <div style={{minWidth:0}}>
                    <div style={{fontWeight:800,textDecoration:done?'line-through':'none',opacity:done ? .65 : 1}}>{task.title}</div>
                    <div style={{fontSize:'.78rem',color:'#42536A',marginTop:4}}>
                      {task.assignedTo||'Määramata'} · {categoryLabels[task.category]||'Üldine'} · tähtaeg: {task.dueDate?fmtDate(task.dueDate):'puudub'} · lisas {task.createdByName||'—'}
                    </div>
                  </div>
                  <div style={{display:'flex',gap:8,alignItems:'center',justifyContent:'flex-end',flexWrap:'wrap'}}>
                    {unread&&<span className="badge" style={{background:'#dbeafe',color:'#1d4ed8'}}>Uus vastus</span>}
                    <span className="badge" style={{background:priorityBg,color:priorityColor}}>{task.priority==='high'?'Kiire':task.priority==='low'?'Madal':'Tavaline'}</span>
                    {overdue&&<span className="badge" style={{background:'#fee2e2',color:'#991b1b'}}>Hilinenud</span>}
                    {done&&<span className="badge" style={{background:'#dcfce7',color:'#166534'}}>Tehtud</span>}
                    {(isAdmin||task.createdByUid===user.uid)&&(
                      <button onClick={()=>deleteTask(task)} className="btn btn-ghost btn-sm" title="Kustuta"><i className="fa-solid fa-trash"/></button>
                    )}
                  </div>
                </div>

                {replies.length>0&&(
                  <div style={{marginLeft:44,marginTop:10,display:'flex',flexDirection:'column',gap:6}}>
                    {replies.slice(-3).map(reply=>(
                      <div key={reply.id||reply.createdAt} style={{padding:'8px 10px',borderRadius:10,background:'#fff',border:'1px solid rgba(28,43,58,.08)'}}>
                        <div style={{fontSize:'.74rem',fontWeight:800,color:'#42536A',marginBottom:3}}>
                          {reply.byName||'—'} · {reply.createdAt?new Date(reply.createdAt).toLocaleString('et-EE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}
                        </div>
                        <div style={{fontSize:'.84rem',color:'#1C2B3A',whiteSpace:'pre-wrap'}}>{reply.text}</div>
                      </div>
                    ))}
                  </div>
                )}

                <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:8,marginLeft:44,marginTop:10}}>
                  <input
                    value={taskReplies[task.id]||''}
                    onFocus={()=>markTaskRepliesSeen(task)}
                    onChange={e=>setTaskReplies(prev=>({...prev,[task.id]:e.target.value}))}
                    placeholder="Vasta ülesandele..."
                  />
                  <button onClick={async()=>{
                    const text = taskReplies[task.id]||'';
                    await replyTask(task,text);
                    setTaskReplies(prev=>({...prev,[task.id]:''}));
                  }} className="btn btn-pine btn-sm">
                    Vasta
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── ÕPPEKAVAD ────────────────────────────────────────────────
function ProgramsView({db,user,students=[],lessons=[],notify,logActivity}) {
  const curriculum=window.HaldusCurriculum||{languages:[],stats:{}};
  const workflow=window.CurriculumWorkflow;
  const [languageFilter,setLanguageFilter]=React.useState('all');
  const [levelFilter,setLevelFilter]=React.useState('all');
  const [query,setQuery]=React.useState('');
  const [openLevels,setOpenLevels]=React.useState({});
  const [openTopics,setOpenTopics]=React.useState({});
  const [preview,setPreview]=React.useState(null);
  const [action,setAction]=React.useState(null);
  const [actionStudentId,setActionStudentId]=React.useState('');
  const [actionLessonIndex,setActionLessonIndex]=React.useState(0);
  const [actionDue,setActionDue]=React.useState('');
  const [actionBusy,setActionBusy]=React.useState('');
  const [createdMaterialId,setCreatedMaterialId]=React.useState('');
  const normalizedQuery=normalizeText(query);
  const allLevels=(curriculum.languages||[]).flatMap(language=>(language.levels||[]).map(level=>({language,level})));
  const curriculumCatalog=React.useMemo(()=>workflow?workflow.flattenCurriculum(curriculum):[],[workflow,curriculum]);
  const activeStudents=React.useMemo(()=>(students||[]).filter(student=>student.active!==false&&!student.mergedIntoStudentId).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'et')),[students]);
  const actionItem=React.useMemo(()=>{
    if(!action)return null;
    return curriculumCatalog.find(item=>item.topicId===action.topic.id&&item.lessonIndex===Number(actionLessonIndex))||null;
  },[action,actionLessonIndex,curriculumCatalog]);
  const actionStudent=activeStudents.find(student=>student.id===actionStudentId)||null;
  const actionStudentValidation=actionItem&&actionStudent&&workflow
    ?workflow.validateStudentMatch(actionItem,actionStudent)
    :{ok:false,errors:actionStudent?['Õppekava kontroll ei ole saadaval.']:['Vali õpilane.']};
  const actionProgress=React.useMemo(()=>{
    if(!workflow||!actionStudent)return null;
    const studentLessons=(lessons||[]).filter(lesson=>lesson.studentId===actionStudent.id);
    return workflow.calculateProgress(curriculum,actionStudent,studentLessons);
  },[workflow,curriculum,actionStudent,lessons]);
  const levelCodes=[...new Set(allLevels.map(item=>item.level.code))];
  const topicMatches=(topic,level,language)=>{
    if(!normalizedQuery)return true;
    const haystack=[
      language.title,level.code,level.name,level.description,topic.name,
      ...(topic.vocab||[]).flatMap(item=>[item.word,item.translation]),
      ...(topic.lessons||[]).map(lesson=>lesson.goal)
    ].join(' ');
    return normalizeText(haystack).includes(normalizedQuery);
  };
  const visibleLevels=allLevels.map(item=>({
    ...item,
    topics:(item.level.topics||[]).filter(topic=>topicMatches(topic,item.level,item.language))
  })).filter(item=>(
    (languageFilter==='all'||item.language.id===languageFilter) &&
    (levelFilter==='all'||item.level.code===levelFilter) &&
    (!normalizedQuery||item.topics.length>0||normalizeText(`${item.language.title} ${item.level.name} ${item.level.description}`).includes(normalizedQuery))
  ));
  const toggleLevel=key=>setOpenLevels(previous=>({...previous,[key]:!previous[key]}));
  const toggleTopic=key=>setOpenTopics(previous=>({...previous,[key]:!previous[key]}));
  const openAction=({language,level,topic})=>{
    const subject=workflow?.SUBJECT_BY_LANGUAGE?.[language.id]||language.title;
    const matching=activeStudents.find(student=>workflow?.canonicalSubject(student.subject)===subject&&String(student.level||'').toUpperCase()===level.code)
      ||activeStudents.find(student=>workflow?.canonicalSubject(student.subject)===subject)
      ||activeStudents[0];
    setAction({language,level,topic});
    setActionStudentId(matching?.id||'');
    setActionLessonIndex(0);
    setActionDue('');
    setCreatedMaterialId('');
  };
  const runAction=async(type)=>{
    if(!workflow||!actionItem){notify('⚠ Õppekava andmed ei ole saadaval');return;}
    if((type==='plan'||type==='homework')&&!actionStudentValidation.ok){notify(`⚠ ${actionStudentValidation.errors.join(' ')}`);return;}
    setActionBusy(type);
    try{
      if(type==='plan'){
        const plan=workflow.buildCurriculumPlan(actionItem,user);
        await db.collection('students').doc(actionStudent.id).update({curriculumPlan:plan,curriculumPlanUpdatedAt:new Date().toISOString()});
        if(logActivity) await logActivity('curriculum.plan_assigned','Õpilasele määrati õpiteema',{studentId:actionStudent.id,studentName:actionStudent.name,curriculumTopicId:actionItem.topicId,curriculumLessonIndex:actionItem.lessonIndex});
        notify(`✓ ${actionStudent.name}: õpiteema määratud`);
      }
      if(type==='material'){
        const record=workflow.buildMaterialRecord(actionItem,user);
        const validation=workflow.validateMaterialLevel(record);
        if(!validation.ok) throw new Error(validation.errors.join(' '));
        const existing=await db.collection('curriculumLessons').where('sourceKey','==',record.sourceKey).limit(1).get();
        if(!existing.empty){
          setCreatedMaterialId(existing.docs[0].id);
          notify('ℹ See tunnimaterjal on õppevaras juba olemas');
        }else{
          const ref=await db.collection('curriculumLessons').add(record);
          setCreatedMaterialId(ref.id);
          if(logActivity) await logActivity('curriculum.material_created','Õppekavast loodi õppematerjal',{materialId:ref.id,curriculumTopicId:actionItem.topicId,curriculumLessonIndex:actionItem.lessonIndex});
          notify('✓ Tunnimaterjal lisatud õppevarasse');
        }
      }
      if(type==='homework'){
        const record=workflow.buildHomeworkRecord(actionItem,actionStudent,user,actionDue);
        const existing=await db.collection('homework').where('studentId','==',actionStudent.id).get();
        const duplicate=existing.docs.some(doc=>doc.data().sourceKey===record.sourceKey&&doc.data().status!=='Tehtud');
        if(duplicate){
          notify('ℹ Sama õppekava kodutöö on sellel õpilasel juba ootel');
        }else{
          const ref=await db.collection('homework').add(record);
          if(logActivity) await logActivity('curriculum.homework_assigned','Õppekavast määrati kodutöö',{homeworkId:ref.id,studentId:actionStudent.id,studentName:actionStudent.name,curriculumTopicId:actionItem.topicId,curriculumLessonIndex:actionItem.lessonIndex});
          notify(`✓ Kodutöö saadetud: ${actionStudent.name}`);
        }
      }
    }catch(error){
      console.error('Curriculum action failed:',error);
      notify(`⚠ ${error?.message||'Toiming ebaõnnestus'}`);
    }finally{
      setActionBusy('');
    }
  };

  React.useEffect(()=>{
    if(!preview)return undefined;
    const closeOnEscape=event=>{if(event.key==='Escape')setPreview(null);};
    document.addEventListener('keydown',closeOnEscape);
    return()=>document.removeEventListener('keydown',closeOnEscape);
  },[preview]);

  return(
    <div className="fade-in curriculum-workspace">
      <section className="curriculum-hero">
        <div>
          <div className="curriculum-eyebrow">ÕPETAJA TÖÖRIIST</div>
          <h1>Õppekavad ja tunnistsenaariumid</h1>
          <p>Metoodiline sisu eesti ja inglise keele õpetamiseks: tasemed, teemad, kaks valmis tunnikava iga teema kohta ning aktiivne sõnavara.</p>
        </div>
      </section>

      <section className="curriculum-stats" aria-label="Õppekavade maht">
        {[
          ['Tasemed',curriculum.stats?.levels||0,'fa-layer-group'],
          ['Teemad',curriculum.stats?.topics||0,'fa-book-open'],
          ['Tunnikavad',curriculum.stats?.lessons||0,'fa-list-check'],
          ['Sõnavara',curriculum.stats?.vocabulary||0,'fa-language']
        ].map(([label,value,icon])=>(
          <div className="curriculum-stat" key={label}>
            <i className={`fa-solid ${icon}`}/><div><strong>{value}</strong><span>{label}</span></div>
          </div>
        ))}
      </section>

      <section className="card curriculum-filters" aria-label="Õppekavade filtrid">
        <div className="curriculum-language-tabs" role="group" aria-label="Keel">
          {[
            ['all','Kõik'],['est','Eesti keel'],['eng','English']
          ].map(([value,label])=>(
            <button key={value} type="button" className={languageFilter===value?'active':''} onClick={()=>setLanguageFilter(value)}>{label}</button>
          ))}
        </div>
        <label className="curriculum-search">
          <i className="fa-solid fa-magnifying-glass"/>
          <input value={query} onChange={event=>setQuery(event.target.value)} placeholder="Otsi teemat, sõna või tunni eesmärki…"/>
        </label>
        <select value={levelFilter} onChange={event=>setLevelFilter(event.target.value)} aria-label="Tase">
          <option value="all">Kõik tasemed</option>
          {levelCodes.map(level=><option key={level} value={level}>{level}</option>)}
        </select>
        {(query||languageFilter!=='all'||levelFilter!=='all')&&(
          <button type="button" className="btn btn-ghost btn-sm" onClick={()=>{setQuery('');setLanguageFilter('all');setLevelFilter('all');}}>Lähtesta</button>

      </section>

      <div className="curriculum-results-note">
        <span>{visibleLevels.length} taset</span>
        <span>{visibleLevels.reduce((sum,item)=>sum+item.topics.length,0)} teemat</span>
        <span>Metoodiline sisu: RU</span>
      </div>

      <section className="curriculum-levels">
        {visibleLevels.map(({language,level,topics})=>{
          const levelKey=`${language.id}-${level.code}`;
          const isOpen=Boolean(openLevels[levelKey]||normalizedQuery);
          return(
            <article className={`card curriculum-level ${isOpen?'open':''}`} key={levelKey}>
              <button type="button" className="curriculum-level-head" onClick={()=>toggleLevel(levelKey)} aria-expanded={isOpen}>

                <div className="curriculum-level-body">

                    {(level.sections||[]).map(section=>(
                      <div className="curriculum-overview" key={section.title}>
                        <h3>{section.title}</h3>

                    {(level.examAlignment||level.schoolAlignment)&&(

                  <div className="curriculum-topic-list">

                        <article className={`curriculum-topic ${topicOpen?'open':''}`} key={topic.id}>
                          <div className="curriculum-topic-head">
                            <div>
                              <span className="curriculum-topic-number">{level.code} · {String((level.topics||[]).indexOf(topic)+1).padStart(2,'0')}</span>
                              <h3>{topic.name}</h3>
                              <p>{topic.lessons.length} tunnikava · {topic.vocab.length} sõna</p>

                            <div className="curriculum-topic-actions">
                              <button type="button" className="btn btn-ghost btn-sm" onClick={()=>setPreview({language,level,topic})}><i className="fa-regular fa-eye"/> Eelvaade</button>

                              <button type="button" className="btn btn-pine btn-sm" onClick={()=>toggleTopic(topicKey)} aria-expanded={topicOpen}>{topicOpen?'Sulge':'Ava teema'}</button>
                            </div>
                          </div>
                          {topicOpen&&(
                            <div className="curriculum-topic-body">
                              <div className="curriculum-lessons">
                                {topic.lessons.map((lesson,index)=>(
                                  <section className="curriculum-lesson" key={`${topic.id}-${index}`}>
                                    <div className="curriculum-lesson-head"><span>{lesson.number}</span><strong>{lesson.goal}</strong></div>
                                    <ol>
                                      {lesson.steps.map((step,stepIndex)=>(
                                        <li key={`${step.title}-${stepIndex}`}>
                                          <span>{stepIndex+1}</span>
                                          <div><strong>{step.title}{step.duration?` · ${step.duration}`:''}</strong>{step.content.map((line,lineIndex)=><p key={lineIndex}>{line}</p>)}</div>
                                        </li>
                                      ))}
                                    </ol>
                                    <div className="curriculum-lesson-notes">
                                      {lesson.materials&&<p><strong>Materjalid</strong>{lesson.materials}</p>}
                                      {lesson.assessment&&<p><strong>Hindamine</strong>{lesson.assessment}</p>}
                                      {lesson.ageNote&&<p><strong>Kohandamine</strong>{lesson.ageNote}</p>}
                                    </div>
                                  </section>
                                ))}
                              </div>
                              <div className="curriculum-vocab">
                                <h4>Aktiivne sõnavara</h4>
                                <div>{topic.vocab.map(item=><a key={item.word} href={item.dictionaryUrl} target="_blank" rel="noopener"><strong>{item.word}</strong><span>{item.translation}</span></a>)}</div>
                              </div>
                            </div>
                          )}
                        </article>
                      );
                    })}
                  </div>
                </div>
              )}
            </article>
          );
        })}
        {visibleLevels.length===0&&(
          <div className="card curriculum-empty"><i className="fa-solid fa-magnifying-glass"/><h2>Õppekava ei leitud</h2><p>Muuda otsingut või lähtesta filtrid.</p></div>
        )}
      </section>

      {action&&(
        <div className="modal-overlay curriculum-action-overlay" role="presentation" onMouseDown={event=>{if(event.target===event.currentTarget&&!actionBusy)setAction(null);}}>
          <section className="curriculum-action-modal" role="dialog" aria-modal="true" aria-labelledby="curriculum-action-title">
            <header>
              <div>
                <span>{action.language.title} · {action.level.code}</span>
                <h2 id="curriculum-action-title">{action.topic.name}</h2>
                <p>Seo teema õpilase, õppematerjali ja kodutööga.</p>
              </div>
              <button type="button" className="icon-btn" onClick={()=>setAction(null)} disabled={Boolean(actionBusy)} aria-label="Sulge"><i className="fa-solid fa-xmark"/></button>
            </header>
            <div className="curriculum-action-body">
              <label>
                <span>Õpilane</span>
                <select value={actionStudentId} onChange={event=>setActionStudentId(event.target.value)}>
                  <option value="">Vali õpilane</option>
                  {activeStudents.map(student=><option key={student.id} value={student.id}>{student.name} · {student.subject||'aine puudub'} · {student.level||'tase puudub'}</option>)}
                </select>
              </label>
              <label>
                <span>Tunnikava</span>
                <select value={actionLessonIndex} onChange={event=>setActionLessonIndex(Number(event.target.value))}>
                  {(action.topic.lessons||[]).map((lesson,index)=><option key={index} value={index}>{lesson.number} · {lesson.goal}</option>)}
                </select>
              </label>
              {actionItem&&(
                <div className="curriculum-action-summary">
                  <strong>{actionItem.lessonGoal}</strong>
                  <span>{actionItem.vocab.length} sõna · {actionItem.steps.length} etappi</span>
                </div>
              )}
              {actionStudent&&actionStudentValidation.ok&&actionProgress&&(
                <div className="curriculum-action-summary">
                  <strong>{actionStudent.name}: {actionProgress.completedLessons}/{actionProgress.totalLessons} tunnikava tehtud</strong>
                  <span>Praegune progress {actionProgress.percent}% · {actionStudent.subject} {actionStudent.level}</span>
                </div>
              )}
              {actionStudent&&!actionStudentValidation.ok&&(
                <div className="curriculum-action-summary" style={{background:'#FFF4E8',borderColor:'#F0C895',color:'#8A4B12'}}>
                  <strong>Kontrolli õpilase kaarti</strong>
                  <span>{actionStudentValidation.errors.join(' ')}</span>
                </div>
              )}
              <label>
                <span>Kodutöö tähtaeg <small>(valikuline)</small></span>
                <input type="date" value={actionDue} onChange={event=>setActionDue(event.target.value)}/>
              </label>
              <div className="curriculum-action-buttons">
                <button type="button" className="btn btn-dark" disabled={!actionStudentValidation.ok||Boolean(actionBusy)} onClick={()=>runAction('plan')}><i className="fa-solid fa-route"/> {actionBusy==='plan'?'Salvestan…':'Määra õpiteemaks'}</button>
                <button type="button" className="btn btn-pine" disabled={Boolean(actionBusy)} onClick={()=>runAction('material')}><i className="fa-solid fa-book-open"/> {actionBusy==='material'?'Loon…':'Lisa õppevarasse'}</button>
                <button type="button" className="btn btn-amber" disabled={!actionStudentValidation.ok||Boolean(actionBusy)} onClick={()=>runAction('homework')}><i className="fa-solid fa-paper-plane"/> {actionBusy==='homework'?'Saadan…':'Saada kodutöö'}</button>
              </div>
              {createdMaterialId&&<a className="curriculum-action-library-link" href={`/haldus-exercises/?libSubject=${encodeURIComponent(actionItem?.subject||'')}&libStage=${encodeURIComponent(actionItem?.level||'')}&libTopic=${encodeURIComponent(actionItem?.topicName||'')}`} target="_blank" rel="noopener"><i className="fa-solid fa-arrow-up-right-from-square"/> Ava loodud materjal õppevaras</a>}
            </div>
          </section>
        </div>
      )}

      {preview&&(
        <div className="modal-overlay curriculum-preview-overlay" role="presentation" onMouseDown={event=>{if(event.target===event.currentTarget)setPreview(null);}}>
          <section className="curriculum-preview" role="dialog" aria-modal="true" aria-labelledby="curriculum-preview-title">
            <header>
              <div><span>{preview.language.title} · {preview.level.code}</span><h2 id="curriculum-preview-title">{preview.topic.name}</h2><p>Materjali eelvaade — midagi ei laadita alla.</p></div>
              <button type="button" className="icon-btn" onClick={()=>setPreview(null)} aria-label="Sulge"><i className="fa-solid fa-xmark"/></button>
            </header>
            <div className="curriculum-preview-content">
              <section>
                <h3>Tundide eesmärgid</h3>
                {preview.topic.lessons.map((lesson,index)=><div className="curriculum-preview-goal" key={index}><span>{lesson.number}</span><p>{lesson.goal}</p></div>)}
              </section>
              <section>
                <h3>Aktiivne sõnavara</h3>
                <div className="curriculum-preview-vocab">{preview.topic.vocab.map(item=><span key={item.word}><strong>{item.word}</strong><small>{item.translation}</small></span>)}</div>
              </section>
              <section>
                <h3>Tunni ülesehitus</h3>
                <ol className="curriculum-preview-steps">{preview.topic.lessons[0]?.steps.map((step,index)=><li key={index}><span>{index+1}</span><div><strong>{step.title}</strong><small>{step.duration}</small></div></li>)}</ol>
              </section>
            </div>
            <footer><button type="button" className="btn btn-pine" onClick={()=>{const key=`${preview.language.id}-${preview.level.code}-${preview.topic.id}`;setOpenLevels(previous=>({...previous,[`${preview.language.id}-${preview.level.code}`]:true}));setOpenTopics(previous=>({...previous,[key]:true}));setPreview(null);}}>Ava täielik tunnikava</button></footer>
          </section>
        </div>
      )}
    </div>
  );
}

// ── TÖÖAEG JA JUHI ABI ──────────────────────────────────────
const workMinutesLabel = value => {
  const minutes=Math.max(0,Math.round(Number(value)||0));
  const hours=Math.floor(minutes/60);
  const remainder=minutes%60;
  return `${hours} h ${String(remainder).padStart(2,'0')} min`;
};
const workDateTimeLabel = value => {
  if(!value) return '—';
  const date=new Date(value);
  return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('et-EE',{
    day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'
  });
};
const previousWorkMonth = () => {
  const date=new Date();
  date.setDate(1);
  date.setMonth(date.getMonth()-1);
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
};

function WorkTimeView({user,isAdmin,staffMembers,sessions,programDays,activityLog,notify}) {
  const [month,setMonth]=React.useState(today().slice(0,7));
  const [breakMinutes,setBreakMinutes]=React.useState('0');
  const [note,setNote]=React.useState('');
  const [busy,setBusy]=React.useState('');
  const [rates,setRates]=React.useState({});

  React.useEffect(()=>{
    const next={};
    (staffMembers||[]).forEach(member=>{
      const uid=member.id||member.uid;
      if(uid) next[uid]=String((Number(member.workHourlyRateCents)||0)/100||'');
    });
    setRates(next);
  },[staffMembers]);

  const ownOpen=(sessions||[]).find(item=>item.staffUid===user?.uid&&item.status==='open');
  const monthSessions=(sessions||[])
    .filter(item=>String(item.startedDate||item.startedAt||'').slice(0,7)===month)
    .sort((a,b)=>String(b.startedAt||'').localeCompare(String(a.startedAt||'')));
  const monthProgramDays=(programDays||[])
    .filter(item=>String(item.date||'').slice(0,7)===month)
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.lastActiveAt||'').localeCompare(String(a.lastActiveAt||'')));
  const people=isAdmin
    ? (staffMembers||[]).map(member=>({...member,uid:member.id||member.uid})).filter(member=>member.uid)
    : [{...((staffMembers||[]).find(member=>(member.id||member.uid)===user?.uid)||user),uid:user?.uid}];
  const historical=historicalActivitySummary(activityLog,{
    month,
    beforeDate:PROGRAM_ACTIVITY_LAUNCH_DATE,
    staffUids:people.map(member=>member.uid)
  });
  const historicalByStaff=new Map(historical.staff.map(item=>[item.staffUid,item]));
  const summaries=people.map(member=>{
    const memberSessions=monthSessions.filter(item=>item.staffUid===member.uid);
    const approved=memberSessions.filter(item=>item.approvalStatus==='approved');
    const pending=memberSessions.filter(item=>item.status==='closed'&&item.approvalStatus==='pending');
    const rejected=memberSessions.filter(item=>item.approvalStatus==='rejected');
    const memberProgramDays=(programDays||[]).filter(item=>
      item.staffUid===member.uid&&String(item.date||'').slice(0,7)===month
    );
    const programSeconds=memberProgramDays.reduce((sum,item)=>sum+(Number(item.activeSeconds)||0),0);
    const currentRateCents=Number(member.workHourlyRateCents)||0;
    const historicalSummary=historicalByStaff.get(member.uid)||{
      estimateMinutes:0,eventCount:0,sessionCount:0,dayCount:0
    };
    return {
      member,
      approvedMinutes:approved.reduce((sum,item)=>sum+(Number(item.durationMinutes)||0),0),
      pendingMinutes:pending.reduce((sum,item)=>sum+(Number(item.durationMinutes)||0),0),
      payCents:approved.reduce((sum,item)=>sum+(Number(item.payAmountCents)||0),0),
      programMinutes:Math.round(programSeconds/60),
      programPayCents:Math.round((programSeconds*currentRateCents)/3600),
      historicalMinutes:historicalSummary.estimateMinutes,
      historicalEventCount:historicalSummary.eventCount,
      historicalDayCount:historicalSummary.dayCount,
      historicalPayCents:Math.round((historicalSummary.estimateMinutes*currentRateCents)/60),
      pendingCount:pending.length,
      rejectedCount:rejected.length,
      open:memberSessions.find(item=>item.status==='open')||null
    };
  });
  const totalProgram=summaries.reduce((sum,item)=>sum+item.programMinutes,0);
  const totalHistorical=summaries.reduce((sum,item)=>sum+item.historicalMinutes,0);
  const totalPending=summaries.reduce((sum,item)=>sum+item.pendingMinutes,0);
  const totalProgramPay=summaries.reduce((sum,item)=>sum+item.programPayCents,0);
  const totalHistoricalPay=summaries.reduce((sum,item)=>sum+item.historicalPayCents,0);
  const confidenceMeta={
    medium:{label:'Keskmine kindlus',bg:'#fef3c7',color:'#92400e'},
    low:{label:'Madal kindlus',bg:'#ffedd5',color:'#9a3412'},
    very_low:{label:'Väga madal kindlus',bg:'#fee2e2',color:'#991b1b'}
  };

  const run=async(key,fn,success)=>{
    setBusy(key);
    try{
      await fn();
      if(success) notify(success);
    }catch(error){
      console.error('Work time action failed:',error);
      notify(`⚠ ${error.message||error}`);
    }finally{
      setBusy('');
    }
  };
  const clockIn=()=>run('clock-in',()=>staffOperationsApiPost('/clock-in',{note}),'✓ Tööpäev alustatud');
  const clockOut=()=>run('clock-out',()=>staffOperationsApiPost('/clock-out',{
    breakMinutes:Number(breakMinutes)||0,note
  }),'✓ Tööpäev lõpetatud ja saadetud kinnitamisele');
  const saveRate=member=>{
    const uid=member.uid||member.id;
    return run(`rate-${uid}`,()=>staffOperationsApiPost('/rates',{
      staffUid:uid,hourlyRate:rates[uid]||'0'
    }),'✓ Tunnitasu salvestatud');
  };
  const approve=session=>{
    const member=people.find(item=>item.uid===session.staffUid)||{};
    const rate=rates[session.staffUid]||String((Number(member.workHourlyRateCents)||0)/100||'');
    if(!rate){notify('⚠ Määra enne kinnitamist töötaja tunnitasu');return;}
    run(`approve-${session.id}`,()=>staffOperationsApiPost('/sessions/approve',{
      sessionId:session.id,hourlyRate:rate
    }),'✓ Tööaeg kinnitatud');
  };
  const reject=session=>{
    const reason=window.prompt('Tagasilükkamise põhjus','');
    if(reason===null) return;
    if(!reason.trim()){notify('⚠ Lisa põhjus');return;}
    run(`reject-${session.id}`,()=>staffOperationsApiPost('/sessions/reject',{
      sessionId:session.id,reason
    }),'✓ Tööaeg lükati tagasi');
  };
  const adjust=session=>{
    const startedAt=window.prompt('Algus ISO-kujul',session.startedAt||'');
    if(startedAt===null) return;
    const endedAt=window.prompt('Lõpp ISO-kujul',session.endedAt||new Date().toISOString());
    if(endedAt===null) return;
    const nextBreak=window.prompt('Paus minutites',String(session.breakMinutes||0));
    if(nextBreak===null) return;
    const reason=window.prompt('Paranduse põhjus (kohustuslik)','');
    if(reason===null||!reason.trim()){notify('⚠ Lisa paranduse põhjus');return;}
    run(`adjust-${session.id}`,()=>staffOperationsApiPost('/sessions/adjust',{
      sessionId:session.id,startedAt,endedAt,breakMinutes:Number(nextBreak)||0,
      note:session.note||'',reason
    }),'✓ Tööaeg parandatud ja saadetud uuesti kinnitamisele');
  };

  return(
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:14,flexWrap:'wrap'}}>
        <div>
          <h1 style={{fontSize:'1.7rem'}}>Tööaeg</h1>
          <div style={{fontSize:'.88rem',color:'#42536A',marginTop:4}}>
            Täpne aeg alates 29.07.2026. Varasemate kuude eraldi hinnang taastatakse säilinud tegevuslogidest.
          </div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setMonth(previousWorkMonth())}>Eelmine kuu</button>
          <input type="month" value={month} onChange={event=>setMonth(event.target.value)} style={{width:'auto'}}/>
        </div>
      </div>

      <div className="card" style={{padding:22}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:16,flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:'.72rem',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:800,color:'#42536A'}}>Tööpäeva kinnitus</div>
            <h3 style={{marginTop:6}}>{ownOpen?'Tööpäev käib':'Automaatne loendus töötab ilma käivitamiseta'}</h3>
            {ownOpen&&<div style={{fontSize:'.82rem',color:'#2F5D50',marginTop:4}}>Alates {workDateTimeLabel(ownOpen.startedAt)}</div>}
            {!ownOpen&&<div style={{fontSize:'.8rem',color:'#42536A',marginTop:4}}>Nupp on valikuline ja aitab administraatoril tööpäeva hiljem kinnitada.</div>}
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {!ownOpen
              ? <button className="btn btn-primary" disabled={Boolean(busy)} onClick={clockIn}>
                  <i className="fa-solid fa-play"/> {busy==='clock-in'?'Alustan...':'Alusta tööpäeva'}
                </button>
              : <button className="btn btn-primary" disabled={Boolean(busy)} onClick={clockOut}>
                  <i className="fa-solid fa-stop"/> {busy==='clock-out'?'Lõpetan...':'Lõpeta tööpäev'}
                </button>}
          </div>
        </div>

function SchoolAssistantView({alerts,refresh,goTab}) {
  const [busy,setBusy]=React.useState(false);
  const active=(alerts||[]).filter(item=>item.active!==false).sort((a,b)=>{
    const priority={critical:0,warning:1,info:2};
    return (priority[a.severity]??9)-(priority[b.severity]??9)||String(b.lastDetectedAt||'').localeCompare(String(a.lastDetectedAt||''));
  });
  const categoryMeta={
    invoice:{label:'Arved',icon:'fa-file-invoice-dollar'},
    task:{label:'Ülesanded',icon:'fa-list-check'},
    work_time:{label:'Tööaeg',icon:'fa-stopwatch'},
    calendar:{label:'Kalender',icon:'fa-calendar-xmark'}
  };
  const doRefresh=async()=>{
    setBusy(true);
    try{await refresh();}finally{setBusy(false);}
  };
  return(
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:14,flexWrap:'wrap'}}>
        <div>
          <h1 style={{fontSize:'1.7rem'}}>Juhi abi</h1>
          <div style={{fontSize:'.88rem',color:'#42536A',marginTop:4}}>
            Automaatne kooli valve: arved, tähtajad, tööaeg ja kalendri vead ühes kohas.

        </div>
        <button className="btn btn-primary" disabled={busy} onClick={doRefresh}>
          <i className={`fa-solid ${busy?'fa-spinner fa-spin':'fa-rotate'}`}/> {busy?'Kontrollin...':'Kontrolli kohe'}
        </button>
      </div>
      <div style={{padding:16,borderRadius:12,background:'#ecfdf5',border:'1px solid #a7f3d0',color:'#166534',fontSize:'.84rem'}}>
        <strong>0 € välise API eest.</strong> Abiline töötab iga tund reeglite järgi Firebase’is ega saada õpilaste, palkade ega arvete andmeid välisele tehisintellektile.
      </div>
      <div className="assistant-summary-grid" style={{display:'grid',gridTemplateColumns:'repeat(3,minmax(0,1fr))',gap:12}}>
        {[
          {label:'Aktiivsed',value:active.length,bg:'#F9F8F6',color:'#1C2B3A'},
          {label:'Kriitilised',value:active.filter(item=>item.severity==='critical').length,bg:'#fee2e2',color:'#991b1b'},
          {label:'Hoiatused',value:active.filter(item=>item.severity==='warning').length,bg:'#fef3c7',color:'#92400e'}

          <div style={{fontSize:'.72rem',fontWeight:800,color:item.color,textTransform:'uppercase',letterSpacing:'.06em'}}>{item.label}</div>
          <div style={{fontSize:'1.55rem',fontWeight:800,color:item.color,marginTop:4}}>{item.value}</div>
        </div>)}

        {active.map(alert=>{

function ActivityLogView({logs,isAdmin}) {
  const [query,setQuery] = React.useState('');
  const [typeFilter,setTypeFilter] = React.useState('all');
  const typeLabels = {
    student:'Õpilased',
    homework:'Kodutööd',
    invoice:'Arved',
    task:'Ülesanded',
    lesson:'Tunnid',
    group:'Grupid'
  };
  const visibleLogs = logs.filter(item=>{
    const baseType = String(item.type||'').split('.')[0] || 'other';
    if(typeFilter!=='all' && baseType!==typeFilter) return false;
    const q=normalizeText(query);
    if(!q) return true;
    return normalizeText(item.label).includes(q)
      || normalizeText(item.byName).includes(q)
      || normalizeText(item.studentName).includes(q)
      || normalizeText(baseType).includes(q);
  });

  return(
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:14,flexWrap:'wrap'}}>
        <div>
          <h1 style={{fontSize:'1.7rem'}}>Tegevused</h1>
          <div style={{fontSize:'.88rem',color:'#42536A',marginTop:4}}>
            {isAdmin?'Administraator näeb kõiki süsteemi tegevusi.':'Õpetaja näeb enda tegevusi ja oma õpilastega seotud muudatusi.'}
          </div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Otsi tegevust..." style={{width:260}}/>
          <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{width:'auto'}}>
            <option value="all">Kõik tüübid</option>
            {Object.entries(typeLabels).map(([id,label])=><option key={id} value={id}>{label}</option>)}
          </select>
        </div>
      </div>

      <div className="card" style={{padding:0,overflow:'hidden'}}>
        {[...visibleLogs].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,120).map(item=>{
          const baseType = String(item.type||'').split('.')[0] || 'other';
          const when = item.createdAt ? new Date(item.createdAt).toLocaleString('et-EE') : fmtDate(item.date);
          return(
            <div key={item.id} style={{display:'grid',gridTemplateColumns:'auto 1fr auto',gap:12,alignItems:'center',padding:'14px 16px',borderBottom:'1px solid rgba(28,43,58,.06)'}}>
              <span className="badge" style={{background:'rgba(47,93,80,.1)',color:'#2F5D50'}}>
                {typeLabels[baseType]||baseType}
              </span>
              <div style={{minWidth:0}}>
                <div style={{fontWeight:800,color:'#1C2B3A'}}>{item.label}</div>
                <div style={{fontSize:'.78rem',color:'#42536A',marginTop:3}}>
                  {item.studentName&&<span>{item.studentName} · </span>}
                  {item.byName||'—'}
                </div>
              </div>
              <div style={{fontSize:'.74rem',color:'#42536A',whiteSpace:'nowrap'}}>{when}</div>
            </div>
          );
        })}
        {visibleLogs.length===0&&(
          <div style={{textAlign:'center',padding:'34px 12px',color:'#42536A'}}>Tegevusi ei leitud.</div>
        )}
      </div>
    </div>
  );
}
