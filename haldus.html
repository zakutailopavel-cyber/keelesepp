                  <th key={label} style={{padding:'11px 12px',textAlign:['Summa','Laekunud','Jääk'].includes(label)?'right':'left'}}>{label}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {visibleRows.map(row=>{
                const meta=statusMeta[row.status]||statusMeta.unpaid;
                return(
                  <tr key={row.id} style={{borderTop:'1px solid rgba(28,43,58,.07)',fontSize:'.78rem'}}>
                    <td style={{padding:'12px',verticalAlign:'top'}}>
                      <div style={{fontWeight:800}}>{row.number}</div>
                      <div style={{color:'#64748b',fontSize:'.7rem',marginTop:2,maxWidth:190,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{row.description||'—'}</div>
                    </td>
                    <td style={{padding:'12px',verticalAlign:'top'}}>
                      <div>{fmtDate(row.date)}</div>
                      <div style={{color:'#64748b',fontSize:'.7rem',marginTop:2}}>tähtaeg {fmtDate(row.due)}</div>
                    </td>
                    <td style={{padding:'12px',verticalAlign:'top',fontWeight:600}}>{row.payer}</td>
                    <td style={{padding:'12px',verticalAlign:'top',textAlign:'right',fontFamily:'monospace',fontWeight:700}}>{moneyCents(row.amountCents)}</td>
                    <td style={{padding:'12px',verticalAlign:'top',textAlign:'right',fontFamily:'monospace',fontWeight:700,color:'#166534'}}>
                      {moneyCents(row.paidCents)}
                      {row.paymentCount>0&&<div style={{fontFamily:'IBM Plex Sans',fontWeight:500,fontSize:'.66rem',color:'#64748b'}}>{row.paymentCount} makset</div>}
                    </td>
                    <td style={{padding:'12px',verticalAlign:'top',textAlign:'right',fontFamily:'monospace',fontWeight:700,color:row.balanceCents>0?'#991b1b':'#42536A'}}>{moneyCents(row.balanceCents)}</td>
                    <td style={{padding:'12px',verticalAlign:'top'}}>
                      <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                        {(row.paymentSourceLabels.length?row.paymentSourceLabels:['—']).map(label=>(
                          <span key={label} className="badge" style={{background:'#f3f4f6',color:'#42536A'}}>{label}</span>
                        ))}
                      </div>
                      {row.paymentDates.length>0&&<div style={{color:'#64748b',fontSize:'.67rem',marginTop:4}}>{row.paymentDates.map(fmtDate).join(', ')}</div>}
                      {row.reconciliationMismatch&&<div style={{color:'#991b1b',fontSize:'.67rem',fontWeight:700,marginTop:4}}>Summad ei ühti</div>}
                    </td>
                    <td style={{padding:'12px',verticalAlign:'top'}}>
                      {row.paymentDocuments.length
                        ? <div style={{display:'grid',gap:4}}>
                            {row.paymentDocuments.map(document=>(
                              <button key={`${document.paymentId}-${document.id}`} onClick={()=>openPaymentDocument&&openPaymentDocument(document)}
                                className="btn btn-ghost btn-sm" style={{padding:'3px 7px',fontSize:'.65rem',justifyContent:'flex-start'}}>
                                <i className={`fa-solid ${document.contentType==='application/pdf'?'fa-file-pdf':'fa-file-image'}`}/>
                                <span style={{maxWidth:125,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{document.fileName}</span>
                                {document.paymentStatus==='voided'&&<span style={{color:'#991b1b'}}>· tühistatud</span>}
                              </button>
                            ))}
                          </div>
                        : <span style={{color:'#94a3b8'}}>—</span>}
                    </td>
                    <td style={{padding:'12px',verticalAlign:'top'}}>
                      <span className="badge" style={{background:meta.bg,color:meta.color}}>{accountingStatusLabel(row.status)}</span>
                    </td>
                  </tr>
                );
              })}
              {visibleRows.length===0&&(
                <tr><td colSpan="9" style={{padding:34,textAlign:'center',color:'#94a3b8'}}>Selles perioodis sobivaid arveid ei ole.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
      </>}
      {registerMode==='lessons'&&<LessonPaymentRegisterPanel
        month={month}
        lessons={lessons}
        invoices={invoices}
        payments={payments}
        paymentLineAllocations={paymentLineAllocations}
        students={students}
        tariffAssignments={tariffAssignments}
        openInvoices={openInvoices}
        openReconciliation={openReconciliation}
        voidPayment={voidPayment}
        addInvoice={addInvoice}
        updateLessonBillingDisposition={updateLessonBillingDisposition}/>}
      {registerMode==='allocations'&&(
        <PaymentAllocationQueuePanel
          queue={allocationQueue}
          onOpen={setAllocationDraft}
          onConfirmBatch={confirmAllocationBatch}
          batchBusy={allocationBatchBusy}/>
      )}
      {registerMode==='control'&&<FinancialPeriodControlPanel
        control={periodControl}
        period={period}
        reviewFinancialPeriod={reviewFinancialPeriod}
        openInvoices={openInvoices}
        openReconciliation={openReconciliation}
        openLessonRegister={()=>setRegisterMode('lessons')}/>}
      {registerMode==='closure'&&<FinancialPeriodClosurePanel month={month} notify={notify}/>}
      {allocationDraft&&(
        <PaymentLineAllocationModal
          invoice={allocationDraft.invoice}
          payment={allocationDraft.payment}
          currentAllocation={allocationDraft.currentAllocation}
          allocationHistory={allocationDraft.history}
          suggestedLines={allocationDraft.status==='exact'?[]:allocationDraft.suggestedLines}
          onSave={savePaymentLineAllocation}
          onClose={()=>setAllocationDraft(null)}/>
      )}
    </div>
  );
}

// ── SVERKA MAKSETE (сверка банковской выписки со счетами) ───────
// Использует реальные данные из Firestore: invoices (num, paymentReference,
// status, amount, studentId, studentName) и students (name, parentName,
// teacher, subject, grade). Выписка вставляется вручную и парсится на лету;
// подтверждённые строки затем сохраняются как нормализованные bankTransactions.
//
// Ключевая идея: у каждого счёта (invoice) уже есть paymentReference вида
// "KS-2026-007" — это ровно то, что клиенты пишут в назначении платежа.
// Поэтому платёж сопоставляется со счётом ТОЧНО по этому номеру, а не по
// похожести имён — и там, где номер найден и он один, сверка полностью
// однозначна. Только когда номера в описании нет (или он задвоен —
// см. предупреждение о дублях ниже), используется резервное угадывание
// по имени ученика/родителя, которое пользователь может поправить вручную.
function PaymentReconciliationView({invoices, students, lessons=[], tariffAssignments=[], payments:invoicePayments=[], isAdmin, bankTransactions, payerCredits, allocateBankTransaction, applyPayerCredit, refundPayerCredit}) {
  const [rawStatement, setRawStatement] = React.useState('');
  const [payments, setPayments] = React.useState([]);
  const [showImport, setShowImport] = React.useState(true);
  const [showRawImport, setShowRawImport] = React.useState(false);
  const [statementFileName, setStatementFileName] = React.useState('');
  const [importResult, setImportResult] = React.useState(null);
  const [assign, setAssignState] = React.useState({});   // paymentId -> имя ученика (ручной override)
  const [verified, setVerified] = React.useState({});    // paymentId -> true
  const [loaded, setLoaded] = React.useState(false);
  const [subTab, setSubTab] = React.useState('pay');     // pay | invoices | months

  const [month, setMonth] = React.useState('all');
  const [search, setSearch] = React.useState('');
  const [hideVerified, setHideVerified] = React.useState(false);
  const [studentPaymentSearch,setStudentPaymentSearch] = React.useState('');
  const [studentPaymentFilter,setStudentPaymentFilter] = React.useState('attention');
  const [moSearch, setMoSearch] = React.useState('');
  const [allocationDraft, setAllocationDraft] = React.useState(null);
  const [allocationBusy, setAllocationBusy] = React.useState(false);
  const [creditDraft, setCreditDraft] = React.useState(null);
  const [creditBusy, setCreditBusy] = React.useState(false);

  // ---- load / save (Firestore, видно всем админам) ----
  React.useEffect(() => {
    db.collection('reconciliation').doc('bankStatement').get().then(snap => {
      if (snap.exists) {
        const d = snap.data();
        setRawStatement(d.rawStatement || '');
        setStatementFileName(d.sourceFileName||'');
        const parsed=d.rawStatement ? parseStatementDetailed(d.rawStatement) : null;
        setPayments(parsed?.rows||[]);
        if(parsed?.rows?.length){
          setImportResult(parsed);
          setShowImport(false);
        }
        setAssignState(d.assign || {});
        setVerified(d.verified || {});
      }
      setLoaded(true);
    }).catch(e => { console.error('Sverka load:', e); setLoaded(true); });
  }, []);

  const persist = React.useCallback((patch) => {
    db.collection('reconciliation').doc('bankStatement').set({
      rawStatement, assign, verified, updatedAt: new Date().toISOString(), ...patch
    }, {merge: true}).catch(e => console.error('Sverka save:', e));
  }, [rawStatement, assign, verified]);

  function handleParse() {
    const parsed=parseStatementDetailed(rawStatement);
    setImportResult(parsed);
    if(!parsed.rows.length){
      setPayments([]);
      return;
    }
    setPayments(parsed.rows);
    setShowImport(false);
    setSubTab('pay');
    persist({
      rawStatement,
      sourceFileName:statementFileName,
      statementFormat:parsed.format,
      statementRowCount:parsed.rows.length,
      importedAt:new Date().toISOString()
    });
  }
  async function loadStatementFile(event) {
    const file=event.target.files?.[0];
    if(!file) return;
    if(file.size>2*1024*1024){
      setImportResult({rows:[],totalLines:0,skippedLines:0,error:'Fail on suurem kui 2 MB.'});
      event.target.value='';
      return;
    }
    try{
      const text=await file.text();
      const parsed=parseStatementDetailed(text);
      setRawStatement(text);
      setStatementFileName(file.name);
      setImportResult(parsed);
      setShowRawImport(false);
    }catch(error){
      console.error('Statement file read failed:',error);
      setImportResult({rows:[],totalLines:0,skippedLines:0,error:'Faili ei saanud lugeda.'});
    }
    event.target.value='';
  }
  function setAssign(id, name) {
    const next = {...assign, [id]: name.trim()};
    setAssignState(next);
    persist({assign: next});
  }
  function openAllocation(payment, match) {
    const matchedInvoice = ['ref','name-amount'].includes(match.tier) ? match.invoice : null;
    const matchedBalance = matchedInvoice ? invoiceFinancialSummary(matchedInvoice).balance : 0;
    const matchedStudent=students.find(student=>
      normalizeText(student.name)===normalizeText(effectiveName(payment))
    )||students.find(student=>student.id===matchedInvoice?.studentId)||null;
    const directLessons=matchedStudent?billableLessonsForStudent(lessons,matchedStudent):[];
    setAllocationDraft({
      payment,
      mode:matchedInvoice?'invoice':directLessons.length?'lessons':'advance',
      studentId:matchedStudent?.id||'',
      rows:matchedInvoice&&matchedBalance>0
        ? [{invoiceId:matchedInvoice.id,amount:money(Math.min(payment.amount,matchedBalance))}]
        : [{invoiceId:'',amount:''}],
      lessonRows:[]
    });
  }
  function updateAllocationRow(index,patch) {
    setAllocationDraft(current=>({
      ...current,
      rows:current.rows.map((row,rowIndex)=>rowIndex===index?{...row,...patch}:row)
    }));
  }
  function removeAllocationRow(index) {
    setAllocationDraft(current=>({...current,rows:current.rows.filter((_,rowIndex)=>rowIndex!==index)}));
  }
  function setAllocationMode(mode) {
    setAllocationDraft(current=>({...current,mode}));
  }
  function toggleDirectLesson(lesson,checked) {
    setAllocationDraft(current=>{
      const existing=(current.lessonRows||[]).filter(row=>row.lessonId!==lesson.id);
      if(!checked) return {...current,lessonRows:existing};
      const student=students.find(item=>item.id===current.studentId)||null;
      const options=student?billableLessonsForStudent(lessons,student):[];
      const pricing=student?invoiceDraftForStudent(student,'','',options,tariffAssignments):{lessonPricesById:{}};
      const price=Number(pricing.lessonPricesById?.[lesson.id])||0;
      return {...current,lessonRows:[...existing,{lessonId:lesson.id,amount:price?money(price):''}]};
    });
  }
  function updateDirectLessonAmount(lessonId,amount) {
    setAllocationDraft(current=>({
      ...current,
      lessonRows:(current.lessonRows||[]).map(row=>row.lessonId===lessonId?{...row,amount}:row)
    }));
  }
  async function saveAllocation() {
    if(!allocationDraft||allocationBusy) return;
    const mode=allocationDraft.mode||'invoice';
    if(['lessons','advance'].includes(mode)&&!allocationDraft.studentId){
      window.alert('Vali õpilane, kellele makse kuulub.');
      return;
    }
    const sourceRows=mode==='invoice'?allocationDraft.rows:[];
    const hasIncompleteRow=sourceRows.some(row=>{
      const amount=Number(String(row.amount).replace(',','.'));
      return (row.invoiceId&&(!Number.isFinite(amount)||amount<=0)) || (!row.invoiceId&&Number.isFinite(amount)&&amount>0);
    });
    if(hasIncompleteRow){window.alert('Täida igal kasutatud real nii arve kui ka positiivne summa.');return;}
    const rows=sourceRows
      .map(row=>({invoiceId:row.invoiceId,amount:Number(String(row.amount).replace(',','.'))}))
      .filter(row=>row.invoiceId&&Number.isFinite(row.amount)&&row.amount>0);
    const lessonRows=mode==='lessons'
      ?(allocationDraft.lessonRows||[])
        .map(row=>({lessonId:row.lessonId,amount:Number(String(row.amount).replace(',','.'))}))
        .filter(row=>row.lessonId&&Number.isFinite(row.amount)&&row.amount>0)
      :[];
    if(mode==='lessons'&&lessonRows.length===0){
      window.alert('Vali vähemalt üks tund.');
      return;
    }
    const ids=rows.map(row=>row.invoiceId);
    if(new Set(ids).size!==ids.length){window.alert('Sama arvet ei saa kaks korda lisada.');return;}
    const total=[
      ...rows.map(row=>row.amount),
      ...lessonRows.map(row=>row.amount)
    ].reduce((sum,amount)=>sum+amount,0);
    if(total>allocationDraft.payment.amount+.001){window.alert('Jaotatud summa on pangatehingust suurem.');return;}
    if(allocationDraft.payment.amount-total>.001&&!allocationDraft.studentId){
      window.alert('Vali õpilane, kelle kontole ülejäänud ettemaks jääb.');
      return;
    }
    setAllocationBusy(true);
    const saved=await allocateBankTransaction(allocationDraft.payment,rows,{
      lessonAllocations:lessonRows,
      creditStudentId:allocationDraft.studentId,
      mode
    });
    setAllocationBusy(false);
    if(!saved) return;
    const next={...verified,[allocationDraft.payment.id]:true};
    setVerified(next);
    persist({verified:next});
    setAllocationDraft(null);
  }
  function openCreditApplication(credit) {
    setCreditDraft({
      credit,
      mode:'invoice',
      requestId:financeRequestId('creditapply'),
      rows:[{invoiceId:'',amount:''}],
      lessonRows:[]
    });
  }
  function updateCreditRow(index,patch) {
    setCreditDraft(current=>({
      ...current,
      rows:current.rows.map((row,rowIndex)=>rowIndex===index?{...row,...patch}:row)
    }));
  }
  function removeCreditRow(index) {
    setCreditDraft(current=>({...current,rows:current.rows.filter((_,rowIndex)=>rowIndex!==index)}));
  }
  function toggleCreditLesson(lesson,checked) {
    setCreditDraft(current=>{
      const existing=(current.lessonRows||[]).filter(row=>row.lessonId!==lesson.id);
      if(!checked) return {...current,lessonRows:existing};
      const student=students.find(item=>item.id===current.credit.studentId)||null;
      const options=student?billableLessonsForStudent(lessons,student):[];
      const pricing=student?invoiceDraftForStudent(student,'','',options,tariffAssignments):{lessonPricesById:{}};
      const price=Number(pricing.lessonPricesById?.[lesson.id])||0;
      return {...current,lessonRows:[...existing,{lessonId:lesson.id,amount:price?money(price):''}]};
    });
  }
  function updateCreditLessonAmount(lessonId,amount) {
    setCreditDraft(current=>({
      ...current,
      lessonRows:(current.lessonRows||[]).map(row=>row.lessonId===lessonId?{...row,amount}:row)
    }));
  }
  async function saveCreditApplication() {
    if(!creditDraft||creditBusy) return;
    const sourceRows=creditDraft.mode==='lessons'?[]:creditDraft.rows;
    const hasIncompleteRow=sourceRows.some(row=>{
      const amount=Number(String(row.amount).replace(',','.'));
      return (row.invoiceId&&(!Number.isFinite(amount)||amount<=0)) || (!row.invoiceId&&Number.isFinite(amount)&&amount>0);
    });
    if(hasIncompleteRow){window.alert('Täida igal kasutatud real nii arve kui ka positiivne summa.');return;}
    const rows=sourceRows
      .map(row=>({invoiceId:row.invoiceId,amount:Number(String(row.amount).replace(',','.'))}))
      .filter(row=>row.invoiceId&&Number.isFinite(row.amount)&&row.amount>0);
    const lessonRows=creditDraft.mode==='lessons'
      ?(creditDraft.lessonRows||[])
        .map(row=>({lessonId:row.lessonId,amount:Number(String(row.amount).replace(',','.'))}))
        .filter(row=>row.lessonId&&Number.isFinite(row.amount)&&row.amount>0)
      :[];
    if(rows.length===0&&lessonRows.length===0){window.alert('Lisa vähemalt üks arve või tund ja summa.');return;}
    if(new Set(rows.map(row=>row.invoiceId)).size!==rows.length){window.alert('Sama arvet ei saa kaks korda lisada.');return;}
    const total=[...rows,...lessonRows].reduce((sum,row)=>sum+row.amount,0);
    if(total>(Number(creditDraft.credit.availableAmount)||0)+.001){window.alert('Summa ületab kasutatava ettemakse.');return;}
    setCreditBusy(true);
    const saved=await applyPayerCredit(
      creditDraft.credit,
      rows,
      creditDraft.requestId,
      {lessonAllocations:lessonRows,mode:creditDraft.mode}
    );
    setCreditBusy(false);
    if(saved) setCreditDraft(null);
  }
  function resetAll() {
    if (!window.confirm('Kas eemaldada käsitsi valitud maksjate nimed? Väljavõte ja salvestatud maksed jäävad alles.')) return;
    setAssignState({});
    persist({assign: {}});
  }

  // ---- matching: unique invoice reference first, then unique name + amount ----
  function matchOf(p) {
    return bankStatementMatchProposal({payment:p,invoices,students});
  }

  function effectiveName(p) {
    if (Object.prototype.hasOwnProperty.call(assign, p.id)) return assign[p.id];
    return matchOf(p).name;
  }

  const studentNames = React.useMemo(() => new Set(students.map(s => s.name)), [students]);
  const months = React.useMemo(() => Array.from(new Set(payments.map(p => p.month))).sort(), [payments]);

  // сумма, назначенная каждому конкретному счёту (по ref-match ИЛИ по ручному
  // назначению на того же ученика, если счёт у него один)
  const invoicePaidSums = React.useMemo(() => {
    const sums = {};
    payments.forEach(p => {
      const m = matchOf(p);
      const eff = effectiveName(p);
      if (m.tier === 'ref' && (!assign[p.id] || assign[p.id] === m.name)) {
        sums[m.invoice.id] = (sums[m.invoice.id] || 0) + p.amount;
      }
    });
    return sums;
    // eslint-disable-next-line
  }, [payments, assign, invoices]);

  const studentTotals = React.useMemo(() => {
    const t = {};
    payments.forEach(p => {
      const name = effectiveName(p);
      if (name && studentNames.has(name)) {
        if (!t[name]) t[name] = {sum: 0, count: 0};
        t[name].sum += p.amount; t[name].count += 1;
      }
    });
    return t;
    // eslint-disable-next-line
  }, [payments, assign, students]);

  const monthlyTotals = React.useMemo(() => {
    const t = {};
    payments.forEach(p => {
      const name = effectiveName(p) || '(sidumata)';
      if (!t[name]) t[name] = {byMonth: {}, isStudent: studentNames.has(name)};
      t[name].byMonth[p.month] = (t[name].byMonth[p.month] || 0) + p.amount;
    });
    return t;
    // eslint-disable-next-line
  }, [payments, assign, students]);

  const pendingInvoices = invoices.filter(i => i.status === 'Ootel');
  const allocatableInvoices = React.useMemo(
    ()=>invoices
      .filter(invoice=>invoiceFinancialSummary(invoice).balance>0)
      .sort((a,b)=>String(a.due||a.date||'').localeCompare(String(b.due||b.date||''))),
    [invoices]
  );
  const allocationStudent=allocationDraft
    ?students.find(student=>student.id===allocationDraft.studentId)||null
    :null;
  const directLessonOptions=allocationStudent
    ?billableLessonsForStudent(lessons,allocationStudent)
    :[];
  const directLessonPricing=allocationStudent
    ?invoiceDraftForStudent(allocationStudent,'','',directLessonOptions,tariffAssignments)
    :{lessonPricesById:{}};
  const allocationTotal = allocationDraft
    ? [
        ...((allocationDraft.mode==='invoice'?allocationDraft.rows:[])||[]),
        ...((allocationDraft.mode==='lessons'?allocationDraft.lessonRows:[])||[])
      ].reduce((sum,row)=>sum+(Number(String(row.amount).replace(',','.'))||0),0)
    : 0;
  const allocationRemaining = allocationDraft
    ? Math.round((allocationDraft.payment.amount-allocationTotal)*100)/100
    : 0;
  const creditApplicationTotal = creditDraft
    ? [
        ...((creditDraft.mode==='lessons'?creditDraft.lessonRows:creditDraft.rows)||[])
      ].reduce((sum,row)=>sum+(Number(String(row.amount).replace(',','.'))||0),0)
    : 0;
  const creditApplicationRemaining = creditDraft
    ? Math.round(((Number(creditDraft.credit.availableAmount)||0)-creditApplicationTotal)*100)/100
    : 0;
  const creditEligibleInvoices=creditDraft?.credit?.studentId
    ?allocatableInvoices.filter(invoice=>String(invoice.studentId||'')===String(creditDraft.credit.studentId))
    :allocatableInvoices;
  const creditStudent=creditDraft?.credit?.studentId
    ?students.find(student=>student.id===creditDraft.credit.studentId)||null
    :null;
  const creditLessonOptions=creditStudent?billableLessonsForStudent(lessons,creditStudent):[];
  const creditLessonPricing=creditStudent
    ?invoiceDraftForStudent(creditStudent,'','',creditLessonOptions,tariffAssignments)
    :{lessonPricesById:{}};
  const openCreditTotal = (payerCredits||[])
    .filter(credit=>credit.status==='open')
    .reduce((sum,credit)=>sum+(Number(credit.availableAmount)||0),0);
  const recordedPaymentIds=React.useMemo(
    ()=>new Set((bankTransactions||[]).map(transaction=>transaction.externalId).filter(Boolean)),
    [bankTransactions]
  );

  const filteredPayments = payments.filter(p => {
    if (month !== 'all' && p.month !== month) return false;
    if (hideVerified && recordedPaymentIds.has(p.id)) return false;
    if (search) {
      const t = search.toLowerCase();
      if (!`${p.payer} ${p.desc} ${effectiveName(p)}`.toLowerCase().includes(t)) return false;
    }
    return true;
  });

  const totalSum = payments.filter(p => month === 'all' || p.month === month).reduce((s, p) => s + p.amount, 0);
  const doneSum = payments
    .filter(p => (month === 'all' || p.month === month) && recordedPaymentIds.has(p.id))
    .reduce((s, p) => s + p.amount, 0);
  const automaticMatchCount=payments.filter(payment=>matchOf(payment).tier==='ref').length;
  const reviewCount=payments.filter(payment=>!recordedPaymentIds.has(payment.id)).length;
  const studentPaymentRegisterData=React.useMemo(
    ()=>studentInvoiceRegister({students,invoices,payments:invoicePayments,payerCredits}),
    [students,invoices,invoicePayments,payerCredits]
  );
  const studentPaymentRows=studentPaymentRegisterData.rows.filter(row=>{
    const query=normalizeText(studentPaymentSearch);
    if(query&&!normalizeText(`${row.studentName} ${row.parentName} ${row.invoiceNumbers.join(' ')}`).includes(query)) return false;
    if(studentPaymentFilter==='attention') return ['partial','unpaid','overdue','needs_review'].includes(row.status);
    if(studentPaymentFilter==='paid') return row.status==='paid';
    if(studentPaymentFilter==='direct') return row.directPaidCents>0||row.advanceCents>0;
    if(studentPaymentFilter==='no_invoice') return row.status==='no_invoice';
    return true;
  });
  const studentPaymentStatusMeta=status=>({
    paid:{label:'Makstud',bg:'#dcfce7',color:'#166534'},
    partial:{label:'Osaliselt',bg:'#fef3c7',color:'#92400e'},
    overdue:{label:'Tähtaja ületanud',bg:'#fee2e2',color:'#991b1b'},
    unpaid:{label:'Tasumata',bg:'#fee2e2',color:'#991b1b'},
    needs_review:{label:'Kontrolli vana märget',bg:'#fffbeb',color:'#92400e'},
    direct_paid:{label:'Tunnid makstud ilma arveta',bg:'#dcfce7',color:'#166534'},
    advance:{label:'Ettemaks',bg:'#ede9fe',color:'#6d28d9'},
    no_invoice:{label:'Arvet pole',bg:'#f1f5f9',color:'#475569'}
  }[status]||{label:status,bg:'#f1f5f9',color:'#475569'});

  let monthEntries = Object.keys(monthlyTotals).map(name => {
    const byMonth = monthlyTotals[name].byMonth;
    const sum = Object.values(byMonth).reduce((a, b) => a + b, 0);
    return {name, byMonth, sum, isStudent: monthlyTotals[name].isStudent};
  });
  if (moSearch) monthEntries = monthEntries.filter(e => e.name.toLowerCase().includes(moSearch.toLowerCase()));
  monthEntries.sort((a, b) => b.sum - a.sum);

  if (!loaded) return <div className="card" style={{padding: 40, textAlign: 'center', color: '#94a3b8'}}>Laadimine…</div>;

  return (
    <div className="fade-in" style={{display: 'flex', flexDirection: 'column', gap: 16}}>
      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10}}>
        <div>
          <h2 style={{fontSize: '1.45rem'}}>Maksete sobitamine</h2>
          <p style={{fontSize:'.8rem',color:'#64748b',marginTop:3}}>

          </p>
        </div>
        {payments.length>0&&<button onClick={resetAll} className="btn btn-ghost btn-sm">Lähtesta käsitsi valitud nimed</button>}

            {number:2,title:'Kontrolli ettepanekut',text:'Roheline vaste tähendab leitud arvenumbrit.',done:payments.length>0&&reviewCount===0},
            {number:3,title:'Kinnita jaotus',text:'Vajuta „Kinnita jaotus“, et luua maksekirje.',done:payments.length>0&&reviewCount===0},
            {number:4,title:'Kontrolli kuud',text:'Lõppkontroll asub Raamatupidamise vaates.',done:false}
          ].map(step=>(
            <div key={step.number} style={{display:'flex',gap:10,alignItems:'flex-start',padding:10,borderRadius:11,background:'#fff',border:'1px solid rgba(28,43,58,.07)'}}>
              <span style={{width:26,height:26,borderRadius:999,display:'grid',placeItems:'center',flexShrink:0,fontSize:'.72rem',fontWeight:800,background:step.done?'#dcfce7':'#1C2B3A',color:step.done?'#166534':'#fff'}}>

              <span>
                <strong style={{display:'block',fontSize:'.78rem'}}>{step.title}</strong>
                <span style={{display:'block',fontSize:'.69rem',color:'#64748b',marginTop:2,lineHeight:1.35}}>{step.text}</span>
              </span>
            </div>
          ))}
        </div>
      </div>

      <div className="card" style={{padding:18}}>
        <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'flex-start',flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:'.68rem',fontWeight:800,color:'#C9882A',textTransform:'uppercase',letterSpacing:'.07em'}}>1. samm</div>
            <div style={{fontWeight:800,marginTop:3}}>Lisa pangaväljavõte</div>
            <div style={{fontSize:'.75rem',color:'#64748b',marginTop:3}}>

            </div>
          </div>
          {payments.length>0&&!showImport&&(
            <button onClick={()=>{
              setShowImport(true);
              setImportResult(rawStatement.trim()?parseStatementDetailed(rawStatement):null);
              setShowRawImport(false);
            }} className="btn btn-ghost btn-sm">
              <i className="fa-solid fa-rotate"/> Asenda väljavõte
            </button>
          )}
        </div>

        {!showImport&&payments.length>0?(
          <div style={{marginTop:14,padding:14,borderRadius:12,background:'#ecfdf5',display:'flex',justifyContent:'space-between',gap:12,alignItems:'center',flexWrap:'wrap'}}>
            <div>
              <div style={{fontWeight:800,color:'#166534'}}><i className="fa-solid fa-circle-check"/> {payments.length} makset valmis kontrollimiseks</div>
              <div style={{fontSize:'.72rem',color:'#42536A',marginTop:3}}>
                {statementFileName||'Kleebitud väljavõte'} · {automaticMatchCount} arvenumbri järgi leitud · {reviewCount} kinnitamata
              </div>
            </div>
            <button onClick={()=>setSubTab('pay')} className="btn btn-pine btn-sm">Kontrolli makseid <i className="fa-solid fa-arrow-down"/></button>

            <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>

              </label>
              <span style={{fontSize:'.75rem',color:statementFileName?'#166534':'#64748b'}}>
                {statementFileName?`Valitud: ${statementFileName}`:'või kleebi read allolevasse kasti'}
              </span>
            </div>
            {importResult&&(
              <div role="status" style={{border:'1px solid rgba(28,43,58,.1)',borderRadius:12,overflow:'hidden'}}>
                <div style={{padding:'12px 14px',background:importResult.error||!importResult.rows?.length?'#fff1f2':'#ecfdf5',display:'flex',justifyContent:'space-between',gap:10,alignItems:'center',flexWrap:'wrap'}}>

                    <div style={{fontWeight:800,color:importResult.error||!importResult.rows?.length?'#991b1b':'#166534'}}>

              <button key={mode} onClick={()=>setAllocationMode(mode)}

                <span style={{display:'block',fontSize:'.66rem',fontWeight:500,opacity:.72,marginTop:2}}>{description}</span>
              </button>
            ))}
          </div>
          {(allocationDraft.mode!=='invoice'||allocationRemaining>0)&&(
            <div style={{padding:12,borderRadius:12,background:'#f8fafc',border:'1px solid rgba(28,43,58,.1)'}}>
              <label style={{display:'block',fontSize:'.7rem',fontWeight:800,color:'#42536A',marginBottom:5}}>
                {allocationDraft.mode==='advance'?'Kelle ettemaks?':allocationDraft.mode==='lessons'?'Kelle tunnid?':'Kellele jääk ettemaksuks jääb?'}

              <select value={allocationDraft.studentId} onChange={event=>setAllocationDraft(current=>({
                ...current,
                studentId:event.target.value,

                {[...students].filter(student=>student.active!==false).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'et')).map(student=>(
                  <option key={student.id} value={student.id}>
                    {student.name}{student.parentName?` · ${student.parentName}`:''}

              </select>

          {allocationDraft.mode==='invoice'&&<div style={{display:'flex',flexDirection:'column',gap:8}}>

                  <select value={row.invoiceId} onChange={event=>updateAllocationRow(index,{invoiceId:event.target.value})}>
                    <option value="">Vali arve</option>
                    {allocatableInvoices.map(invoice=>(
                      <option key={invoice.id} value={invoice.id}>

                      </option>

                  </select>
                  <input value={row.amount} onChange={event=>updateAllocationRow(index,{amount:event.target.value})}

                  <button onClick={()=>removeAllocationRow(index)} className="btn btn-red btn-sm" title="Eemalda rida">×</button>

            <div style={{display:'flex',flexDirection:'column',gap:8}}>

                  <label key={lesson.id} style={{display:'grid',gridTemplateColumns:'auto minmax(180px,1fr) 130px',gap:10,alignItems:'center',padding:'10px 12px',border:'1px solid rgba(28,43,58,.1)',borderRadius:11,background:row?'#eef6f2':'#fff'}}>
                    <input type="checkbox" checked={Boolean(row)} onChange={event=>toggleDirectLesson(lesson,event.target.checked)} style={{width:'auto'}}/>
                    <span>
                      <strong style={{display:'block'}}>{fmtDate(lesson.date)} · {lesson.topic||lesson.title||'Tund'}</strong>
                      <span style={{display:'block',fontSize:'.68rem',color:'#64748b',marginTop:2}}>
                        {lesson.teacher||'—'}{suggested?` · tariif ${money(suggested)}€`:''}

            <div style={{padding:16,borderRadius:12,background:'#f5f3ff',border:'1px solid #ddd6fe',color:'#4c1d95'}}>

          <div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'center',flexWrap:'wrap'}}>

                ?`Ettemakse ${money(allocationDraft.payment.amount)}€`
                :<>Jaotatud {money(allocationTotal)}€ · {allocationRemaining>0?`ettemakse ${money(allocationRemaining)}€`:allocationRemaining<0?`ületus ${money(Math.abs(allocationRemaining))}€`:'jääk 0€'}</>}
            </div>
            <button onClick={saveAllocation} className="btn btn-pine btn-sm" disabled={allocationBusy||allocationRemaining<-.001}
              style={{opacity:(allocationBusy||allocationRemaining<-.001) ? .55 : 1}}>
              {allocationBusy?'Salvestan…':allocationDraft.mode==='advance'?'Salvesta ettemaks':allocationDraft.mode==='lessons'?'Kinnita tunnimakse':'Kinnita ja salvesta'}

                {creditDraft.credit.studentName||creditDraft.credit.payerName||'Maksja'} · kasutada {money(creditDraft.credit.availableAmount)}€

                <div style={{fontSize:'.75rem',color:'#64748b'}}>Pangamaksja: {creditDraft.credit.payerName}</div>

          <div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:8}}>

            <button onClick={()=>setCreditDraft(current=>({...current,mode:'lessons'}))}

                      <option key={invoice.id} value={invoice.id}>

                      </option>

function MiniStat({label, value, color}) {
  return (
    <div style={{background: 'rgba(255,255,255,.06)', border: '1px solid rgba(255,255,255,.12)', borderRadius: 8, padding: '6px 10px'}}>
      <div style={{fontSize: '.62rem', textTransform: 'uppercase', color: 'rgba(255,255,255,.55)'}}>{label}</div>
      <div style={{fontFamily: 'monospace', fontSize: '.95rem', color: color || '#fff', marginTop: 2}}>{value}</div>
    </div>
  );
}

function LessonModal({modalEv,setModalEv,lTopic,setLTopic,lGrade,setLGrade,
  lStatus,setLStatus,lComment,setLComment,
  lNewWords,setLNewWords,lGrammar,setLGrammar,lCovered,setLCovered,lNextNotes,setLNextNotes,
  lDur,setLDur,lessonFile,setLessonFile,saveLesson,deleteLesson,db,user,notify,students,markAttendance,
  studentPackages=[],schedule=[],staffMembers=[],isAdmin,updateLessonBillingDisposition,logActivity}) {

  const [moveDate,setMoveDate] = React.useState(modalEv.requestedMoveDate||modalEv.occurrenceDate||modalEv.date||new Date().toISOString().split("T")[0]);
  const [moveTime,setMoveTime] = React.useState(modalEv.requestedMoveTime||modalEv.time||"09:00");
  const [saving,setSaving]     = React.useState(false);
  const [savingDiary,setSavingDiary] = React.useState(false);
  const [billingBusy,setBillingBusy] = React.useState(false);
  const [seriesScope,setSeriesScope] = React.useState('occurrence');
  const teacherUidForName = React.useCallback(teacherName=>{
    const canonical=normalizeText(canonicalTeacherName(teacherName));
    if(canonical&&canonical===normalizeText(canonicalTeacherName(user.displayName||''))) return user.uid||'';
    const member=staffMembers.find(item=>
      normalizeText(canonicalTeacherName(item.displayName||item.name||''))===canonical
    );
    return member?.id||member?.uid||'';
  },[staffMembers,user]);

  const fmtDate = d => d?new Date(d).toLocaleDateString("et-EE",{day:"2-digit",month:"2-digit",year:"numeric"}):"—";
  const hasDate = Boolean(modalEv.date||modalEv.occurrenceDate);
  const st = modalEv.status||"Planeeritud";
  const isJournalEdit = Boolean(modalEv.lessonEntryId);
  const isGoogleEvent = modalEv.source==='gcal';
  const isSeries = Boolean(modalEv.recurring&&!modalEv.seriesId&&!modalEv.isGroup);
  const isOccurrenceException = Boolean(modalEv.seriesId&&modalEv.originalOccurrenceDate);
  const savedLessonStatus = modalEv.status||lStatus;
  const billingOptions = savedLessonStatus==='Toimunud'
    ? [
        ['', 'Finantsstaatus määramata'],
        ['unbilled','Arveldamata · tasuline'],
        ['free','Tasuta tund'],
        ['written_off','Mahakantud']
      ]
    : [
        ['', 'Finantsstaatus määramata'],
        ['cancelled_on_time','Õigeaegselt tühistatud · tasuta'],
        ['late_cancel_billable','Hilinenud tühistus · tasuline'],
        ['written_off','Mahakantud']
      ];
  const changeBillingDisposition = async event=>{
    const nextStatus=event.target.value||'unset';
    if(!updateLessonBillingDisposition||billingBusy) return;
    setBillingBusy(true);
    const updated=await updateLessonBillingDisposition(modalEv.lessonEntryId,nextStatus);

    const fmt   = dt => dt.getFullYear()+String(dt.getMonth()+1).padStart(2,"0")+String(dt.getDate()).padStart(2,"0")
                  +"T"+String(dt.getHours()).padStart(2,"0")+String(dt.getMinutes()).padStart(2,"0")+"00";

                disabled={isGoogleEvent||(isSeries&&seriesScope==='occurrence')}
                className="btn btn-ghost btn-sm"
                style={{width:"100%",marginBottom:12,color:"#991b1b",borderColor:"rgba(239,68,68,.25)",opacity:(isGoogleEvent||(isSeries&&seriesScope==='occurrence'))?0.45:1}}>
                <i className="fa-solid fa-trash"/> {isSeries?'Kustuta kogu sari':isOccurrenceException?'Kustuta erand ja taasta algne tund':'Kustuta tund täielikult'}
              </button>
            )}

            {/* Перенос */}
            <div style={{fontSize:".78rem",fontWeight:600,color:"#42536A",marginBottom:6}}>Tõsta tund ümber:</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <input type="date" value={moveDate} onChange={e=>setMoveDate(e.target.value)}

              <select value={moveTime} onChange={e=>setMoveTime(e.target.value)} disabled={!hasDate||isGoogleEvent} style={{opacity:(!hasDate||isGoogleEvent)?0.5:1}}>

            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={rescheduleLesson} className="btn btn-amber btn-sm" disabled={!hasDate||saving||isGoogleEvent} style={{flex:1,opacity:(!hasDate||isGoogleEvent)?0.5:1}}>
                <i className="fa-solid fa-calendar-days"/> {saving?"Salvestab…":"Salvesta uus aeg"}
              </button>
              <button onClick={exportIcs} className="btn btn-ghost btn-sm" disabled={!hasDate} style={{opacity:!hasDate?.5:1}} title="Ekspordi .ics faili (avab Google/Apple Calendar)">
                <i className="fa-solid fa-calendar-arrow-up"/> .ics
              </button>
            </div>
            {!hasDate&&<div style={{fontSize:".72rem",color:"#9ca3af",marginTop:8}}>Mallikirjet ei saa ümber tõsta. Loo uus konkreetse kuupäevaga tund.</div>}
            {modalEv.originalDate&&(
              <div style={{fontSize:".72rem",color:"#42536A",marginTop:8,display:"flex",gap:4}}>
                <span>Algne aeg:</span>
                <span style={{color:"#A96E1A",fontWeight:600}}>{fmtDate(modalEv.originalDate)} {modalEv.originalTime||""}</span>
              </div>
            )}
            {modalEv.recurring&&(
              <div style={{fontSize:".72rem",color:"#2F5D50",marginTop:8,fontWeight:600}}>
                {seriesScope==='occurrence'
                  ?'Muudatus eraldab ainult valitud kuupäeva korduvast sarjast.'
                  :'See tund on korduv ja muudatus mõjutab kogu sarja.'}
              </div>
            )}
          </div>}

          {modalEv.isGroup&&assignedGroupStudents.length>0&&st!=="Tühistatud"&&(
            <div style={{background:"#F9F8F6",borderRadius:12,padding:16,border:"1px solid rgba(28,43,58,.07)"}}>
              <div style={{fontSize:".76rem",fontWeight:700,color:"#42536A",textTransform:"uppercase",letterSpacing:".08em",marginBottom:12}}>
                👥 Grupi kohalolu
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {assignedGroupStudents.map(student=>{
                  const key = `${student.id}_${lessonDate}`;
                  const saved = modalEv.attendance?.[key]?.status || '';
                  return (
                    <div key={student.id} style={{display:"grid",gridTemplateColumns:"1fr auto",gap:10,alignItems:"center",padding:"10px 12px",borderRadius:10,background:"#fff",border:"1px solid rgba(28,43,58,.08)"}}>
                      <div>
                        <div style={{fontWeight:800,color:"#1C2B3A",fontSize:".9rem"}}>{student.name}</div>
                        <div style={{fontSize:".74rem",color:saved?"#2F5D50":"#991b1b",fontWeight:700}}>
                          {attendanceText(saved)}
                        </div>
                      </div>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
                        <button type="button" onClick={()=>setGroupAttendance(student,'coming')} className={`btn btn-sm ${saved==='coming'?'btn-pine':'btn-ghost'}`} style={{padding:"7px 9px"}}>
                          Tuli
                        </button>
                        <button type="button" onClick={()=>setGroupAttendance(student,'absent')} className={`btn btn-sm ${saved==='absent'?'btn-red':'btn-ghost'}`} style={{padding:"7px 9px"}}>
                          Puudus
                        </button>
                        <button type="button" onClick={()=>setGroupAttendance(student,'warned')} className={`btn btn-sm ${saved==='warned'?'btn-amber':'btn-ghost'}`} style={{padding:"7px 9px"}}>
                          Hoiatas
                        </button>
                        {saved&&(
                          <button type="button" onClick={()=>setGroupAttendance(student,'clear')} className="btn btn-ghost btn-sm" style={{padding:"7px 9px",color:"#42536A"}}>

          {st!=="Tühistatud"&&(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>

                📝 Päeviku kanne
              </div>
              {curriculumLessonOptions.length>0&&(
                <label style={{display:'grid',gap:5,padding:'11px 12px',borderRadius:11,background:'#F3FAF7',border:'1px solid #CBE3DA'}}>
                  <span style={{fontSize:'.72rem',fontWeight:800,color:'#2F5D50'}}>Õppekava teema</span>
                  <select value={selectedCurriculumKey} onChange={applyCurriculumLesson}>

                  </select>
                  <small style={{color:'#557568',fontSize:'.68rem'}}>Valik täidab teema, sõnavara, tunni eesmärgi ja järgmise ülesande. Kõiki välju saab muuta.</small>

              )}
              <input value={lTopic} onChange={e=>setLTopic(e.target.value)} placeholder="Tunni teema (valikuline)"/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <select value={lStatus} onChange={e=>setLStatus(e.target.value)} disabled={Boolean(modalEv.billingStatus||modalEv.invoiceId)}>
                  <option value="Toimunud">✓ Toimunud</option>
                  <option value="Puudus_p">Puudus (põhjusega)</option>
                  <option value="Puudus_eta">Puudus (põhjuseta)</option>
                </select>
                <select value={lGrade} onChange={e=>setLGrade(e.target.value)} disabled={lStatus!=="Toimunud"}>
                  <option value="5">5 ★★★★★</option>
                  <option value="4">4 ★★★★</option>
                  <option value="3">3 ★★★</option>
                  <option value="2">2 ★★</option>
                </select>
              </div>
              {(lessonPackageOptions.length>0||modalEv.packageAccountingSource==='package_ledger_v1')&&(
                <div style={{padding:12,borderRadius:12,background:'#f0fdf4',border:'1px solid #bbf7d0',display:'grid',gap:7}}>
                  <div style={{fontSize:'.75rem',fontWeight:800,color:'#166534',textTransform:'uppercase'}}>Tunnipakett</div>
                  <select
                    value={modalEv.requestedStudentPackageId||(
                      modalEv.packageConsumptionStatus==='consumed'
                        ? modalEv.packageStudentPackageId||''
                        : ''
                    )}
                    onChange={e=>setModalEv(prev=>({...prev,requestedStudentPackageId:e.target.value}))}
                    disabled={modalEv.packageConsumptionStatus==='consumed'}>
                    <option value="">Automaatne · vanim kehtiv pakett</option>
                    {lessonPackageOptions.map(studentPackage=>(
                      <option key={studentPackage.id} value={studentPackage.id}>
                        {studentPackage.packageProductName} · {Number(studentPackage.balanceCredits)||0} tundi alles
                      </option>
                    ))}
                  </select>
                  <div style={{fontSize:'.72rem',color:modalEv.packageConsumptionStatus==='needs_attention'?'#991b1b':'#166534'}}>
                    {modalEv.packageConsumptionStatus==='consumed'
                      ? `Üks tund on maha arvestatud paketist ${modalEv.packageProductName||''}.`
                      : modalEv.packageConsumptionStatus==='restored'
                        ? 'Varasem paketikrediit on tagastatud eraldi liikumisega.'
                        : modalEv.packageConsumptionStatus==='needs_attention'
                          ? `Vajab tähelepanu: ${modalEv.packageSyncError||'sobivat paketikrediiti ei leitud'}.`
                          : 'Toimunud tunni salvestamisel arvestatakse üks krediit automaatselt maha.'}
                  </div>
                </div>
              )}
              {isAdmin&&isJournalEdit&&(
                <div style={{padding:12,borderRadius:12,background:'#fff7ed',border:'1px solid #fed7aa',display:'grid',gap:7}}>
                  <div style={{fontSize:'.75rem',fontWeight:800,color:'#9a3412',textTransform:'uppercase'}}>Finantsstaatus</div>
                  {modalEv.invoiceId
                    ? <div style={{fontSize:'.82rem',fontWeight:700,color:'#6d28d9'}}>Arvel {modalEv.invoiceNum||modalEv.invoiceId} · muutmine lukus</div>
                    : modalEv.packageConsumptionStatus==='consumed'
                      ? <div style={{fontSize:'.82rem',fontWeight:700,color:'#166534'}}>Paketist tasutud · muutmine lukus</div>
                      : <select value={modalEv.billingStatus||''} onChange={changeBillingDisposition} disabled={billingBusy}>
                          {billingOptions.map(([value,label])=><option key={value||'unset'} value={value}>{label}</option>)}
                        </select>}
                  <div style={{fontSize:'.72rem',color:'#9a3412'}}>
                    Salvesta esmalt päeviku staatus. Finantsstaatuse muutmine küsib põhjust ja salvestub auditisse.
                  </div>
                </div>
              )}
              <select value={lDur} onChange={e=>setLDur(e.target.value)} disabled={Boolean(modalEv.billingStatus||modalEv.invoiceId)}>
                {LESSON_DURATIONS.map(d=><option key={d} value={d}>{d} minutit</option>)}
              </select>
              <textarea value={lComment} onChange={e=>setLComment(e.target.value)} placeholder="Õpetaja kommentaar…" rows={2} style={{resize:"vertical"}}/>
              <label style={{fontSize:".76rem",fontWeight:700,color:"#42536A",display:"flex",flexDirection:"column",gap:4}}>
                <span>📖 Uued sõnad ja väljendid <span style={{fontWeight:400,color:"#9ca3af"}}>(õpilane näeb)</span></span>
                <textarea value={lNewWords} onChange={e=>setLNewWords(e.target.value)}
                  placeholder="nt. sisse elama, kohalik kogukond…" rows={2} style={{resize:"vertical"}}/>
              </label>
              <label style={{fontSize:".76rem",fontWeight:700,color:"#42536A",display:"flex",flexDirection:"column",gap:4}}>
                <span>📐 Grammatika teema <span style={{fontWeight:400,color:"#9ca3af"}}>(õpilane näeb)</span></span>
                <textarea value={lGrammar} onChange={e=>setLGrammar(e.target.value)}
                  placeholder="nt. kuhu? vs kus? – suunaverbid…" rows={2} style={{resize:"vertical"}}/>
              </label>
              <label style={{fontSize:".76rem",fontWeight:700,color:"#42536A",display:"flex",flexDirection:"column",gap:4}}>
                <span>✅ Mida tegime tunnis <span style={{fontWeight:400,color:"#9ca3af"}}>(õpilane näeb)</span></span>
                <textarea value={lCovered} onChange={e=>setLCovered(e.target.value)}
                  placeholder="nt. Lugusime teksti, arutasime kultuuri teemal…" rows={2} style={{resize:"vertical"}}/>
              </label>
              <label style={{fontSize:".76rem",fontWeight:700,color:"#42536A",display:"flex",flexDirection:"column",gap:4}}>
                <span>🎯 Järgmiseks korraks <span style={{fontWeight:400,color:"#9ca3af"}}>(õpilane näeb)</span></span>
                <textarea value={lNextNotes} onChange={e=>setLNextNotes(e.target.value)}
                  placeholder="nt. Kordame sõnavara, lahendame harjutuse 3…" rows={2} style={{resize:"vertical"}}/>
              </label>
              <label style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,padding:'10px 12px',borderRadius:10,border:'1.5px solid rgba(28,43,58,.15)',background:'#fff',cursor:'pointer',fontSize:'.86rem',color:'#42536A'}}>
                <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  <i className="fa-solid fa-paperclip" style={{marginRight:7}}/>
                  {selectedLessonFiles.length ? `${selectedLessonFiles.length} faili valitud` : existingLessonAttachments.length ? `Olemas: ${existingLessonAttachments.length} faili` : 'Lisa failid tunni juurde'}
                </span>
                <input type="file" multiple accept="image/*,.heic,.heif,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv" onChange={e=>setLessonFile(Array.from(e.target.files||[]))} style={{display:'none'}}/>
              </label>
              {selectedLessonFiles.length>0&&(
                <div style={{display:'flex',flexDirection:'column',gap:6}}>
                  {selectedLessonFiles.map((file,idx)=>(
                    <div key={`${file.name}-${idx}`} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,padding:'8px 10px',borderRadius:9,background:'#F9F8F6',border:'1px solid rgba(28,43,58,.07)'}}>
                      <span style={{fontSize:'.78rem',fontWeight:700,color:'#42536A',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                        <i className="fa-solid fa-paperclip" style={{marginRight:7}}/>{file.name}
                      </span>
                      <button type="button" onClick={()=>removeSelectedAttachment(idx)} disabled={savingDiary} className="btn btn-ghost" style={{padding:'5px 8px',fontSize:'.72rem',color:'#991b1b',borderColor:'rgba(239,68,68,.25)',opacity:savingDiary?.45:1}}>
                        <i className="fa-solid fa-xmark"/> Eemalda
                      </button>
                    </div>
                  ))}
                </div>
              )}
              {existingLessonAttachments.length>0&&(
                <div style={{display:'flex',flexDirection:'column',gap:6}}>
                  {existingLessonAttachments.map((att,idx)=>(
                    <div key={`${att.url||att.name}-${idx}`} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,padding:'8px 10px',borderRadius:9,background:'#F9F8F6',border:'1px solid rgba(28,43,58,.07)'}}>
                      {att.url?(
                        <a href={att.url} target="_blank" rel="noreferrer" style={{display:'inline-flex',alignItems:'center',gap:7,minWidth:0,fontSize:'.78rem',fontWeight:700,color:'#2F5D50',textDecoration:'none',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                          <i className="fa-solid fa-paperclip"/> {att.name||'Tunni fail'}
                        </a>
                      ):(
                        <span style={{fontSize:'.78rem',fontWeight:700,color:'#42536A',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                          <i className="fa-solid fa-paperclip" style={{marginRight:7}}/>{att.name||'Tunni fail'}
                        </span>
                      )}
                      <button type="button" onClick={()=>removeExistingAttachment(idx)} disabled={savingDiary} className="btn btn-ghost" style={{padding:'5px 8px',fontSize:'.72rem',color:'#991b1b',borderColor:'rgba(239,68,68,.25)',opacity:savingDiary?.45:1}}>
                        <i className="fa-solid fa-trash"/> Eemalda
                      </button>
                    </div>
                  ))}
                </div>
              )}
              <button onClick={handleSaveLesson} disabled={savingDiary} className="btn btn-dark" style={{width:"100%",padding:13,opacity:savingDiary?.75:1}}>
                <i className={`fa-solid ${savingDiary?'fa-spinner fa-spin':'fa-floppy-disk'}`}/> {savingDiary?'Salvestan...':'Salvesta päevikusse'}
              </button>
              {isJournalEdit&&(
                <button onClick={hardDeleteJournalEntry} disabled={savingDiary} className="btn btn-ghost" style={{width:"100%",padding:13,color:"#991b1b",borderColor:"rgba(239,68,68,.25)",opacity:savingDiary?.45:1}}>
                  <i className="fa-solid fa-trash"/> Kustuta päeviku kanne
                </button>
              )}
            </div>
          )}
          {st==="Tühistatud"&&(
            <div style={{textAlign:"center",padding:"16px 0",color:"#42536A",fontSize:".88rem"}}>
              Tühistatud tundi ei saa päevikusse kanda. Taasta tund enne.
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── РЕДАКТИРОВАНИЕ И УДАЛЕНИЕ УЧЕНИКА ────────────────────────
function EditStudentModal({student,onClose,onSave,onDelete,db,notify,isAdmin,resolveTeacherUid,groupOptions=[]}) {
  const [name,    setName]    = React.useState(student.name||'');
  const [parentName,setParentName] = React.useState(student.parentName||'');
  const [email,   setEmail]   = React.useState(student.email||'');
  const [phone,   setPhone]   = React.useState(student.phone||'');
  const [level,   setLevel]   = React.useState(student.level||'A1');
  const [target,  setTarget]  = React.useState(student.targetLevel||'B1');
  const [subject, setSubject] = React.useState(student.subject||'Eesti keel');
  const [grade,   setGrade]   = React.useState(student.grade||'');
  const [group,   setGroup]   = React.useState(student.group||'');
  const [teacher, setTeacher] = React.useState(student.teacher||'Pavel');
  const [contactStatus,setContactStatus] = React.useState(student.contactStatus||'new');
  const [contactOwner,setContactOwner] = React.useState(student.contactOwner||'');
  const [contactLastAt,setContactLastAt] = React.useState(student.contactLastAt||'');
  const [contactNotes,setContactNotes] = React.useState(student.contactNotes||'');
  const [pkg,     setPkg]     = React.useState(String(student.packageTotal||0));
  const [used,    setUsed]    = React.useState(String(student.packageUsed||0));
  const [lessonPrice,setLessonPrice] = React.useState(String(student.lessonPrice||''));
  const [hiddenFields,setHiddenFields] = React.useState(student.hiddenFields||{});
  const toggleHide = field => setHiddenFields(prev=>({...prev,[field]:!prev[field]}));
  const HideToggle = ({field,label='Ei ole vaja'}) => (
    <label style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:'.7rem',color:hiddenFields[field]?'#991b1b':'#9ca3af',cursor:'pointer',marginTop:4,userSelect:'none'}}>
      <input type="checkbox" checked={!!hiddenFields[field]} onChange={()=>toggleHide(field)}
        style={{width:12,height:12,accentColor:'#dc2626'}}/>
      {hiddenFields[field]?'Peidetud':'Peida'}
    </label>
  );
  const [saving,  setSaving]  = React.useState(false);
  const [confirm, setConfirm] = React.useState(false);
  const modalGroupOptions = React.useMemo(()=>
    [...new Set([...(groupOptions||[]),group].map(g=>(g||'').trim()).filter(Boolean))]
      .sort((a,b)=>a.localeCompare(b,'et'))
  ,[groupOptions,group]);

  const save = async()=>{
    if(!name.trim()){notify('⚠ Sisesta nimi');return;}
    setSaving(true);
    await db.collection('students').doc(student.id).update({
      name,parentName,email,phone,level,targetLevel:target,
      subject,grade,group,teacher,teacherUid:resolveTeacherUid?.(teacher)||student.teacherUid||'',
      contactStatus,contactOwner,contactLastAt,contactNotes,
      packageTotal:parseInt(pkg)||0,
      packageUsed:parseInt(used)||0,
      lessonPrice:parseFloat(lessonPrice)||0,
      hiddenFields,
      updatedAt: new Date().toISOString().split('T')[0]
    });
    notify('✓ Muudatused salvestatud!');
    onSave();
    setSaving(false);
  };

  const deleteStudent = async()=>{
    setSaving(true);
    // Кудалем ученика и связанные данные
    await db.collection('students').doc(student.id).delete();
    // Удаляем уроки
    const lessons = await db.collection('lessons').where('studentId','==',student.id).get();
    for(const doc of lessons.docs) await doc.ref.delete();
    // Удаляем домашние задания
    const hw = await db.collection('homework').where('studentId','==',student.id).get();
    for(const doc of hw.docs) await doc.ref.delete();
    // Удаляем счета
    const inv = await db.collection('invoices').where('studentId','==',student.id).get();
    for(const doc of inv.docs) await doc.ref.delete();
    notify('✓ Õpilane kustutatud');
    onDelete();
    setSaving(false);
  };

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(28,43,58,.6)',display:'flex',alignItems:'center',
      justifyContent:'center',padding:16,zIndex:210,backdropFilter:'blur(4px)'}}>
      <div className="card scroll" style={{padding:0,maxWidth:520,width:'100%',maxHeight:'92vh',overflowY:'auto'}}>
        <div style={{padding:'20px 24px 16px',borderBottom:'1px solid rgba(28,43,58,.08)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <h2 style={{fontSize:'1.2rem'}}>✏️ Muuda õpilase andmeid</h2>
          <button onClick={onClose} style={{background:'rgba(28,43,58,.07)',border:'none',cursor:'pointer',borderRadius:9,
            width:30,height:30,display:'flex',alignItems:'center',justifyContent:'center',color:'#42536A'}}>✕</button>
        </div>

        <div style={{padding:'20px 24px',display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div style={{gridColumn:'1/-1'}}>
              <div style={{fontSize:'.78rem',fontWeight:600,color:'#42536A',marginBottom:4}}>Lapse nimi *</div>
              <input value={name} onChange={e=>setName(e.target.value)} placeholder="Lapse nimi *"/>
            </div>
            <div style={{gridColumn:'1/-1'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{fontSize:'.78rem',fontWeight:600,color:'#42536A',marginBottom:4}}>Vanema nimi</div>
                <HideToggle field="parentName"/>
              </div>
              <input value={parentName} onChange={e=>setParentName(e.target.value)} placeholder="Vanema nimi"
                style={{opacity:hiddenFields.parentName?.6:1}}/>
            </div>
            <div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{fontSize:'.78rem',fontWeight:600,color:'#42536A',marginBottom:4}}>E-post</div>
                <HideToggle field="email"/>
              </div>
              <input value={email} onChange={e=>setEmail(e.target.value)} type="email" placeholder="E-post"
                style={{opacity:hiddenFields.email?.6:1}}/>
            </div>
            <div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{fontSize:'.78rem',fontWeight:600,color:'#42536A',marginBottom:4}}>Telefon</div>
                <HideToggle field="phone"/>
              </div>
              <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="+372…"
                style={{opacity:hiddenFields.phone?.6:1}}/>
            </div>
            <div>
              <div style={{fontSize:'.78rem',fontWeight:600,color:'#42536A',marginBottom:4}}>Õppeaine</div>
              <select value={subject} onChange={e=>setSubject(e.target.value)}>
                {SUBJECTS.map(subject=><option key={subject}>{subject}</option>)}
              </select>
            </div>
            <div>
              <div style={{fontSize:'.78rem',fontWeight:600,color:'#42536A',marginBottom:4}}>Klass / vanus</div>
              <select value={grade} onChange={e=>setGrade(e.target.value)}>
                <option value="">Määramata</option>
                {GRADES.map(g=><option key={g}>{g}</option>)}
              </select>
            </div>

// ── GOOGLE CALENDAR SETTINGS ──────────────────────────────────
function GCalSettings({user,notify}) {
  const [status,setStatus] = React.useState(null); // null | 'connected' | 'disconnected'
  const [lastSync,setLastSync] = React.useState(null);
  const [lastCount,setLastCount] = React.useState(0);
  const [lastSkipped,setLastSkipped] = React.useState(0);
  const [lastRemoved,setLastRemoved] = React.useState(0);
  const [lastCancelled,setLastCancelled] = React.useState(0);
  const [lastExceptions,setLastExceptions] = React.useState(0);
  const [lastError,setLastError] = React.useState('');
  const [writeEnabled,setWriteEnabled] = React.useState(false);
  const [requiresWriteConsent,setRequiresWriteConsent] = React.useState(false);
  const [lastPush,setLastPush] = React.useState(null);
  const [lastPushError,setLastPushError] = React.useState('');
  const [syncing,setSyncing] = React.useState(false);
  const [connecting,setConnecting] = React.useState(false);
  const [statusError,setStatusError] = React.useState('');
  const [detailsOpen,setDetailsOpen] = React.useState(false);
  const FUNCTIONS_BASE = 'https://us-central1-keelesepp-5136b.cloudfunctions.net/gcalApi';

  React.useEffect(()=>{
    if(!user?.uid) return;
    authFetch(`${FUNCTIONS_BASE}/gcal/status?uid=${user.uid}`)
      .then(async r=>{
        const data=await r.json();
        if(!r.ok) throw new Error(data.error||'Google Calendari olekut ei õnnestunud kontrollida');
        return data;
      })
      .then(d=>{
        setStatusError('');
        setStatus(d.connected?'connected':'disconnected');
        setLastSync(d.lastSyncAt||null);
        setLastCount(Number(d.lastSyncCount||0));
        setLastSkipped(Number(d.lastSyncSkipped||0));
        setLastRemoved(Number(d.lastSyncRemoved||0));
        setLastCancelled(Number(d.lastSyncCancelled||0));
        setLastExceptions(Number(d.lastSyncExceptions||0));
        setLastError(d.lastSyncError||'');
        setWriteEnabled(Boolean(d.writeEnabled));
        setRequiresWriteConsent(Boolean(d.requiresWriteConsent));
        setLastPush(d.lastPushAt||null);
        setLastPushError(d.lastPushError||'');
      })
      .catch(error=>{
        setStatus('disconnected');
        setStatusError(String(error?.message||'Google Calendari olekut ei õnnestunud kontrollida'));
      });
  },[user?.uid]);

  const connect = async()=>{
    setConnecting(true);
    try{
      const r = await authFetch(`${FUNCTIONS_BASE}/gcal/auth-url?uid=${user.uid}`);
      const d = await r.json();
      if(!r.ok) throw new Error(d.error||'Google Calendar ühendamine ebaõnnestus');
      setStatusError('');
      window.location.href = d.url;
    }catch(error){
      const message=googleCalendarErrorGuidance(error?.message)||'Google Calendar ühendamine ebaõnnestus. Proovi uuesti.';
      setStatusError(message);
      notify(`⚠ ${message}`);
      setConnecting(false);
    }
  };

  const sync = async()=>{
    setSyncing(true);
    try{
      const r = await authFetch(`${FUNCTIONS_BASE}/gcal/sync`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({uid:user.uid})
      });
      const d = await r.json();
      if(!r.ok) throw new Error(d.error||'Sünkroonimine ebaõnnestus');
      notify(`✓ Google → KeeleSepp: ${d.synced}${d.exceptions?` · sarja erandeid: ${d.exceptions}`:''}${d.pushed?` · Google’isse: ${d.pushed}`:''}${d.removed?` · eemaldatud: ${d.removed}`:''}${d.cancelled?` · tühistatud: ${d.cancelled}`:''}${d.skipped?` · vahele jäetud: ${d.skipped}`:''}`);
      setLastSync(new Date().toISOString());
      setLastCount(Number(d.synced||0));
      setLastSkipped(Number(d.skipped||0));
      setLastRemoved(Number(d.removed||0));
      setLastCancelled(Number(d.cancelled||0));
      setLastExceptions(Number(d.exceptions||0));
      setLastError('');
      setStatusError('');
      if(d.pushed) setLastPush(new Date().toISOString());
      setLastPushError(d.pushFailed?'Mõnda muudatust ei õnnestunud Google Calendarisse saata.':'');
    }catch(e){
      const message=String(e?.message||'Sünkroonimine ebaõnnestus').slice(0,500);
      setLastError(message);
      notify(`⚠ ${googleCalendarErrorGuidance(message)||message}`);
    }
    setSyncing(false);
  };

  const disconnect = async()=>{
    if(!window.confirm('Eemalda Google Calendar ühendus?')) return;
    await authFetch(`${FUNCTIONS_BASE}/gcal/disconnect`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({uid:user.uid})
    });
    setStatus('disconnected');
    notify('✓ Google Calendar ühendus eemaldatud');
  };

  const activeError=lastPushError||lastError||statusError;
  const friendlyError=googleCalendarErrorGuidance(activeError);
  const reconnectRequired=googleCalendarReconnectRequired(activeError);

  return(
    <div className="card" style={{padding:'14px 18px',marginTop:16}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:32,height:32,borderRadius:8,background:'rgba(66,133,244,.12)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="4" width="18" height="17" rx="2" stroke="#4285f4" strokeWidth="2"/>
              <path d="M3 9h18" stroke="#4285f4" strokeWidth="2"/>
              <path d="M8 2v4M16 2v4" stroke="#4285f4" strokeWidth="2" strokeLinecap="round"/>
            </svg>
          </div>
          <div>
            <div style={{fontWeight:700}}>Google Calendar</div>
            <div style={{fontSize:'.76rem',color:'#42536A'}}>
              {status==='connected'
                ? <span style={{color:(lastError||lastPushError)?'#991b1b':'#166534'}}>
                    {(lastError||lastPushError)
                      ?'⚠ Sünkroonimine vajab tähelepanu'
                      :writeEnabled
                        ?'✓ Ühendatud · KeeleSepp ↔ Google'
                        :'✓ Ühendatud · Google → KeeleSepp'}
                    {lastSync&&` · ${new Date(lastSync).toLocaleString('et-EE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}`}
                  </span>
                : status===null?'Kontrollin staatust…':'Kalender pole ühendatud'}
            </div>
          </div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {status==='disconnected'&&(
            <button onClick={connect} disabled={connecting} className="btn btn-pine btn-sm">
              {connecting?'Ühendan…':'Ühenda kalender'}
            </button>
          )}
          {status==='connected'&&(
            <>
              {(requiresWriteConsent||reconnectRequired)&&(
                <button onClick={connect} disabled={connecting} className="btn btn-amber btn-sm">
                  {connecting?'Ühendan…':reconnectRequired?'Ühenda uuesti':'Luba kahesuunaline sync'}
                </button>
              )}
              <button onClick={sync} disabled={syncing} className="btn btn-pine btn-sm">
                {syncing?'Sünkroonin…':activeError&&!reconnectRequired?'Proovi uuesti':'Sünkrooni'}
              </button>
              <button onClick={()=>setDetailsOpen(open=>!open)} className="btn btn-ghost btn-sm">
                {detailsOpen?'Peida':'Seaded'} <i className={`fa-solid fa-chevron-${detailsOpen?'up':'down'}`}/>
              </button>
            </>
          )}
        </div>
      </div>

      {status==='disconnected'&&friendlyError&&(
        <div style={{marginTop:10,padding:'9px 11px',borderRadius:10,background:'#fff7ed',color:'#9a3412',fontSize:'.76rem'}}>
          {friendlyError}
        </div>
      )}

      {status==='connected'&&detailsOpen&&(
        <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid rgba(28,43,58,.08)',display:'flex',justifyContent:'space-between',gap:12,alignItems:'center',flexWrap:'wrap'}}>
          <div style={{fontSize:'.78rem',color:'#42536A',maxWidth:760}}>
            {writeEnabled
              ?'KeeleSeppa lisatud, tõstetud ja tühistatud tunnid saadetakse Google Calendarisse ning Google’i muudatused tuuakse tagasi iga tund.'
              :'Praegu toimub turvaline import Google Calendarist KeeleSeppa iga tund. Kahesuunalise sünkroonimise jaoks kinnita üks kord uus sündmuste muutmise luba.'}
            {' '}Lisa välise sündmuse pealkirja õpilase nimi, näiteks „Tund — Hanna Skoryk“.
            Viimati imporditi {lastCount} ja jäeti seoseta {lastSkipped} sündmust vahele.
            {lastExceptions>0&&<> Neist {lastExceptions} olid Google’is muudetud või tühistatud sarja üksiktunnid.</>}
            {lastRemoved>0&&<> Google’ist eemaldatud sündmusi koristati kalendrist {lastRemoved}.</>}
            {lastCancelled>0&&<> Google’is kustutatud KeeleSepa tunde märgiti tühistatuks {lastCancelled}.</>}
            {lastPush&&<> Viimane saatmine Google’isse: {new Date(lastPush).toLocaleString('et-EE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}.</>}
            {friendlyError&&<div style={{marginTop:5,color:'#991b1b'}}>Vajab tegevust: {friendlyError}</div>}
          </div>
          <button onClick={disconnect} className="btn btn-ghost btn-sm" style={{color:'#dc2626'}}>
            Eemalda ühendus
          </button>
        </div>
      )}
    </div>
  );
}

        status,
        by:user.uid||'',
        byName:user.displayName||user.email||'',
        byRole:user.role||'',
        updatedAt:new Date().toISOString()
      };

      const lessons = (group.lessons||[]).map(lesson=>{
        if(lesson.id!==event.groupLessonId) return lesson;
        const nextAttendance = {...(lesson.attendance||{})};
        if(shouldClear) delete nextAttendance[attendanceKey];
        else nextAttendance[attendanceKey] = attendance;
        return {...lesson,attendance:nextAttendance};
      });
      await db.collection('groups').doc(group.id).update({lessons,updatedAt:new Date().toISOString()});
    }else{
      if(shouldClear){
        await db.collection('schedule').doc(event.id).update({
          [`attendance.${attendanceKey}`]: firebase.firestore.FieldValue.delete()
        });
      }else{
        await db.collection('schedule').doc(event.id).update({
          [`attendance.${attendanceKey}`]: attendance
        });
      }
