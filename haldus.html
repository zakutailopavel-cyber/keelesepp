  kirjutamine:{label:'Kirjutamine', icon:'✍️', color:'#A96E1A'},
  rääkimine:  {label:'Rääkimine',   icon:'🗣️', color:'#047857'},
  kuulamine:  {label:'Kuulamine',   icon:'🎧', color:'#be185d'},
  lauseehitus:{label:'Lauseehitus', icon:'🧩', color:'#dc2626'},
};
const SM_SKILLS = window.HaldusSkillCatalog || {};

function SkillMapWidget({student, isTeacher, user}) {
  const [skillMap, setSkillMap] = React.useState({});
  const [loading, setLoading] = React.useState(true);
  const [showAiGen, setShowAiGen] = React.useState(false);
  const level = student?.level || 'A2';
  const skills = SM_SKILLS[level] || SM_SKILLS.A2 || [];

  React.useEffect(()=>{
    if(!student?.id) return;
    // Read skillMap from the student document
    const unsub = db.collection('students').doc(student.id).onSnapshot(snap=>{
      setSkillMap(snap.data()?.skillMap || {});
      setLoading(false);
    }, ()=>setLoading(false));
    return unsub;
  },[student?.id]);

  const getStars = score => {
    if(score===null||score===undefined) return 0;
    if(score>=80) return 3; if(score>=50) return 2; if(score>=25) return 1; return 0;
  };
  const getStatus = score => {
    if(score===null||score===undefined) return 'untested';
    if(score>=80) return 'strong'; if(score>=50) return 'normal'; return 'weak';
  };
  const statusColor = {strong:'#166534', normal:'#1d4ed8', weak:'#dc2626', untested:'#B0A898'};

  // Radar chart
  const cats = Object.keys(SM_CATS);
  const N = cats.length;
  const CX=130,CY=130,R=95;
  const getPoint=(i,r)=>{
    const angle=(2*Math.PI*i/N)-Math.PI/2;
    return[CX+r*Math.cos(angle),CY+r*Math.sin(angle)];
  };
  const catScores={};
  cats.forEach(cat=>{
    const cs=skills.filter(s=>s.cat===cat);
    if(!cs.length){catScores[cat]=0;return;}
    const sc=cs.map(s=>skillMap[s.id]??0);
    catScores[cat]=sc.reduce((a,b)=>a+b,0)/sc.length;
  });
  const LEVEL_COLORS={A1:'#047857',A2:'#0e7490',B1:'#1d4ed8',B2:'#6d28d9',C1:'#be185d'};
  const lc=LEVEL_COLORS[level]||'#0e7490';
  const gridPaths=[25,50,75,100].map(gl=>{
    const pts=cats.map((_,i)=>getPoint(i,R*gl/100));
    return pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+'Z';
  });
  const dataPts=cats.map((cat,i)=>getPoint(i,R*(catScores[cat]||0)/100));
  const dataPath=dataPts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+'Z';

  const tested = skills.filter(s=>skillMap[s.id]!==undefined&&skillMap[s.id]!==null);
  const strong = skills.filter(s=>(skillMap[s.id]||0)>=80);
  const weak   = skills.filter(s=>skillMap[s.id]!==undefined&&skillMap[s.id]!==null&&skillMap[s.id]<50);

  if(loading) return null;

  const hasAnyData = tested.length > 0;

  return(
    <React.Fragment>
    <div style={{background:'linear-gradient(135deg,#1C2B3A 0%,'+lc+' 100%)',borderRadius:18,padding:24,color:'#fff',position:'relative'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}}>
        <div>
          <div style={{fontSize:'.68rem',fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'rgba(255,255,255,.45)',marginBottom:4}}>
            Oskuste kaart — {level}
          </div>
          <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:'1.6rem',fontWeight:800,color:strong.length?'#4ade80':'rgba(255,255,255,.3)'}}>{strong.length}</div>
              <div style={{fontSize:'.62rem',color:'rgba(255,255,255,.45)',textTransform:'uppercase',letterSpacing:'.07em'}}>💪 Tugevad</div>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:'1.6rem',fontWeight:800,color:weak.length?'#fca5a5':'rgba(255,255,255,.3)'}}>{weak.length}</div>
              <div style={{fontSize:'.62rem',color:'rgba(255,255,255,.45)',textTransform:'uppercase',letterSpacing:'.07em'}}>🎯 Arendada</div>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:'1.6rem',fontWeight:800,color:'rgba(255,255,255,.6)'}}>{tested.length}/{skills.length}</div>
              <div style={{fontSize:'.62rem',color:'rgba(255,255,255,.45)',textTransform:'uppercase',letterSpacing:'.07em'}}>📊 Testitud</div>
            </div>
          </div>
        </div>
        {isTeacher&&(
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button onClick={()=>window.open('/haldus-skillmap/?student='+student.id,'_blank')}
              style={{background:'rgba(255,255,255,.12)',border:'1px solid rgba(255,255,255,.2)',color:'#fff',
                borderRadius:9,padding:'7px 13px',cursor:'pointer',fontSize:'.76rem',fontWeight:700,
                display:'flex',alignItems:'center',gap:6}}>
              ✏️ Muuda hindeid
            </button>
            <button onClick={()=>setShowAiGen(true)}
              style={{background:'#C9882A',border:'1px solid rgba(255,255,255,.2)',color:'#fff',
                borderRadius:9,padding:'7px 13px',cursor:'pointer',fontSize:'.76rem',fontWeight:700,
                display:'flex',alignItems:'center',gap:6}}>
              🤖 Genereeri komplekt
            </button>
          </div>
        )}
      </div>

      {!hasAnyData?(
        <div style={{textAlign:'center',padding:'20px 0',color:'rgba(255,255,255,.35)',fontSize:'.84rem'}}>
          {isTeacher?'Ava "Muuda hindeid" et lisada oskuste tulemused':'Oskuste hinded lisab õpetaja'}
        </div>
      ):(
        <div style={{display:'flex',gap:20,alignItems:'flex-start',flexWrap:'wrap'}}>
          {/* Radar */}
          <div style={{flexShrink:0}}>
            <svg width={260} height={260} viewBox="0 0 260 260">
              {gridPaths.map((d,gi)=><path key={gi} d={d} fill="none" stroke="rgba(255,255,255,.08)" strokeWidth="1"/>)}
              {cats.map((_,i)=>{const[x,y]=getPoint(i,R);return<line key={i} x1={CX} y1={CY} x2={x.toFixed(1)} y2={y.toFixed(1)} stroke="rgba(255,255,255,.07)" strokeWidth="1"/>;})};
              <path d={dataPath} fill={lc} fillOpacity=".3" stroke={lc} strokeWidth="2.5"/>
              {cats.map((cat,i)=>{
                const[x,y]=getPoint(i,R+18);
                const c=SM_CATS[cat];
                const anchor=x<CX-8?'end':x>CX+8?'start':'middle';
                return(
                  <g key={cat}>
                    <text x={x} y={y} fontSize="11" textAnchor={anchor} fill="rgba(255,255,255,.7)" fontFamily="IBM Plex Sans">{c.icon}</text>
                    <text x={x} y={y+12} fontSize="7.5" textAnchor={anchor} fill="rgba(255,255,255,.4)" fontFamily="IBM Plex Sans">{c.label}</text>
                  </g>
                );
              })}
              {dataPts.map(([x,y],i)=><circle key={i} cx={x.toFixed(1)} cy={y.toFixed(1)} r="4" fill={lc} stroke="rgba(255,255,255,.6)" strokeWidth="2"/>)}
            </svg>
          </div>
          {/* Skills list */}
          <div style={{flex:1,minWidth:180,display:'flex',flexDirection:'column',gap:6}}>
            {skills.map(sk=>{
              const score=skillMap[sk.id]??null;
              const stars=getStars(score);
              const st=getStatus(score);
              const cat=SM_CATS[sk.cat];
              const barW=score??0;
              return(
                <div key={sk.id} style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:'.72rem',minWidth:16}}>{cat.icon}</span>
                  <span style={{fontSize:'.76rem',fontWeight:600,color:'rgba(255,255,255,.8)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{sk.name}</span>
                  <div style={{width:60,height:4,background:'rgba(255,255,255,.1)',borderRadius:2,flexShrink:0}}>
                    <div style={{width:barW+'%',height:'100%',borderRadius:2,background:statusColor[st]}}/>
                  </div>
                  <div style={{display:'flex',gap:1,flexShrink:0}}>
                    {[0,1,2].map(i=><span key={i} style={{fontSize:'.65rem',opacity:i<stars?1:.2}}>⭐</span>)}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Encouragement for student/parent */}
      {!isTeacher&&hasAnyData&&(
        <div style={{marginTop:14,display:'flex',gap:10,flexWrap:'wrap'}}>
          {strong.length>0&&(
            <div style={{flex:1,minWidth:140,padding:'10px 12px',background:'rgba(74,222,128,.1)',borderRadius:10,border:'1px solid rgba(74,222,128,.2)'}}>
              <div style={{fontSize:'.68rem',fontWeight:700,color:'#4ade80',marginBottom:5}}>💪 Tugevad oskused</div>
              {strong.slice(0,3).map(s=><div key={s.id} style={{fontSize:'.74rem',color:'rgba(255,255,255,.7)',marginBottom:2}}>✓ {s.name}</div>)}
            </div>
          )}
          {weak.length>0&&(
            <div style={{flex:1,minWidth:140,padding:'10px 12px',background:'rgba(251,146,60,.1)',borderRadius:10,border:'1px solid rgba(251,146,60,.2)'}}>
              <div style={{fontSize:'.68rem',fontWeight:700,color:'#fb923c',marginBottom:5}}>🎯 Harjuta rohkem</div>
              {weak.slice(0,3).map(s=><div key={s.id} style={{fontSize:'.74rem',color:'rgba(255,255,255,.7)',marginBottom:2}}>→ {s.name}</div>)}
            </div>
          )}
        </div>
      )}
    </div>
    {showAiGen&&<AIGeneratorModal student={student} skillMap={skillMap} level={level} skills={skills} user={user} onClose={()=>setShowAiGen(false)}/>}
    </React.Fragment>
  );
}

// ── ESMASE HINDAMISE KAART ────────────────────────────────────
function StudentInitialAssessment({student,user,canManage,notify}) {
  const core=window.InitialAssessmentCore;
  const [assessment,setAssessment]=React.useState(null);
  const [loading,setLoading]=React.useState(true);
  const [editing,setEditing]=React.useState(false);
  const [draft,setDraft]=React.useState(null);
  const [saving,setSaving]=React.useState(false);
  const [section,setSection]=React.useState('grammar');
  const [error,setError]=React.useState('');

  React.useEffect(()=>{
    if(!student?.id) return;
    setLoading(true); setError(''); setEditing(false); setDraft(null);
    return db.collection('studentInitialAssessments').doc(student.id).onSnapshot(doc=>{
      setAssessment(doc.exists?{id:doc.id,...doc.data()}:null);
      setLoading(false);
    },err=>{
      console.warn('initial assessment listener:',err);
      setError('Hindamise andmeid ei õnnestunud laadida.');
      setLoading(false);
    });
  },[student?.id]);

  const startCreate=()=>{
    setDraft(core.buildInitialAssessment(student,user));
    setEditing(true);
  };
  const startEdit=()=>{
    setDraft(core.normalizeAssessment(assessment,student,user,assessment?.updatedAt));
    setEditing(true);
  };
  const cancelEdit=()=>{setEditing(false);setDraft(null);setError('');};
  const saveAssessment=async()=>{
    setSaving(true); setError('');
    try{
      const payload=core.normalizeAssessment(draft,student,user);
      await db.collection('studentInitialAssessments').doc(student.id).set(payload,{merge:false});
      setEditing(false); setDraft(null);
      notify&&notify('✓ Esmane hindamine salvestatud');
    }catch(err){
      console.error('initial assessment save:',err);
      setError('Salvestamine ebaõnnestus. Kontrolli õigusi ja proovi uuesti.');
    }finally{setSaving(false);}
  };

  const current=editing?draft:assessment;
  const updateField=(key,value)=>setDraft(prev=>({...prev,[key]:value}));
  const updateRow=(key,index,field,value)=>setDraft(prev=>({
    ...prev,
    [key]:prev[key].map((row,i)=>i===index?{
      ...row,
      [field]:value,
      ...(field==='score'?{status:core.statusForScore(value)}:{})
    }:row)
  }));
  const addRow=(key)=>setDraft(prev=>({
    ...prev,
    [key]:[...prev[key],{id:`custom_${Date.now()}`,name:'Uus teema',score:null,status:'not_tested',priority:'medium',comment:''}]
  }));
  const removeRow=(key,index)=>setDraft(prev=>({...prev,[key]:prev[key].filter((_,i)=>i!==index)}));
  const listValue=key=>(draft?.[key]||[]).join('\n');
  const setListValue=(key,value)=>updateField(key,value.split('\n'));
  const statusMeta=value=>core.STATUSES[value]||core.STATUSES.not_tested;
  const inputStyle={width:'100%',padding:'9px 10px',border:'1px solid #d8dee7',borderRadius:9,background:'#fff',font:'inherit',color:'#1C2B3A'};

  const AssessmentRows=({dataKey,allowPriority=true})=>{
    const rows=current?.[dataKey]||[];
    return <div style={{display:'grid',gap:10,overflowX:'auto',paddingBottom:4}}>
      {rows.map((row,index)=>{
        const meta=statusMeta(row.status);
        return <div key={row.id||index} style={{display:'grid',gridTemplateColumns:'minmax(180px,1.5fr) 92px minmax(150px,1fr) minmax(130px,1fr) minmax(180px,1.4fr) auto',gap:10,alignItems:'center',padding:12,border:'1px solid rgba(28,43,58,.08)',borderRadius:12,background:'#fff',minWidth:allowPriority?930:780}}>
          {editing
            ?<input value={row.name||''} onChange={e=>updateRow(dataKey,index,'name',e.target.value)} style={inputStyle} aria-label="Teema nimi"/>
            :<strong style={{fontSize:'.86rem'}}>{row.name}</strong>}
          {editing
            ?<input type="number" min="0" max="100" placeholder="—" value={row.score===null||typeof row.score==='undefined'?'':row.score} onChange={e=>updateRow(dataKey,index,'score',e.target.value===''?null:e.target.value)} style={inputStyle} aria-label={`${row.name} tulemus`}/>
            :<span style={{fontWeight:800,color:row.score===null||typeof row.score==='undefined'?'#94a3b8':'#1C2B3A'}}>{row.score===null||typeof row.score==='undefined'?'—':`${row.score}%`}</span>}
          {editing
            ?<select value={row.status||'not_tested'} onChange={e=>updateRow(dataKey,index,'status',e.target.value)} style={inputStyle}>{Object.entries(core.STATUSES).map(([key,item])=><option key={key} value={key}>{item.label}</option>)}</select>
            :<span className="badge" style={{background:meta.bg,color:meta.color,justifySelf:'start'}}>{meta.label}</span>}
          {allowPriority&&(editing
            ?<select value={row.priority||'medium'} onChange={e=>updateRow(dataKey,index,'priority',e.target.value)} style={inputStyle}>{Object.entries(core.PRIORITIES).map(([key,item])=><option key={key} value={key}>{item.label}</option>)}</select>
            :<span style={{fontSize:'.78rem',color:'#42536A'}}>{core.PRIORITIES[row.priority]?.label||'—'}</span>)}
          {!allowPriority&&<span/>}
          {editing
            ?<input value={row.comment||''} onChange={e=>updateRow(dataKey,index,'comment',e.target.value)} placeholder="Kommentaar" style={inputStyle}/>
            :<span style={{fontSize:'.8rem',color:'#42536A'}}>{row.comment||'Kommentaar puudub'}</span>}
          {editing&&<button type="button" onClick={()=>removeRow(dataKey,index)} className="btn btn-red btn-sm" title="Kustuta teema"><i className="fa-solid fa-trash"/></button>}
        </div>;
      })}
      {editing&&<button type="button" onClick={()=>addRow(dataKey)} className="btn btn-ghost btn-sm" style={{justifySelf:'start'}}><i className="fa-solid fa-plus"/> Lisa teema</button>}
    </div>;
  };

  if(loading) return <div className="card" style={{padding:32,textAlign:'center',color:'#42536A'}}>Laadin esmast hindamist…</div>;
  if(!assessment&&!editing) return <div className="card" style={{padding:36,textAlign:'center'}}>
    <div style={{width:54,height:54,borderRadius:16,background:'#E8F3EE',color:'#2F5D50',display:'grid',placeItems:'center',margin:'0 auto 14px',fontSize:'1.3rem'}}><i className="fa-solid fa-clipboard-check"/></div>
    <h3 style={{marginBottom:7}}>Esmast hindamist ei ole veel tehtud</h3>
    <p style={{color:'#42536A',fontSize:'.88rem',maxWidth:520,margin:'0 auto 18px'}}>Lisa õppija lähtetase, sihttase, oskuste tulemused ja järgmise õppeperioodi fookus.</p>
    {canManage&&<button onClick={startCreate} className="btn btn-pine"><i className="fa-solid fa-plus"/> Loo hindamine</button>}
    {error&&<div style={{color:'#b42318',marginTop:14}}>{error}</div>}
  </div>;

  const overall=statusMeta(current?.overallStatus);
  return <div style={{display:'grid',gap:16}}>
    <div className="card" style={{padding:24}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:14,flexWrap:'wrap',alignItems:'flex-start'}}>
        <div><div style={{fontSize:'.72rem',fontWeight:800,color:'#2F5D50',textTransform:'uppercase',letterSpacing:'.08em'}}>Õppija lähtepunkt</div><h3 style={{fontSize:'1.3rem',marginTop:4}}>Esmane hindamine</h3></div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {!editing&&canManage&&<button onClick={startEdit} className="btn btn-dark btn-sm"><i className="fa-solid fa-pen"/> Muuda</button>}
          {editing&&<><button onClick={cancelEdit} disabled={saving} className="btn btn-ghost btn-sm">Tühista</button><button onClick={saveAssessment} disabled={saving} className="btn btn-pine btn-sm"><i className="fa-solid fa-floppy-disk"/> {saving?'Salvestan…':'Salvesta'}</button></>}
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12,marginTop:20}}>
        {[['assessmentDate','Hindamise kuupäev','date'],['currentLevel','Praegune tase','text'],['targetLevel','Sihttase','text']].map(([key,label,type])=><label key={key} style={{padding:14,background:'#f8fafc',borderRadius:12,fontSize:'.78rem',color:'#42536A'}}>{label}{editing?<input type={type} value={current?.[key]||''} onChange={e=>updateField(key,e.target.value)} style={{...inputStyle,marginTop:7}}/>:<strong style={{display:'block',color:'#1C2B3A',fontSize:'1rem',marginTop:5}}>{current?.[key]||'Määramata'}</strong>}</label>)}
        <label style={{padding:14,background:overall.bg,borderRadius:12,fontSize:'.78rem',color:overall.color}}>Üldseis{editing?<select value={current?.overallStatus||'needs_work'} onChange={e=>updateField('overallStatus',e.target.value)} style={{...inputStyle,marginTop:7}}>{Object.entries(core.STATUSES).filter(([key])=>key!=='not_tested').map(([key,item])=><option key={key} value={key}>{item.label}</option>)}</select>:<strong style={{display:'block',fontSize:'1rem',marginTop:5}}>{overall.label}</strong>}</label>
      </div>
      {error&&<div style={{color:'#b42318',marginTop:14}}>{error}</div>}
    </div>

    <div className="card" style={{padding:20}}>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>{[['grammar','Grammatika'],['vocabulary','Sõnavara'],['skills','Keeleoskused']].map(([key,label])=><button key={key} onClick={()=>setSection(key)} className={`btn btn-sm ${section===key?'btn-dark':'btn-ghost'}`}>{label}</button>)}</div>
      <div style={{fontSize:'.74rem',color:'#64748b',marginBottom:12}}>Tulemus 0% tähendab kontrollitud, kuid lahendamata ülesannet. Kriips tähendab, et teemat ei ole hinnatud.</div>
      {section==='grammar'&&<AssessmentRows dataKey="grammarData"/>}
      {section==='vocabulary'&&<AssessmentRows dataKey="vocabularyData"/>}
      {section==='skills'&&<AssessmentRows dataKey="skillsData" allowPriority={false}/>}
    </div>

    <div className="card" style={{padding:24,display:'grid',gap:18}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:16}}>
        {[['strengths','Tugevused'],['developmentAreas','Arengukohad']].map(([key,label])=><div key={key}><h4 style={{marginBottom:9}}>{label}</h4>{editing?<textarea rows="6" value={listValue(key)} onChange={e=>setListValue(key,e.target.value)} placeholder="Üks punkt igale reale" style={{...inputStyle,resize:'vertical'}}/>:<ul style={{margin:0,paddingLeft:20,color:'#42536A'}}>{(current?.[key]||[]).length?(current[key].map((item,i)=><li key={i} style={{marginBottom:6}}>{item}</li>)):<li>Andmed puuduvad</li>}</ul>}</div>)}
      </div>
      <div><h4 style={{marginBottom:9}}>Õppefookus</h4>{editing?<textarea rows="5" value={current?.learningFocus||''} onChange={e=>updateField('learningFocus',e.target.value)} style={{...inputStyle,resize:'vertical'}}/>:<p style={{margin:0,color:'#42536A',whiteSpace:'pre-wrap'}}>{current?.learningFocus||'Õppefookus ei ole veel määratud.'}</p>}</div>
    </div>
  </div>;
}

                  <select value={schTeach} onChange={e=>setSchTeach(e.target.value)}>

          <div style={{maxHeight:320,overflowY:'auto',display:'flex',flexDirection:'column',gap:12}} className="scroll">
            {stuLessons.length===0&&<p style={{color:'#42536A',fontSize:'.85rem',textAlign:'center',padding:'16px 0'}}>Tunnid puuduvad. 🎓</p>}
            {[...stuLessons].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(l=>{
              const bmap={Toimunud:{bg:'#dcfce7',c:'#166534',t:'✓ Toimunud'},Puudus_p:{bg:'#dbeafe',c:'#1e40af',t:'Puudus (põhj.)'},Puudus_eta:{bg:'#fee2e2',c:'#991b1b',t:'Puudus'}};
              const b=bmap[l.status]||bmap.Toimunud;
              const billingMeta=lessonBillingStatusMeta(l);
              return(
                <div key={l.id} style={{display:'flex',gap:12,paddingBottom:12,borderBottom:'1px solid rgba(28,43,58,.06)'}}>
                  <div style={{width:38,height:38,borderRadius:10,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',
                    fontWeight:700,background:l.status==='Toimunud'?'rgba(201,136,42,.1)':'rgba(239,68,68,.08)',color:l.status==='Toimunud'?'#C9882A':'#dc2626'}}>

                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',justifyContent:'space-between',gap:6,marginBottom:3}}>

                      <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>

                        {canManage&&<button onClick={()=>(l.invoiceId||l.billingStatus||l.packageConsumptionStatus==='consumed')?notify('⚠ Finants- või paketiliikumisega tundi ei saa kustutada'):deleteLesson(l)}

      {canManage&&(

              </div>
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <span className="badge" style={{background:unpaidStudentAmount?'#fee2e2':'#dcfce7',color:unpaidStudentAmount?'#991b1b':'#166534'}}>

              {invoiceDraft.hasAuto&&(
                <span className="badge" style={{background:'#dbeafe',color:'#1d4ed8'}}>

          </div>

          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:14,alignItems:'stretch',marginBottom:16}}>

              <div>
                <div style={{fontSize:'.74rem',fontWeight:800,color:'#42536A',textTransform:'uppercase'}}>Arve mustand</div>
                <div style={{fontSize:'2rem',fontWeight:800,color:'#2F5D50',marginTop:6}}>{invoiceDraft.amount?money(invoiceDraft.amount)+'€':'—'}</div>

              </div>
              <div style={{fontSize:'.76rem',color:'#42536A'}}>
                {invoiceDraft.hasAuto
                  ? invoiceDraft.lessonPrice>0
                    ? `${invoiceDraft.lessons} arveldamata tundi x ${money(invoiceDraft.lessonPrice)}€`

            </div>
            <div style={{padding:16,borderRadius:14,background:'#F9F8F6',border:'1px solid rgba(28,43,58,.07)',display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10,alignContent:'center'}}>
              <input type="number" value={invAmt} onChange={e=>setInvAmt(e.target.value)}
                placeholder={invoiceDraft.hasAuto?`Automaatne ${money(invoiceDraft.autoAmount)}€`:'Summa (€) *'}/>
              <input value={invDesc} onChange={e=>setInvDesc(e.target.value)}
                placeholder={invoiceDraft.hasAuto?invoiceDraft.desc:'Kirjeldus'}/>
              <input value={invRef} onChange={e=>setInvRef(e.target.value)}
                placeholder="Makse selgitus (vaikimisi arve nr)"/>
              <input type="date" value={invDue||invoiceDueDate()} onChange={e=>setInvDue(e.target.value)}
                title="Maksetähtaeg"/>
              <button onClick={()=>addInvoice(currentStu.id)} className="btn btn-pine" style={{justifyContent:'center'}}>
                <i className="fa-solid fa-file-circle-plus"/> Genereeri arve
              </button>
            </div>
          </div>

          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:12}}>
            {stuInv.length===0&&(
              <div style={{color:'#42536A',fontSize:'.85rem',textAlign:'center',padding:'18px 0',gridColumn:'1/-1'}}>
                Arveid pole.
              </div>
            )}
            {[...stuInv].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(inv=>{
              const mailMeta = invoiceMailStatusMeta(inv);
              const financial = invoiceFinancialSummary(inv);
              return (
              <div key={inv.id} style={{padding:16,background:'#fff',borderRadius:14,border:'1px solid rgba(28,43,58,.08)',boxShadow:'0 2px 8px rgba(28,43,58,.04)',display:'flex',flexDirection:'column',gap:12}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12}}>
                  <div>
                    <div style={{fontSize:'.76rem',fontWeight:800,color:'#42536A',textTransform:'uppercase'}}>Arve {inv.num}</div>
                    <div style={{fontWeight:700,fontSize:'.96rem',marginTop:4}}>{inv.desc||'Keeletunnid'}</div>
                    <div style={{fontSize:'.78rem',color:'#42536A',marginTop:3}}>
                      {fmtDate(inv.date)} · tähtaeg {fmtDate(inv.due)}
                    </div>
                    <div style={{fontSize:'.78rem',color:'#42536A',marginTop:3}}>
                      Selgitus: <strong style={{color:'#1C2B3A'}}>{inv.paymentReference||inv.num}</strong>
                    </div>
                  </div>
                  <div style={{fontWeight:800,fontSize:'1.35rem',color:'#1C2B3A',whiteSpace:'nowrap'}}>
                    {financial.credited>0&&<><s style={{color:'#94a3b8',fontSize:'.85rem'}}>{money(financial.originalAmount)}€</s>{' → '}</>}
                    {money(financial.amount)}€
                  </div>
                </div>
                <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
                  {inv.status==='Krediteeritud'
                    ?<span className="badge" style={{background:'#ede9fe',color:'#6d28d9'}}>Krediteeritud</span>
                    :inv.status==='Makstud'
                    ?<span className="badge" style={{background:'#dcfce7',color:'#166534'}}>✓ Makstud</span>
                    :<span className="badge" style={{background:'#fef3c7',color:'#92400e'}}>Ootel</span>}
                  {inv.parentPaymentStatus==='submitted'&&inv.status!=='Makstud'&&<span className="badge" style={{background:'#dbeafe',color:'#1d4ed8'}}>Maksest teavitatud</span>}
                  {inv.parentPaymentStatus==='submitted'&&inv.status!=='Makstud'&&(
                    <span className="badge" style={{background:'#eef2ff',color:'#4338ca'}}>
                      {PAYMENT_METHODS.find(method=>method.id===(inv.parentPaymentMethod||'bank'))?.label || 'Pangaülekanne'}
                    </span>
                  )}
                  {mailMeta&&(
                    <span className="badge" style={{background:mailMeta.bg,color:mailMeta.color}}>
                      <i className="fa-solid fa-envelope" style={{marginRight:4}}/> {mailMeta.text}
                    </span>
                  )}
                </div>
                {inv.parentPaymentStatus==='submitted'&&inv.status!=='Makstud'&&(
                  <div style={{padding:'9px 11px',borderRadius:10,background:'#eff6ff',color:'#1d4ed8',fontSize:'.78rem'}}>
                    Vanem teavitas maksest {fmtDate(inv.parentPaymentSubmittedAt)}.
                  </div>
                )}
                <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginTop:'auto'}}>
                  {inv.status==='Ootel'&&<button onClick={()=>markPaid(inv.id)} className="btn btn-pine btn-sm">Märgi makstud</button>}
                  {inv.status==='Makstud'&&<button onClick={()=>unmarkPaid(inv.id)} className="btn btn-red btn-sm">Tühista makse</button>}
                  {inv.parentPaymentStatus==='submitted'&&inv.status!=='Makstud'&&<button onClick={()=>resetParentPayment(inv.id)} className="btn btn-ghost btn-sm">Lähtesta teavitus</button>}
                  <button onClick={()=>updateInvoiceReference(inv)} className="btn btn-ghost btn-sm">Muuda selgitust</button>
                  {updateInvoiceDue&&<button onClick={()=>updateInvoiceDue(inv)} className="btn btn-ghost btn-sm">Muuda tähtaega</button>}
                  {sendInvoiceEmail&&(
                    <button onClick={()=>sendInvoiceEmail(inv)} className="btn btn-ghost btn-sm"
                      disabled={invoiceEmailBusy===`invoice:${inv.id}`}
                      style={{opacity:invoiceEmailBusy===`invoice:${inv.id}` ? .65 : 1}}>
                      <i className="fa-solid fa-envelope"/> {invoiceEmailBusy===`invoice:${inv.id}`?'Saadan...':'Saada e-post'}
                    </button>
                  )}
                  {sendInvoiceReminder&&inv.status!=='Makstud'&&(
                    <button onClick={()=>sendInvoiceReminder(inv)} className="btn btn-ghost btn-sm"
                      disabled={invoiceEmailBusy===`reminder:${inv.id}`}
                      style={{opacity:invoiceEmailBusy===`reminder:${inv.id}` ? .65 : 1}}>
                      <i className="fa-solid fa-bell"/> {invoiceEmailBusy===`reminder:${inv.id}`?'Saadan...':'Meeldetuletus'}
                    </button>
                  )}
                  <button onClick={()=>printInvoice(inv)} className="btn btn-ghost btn-sm"><i className="fa-solid fa-print"/> Arve vaade</button>
                  <button onClick={()=>deleteInvoice(inv)} className="btn btn-red btn-sm">Kustuta</button>
                </div>
              </div>
              );
            })}
          </div>
        </div>
      )}
      </React.Fragment>}
    </div>
  );
}

// ── ARVED VANEMA / ÕPILASE VAATES ────────────────────────────
function ParentInvoicesView({invoices,printInvoice,submitParentPayment}) {
  const [paymentChoices,setPaymentChoices] = React.useState({});
  const [copiedPaymentKey,setCopiedPaymentKey] = React.useState('');
  const pending = invoices.filter(inv=>inv.status==='Ootel');
  const paid = invoices.filter(inv=>inv.status==='Makstud');
  const pendingTotal = pending.reduce((sum,inv)=>sum+invoiceFinancialSummary(inv).balance,0);
  const copyPaymentValue = async(key,value)=>{
    const ok = await copyText(value);
    if(ok){
      setCopiedPaymentKey(key);
      setTimeout(()=>setCopiedPaymentKey(''),1600);
    }
  };

  return (
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:24}}>
      <div>
	        <h1 style={{fontSize:'1.7rem'}}>Arved</h1>
	        <div style={{color:'#42536A',fontSize:'.88rem',marginTop:4}}>
	          Siin on pere arved, makseinfo ja makseteavitused.
	        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:12}}>
        <div className="card" style={{padding:20}}>
          <div style={{fontSize:'.74rem',fontWeight:800,color:'#42536A',letterSpacing:'.08em',textTransform:'uppercase'}}>Ootel</div>
          <div style={{fontSize:'1.8rem',fontWeight:800,color:pending.length?'#991b1b':'#2F5D50',marginTop:8}}>{pendingTotal}€</div>
        </div>
        <div className="card" style={{padding:20}}>
          <div style={{fontSize:'.74rem',fontWeight:800,color:'#42536A',letterSpacing:'.08em',textTransform:'uppercase'}}>Arveid kokku</div>
          <div style={{fontSize:'1.8rem',fontWeight:800,color:'#1C2B3A',marginTop:8}}>{invoices.length}</div>
        </div>
        <div className="card" style={{padding:20}}>
          <div style={{fontSize:'.74rem',fontWeight:800,color:'#42536A',letterSpacing:'.08em',textTransform:'uppercase'}}>Makstud</div>
          <div style={{fontSize:'1.8rem',fontWeight:800,color:'#2F5D50',marginTop:8}}>{paid.length}</div>
        </div>
      </div>

      <div className="card" style={{padding:24}}>
        {invoices.length===0&&(
          <div style={{textAlign:'center',padding:'32px 12px',color:'#42536A'}}>
            Arveid pole.
          </div>
        )}
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {[...invoices].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(inv=>{
            const financial=invoiceFinancialSummary(inv);
            return (
            <div key={inv.id} style={{padding:16,borderRadius:14,background:'#F9F8F6',border:'1px solid rgba(28,43,58,.07)',display:'flex',flexDirection:'column',gap:12}}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
                <div>
                  <div style={{fontWeight:800,fontSize:'1rem'}}>{inv.num}</div>
                  <div style={{fontSize:'.82rem',color:'#42536A',marginTop:3}}>
                    {invoicePartyTypeLabel(inv)}: {invoicePartyLabel(inv)} · {inv.desc} · Tähtaeg: {fmtDate(inv.due)}
                  </div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                  <strong>
                    {financial.credited>0&&<><s style={{color:'#94a3b8',fontWeight:500}}>{money(financial.originalAmount)}€</s>{' → '}</>}
                    {money(financial.amount)}€
                  </strong>
                  {inv.status==='Krediteeritud'
                    ? <span className="badge" style={{background:'#ede9fe',color:'#6d28d9'}}>Krediteeritud</span>
                    : inv.status==='Makstud'
                    ? <span className="badge" style={{background:'#dcfce7',color:'#166534'}}>✓ Makstud</span>
                    : <span className="badge" style={{background:'#fef3c7',color:'#92400e'}}>Ootel</span>}
                  {inv.parentPaymentStatus==='submitted'&&inv.status!=='Makstud'&&(
                    <span className="badge" style={{background:'#dbeafe',color:'#1d4ed8'}}>Maksest teavitatud</span>
                  )}
                </div>
              </div>

              {inv.status==='Ootel'&&(
                <div style={{padding:14,borderRadius:12,background:'#fff',border:'1px solid rgba(28,43,58,.08)',display:'flex',flexDirection:'column',gap:10}}>
                  <div style={{fontSize:'.78rem',fontWeight:800,color:'#42536A',textTransform:'uppercase',letterSpacing:'.08em'}}>Maksmise info</div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:'8px 10px',alignItems:'center'}}>
                    <div style={{fontSize:'.82rem',color:'#42536A'}}>Saaja: <strong style={{color:'#1C2B3A'}}>{PAYMENT_DETAILS.company}</strong></div><div/>
                    <div style={{fontSize:'.82rem',color:'#42536A'}}>IBAN: <strong style={{color:'#1C2B3A'}}>{PAYMENT_DETAILS.iban}</strong></div>
                    <button onClick={()=>copyPaymentValue(`iban-${inv.id}`,PAYMENT_DETAILS.iban)} className="btn btn-ghost btn-sm">{copiedPaymentKey===`iban-${inv.id}`?'Kopeeritud':'Kopeeri'}</button>
                    <div style={{fontSize:'.82rem',color:'#42536A'}}>Selgitus: <strong style={{color:'#1C2B3A'}}>{inv.paymentReference||inv.num}</strong></div>
                    <button onClick={()=>copyPaymentValue(`ref-${inv.id}`,inv.paymentReference||inv.num)} className="btn btn-ghost btn-sm">{copiedPaymentKey===`ref-${inv.id}`?'Kopeeritud':'Kopeeri'}</button>
                    <div style={{fontSize:'.82rem',color:'#42536A'}}>Tasuda: <strong style={{color:'#1C2B3A'}}>{money(financial.balance)} €</strong></div>
                    <button onClick={()=>copyPaymentValue(`sum-${inv.id}`,String(financial.balance))} className="btn btn-ghost btn-sm">{copiedPaymentKey===`sum-${inv.id}`?'Kopeeritud':'Kopeeri'}</button>
                  </div>
                  <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                    <select value={paymentChoices[inv.id]||inv.parentPaymentMethod||'bank'} onChange={e=>setPaymentChoices(prev=>({...prev,[inv.id]:e.target.value}))} style={{maxWidth:220}}>
                      {PAYMENT_METHODS.map(method=><option key={method.id} value={method.id}>{method.label}</option>)}
                    </select>
                    {inv.parentPaymentStatus==='submitted'
                      ? <span style={{fontSize:'.82rem',color:'#166534',fontWeight:700}}>✓ Maksest on teavitatud {fmtDate(inv.parentPaymentSubmittedAt)}</span>
                      : <button onClick={()=>submitParentPayment(inv.id,paymentChoices[inv.id]||inv.parentPaymentMethod||'bank')} className="btn btn-pine btn-sm">Teavita maksest</button>}
                  </div>
                </div>
              )}

              <div>
                <button onClick={()=>printInvoice(inv)} className="btn btn-ghost btn-sm"><i className="fa-solid fa-print"/> Arve vaade</button>
              </div>
            </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── ARVED ÜLDVAADE ────────────────────────────────────────────
function PaymentLineAllocationModal({invoice,payment,currentAllocation,allocationHistory=[],suggestedLines=[],onSave,onClose}) {
  const correctedIds=new Set((invoice.correctedLessonIds||[]).map(String));
  const lines=(Array.isArray(invoice.lines)?invoice.lines:[])
    .map((line,index)=>({...line,index,lessonId:String(line.lessonId||'')}))
    .filter(line=>line.lessonId&&!correctedIds.has(line.lessonId));
  const paymentNet=paymentFinancialSummary(payment).net;
  const initialAmounts=React.useMemo(()=>{
    if(suggestedLines.length){
      return Object.fromEntries(suggestedLines.map(line=>[
        String(line.lessonId),
        money(Number(line.allocatedAmountCents||0)/100)
      ]));
    }
    if(currentAllocation){
      return Object.fromEntries((currentAllocation.lines||[]).map(line=>[
        String(line.lessonId),
        money(Number(line.allocatedAmountCents||0)/100)
      ]));
    }
    let remaining=Math.round(paymentNet*100);
    return Object.fromEntries(lines.map(line=>{
      const lineCents=Number.isInteger(Number(line.amountCents))
        ?Number(line.amountCents)
        :Math.round((Number(line.amount)||0)*100);
      const allocated=Math.min(Math.max(0,lineCents),remaining);
      remaining-=allocated;
      return [line.lessonId,allocated>0?money(allocated/100):''];
    }));
  },[payment.id,currentAllocation?.id,suggestedLines]);
  const [amounts,setAmounts]=React.useState(initialAmounts);
  const [effectiveDate,setEffectiveDate]=React.useState(today());
  const [reason,setReason]=React.useState('');
  const [saving,setSaving]=React.useState(false);
  const total=Object.values(amounts).reduce((sum,value)=>{
    const amount=Number(String(value||'').replace(',','.'));
    return sum+(Number.isFinite(amount)&&amount>0?amount:0);
  },0);
  const remaining=Math.max(0,paymentNet-total);
  const invalid=total<=0||total>paymentNet+.001||(currentAllocation&&!reason.trim());
  const submit=async()=>{
    if(invalid||saving) return;
    setSaving(true);
    const saved=await onSave(payment,{
      allocations:lines.map(line=>({
        lessonId:line.lessonId,
        amount:Number(String(amounts[line.lessonId]||'').replace(',','.'))
      })).filter(item=>Number.isFinite(item.amount)&&item.amount>0),
      effectiveDate,
      reason:reason.trim()
    });
    setSaving(false);
    if(saved) onClose();
  };
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(28,43,58,.65)',display:'flex',alignItems:'flex-start',justifyContent:'center',padding:16,zIndex:340,backdropFilter:'blur(6px)',overflowY:'auto'}}>
      <div className="card" style={{width:'min(720px,100%)',marginTop:30,padding:0,overflow:'hidden'}}>
        <div style={{padding:'18px 20px',background:'#1C2B3A',color:'#fff',display:'flex',justifyContent:'space-between',gap:16}}>
          <div>
            <div style={{fontSize:'.7rem',textTransform:'uppercase',letterSpacing:'.08em',opacity:.65}}>
              {currentAllocation?`Täpse jaotuse parandus · versioon ${Number(currentAllocation.version||0)+1}`:'Täpne maksejaotus'}
            </div>
            <h2 style={{fontSize:'1.25rem',marginTop:4}}>{invoice.num||invoice.id} · {money(paymentNet)} €</h2>
          </div>
          <button onClick={onClose} className="btn btn-ghost btn-sm" style={{background:'#fff'}}>Sulge</button>
        </div>
        <div style={{padding:20}}>
          <div style={{fontSize:'.78rem',color:'#42536A',lineHeight:1.55,marginBottom:14}}>
            Määra, milliseid arve tunniridu see makse katab. Salvestatud versiooni ei muudeta:
            parandamisel luuakse uus kuupäeva, põhjuse ja auditiga versioon.
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {lines.map(line=>{
              const lineAmount=Number.isInteger(Number(line.amountCents))
                ?Number(line.amountCents)/100
                :Number(line.amount)||0;
              return(
                <div key={line.lessonId} style={{display:'grid',gridTemplateColumns:'minmax(0,1fr) 130px',gap:12,alignItems:'center',padding:'10px 12px',border:'1px solid rgba(28,43,58,.09)',borderRadius:10}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:'.82rem'}}>{fmtDate(line.date)} · {line.description||`Tund ${line.index+1}`}</div>
                    <div style={{fontSize:'.7rem',color:'#64748b',marginTop:3}}>Rea summa {money(lineAmount)} € · ID {line.lessonId}</div>
                  </div>
                  <div style={{position:'relative'}}>
                    <input type="number" min="0" max={lineAmount} step="0.01"
                      value={amounts[line.lessonId]||''}
                      onChange={event=>setAmounts({...amounts,[line.lessonId]:event.target.value})}
                      aria-label={`Jaotus tunnile ${line.lessonId}`}/>
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12,marginTop:16}}>
            <div>
              <div style={{fontSize:'.7rem',fontWeight:800,color:'#42536A',marginBottom:5}}>Kande kuupäev</div>
              <input type="date" min={String(payment.paidAt||'').slice(0,10)} value={effectiveDate} onChange={event=>setEffectiveDate(event.target.value)}/>
            </div>
            <div>
              <div style={{fontSize:'.7rem',fontWeight:800,color:'#42536A',marginBottom:5}}>
                Põhjus {currentAllocation?'(kohustuslik)':'(valikuline)'}
              </div>
              <input value={reason} onChange={event=>setReason(event.target.value)}
                placeholder={currentAllocation?'Miks jaotust parandatakse?':'Esmane täpne jaotus'}/>
            </div>
          </div>
          <div style={{marginTop:16,padding:14,borderRadius:12,background:remaining>.001?'#fffbeb':'#ecfdf5',display:'flex',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
            <span>Jaotatud <strong>{money(total)} €</strong> / makse {money(paymentNet)} €</span>
            <span style={{color:remaining>.001?'#92400e':'#166534'}}>Jaotamata <strong>{money(remaining)} €</strong></span>
          </div>
          {remaining>.001&&<div style={{fontSize:'.72rem',color:'#92400e',marginTop:7}}>Jaotamata osa jääb kuu kontrollis tähelepanu nõudvaks kirjeks.</div>}
          {allocationHistory.length>0&&(
            <div style={{marginTop:18,paddingTop:16,borderTop:'1px solid rgba(28,43,58,.1)'}}>
              <div style={{fontSize:'.72rem',fontWeight:800,textTransform:'uppercase',letterSpacing:'.07em',color:'#42536A'}}>
                Muutmatu versiooniajalugu · {allocationHistory.length}
              </div>
              <div style={{display:'grid',gap:8,marginTop:9}}>
                {allocationHistory.slice().sort((a,b)=>Number(b.version||0)-Number(a.version||0)).map(version=>(
                  <div key={version.id} style={{padding:'10px 12px',borderRadius:10,background:version.id===currentAllocation?.id?'#ecfdf5':'#F9F8F6',border:'1px solid rgba(28,43,58,.08)'}}>
                    <div style={{display:'flex',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
                      <strong style={{fontSize:'.78rem'}}>Versioon {version.version} · {fmtDate(version.effectiveDate)}</strong>
                      <span style={{fontSize:'.7rem',color:version.id===currentAllocation?.id?'#166534':'#64748b'}}>
                        {version.id===currentAllocation?.id?'Aktiivne · ':''}
                        {money(Number(version.allocatedAmountCents||0)/100)} € jaotatud
                      </span>
                    </div>
                    <div style={{fontSize:'.7rem',color:'#42536A',marginTop:4}}>{version.reason||'Põhjus puudub'}</div>
                    <div style={{fontSize:'.66rem',color:'#64748b',marginTop:5}}>
                      {(version.lines||[]).map(line=>`${fmtDate(line.lessonDate)} · ${money(Number(line.allocatedAmountCents||0)/100)} €`).join(' · ')||'Tunniridu pole'}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:18}}>
            <button onClick={onClose} className="btn btn-ghost">Loobu</button>
            <button onClick={submit} disabled={invalid||saving} className="btn btn-pine" style={{opacity:(invalid||saving)?0.55:1}}>
              {saving?'Salvestan…':currentAllocation?'Loo parandusversioon':'Salvesta täpne jaotus'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

const EXPENSE_CATEGORY_LABELS={
  rent:'Rent',advertising:'Reklaam',software:'Tarkvara',learning_materials:'Õppematerjalid',
  bank_fees:'Pangatasud',taxes:'Maksud',office:'Kontor',travel:'Sõidukulud',other:'Muu'
};

function ExpensesView({expenses=[],notify}) {
  const [month,setMonth]=React.useState(()=>today().slice(0,7));
  const [search,setSearch]=React.useState('');
  const [categoryFilter,setCategoryFilter]=React.useState('all');
  const [statusFilter,setStatusFilter]=React.useState('all');
  const [form,setForm]=React.useState({expenseDate:today(),category:'learning_materials',description:'',amount:'',vatRate:'0',paymentMethod:'bank',note:''});
  const [busy,setBusy]=React.useState('');
  const rows=React.useMemo(()=>(expenses||[])
    .filter(expense=>String(expense.expenseDate||'').slice(0,7)===month)
    .sort((a,b)=>String(b.expenseDate||'').localeCompare(String(a.expenseDate||''))),[expenses,month]);
  const visibleRows=React.useMemo(()=>{
    const query=normalizeText(search);
    return rows.filter(expense=>{
      if(categoryFilter!=='all'&&expense.category!==categoryFilter) return false;
      if(statusFilter!=='all'&&expense.status!==statusFilter) return false;
      return !query||normalizeText(`${expense.description||''} ${expense.note||''} ${EXPENSE_CATEGORY_LABELS[expense.category]||expense.category||''} ${(expense.documents||[]).map(document=>document.fileName||'').join(' ')}`).includes(query);
    });
  },[rows,search,categoryFilter,statusFilter]);
  const activeRows=visibleRows.filter(expense=>expense.status==='active');
  const totals=activeRows.reduce((sum,expense)=>({
    gross:sum.gross+(Number(expense.amountCents)||0),
    vat:sum.vat+(Number(expense.vatAmountCents)||0),
    net:sum.net+(Number(expense.netAmountCents)||0)
  }),{gross:0,vat:0,net:0});
  const cents=value=>`${(Number(value||0)/100).toFixed(2)} €`;
  const vatAmount=React.useMemo(()=>{
    const amount=Number(String(form.amount).replace(',','.'))||0;
    const rate=Number(form.vatRate)||0;
    return rate>0?Math.round((amount*rate/(100+rate))*100)/100:0;
  },[form.amount,form.vatRate]);
  const patchForm=patch=>setForm(current=>({...current,...patch}));
  const addExpense=async()=>{
    if(busy) return;
    if(!form.expenseDate||!form.description.trim()||!(Number(String(form.amount).replace(',','.'))>0)){
      notify('⚠ Täida kuupäev, kirjeldus ja summa');return;
    }
    setBusy('create');
    try{
      await financeApiPost('/expenses',{
        expenseDate:form.expenseDate,category:form.category,description:form.description.trim(),
        amount:Number(String(form.amount).replace(',','.')),vatAmount,paymentMethod:form.paymentMethod,
        note:form.note.trim(),requestId:financeRequestId('expense')
      });
      patchForm({description:'',amount:'',note:''});
      notify('✓ Kulu lisatud');
    }catch(error){notify(`⚠ Kulu lisamine ebaõnnestus: ${error.message||error}`);}
    finally{setBusy('');}
  };
  const correctExpense=async expense=>{
    const description=window.prompt('Parandatud kirjeldus',expense.description||'');
    if(description===null) return;
    const amount=window.prompt('Parandatud summa (€)',String(Number(expense.amount)||((Number(expense.amountCents)||0)/100)));
    if(amount===null) return;
    const vat=window.prompt('Parandatud käibemaksu summa (€)',String(Number(expense.vatAmount)||((Number(expense.vatAmountCents)||0)/100)));
    if(vat===null) return;
    const reason=window.prompt('Paranduse põhjus','Andmete täpsustamine');
    if(!reason?.trim()) return;
    setBusy(`correct-${expense.id}`);
    try{
      await financeApiPost('/expenses/correct',{
        expenseId:expense.id,expenseDate:expense.expenseDate,category:expense.category,
        description:description.trim(),amount:Number(String(amount).replace(',','.')),
        vatAmount:Number(String(vat).replace(',','.')),paymentMethod:expense.paymentMethod||'bank',
        note:expense.note||'',reason:reason.trim(),requestId:financeRequestId('expensecorrect')
      });
      notify('✓ Loodi parandatud kulukirje; algne jäi ajalukku');
    }catch(error){notify(`⚠ Kulu parandamine ebaõnnestus: ${error.message||error}`);}
    finally{setBusy('');}
  };
  const voidExpense=async expense=>{
    const reason=window.prompt('Tühistamise põhjus','Vale kulukirje');
    if(!reason?.trim()) return;
    setBusy(`void-${expense.id}`);
    try{
      await financeApiPost('/expenses/void',{expenseId:expense.id,reason:reason.trim(),requestId:financeRequestId('expensevoid')});
      notify('✓ Kulu tühistatud; ajalugu säilib');
    }catch(error){notify(`⚠ Kulu tühistamine ebaõnnestus: ${error.message||error}`);}
    finally{setBusy('');}
  };
  const uploadReceipt=async(expense,file,input)=>{
    if(!file||!storage) return;
    const extension=String(file.name||'').toLowerCase().split('.').pop();
    const inferred={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp'}[extension]||'';
    const contentType=String(file.type||inferred).toLowerCase();
    if(!['application/pdf','image/jpeg','image/png','image/webp'].includes(contentType)||file.size<=0||file.size>10*1024*1024){
      notify('⚠ Tšekk peab olema PDF, JPG, PNG või WebP ja kuni 10 MB');if(input) input.value='';return;
    }
    const requestId=financeRequestId('expensedoc');
    const storagePath=`financial/expenses/${expense.id}/${requestId}`;
    setBusy(`doc-${expense.id}`);
    try{
      await storage.ref().child(storagePath).put(file,{contentType,customMetadata:{kind:'expense_receipt',expenseId:expense.id,documentId:requestId}});
      await financeApiPost('/expenses/documents',{expenseId:expense.id,storagePath,fileName:String(file.name||'Tšekk').slice(0,180),contentType,size:file.size,requestId});
      notify('✓ Tšekk lisatud');
    }catch(error){notify(`⚠ Tšeki lisamine ebaõnnestus: ${error.message||error}`);}
    finally{setBusy('');if(input) input.value='';}
  };
  const openDocument=async document=>{
    try{window.open(await storage.ref().child(document.storagePath).getDownloadURL(),'_blank','noopener,noreferrer');}
    catch(error){notify(`⚠ Faili ei saanud avada: ${error.message||error}`);}
  };
  return <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:18}}>
    <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'flex-end',flexWrap:'wrap'}}>
      <div><h1 style={{fontSize:'1.7rem'}}>Kulud</h1><p style={{color:'#64748b',fontSize:'.86rem',marginTop:3}}>Keelekooli kulud, tšekid ja paranduste ajalugu.</p></div>
      <input type="month" value={month} onChange={event=>setMonth(event.target.value)} style={{width:170,fontWeight:700}}/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12}}>
      {[['Kulusid',activeRows.length],['Raamatupidamiskulu',cents(totals.gross)],['Dokumendil KM',cents(totals.vat)],['KM-ta osa',cents(totals.net)]].map(([label,value])=><div key={label} className="card" style={{padding:16}}><div style={{fontSize:'.7rem',fontWeight:800,color:'#64748b',textTransform:'uppercase'}}>{label}</div><div style={{fontSize:'1.4rem',fontWeight:800,marginTop:6}}>{value}</div></div>)}
    </div>
    <div className="card" style={{padding:'12px 15px',background:'#eff6ff',color:'#1e3a5f',fontSize:'.78rem'}}><i className="fa-solid fa-circle-info" style={{marginRight:7}}/>E&amp;P Koolitus OÜ ei ole tavapärane käibemaksukohustuslane. Sisendkäibemaksu ei arvata maha: raamatupidamiskulu on kogu tasutud summa; tšekil olev KM säilib informatiivse väljana.</div>
    <div className="card" style={{padding:18}}>
      <h2 style={{fontSize:'1.05rem'}}>Lisa kulu</h2>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,marginTop:12}}>
        <input type="date" value={form.expenseDate} onChange={event=>patchForm({expenseDate:event.target.value})}/>
        <select value={form.category} onChange={event=>patchForm({category:event.target.value})}>{Object.entries(EXPENSE_CATEGORY_LABELS).map(([id,label])=><option key={id} value={id}>{label}</option>)}</select>
        <input value={form.description} onChange={event=>patchForm({description:event.target.value})} placeholder="Kirjeldus"/>
        <input type="number" min="0.01" step="0.01" value={form.amount} onChange={event=>patchForm({amount:event.target.value})} placeholder="Summa koos KM-ga (€)"/>
        <select value={form.vatRate} onChange={event=>patchForm({vatRate:event.target.value})}><option value="0">KM 0%</option><option value="9">KM 9%</option><option value="13">KM 13%</option><option value="24">KM 24%</option></select>
        <select value={form.paymentMethod} onChange={event=>patchForm({paymentMethod:event.target.value})}><option value="bank">Pangaülekanne</option><option value="card">Kaart</option><option value="cash">Sularaha</option><option value="other">Muu</option></select>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'center',marginTop:12,flexWrap:'wrap'}}><span style={{fontSize:'.76rem',color:'#64748b'}}>Dokumendil sisalduv KM (informatiivne): <strong>{vatAmount.toFixed(2)} €</strong></span><button className="btn btn-pine" onClick={addExpense} disabled={Boolean(busy)}>{busy==='create'?'Salvestan…':'Lisa kulu'}</button></div>
    </div>
    <div className="card" style={{overflow:'hidden'}}>
      <div style={{padding:14,display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(190px,1fr))',gap:8}}><input value={search} onChange={event=>setSearch(event.target.value)} placeholder="Otsi kirjeldust, märkust või tšekki…"/><select value={categoryFilter} onChange={event=>setCategoryFilter(event.target.value)}><option value="all">Kõik kategooriad</option>{Object.entries(EXPENSE_CATEGORY_LABELS).map(([id,label])=><option key={id} value={id}>{label}</option>)}</select><select value={statusFilter} onChange={event=>setStatusFilter(event.target.value)}><option value="all">Kõik staatused</option><option value="active">Aktiivsed</option><option value="corrected">Parandatud</option><option value="voided">Tühistatud</option></select></div>
      {visibleRows.map(expense=><div key={expense.id} style={{padding:'14px 16px',borderTop:'1px solid rgba(28,43,58,.08)',display:'flex',justifyContent:'space-between',gap:14,alignItems:'center',flexWrap:'wrap',opacity:expense.status==='active'?1:.58}}>
        <div style={{minWidth:220,flex:1}}><div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}><strong>{expense.description}</strong><span className="badge" style={{background:expense.status==='active'?'#ecfdf5':'#f3f4f6',color:expense.status==='active'?'#166534':'#64748b'}}>{expense.status==='active'?'Aktiivne':expense.status==='corrected'?'Parandatud':'Tühistatud'}</span></div><div style={{fontSize:'.74rem',color:'#64748b',marginTop:4}}>{fmtDate(expense.expenseDate)} · {EXPENSE_CATEGORY_LABELS[expense.category]||expense.category} · KM {cents(expense.vatAmountCents)}</div></div>
        <strong style={{fontSize:'1rem'}}>{cents(expense.amountCents)}</strong>
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          {(expense.documents||[]).map(document=><button key={document.id} className="btn btn-ghost btn-sm" onClick={()=>openDocument(document)}><i className="fa-solid fa-eye"/> {document.fileName||'Tšekk'}</button>)}
          {expense.status==='active'&&<label className="btn btn-ghost btn-sm" style={{cursor:'pointer'}}><i className="fa-solid fa-paperclip"/> {busy===`doc-${expense.id}`?'Laadin…':'Lisa tšekk'}<input type="file" accept=".pdf,image/jpeg,image/png,image/webp" hidden onChange={event=>uploadReceipt(expense,event.target.files?.[0],event.target)}/></label>}
          {expense.status==='active'&&<button className="btn btn-ghost btn-sm" onClick={()=>correctExpense(expense)} disabled={Boolean(busy)}>Paranda</button>}
          {expense.status==='active'&&<button className="btn btn-ghost btn-sm" style={{color:'#991b1b'}} onClick={()=>voidExpense(expense)} disabled={Boolean(busy)}>Tühista</button>}
        </div>
      </div>)}
      {visibleRows.length===0&&<div style={{padding:34,textAlign:'center',color:'#94a3b8'}}>Valitud filtritele vastavaid kulusid ei leitud.</div>}
    </div>
  </div>;
}

function TaxReportsView({students=[],parents=[],invoices=[],payments=[],taxProfiles=[],user,notify}) {
  const [year,setYear]=React.useState(()=>new Date().getFullYear());
  const [status,setStatus]=React.useState('all');
  const [search,setSearch]=React.useState('');
  const [drafts,setDrafts]=React.useState({});
  const [busy,setBusy]=React.useState('');
  const [showAllPeople,setShowAllPeople]=React.useState(false);
  const preview=React.useMemo(()=>TaxReportCore.buildInf3Preview({
    year,students,parents,invoices,payments,taxProfiles,ehisRegisteredFrom:'2026-02-17'
  }),[year,students,parents,invoices,payments,taxProfiles]);
  const yearOptions=React.useMemo(()=>{
    const years=new Set([new Date().getFullYear(),new Date().getFullYear()-1,2026]);
    (payments||[]).forEach(payment=>{
      const value=String(payment.paidAt||payment.paymentDate||payment.date||payment.createdAt||'').slice(0,4);
      if(/^\d{4}$/.test(value)) years.add(Number(value));
    });
    return [...years].sort((a,b)=>b-a);
  },[payments]);
  const visibleRecords=React.useMemo(()=>{
    const query=normalizeText(search);
    return preview.records.filter(record=>{
      if(status!=='all'&&record.status!==status) return false;
      return !query||normalizeText(`${record.invoiceNumber} ${record.payerName} ${record.studentName} ${record.paymentId} ${record.reasons.join(' ')}`).includes(query);
    });
  },[preview.records,status,search]);
  const people=showAllPeople?preview.people:preview.people.filter(person=>!person.valid);
  const cents=value=>`${(Number(value||0)/100).toFixed(2)} €`;
  const statusMeta={
    ready:{label:'Valmis',bg:'#dcfce7',color:'#166534'},
    missing:{label:'Andmed puudu',bg:'#fef3c7',color:'#92400e'},
    excluded:{label:'Ei kuulu INF 3-le',bg:'#f3f4f6',color:'#64748b'}
  };
  const saveProfile=async person=>{
    const personalCode=TaxReportCore.normalizePersonalCode(drafts[person.key]);
    if(!TaxReportCore.validPersonalCode(personalCode)){
      notify('⚠ Isikukood peab olema kehtiv 11-kohaline Eesti isikukood');
      return;
    }
    setBusy(person.key);
    const nowIso=new Date().toISOString();
    try{
      const batch=db.batch();
      const profileRef=db.collection('taxPersonProfiles').doc(encodeURIComponent(person.key));
      batch.set(profileRef,{
        entityType:person.entityType,
        entityId:person.entityId,
        displayName:person.name,
        personalCode,
        updatedAt:nowIso,
        updatedByUid:user?.uid||'',
        updatedByName:user?.displayName||user?.email||''
      },{merge:true});

        type:'tax_person_profile_updated',
        label:`INF 3 isikukood uuendatud: ${person.name}`,

      });

    link.href=url;link.download=fileName;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);
  };
  return <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:18}}>

        <div style={{display:'flex',gap:7,flexWrap:'wrap'}}><span className="badge" style={{background:'#dcfce7',color:'#166534'}}>EHIS aktiivne</span><span className="badge" style={{background:'#eff6ff',color:'#1d4ed8'}}>KM-kohustuslane: ei</span></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(190px,1fr))',gap:10,marginTop:14,fontSize:'.78rem'}}>
        <div><span style={{color:'#64748b'}}>EHIS ID</span><strong style={{display:'block',marginTop:2}}>2141297</strong></div>
        <div><span style={{color:'#64748b'}}>Tegevusteade</span><strong style={{display:'block',marginTop:2}}>261556 · alates 17.02.2026</strong></div>
        <div><span style={{color:'#64748b'}}>Õppekavarühm</span><strong style={{display:'block',marginTop:2}}>Keeleõpe</strong></div>
        <div><span style={{color:'#64748b'}}>INF 3 koolituse liik</span><strong style={{display:'block',marginTop:2}}>2 · täienduskoolitus</strong></div>
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:10}}>

        ['INF 3 valmis',preview.summary.readyPaymentCount,'#166534'],
        ['Valmis summa',cents(preview.summary.readyAmountCents),'#166534'],
        ['Andmed puudu',preview.summary.missingPaymentCount,'#92400e'],
        ['Ei kuulu aruandesse',preview.summary.excludedPaymentCount,'#64748b']
      ].map(([label,value,color])=><div key={label} className="card" style={{padding:15}}><div style={{fontSize:'.68rem',fontWeight:800,textTransform:'uppercase',color:'#64748b'}}>{label}</div><div style={{fontSize:'1.35rem',fontWeight:800,color,marginTop:5}}>{value}</div></div>)}
    </div>
    <div className="card" style={{overflow:'hidden'}}>
      <div style={{padding:16,display:'flex',justifyContent:'space-between',gap:10,alignItems:'center',flexWrap:'wrap'}}><div><strong>Isikukoodide kontroll</strong><div style={{fontSize:'.72rem',color:'#64748b',marginTop:3}}>Isikukoode hoitakse eraldi ja neid ei kuvata õpilase ega lapsevanema tavavaates.</div></div><button className="btn btn-ghost btn-sm" onClick={()=>setShowAllPeople(value=>!value)}>{showAllPeople?'Näita ainult puuduvaid':'Näita kõiki'}</button></div>
      {people.map(person=><div key={person.key} style={{padding:'12px 16px',borderTop:'1px solid rgba(28,43,58,.08)',display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
        <div style={{minWidth:210,flex:1}}><strong>{person.name}</strong><div style={{fontSize:'.72rem',color:'#64748b',marginTop:3}}>{person.role==='learner'?'Õppija':'Maksja'} · {person.entityType} · {person.valid?TaxReportCore.maskPersonalCode(person.personalCode):'isikukood puudub'}</div></div>
        <input inputMode="numeric" autoComplete="off" maxLength="11" value={drafts[person.key]||''} onChange={event=>setDrafts(current=>({...current,[person.key]:event.target.value}))} placeholder={person.valid?'Sisesta uus isikukood':'Isikukood'} style={{width:180}}/>
        <button className="btn btn-pine btn-sm" disabled={busy===person.key||!drafts[person.key]} onClick={()=>saveProfile(person)}>{busy===person.key?'Salvestan…':'Salvesta'}</button>
      </div>)}
      {people.length===0&&<div style={{padding:28,textAlign:'center',color:'#166534'}}><i className="fa-solid fa-circle-check"/> Kõigi leitud isikute isikukoodid on korras.</div>}
    </div>
    <div className="card" style={{overflow:'hidden'}}>
      <div style={{padding:16,display:'flex',justifyContent:'space-between',gap:10,alignItems:'center',flexWrap:'wrap'}}>
        <div><strong>INF 3 tööfaili alus ({visibleRecords.length}/{preview.records.length})</strong><div style={{fontSize:'.72rem',color:'#64748b',marginTop:3}}>Tööfail tuleb enne Maksu- ja Tolliametile esitamist raamatupidajal üle kontrollida.</div></div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}><button className="btn btn-ghost btn-sm" disabled={!preview.rows.length} onClick={()=>downloadCsv(TaxReportCore.inf3WorkfileCsv(preview),`keelesepp-inf3-toofail-${year}.csv`)}><i className="fa-solid fa-file-csv"/> INF 3 CSV</button><button className="btn btn-ghost btn-sm" disabled={!preview.records.some(record=>record.status!=='ready')} onClick={()=>downloadCsv(TaxReportCore.inf3IssuesCsv(preview),`keelesepp-inf3-puuduvad-andmed-${year}.csv`)}><i className="fa-solid fa-triangle-exclamation"/> Puuduvad andmed CSV</button></div>
      </div>

      {visibleRecords.map(record=>{const meta=statusMeta[record.status]||statusMeta.missing;return <div key={record.paymentId||`${record.invoiceId}-${record.paidAt}`} style={{padding:'12px 16px',borderTop:'1px solid rgba(28,43,58,.08)',display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}><div style={{minWidth:230,flex:1}}><strong>{record.invoiceNumber||'Arve seos puudub'} · {record.studentName||record.payerName||'Isik määramata'}</strong><div style={{fontSize:'.72rem',color:'#64748b',marginTop:3}}>{record.paidAt} · {cents(record.amountCents)}{record.reasons.length?` · ${record.reasons.join(' · ')}`:''}</div></div><span className="badge" style={{background:meta.bg,color:meta.color}}>{meta.label}</span></div>;})}
      {visibleRecords.length===0&&<div style={{padding:30,textAlign:'center',color:'#94a3b8'}}>Valitud tingimustele vastavaid makseid ei leitud.</div>}
    </div>
  </div>;
}

function DataQualityView({notify}) {
  const [data,setData]=React.useState(null);
  const [busy,setBusy]=React.useState('');
  const [selections,setSelections]=React.useState({});
  const [accountSearch,setAccountSearch]=React.useState('');
  const [showAllAccounts,setShowAllAccounts]=React.useState(false);
  const refresh=React.useCallback(async()=>{
    setBusy('refresh');
    try{setData(await staffOperationsApiPost('/data-quality/preview',{}));}
    catch(error){notify(`⚠ Kontroll ebaõnnestus: ${error.message||error}`);}
    finally{setBusy('');}
  },[]);
  React.useEffect(()=>{refresh();},[]);
  const pick=(key,value)=>setSelections(current=>({...current,[key]:value}));
  const relink=async(type,item)=>{
    const studentId=selections[`${type}-${item.id}`];
    if(!studentId){notify('⚠ Vali õige õpilane');return;}
    if(!window.confirm('Kas seod selle kirje täpselt valitud õpilasega?')) return;
    setBusy(`${type}-${item.id}`);
    try{await staffOperationsApiPost('/data-quality/relink',{entityType:type,entityId:item.id,studentId,requestId:financeRequestId('datarelink')});notify('✓ Seos parandatud ja logitud');await refresh();}
    catch(error){notify(`⚠ Seost ei saanud parandada: ${error.message||error}`);setBusy('');}
  };
  const linkGroupLesson=async(item,skipConfirm=false)=>{
    const groupId=selections[`group-lesson-${item.id}`]||item.suggestedGroupId||'';
    if(!groupId){notify('⚠ Vali täpne grupp');return false;}
    if(!skipConfirm&&!window.confirm('Kas seod selle tunni täpselt valitud grupiga?')) return false;
    setBusy(`group-lesson-${item.id}`);
    try{
      await staffOperationsApiPost('/data-quality/group-lesson',{lessonId:item.id,groupId,requestId:financeRequestId('grouplessonlink')});
      if(!skipConfirm){notify('✓ Grupitunni seos parandatud ja logitud');await refresh();}
      return true;
    }catch(error){notify(`⚠ Grupitundi ei saanud siduda: ${error.message||error}`);setBusy('');return false;}
  };
  const linkExactGroupLessons=async()=>{
    const exact=(data?.groupLessonsNeedingLink||[]).filter(item=>item.exactGroupMatch&&item.suggestedGroupId);
    if(!exact.length) return;
    if(!window.confirm(`Seon ${exact.length} tundi ainult täpselt sama nimega olemasoleva grupiga. Õpilaste kirjeid ei muudeta. Jätkan?`)) return;
    setBusy('group-lessons-bulk');
    let linked=0;
    for(const item of exact){if(await linkGroupLesson(item,true)) linked+=1;}
    notify(`✓ ${linked} grupitunni seost parandatud ja logitud`);
    await refresh();
  };
  const correctDue=async invoice=>{
    const due=window.prompt(`Arve ${invoice.number||invoice.id} uus tähtaeg`,invoice.date||today());
    if(!due) return;
    const reason=window.prompt('Paranduse põhjus','Tähtaeg oli varasem kui arve kuupäev');
    if(!reason?.trim()) return;
    setBusy(`due-${invoice.id}`);
    try{await staffOperationsApiPost('/data-quality/invoice-due',{invoiceId:invoice.id,due,reason:reason.trim(),requestId:financeRequestId('invoiceduefix')});notify('✓ Arve tähtaeg parandatud');await refresh();}
    catch(error){notify(`⚠ Tähtaega ei saanud parandada: ${error.message||error}`);setBusy('');}
  };
  const linkAccount=async account=>{
    const studentId=selections[`account-student-${account.uid}`];
    const relationship=selections[`account-role-${account.uid}`]||'parent';
    if(!studentId){notify('⚠ Vali laps või õpilane');return;}
    setBusy(`account-${account.uid}`);
    try{await staffOperationsApiPost('/accounts/link',{uid:account.uid,studentId,relationship,requestId:financeRequestId('accountlink')});notify('✓ Konto seoti valitud õpilasega');await refresh();}
    catch(error){notify(`⚠ Kontot ei saanud siduda: ${error.message||error}`);setBusy('');}
  };
  const changeAccountStatus=async account=>{
    const disabled=!account.disabled;
    const reason=window.prompt(disabled?'Konto peatamise põhjus':'Konto taastamise põhjus',disabled?'Vale või dubleeritud konto':'Konto seos on kontrollitud');
    if(!reason?.trim()) return;
    if(disabled&&!window.confirm('Konto ei saa pärast peatamist sisse logida. Andmeid ei kustutata. Jätkan?')) return;
    setBusy(`status-${account.uid}`);
    try{await staffOperationsApiPost('/accounts/status',{uid:account.uid,disabled,reason:reason.trim(),requestId:financeRequestId('accountstatus')});notify(disabled?'✓ Konto peatatud':'✓ Konto taastatud');await refresh();}
    catch(error){notify(`⚠ Konto olekut ei saanud muuta: ${error.message||error}`);setBusy('');}
  };
  const mergeGroup=async group=>{
    const primaryStudentId=selections[`duplicate-${group.kind}-${group.key}`]||group.students[0]?.id;
    const duplicateStudentIds=group.students.map(student=>student.id).filter(id=>id!==primaryStudentId);
    if(!primaryStudentId||!duplicateStudentIds.length) return;
    const preview=await staffOperationsApiPost('/students/merge/preview',{primaryStudentId,duplicateStudentIds});

    setBusy(`duplicate-${group.key}`);

    catch(error){notify(`⚠ Duplikaate ei saanud ühendada: ${error.message||error}`);setBusy('');}

    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:10}}>{[['Kadunud õpilase tunnid',data.summary.orphanLessonCount,'#991b1b'],['Grupiseos puudu',data.summary.groupLessonLinkCount,'#b45309'],['Sidumata arved',data.summary.orphanInvoiceCount,'#991b1b'],['Valed tähtajad',data.summary.invalidInvoiceDateCount,'#991b1b'],['Sidumata kontod',data.summary.unlinkedAccountCount,'#991b1b'],['Duplikaadigrupid',data.summary.duplicateGroupCount,'#991b1b']].map(([label,value,issueColor])=><div key={label} className="card" style={{padding:15}}><div style={{fontSize:'.68rem',fontWeight:800,color:'#64748b',textTransform:'uppercase'}}>{label}</div><div style={{fontSize:'1.5rem',fontWeight:800,marginTop:5,color:value?issueColor:'#166534'}}>{value}</div></div>)}</div>

e-${account.uid}`]||'parent'} onChange={event=>pick(`account-role-${account.uid}`,event.target.value)}><option value="parent">Lapsevanem</option><option value="student">Õpilane</option></select><button className="btn btn-pine btn-sm" onClick={()=>linkAccount(account)}>Lisa seos</button><button className="btn btn-ghost btn-sm" style={{color:account.disabled?'#166534':'#991b1b'}} onClick={()=>changeAccountStatus(account)}>{account.disabled?'Taasta':'Peata'}</button></div>)}{visibleAccounts.length===0&&<div style={{padding:30,textAlign:'center',color:'#94a3b8'}}>Kontosid ei leitud.</div>}</div>

lose}>3. Sulge kuu</button>}{close.alreadyClosed&&<button className="btn btn-amber" onClick={correction} disabled={Boolean(busy)}>Lisa auditeeritud parandus</button>}<span style={{fontSize:'.72rem',color:'#64748b'}}>Suletud perioodi vanu kirjeid ei kirjutata üle.</span></div></div>;
