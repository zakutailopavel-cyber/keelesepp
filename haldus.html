                    <span style={{fontSize:".84rem",fontWeight:700,color:s.c}}>{s.v}</span>
                  </div>
                ));
              })()}
            </div>

            {visibleConflictRows.length>0&&(
              <div className="card" style={{padding:16,border:'1px solid rgba(220,38,38,.2)'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:10}}>
                  <div style={{fontSize:'.66rem',fontWeight:800,color:'#991b1b',textTransform:'uppercase',letterSpacing:'.1em'}}>
                    Ajaplaani konfliktid
                  </div>
                  <span className="badge" style={{background:'#fee2e2',color:'#991b1b'}}>{visibleConflictRows.length}</span>
                </div>
                <div className="scroll" style={{display:'flex',flexDirection:'column',gap:8,maxHeight:320,overflowY:'auto'}}>
                  {visibleConflictRows.slice(0,30).map(row=>{
                    const reason=row.reasons.includes('teacher')&&row.reasons.includes('student')
                      ?'Õpetaja ja õpilane on topelt'
                      :row.reasons.includes('teacher')
                        ?'Õpetaja on samal ajal kahes tunnis'
                        :'Õpilasel on kaks tundi korraga';
                    return(
                      <button key={row.key} type="button" onClick={()=>focusConflict(row)}
                        style={{display:'grid',gridTemplateColumns:'1fr auto',gap:8,textAlign:'left',padding:'9px 10px',borderRadius:10,border:'1px solid rgba(220,38,38,.14)',background:highlightedConflict?.key===row.key?'#fff1f2':'#fff',cursor:'pointer',fontFamily:'inherit'}}>
                        <span style={{minWidth:0}}>
                          <strong style={{display:'block',fontSize:'.76rem',color:'#1C2B3A'}}>
                            {fmtDate(row.date)} · {row.first?.time||'—'}
                          </strong>
                          <span style={{display:'block',fontSize:'.7rem',color:'#42536A',overflow:'hidden',textOverflow:'ellipsis'}}>
                            {row.first?.studentName||'Tund'} ↔ {row.second?.studentName||'Tund'}
                          </span>
                          <span style={{display:'block',fontSize:'.65rem',color:'#991b1b',marginTop:2}}>{reason}</span>
                        </span>
                        <span style={{fontSize:'.68rem',fontWeight:800,color:'#991b1b',alignSelf:'center'}}>Näita →</span>
                      </button>
                    );
                  })}
                </div>
                {visibleConflictRows.length>30&&<div style={{fontSize:'.68rem',color:'#64748b',marginTop:8}}>Veel {visibleConflictRows.length-30} konflikti. Kitsenda vaadet päeva või õpetaja järgi.</div>}
              </div>
            )}

            {quickCompleteLesson&&todayPendingLessons.length>0&&(
              <div className="card" style={{padding:16}}>
                <div style={{fontSize:".66rem",fontWeight:800,color:"#9ca3af",textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}}>
                  Tänased lõpetamata tunnid
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:7}}>
                  {todayPendingLessons.slice(0,12).map(event=>(
                    <div key={`today-${event.id}`} style={{display:'grid',gridTemplateColumns:'1fr auto',gap:8,alignItems:'center',padding:'7px 0',borderBottom:'1px solid rgba(28,43,58,.06)'}}>
                      <div style={{minWidth:0}}>
                        <div style={{fontSize:'.76rem',fontWeight:800,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{event.studentName}</div>
                        <div style={{fontSize:'.66rem',color:'#64748b'}}>{event.time||'—'} · {event.duration||60} min</div>
                      </div>
                      <button type="button" className="calendar-quick-complete" style={{marginTop:0}}
                        onClick={()=>quickCompleteLesson({...event,occurrenceDate:today()})}
                        title="Märgi tund toimunuks">
                        <i className="fa-solid fa-check"/>
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Spikker */}
            <div className="card" style={{padding:16}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,gap:4,flexWrap:"wrap"}}>
                <div style={{fontSize:".66rem",fontWeight:800,color:"#9ca3af",textTransform:"uppercase",letterSpacing:".1em"}}>
                  Õpilaste spikker
                </div>
                <div style={{display:"flex",gap:3}}>
                  {[['all','Kõik'],['empty','0 t'],['under','Vähe']].map(([id,l])=>(
                    <button key={id} onClick={()=>setPlannerFilter(id)}
                      style={{padding:"2px 7px",borderRadius:6,
                        border:"0.5px solid rgba(28,43,58,.1)",
                        background:plannerFilter===id?"#1C2B3A":"transparent",
                        color:plannerFilter===id?"#fff":"#42536A",
                        cursor:"pointer",fontSize:".64rem",fontWeight:600,fontFamily:"inherit"}}>
                      {l}
                    </button>
                  ))}
                </div>
              </div>
              <input value={plannerSearch} onChange={e=>setPlannerSearch(e.target.value)}
                placeholder="Otsi..." style={{marginBottom:8,fontSize:".78rem"}}/>
              {missingCount>0&&plannerFilter==='all'&&(
                <div style={{padding:"5px 9px",borderRadius:7,background:"rgba(220,38,38,.06)",
                  border:"0.5px solid rgba(220,38,38,.15)",marginBottom:8,
                  fontSize:".72rem",color:"#dc2626",fontWeight:600}}>
                  ⚠ {missingCount} õpilasel 0 tundi
                </div>
              )}
              <div style={{display:"flex",flexDirection:"column",gap:3,maxHeight:420,overflowY:"auto"}} className="scroll">
                {plannerRows.length===0&&(
                  <div style={{textAlign:"center",padding:"14px 0",color:"#9ca3af",fontSize:".76rem"}}>Õpilasi ei leitud</div>
                )}
                {plannerRows.map(row=>{
                  const {student,lessonsThisWeek,target}=row;
                  const isOk=lessonsThisWeek.length>0&&(target===0||lessonsThisWeek.length>=target);
                  const tc=tColor(student.teacher);
                  return(
                    <div key={student.id} style={{display:"flex",alignItems:"center",gap:6,
                      padding:"5px 7px",borderRadius:8,
                      background:!isOk?"rgba(220,38,38,.04)":"rgba(28,43,58,.02)",
                      border:`0.5px solid ${!isOk?"rgba(220,38,38,.1)":"rgba(28,43,58,.05)"}`}}>
                      <div style={{width:5,height:5,borderRadius:"50%",background:tc.dot,flexShrink:0}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:".76rem",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                          {student.name}
                        </div>
                        <div style={{fontSize:".62rem",color:"#42536A"}}>{student.level||'—'}</div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2,flexShrink:0}}>
                        <span style={{fontSize:".66rem",fontWeight:700,padding:"1px 5px",borderRadius:999,
                          background:isOk?"rgba(22,101,52,.1)":"rgba(220,38,38,.1)",
                          color:isOk?"#166534":"#dc2626"}}>
                          {target>0?`${lessonsThisWeek.length}/${target}`:lessonsThisWeek.length}
                        </span>
                        <button onClick={event=>openPlannerStudentPopup(event,student)}
                          style={{fontSize:".6rem",padding:"1px 5px",borderRadius:5,
                            border:"0.5px solid rgba(28,43,58,.12)",background:"#fff",
                            cursor:"pointer",color:"#42536A",fontFamily:"inherit"}}>
                          + Lisa
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}
      </div>

      <style>{`
        .slot-add-hint { transition: color .15s !important; }
        div:hover > .slot-add-hint { color: rgba(47,93,80,.45) !important; }
        .ev-del-btn { transition: color .1s !important; }
        .ev-card:hover .ev-del-btn, div:hover > .ev-del-btn { color: rgba(0,0,0,.25) !important; }
      `}</style>
    </div>
  );
}


// ── ÕPILASTE NIMEKIRI ─────────────────────────────────────────
function StudentsList({students,lessons,isAdmin,search,setSearch,stuFilter,setStuFilter,setSelStu,user,notify}) {
  const [teacherFilter,setTeacherFilter]=React.useState('all');
  const [subjectFilter,setSubjectFilter]=React.useState('all');
  const [levelFilter,setLevelFilter]=React.useState('all');
  const [gradeFilter,setGradeFilter]=React.useState('all');
  const [groupFilter,setGroupFilter]=React.useState('all');
  const [lessonFilter,setLessonFilter]=React.useState('all');
  const [packageFilter,setPackageFilter]=React.useState('all');
  const [sortMode,setSortMode]=React.useState('name_asc');
  const [exportBusy,setExportBusy]=React.useState('');
  const exportRows=React.useMemo(()=>StudentExportCore.buildStudentExportRows({students,lessons,packageSummary:legacyPackageSummary})
    .map(row=>({...row,teacher:canonicalTeacherName(row.teacher)})),[students,lessons]);
  const optionsFor=key=>[...new Set(exportRows.map(row=>row[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'et'));
  const teacherOptions=React.useMemo(()=>optionsFor('teacher'),[exportRows]);
  const subjectOptions=React.useMemo(()=>optionsFor('subject'),[exportRows]);
  const levelOptions=React.useMemo(()=>optionsFor('level'),[exportRows]);
  const gradeOptions=React.useMemo(()=>optionsFor('grade'),[exportRows]);
  const groupOptions=React.useMemo(()=>optionsFor('group'),[exportRows]);
  const visibleRows=React.useMemo(()=>{
    const query=normalizeText(search);
    const levelRank=LEVELS.reduce((result,level,index)=>({...result,[level]:index}),{});
    return exportRows
      .filter(row=>stuFilter==='active'?row.status==='Aktiivne':stuFilter==='inactive'?row.status==='Arhiveeritud':true)
      .filter(row=>!query||normalizeText([row.name,row.email,row.phone,row.parentName,row.parentEmail,row.teacher,row.subject,row.grade,row.group].join(' ')).includes(query))
      .filter(row=>teacherFilter==='all'||row.teacher===teacherFilter)
      .filter(row=>subjectFilter==='all'||row.subject===subjectFilter)
      .filter(row=>levelFilter==='all'||row.level===levelFilter)
      .filter(row=>gradeFilter==='all'||row.grade===gradeFilter)
      .filter(row=>groupFilter==='all'||row.group===groupFilter)
      .filter(row=>lessonFilter==='all'||(lessonFilter==='with'?row.completedLessons>0:row.completedLessons===0))
      .filter(row=>packageFilter==='all'||(packageFilter==='available'?row.packageRemaining>0:packageFilter==='empty'?row.packageTotal>0&&row.packageRemaining===0:row.packageTotal===0))
      .sort((a,b)=>{
        if(sortMode==='name_desc') return b.name.localeCompare(a.name,'et');
        if(sortMode==='teacher') return a.teacher.localeCompare(b.teacher,'et')||a.name.localeCompare(b.name,'et');
        if(sortMode==='level') return (levelRank[a.level]??99)-(levelRank[b.level]??99)||a.name.localeCompare(b.name,'et');
        if(sortMode==='lessons') return b.completedLessons-a.completedLessons||a.name.localeCompare(b.name,'et');
        return a.name.localeCompare(b.name,'et');
      })
      .map((row,index)=>({...row,index:index+1}));
  },[exportRows,search,stuFilter,teacherFilter,subjectFilter,levelFilter,gradeFilter,groupFilter,lessonFilter,packageFilter,sortMode]);
  const studentById=React.useMemo(()=>new Map(students.map(student=>[student.id,student])),[students]);
  const visibleStudents=visibleRows.map(row=>studentById.get(row.id)).filter(Boolean);
  const activeFilterCount=[search,stuFilter!=='active'&&stuFilter,teacherFilter!=='all'&&teacherFilter,subjectFilter!=='all'&&subjectFilter,levelFilter!=='all'&&levelFilter,gradeFilter!=='all'&&gradeFilter,groupFilter!=='all'&&groupFilter,lessonFilter!=='all'&&lessonFilter,packageFilter!=='all'&&packageFilter,sortMode!=='name_asc'&&sortMode].filter(Boolean).length;
  const resetFilters=()=>{setSearch('');setStuFilter('active');setTeacherFilter('all');setSubjectFilter('all');setLevelFilter('all');setGradeFilter('all');setGroupFilter('all');setLessonFilter('all');setPackageFilter('all');setSortMode('name_asc');};
  const labelFor=(value,options)=>options.find(option=>option.value===value)?.label||value;
  const filterSummary=()=>[
    stuFilter==='active'?'Aktiivsed':stuFilter==='inactive'?'Arhiveeritud':'Kõik staatused',
    search&&`otsing „${search}”`,
    teacherFilter!=='all'&&`õpetaja ${teacherFilter}`,
    subjectFilter!=='all'&&`aine ${subjectFilter}`,
    levelFilter!=='all'&&`tase ${levelFilter}`,
    gradeFilter!=='all'&&`klass ${gradeFilter}`,
    groupFilter!=='all'&&`grupp ${groupFilter}`,
    lessonFilter!=='all'&&labelFor(lessonFilter,[{value:'with',label:'toimunud tundidega'},{value:'without',label:'ilma toimunud tundideta'}]),
    packageFilter!=='all'&&labelFor(packageFilter,[{value:'available',label:'paketijääk olemas'},{value:'empty',label:'pakett kasutatud'},{value:'none',label:'pakett puudub'}]),
  ].filter(Boolean).join(' · ');
  const exportSelection=async format=>{
    if(!visibleRows.length){notify('⚠ Eksporditavaid õpilasi pole');return;}
    setExportBusy(format);
    const generatedAt=new Date();
    const metadata={generatedAt:generatedAt.toISOString(),generatedAtLabel:generatedAt.toLocaleString('et-EE'),generatedBy:user?.displayName||user?.email||'KeeleSepp',filterSummary:filterSummary()};
    try{
      if(format==='word') StudentExportCore.downloadWord(visibleRows,metadata);
      if(format==='pdf') await StudentExportCore.downloadPdf(visibleRows,metadata);
      if(format==='excel') await StudentExportCore.downloadExcel(visibleRows,metadata);
      notify(`✓ ${visibleRows.length} õpilase väljavõte laaditi alla`);
    }catch(error){notify(`⚠ Väljavõtet ei saanud luua: ${error.message||error}`);}
    finally{setExportBusy('');}
  };
  const selectStyle={width:'100%',minWidth:0,padding:'9px 11px',fontSize:'.76rem'};
  return(
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:20}}>
      <div className="card" style={{padding:20,display:'flex',flexDirection:'column',gap:14}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
          <div><h1 style={{fontSize:'1.7rem'}}>Minu õpilased <span style={{fontSize:'1rem',fontFamily:'IBM Plex Sans',fontWeight:400,color:'#42536A'}}>({visibleStudents.length})</span></h1><div style={{fontSize:'.72rem',color:'#64748b',marginTop:3}}>Filtrid ja väljavõte kasutavad ainult praegu nähtavaid õpilasi.</div></div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',flex:1,justifyContent:'flex-end'}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Otsi nime, kontakti või õpetajat…" style={{width:'min(100%,310px)',padding:'9px 14px'}}/>
            <select value={stuFilter} onChange={e=>setStuFilter(e.target.value)} style={{width:'auto'}}><option value="active">Aktiivsed</option><option value="all">Kõik</option><option value="inactive">Arhiveeritud</option></select>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(145px,1fr))',gap:8}}>
          {isAdmin&&<select value={teacherFilter} onChange={e=>setTeacherFilter(e.target.value)} style={selectStyle}><option value="all">Kõik õpetajad</option>{teacherOptions.map(value=><option key={value} value={value}>{value}</option>)}</select>}
          <select value={subjectFilter} onChange={e=>setSubjectFilter(e.target.value)} style={selectStyle}><option value="all">Kõik õppeained</option>{subjectOptions.map(value=><option key={value} value={value}>{value}</option>)}</select>
          <select value={levelFilter} onChange={e=>setLevelFilter(e.target.value)} style={selectStyle}><option value="all">Kõik tasemed</option>{levelOptions.map(value=><option key={value} value={value}>{value}</option>)}</select>
          <select value={gradeFilter} onChange={e=>setGradeFilter(e.target.value)} style={selectStyle}><option value="all">Kõik klassid</option>{gradeOptions.map(value=><option key={value} value={value}>{value}</option>)}</select>
          <select value={groupFilter} onChange={e=>setGroupFilter(e.target.value)} style={selectStyle}><option value="all">Kõik grupid</option>{groupOptions.map(value=><option key={value} value={value}>{value}</option>)}</select>
          <select value={lessonFilter} onChange={e=>setLessonFilter(e.target.value)} style={selectStyle}><option value="all">Kõik tundide järgi</option><option value="with">Toimunud tundidega</option><option value="without">Ilma toimunud tundideta</option></select>
          <select value={packageFilter} onChange={e=>setPackageFilter(e.target.value)} style={selectStyle}><option value="all">Kõik pakettide järgi</option><option value="available">Paketijääk olemas</option><option value="empty">Pakett kasutatud</option><option value="none">Pakett puudub</option></select>
          <select value={sortMode} onChange={e=>setSortMode(e.target.value)} style={selectStyle}><option value="name_asc">Nimi A–Z</option><option value="name_desc">Nimi Z–A</option><option value="teacher">Õpetaja järgi</option><option value="level">Taseme järgi</option><option value="lessons">Tundide arvu järgi</option></select>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,flexWrap:'wrap',paddingTop:12,borderTop:'1px solid rgba(28,43,58,.08)'}}>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}><span className="badge" style={{background:'#eef7f4',color:'#166534'}}>{visibleRows.length} õpilast väljavõttes</span>{activeFilterCount>0&&<button className="btn btn-ghost btn-sm" onClick={resetFilters}><i className="fa-solid fa-filter-circle-xmark"/> Lähtesta filtrid ({activeFilterCount})</button>}</div>
          <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
            <button className="btn btn-ghost btn-sm" disabled={Boolean(exportBusy)||!visibleRows.length} onClick={()=>exportSelection('word')}><i className={`fa-solid ${exportBusy==='word'?'fa-spinner fa-spin':'fa-file-word'}`}/> Word</button>
            <button className="btn btn-ghost btn-sm" disabled={Boolean(exportBusy)||!visibleRows.length} onClick={()=>exportSelection('pdf')}><i className={`fa-solid ${exportBusy==='pdf'?'fa-spinner fa-spin':'fa-file-pdf'}`}/> PDF</button>
            <button className="btn btn-pine btn-sm" disabled={Boolean(exportBusy)||!visibleRows.length} onClick={()=>exportSelection('excel')}><i className={`fa-solid ${exportBusy==='excel'?'fa-spinner fa-spin':'fa-file-excel'}`}/> Excel</button>
          </div>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(290px,1fr))',gap:14}}>
        {visibleStudents.map(s=>{
          const done=StudentExportCore.studentLessons(s,lessons).filter(l=>{
            const matchesStudent=l.status==='Toimunud';
            if(!matchesStudent) return false;
            if(isAdmin) return true;
            return canonicalTeacherName(l.teacher)===canonicalTeacherName(s.teacher);
          });
          const pct=levelPct(s.level,s.targetLevel);
          const packageSummary=legacyPackageSummary(s);
          const rem=packageSummary.remaining;
          return(
            <div key={s.id} className="card" style={{padding:20,cursor:'pointer',transition:'all .18s',opacity:s.active===false?.6:1,position:'relative'}}
              onClick={()=>setSelStu(s)}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='#C9882A';e.currentTarget.style.transform='translateY(-2px)';}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(28,43,58,.07)';e.currentTarget.style.transform='translateY(0)';}}>
              {s.active===false&&<span className="badge" style={{position:'absolute',top:10,right:10,background:'#f3f4f6',color:'#6b7280'}}>Arhiveeritud</span>}
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:14}}>
                <div>
                  <div style={{fontWeight:700,fontSize:'.98rem'}}>{s.name}</div>
                  <div style={{fontSize:'.75rem',color:'#42536A',marginTop:2}}>{s.level} → {s.targetLevel}{isAdmin&&<span style={{color:'#2F5D50',marginLeft:6}}>· {canonicalTeacherName(s.teacher)}</span>}{s.subject&&<span style={{color:'#42536A',marginLeft:6}}>· {s.subject}</span>}{s.grade&&<span style={{color:'#C9882A',marginLeft:6}}>· {s.grade}</span>}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:'1.2rem',fontWeight:700,color:'#C9882A'}}>{done.length?avg(done.map(l=>l.grade))+'★':'—'}</div>
                  <div style={{fontSize:'.72rem',color:'#42536A'}}>{done.length} tundi</div>
                </div>
              </div>
              <div className="level-bar" style={{marginBottom:6}}><div className="level-fill" style={{width:pct+'%'}}/></div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:'.72rem',color:'#42536A'}}>
                <span>{s.level}</span><span style={{color:'#2F5D50',fontWeight:600}}>{pct}%</span><span>{s.targetLevel}</span>
              </div>
              {packageSummary.total>0&&(
                <div style={{marginTop:12,padding:'8px 12px',borderRadius:9,display:'flex',justifyContent:'space-between',
                  background:rem<=2?'#fee2e2':rem<=5?'#fef3c7':'#f0fdf4'}}>
                  <span style={{fontSize:'.75rem',fontWeight:600,color:rem<=2?'#991b1b':rem<=5?'#92400e':'#166534'}}>📦 Paketi jääk</span>
                  <span style={{fontSize:'.82rem',fontWeight:700,color:rem<=2?'#991b1b':rem<=5?'#92400e':'#166534'}}>{rem} / {packageSummary.total} alles</span>
                </div>
              )}
            </div>
          );
        })}
        {visibleStudents.length===0&&<div style={{gridColumn:'1/-1',textAlign:'center',padding:'48px 0',color:'#42536A'}}>{search?`"${search}" ei leitud`:'Valitud filtritele vastavaid õpilasi pole.'}</div>}
      </div>
    </div>
  );
}

// ── LAPSEVANEMAD ─────────────────────────────────────────────
function ParentsView({parents,students,invoices,isAdmin,parentAlerts,setSelStu,setTab,createMissingParentStudents,markParentChecked,mergeParentDuplicates,assignStudentToParent,changeParentToStudent,notify}) {
  const [search,setSearch] = React.useState('');
  const [statusFilter,setStatusFilter] = React.useState('all');
  const [editingParentId,setEditingParentId] = React.useState('');
  const parentStatusMeta = {
    new:{t:'Uus',bg:'#dbeafe',c:'#1d4ed8'},
    written:{t:'Kirjutatud',bg:'#ede9fe',c:'#6d28d9'},
    called:{t:'Helistatud',bg:'#fef3c7',c:'#92400e'},
    waiting:{t:'Ootab vastust',bg:'#fee2e2',c:'#991b1b'},
    agreed:{t:'Kokkulepitud',bg:'#dcfce7',c:'#166534'},
    problem:{t:'Probleem',bg:'#fee2e2',c:'#991b1b'},
    active:{t:'Aktiivne',bg:'#dcfce7',c:'#166534'}
  };
  const noData = (
    <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',padding:'3px 8px',borderRadius:999,background:'#fee2e2',border:'1px solid #fecaca',color:'#991b1b',fontWeight:800,fontSize:'.72rem'}}>
      Andmed puuduvad
    </span>
  );
  const updateParent = async(parent,patch)=>{
    if(!parent?.id) return;
    try{
      await db.collection('users').doc(parent.id).update({
        ...patch,
        parentCrmUpdatedAt:new Date().toISOString()
      });
      notify?.('✓ Lapsevanema info salvestatud');
    }catch(err){
      console.error('Parent update failed:',err);
      notify?.('⚠ Lapsevanema infot ei saanud salvestada');
    }
  };
  const parentRows = React.useMemo(()=>{
    const q = normalizeText(search);
    const uniqBy = (items,keyFn)=>{
      const seen = new Set();
      return items.filter(item=>{
        const key = keyFn(item);
        if(!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    };
    const parentMergeKey = parent => {
      const email = normalizeText(parent.email);
      if(email) return `email:${email}`;
      const phone = normalizeText(parent.phone || parent.parentPhone).replace(/[^0-9]/g,'');
      if(phone) return `phone:${phone}`;
      const childKey = parseLinkedNames(parent.childName).join('|');
      return `name:${normalizeText(parent.displayName)}|children:${childKey}`;
    };
    const buildChildGroups = linkedChildren => Object.values(linkedChildren.reduce((acc,student)=>{
      const key = studentIdentityKey(student) || normalizeText(student.name) || student.id;
      if(!acc[key]) acc[key] = {name:student.name||'',items:[]};
      acc[key].items.push(student);
      return acc;
    },{}));
    const buildParentRow = parent => {
      const rawNames = String(parent.childName||'')
        .split(/[,\n;|]+/)
        .map(name=>name.trim())
        .filter(Boolean);
      const childNameKeys = new Set((rawNames.length?rawNames:parseLinkedNames(parent.childName)).map(name=>normalizeText(name)));
      const parentEmail = normalizeText(parent.email);
      const parentName = normalizeText(parent.displayName);
      const linkedChildren = students.filter(student=>{
        if(student.active===false || student.convertedToParent) return false;
        const linkedParentId = student.linkedParentId || student.parentUid || student.guardianUid || '';
        const studentName = normalizeText(student.name);
        const studentParentEmail = normalizeText(student.parentEmail || student.contactEmail || student.guardianEmail || student.email);
        const studentParentName = normalizeText(student.parentName || student.guardianName);
        const parentMatched = linkedParentId===parent.id ||
          (!!parentEmail && studentParentEmail===parentEmail) ||
          (!!parentName && studentParentName===parentName);
        return parentMatched || (childNameKeys.has(studentName) && parentMatched);
      });
      const uniqueChildren = uniqBy(linkedChildren,student=>studentProfileKey(student)||student.id);
      const childGroups = buildChildGroups(uniqueChildren);
      const unpaid = invoices.filter(inv=>
        inv.status==='Ootel' && (
          invoiceMatchesParentProfile(inv,parent) ||
          uniqueChildren.some(student=>student.id===inv.studentId || normalizeText(student.name)===normalizeText(inv.studentName))
        )
      );
      return {key:parentMergeKey(parent),parent,parents:[parent],duplicateParents:[],rawNames,linkedChildren:uniqueChildren,childGroups,unpaid};
    };
    const rowsByKey = parents.reduce((acc,parent)=>{
      const row = buildParentRow(parent);
      if(!acc[row.key]){
        acc[row.key]=row;
        return acc;
      }
      const target = acc[row.key];
      target.parents.push(parent);
      target.duplicateParents.push(parent);
      target.rawNames = uniqBy([...target.rawNames,...row.rawNames],name=>normalizeText(name));
      target.linkedChildren = uniqBy([...target.linkedChildren,...row.linkedChildren],student=>studentProfileKey(student)||student.id);
      target.childGroups = buildChildGroups(target.linkedChildren);
      target.unpaid = uniqBy([...target.unpaid,...row.unpaid],inv=>inv.id || `${inv.studentId}|${inv.studentName}|${inv.amount}|${inv.createdAt}`);
      return acc;
    },{});
    const mergedRows = Object.values(rowsByKey).map(row=>{
      const allParents = row.parents || [row.parent];
      const pick = field => allParents.map(parent=>parent?.[field]).find(Boolean) || '';
      const bestName = allParents
        .map(parent=>parent?.displayName)
        .filter(Boolean)
        .sort((a,b)=>String(b).length-String(a).length)[0] || '';
      const bestStatusParent = allParents.find(parent=>parent?.parentContactStatus && parent.parentContactStatus!=='new') || row.parent;
      const parentNameKeys = new Set(allParents.map(parent=>normalizeText(parent?.displayName)).filter(Boolean));
      const hasRealChild = row.linkedChildren.some(student=>!parentNameKeys.has(normalizeText(student.name)));
      const cleanChildren = hasRealChild
        ? row.linkedChildren.filter(student=>!parentNameKeys.has(normalizeText(student.name)))
        : row.linkedChildren;
      const childGroups = buildChildGroups(cleanChildren);
      return {
        ...row,
        displayName:bestName,
        email:pick('email'),
        phone:pick('phone') || pick('parentPhone'),
        createdAt:pick('createdAt'),
        linkedChildren:cleanChildren,
        childGroups,
        statusValue:bestStatusParent?.parentContactStatus || row.parent.parentContactStatus || 'new',
        duplicateCount:Math.max(0,allParents.length-1),
        hiddenStudentCount:Math.max(0,row.linkedChildren.length-cleanChildren.length)
      };
    });
    return mergedRows.filter(row=>{
      if(statusFilter!=='all' && row.statusValue!==statusFilter) return false;
      if(!q) return true;
      return row.parents.some(parent=>
          normalizeText(parent.displayName).includes(q) ||
          normalizeText(parent.email).includes(q) ||
          normalizeText(parent.parentContactNotes).includes(q) ||
          normalizeText(parent.parentContactOwner).includes(q)
        ) ||
        row.rawNames.some(name=>normalizeText(name).includes(q)) ||
        row.linkedChildren.some(student=>
          normalizeText(student.name).includes(q) ||
          normalizeText(student.teacher).includes(q) ||
          normalizeText(student.subject).includes(q) ||
          normalizeText(student.group).includes(q)
        );
    }).sort((a,b)=>(a.displayName||a.email||'').localeCompare(b.displayName||b.email||'','et'));
  },[parents,students,invoices,search,statusFilter]);
  const linkedCount = parentRows.filter(row=>row.linkedChildren.length>0).length;
  const missingCount = parentRows.filter(row=>row.rawNames.length>0&&row.linkedChildren.length===0).length;
  const unpaidTotal = parentRows.reduce((sum,row)=>sum+row.unpaid.reduce((a,inv)=>a+(parseFloat(inv.amount)||0),0),0);
  const todayCalls = parentRows.filter(row=>row.parent.parentNextContactAt===today()).length;
  const openStudent = student => {
    setSelStu(student);
    setTab('students');
  };
  const parentHasStudentRole = parent => {
    const roles = Array.isArray(parent?.roles) ? parent.roles : [];
    return parent?.studentRole===true || roles.includes('student') || parent?.role==='student';
  };
  return(
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div>
          <h1 style={{fontSize:'1.7rem'}}>Lapsevanemad</h1>
          <div style={{fontSize:'.9rem',color:'#42536A',marginTop:4}}>
            Eraldi vanemate baas: seotud lapsed, õppeained, õpetajad ja maksed.
          </div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'flex-end'}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Otsi vanemat, last, õpetajat…" style={{width:310,padding:'9px 14px'}}/>
          <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{width:'auto'}}>
            <option value="all">Kõik staatused</option>
            {Object.entries(parentStatusMeta).map(([key,meta])=><option key={key} value={key}>{meta.t}</option>)}
          </select>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12}}>
        <div className="stat-card"><div className="stat-label">Lapsevanemaid</div><div className="stat-value">{parentRows.length}</div></div>
        <div className="stat-card"><div className="stat-label">Seotud lastega</div><div className="stat-value" style={{color:'#2F5D50'}}>{linkedCount}</div></div>
        <div className="stat-card"><div className="stat-label">Vajab sidumist</div><div className="stat-value" style={{color:missingCount?'#991b1b':'#2F5D50'}}>{missingCount}</div></div>
        <div className="stat-card"><div className="stat-label">Ootel arved</div><div className="stat-value" style={{color:unpaidTotal?'#991b1b':'#2F5D50'}}>{unpaidTotal}€</div></div>
        <div className="stat-card"><div className="stat-label">Täna ühendust</div><div className="stat-value" style={{color:todayCalls?'#C9882A':'#2F5D50'}}>{todayCalls}</div></div>
      </div>

      {isAdmin&&parentAlerts?.length>0&&(
        <div className="card" style={{padding:18,border:'1px solid #fecaca',background:'#fff7f7'}}>
          <div style={{fontWeight:800,color:'#991b1b',marginBottom:8}}>Uued lapsevanema registreeringud vajavad kontrolli</div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {parentAlerts.map(alert=>(
              <div key={alert.parent.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap',borderTop:'1px solid #fecaca',paddingTop:8}}>
                <div>
                  <strong>{alert.parent.displayName||alert.parent.email}</strong>
                  <span style={{color:'#42536A'}}> · {alert.childNames.join(', ')}</span>
                </div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'flex-end'}}>
                  <button onClick={()=>markParentChecked(alert.parent)} className="btn btn-ghost btn-sm">
                    Kontrollitud
                  </button>
                  <button onClick={()=>createMissingParentStudents(alert.parent)} className="btn btn-red btn-sm">
                    Loo / seo õpilane
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(360px,1fr))',gap:16}}>
        {parentRows.map(row=>(
          <div key={row.key||row.parent.id} className="card" style={{padding:20,display:'flex',flexDirection:'column',gap:14,border:row.parent.parentNextContactAt===today()?'1px solid #C9882A':'1px solid rgba(28,43,58,.07)'}}>
            <div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'flex-start'}}>
              <div>
                <h2 style={{fontSize:'1.15rem',marginBottom:4}}>{row.displayName||noData}</h2>
                <div style={{fontSize:'.82rem',color:'#42536A'}}>{row.email||noData}</div>
                <div style={{fontSize:'.78rem',color:'#42536A',marginTop:4}}>Lisatud: {row.createdAt||noData}</div>
              </div>
              <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
                <span className="badge" style={{background:row.linkedChildren.length?'#dcfce7':'#fee2e2',color:row.linkedChildren.length?'#166534':'#991b1b'}}>
                  {row.linkedChildren.length?`${row.linkedChildren.length} kirjet`:'sidumata'}
                </span>
                {row.duplicateCount>0&&(
                  <span className="badge" style={{background:'#fef3c7',color:'#92400e'}}>
                    {row.duplicateCount} duplikaat peidetud
                  </span>
                )}
                {row.hiddenStudentCount>0&&(
                  <span className="badge" style={{background:'#fee2e2',color:'#991b1b'}}>
                    {row.hiddenStudentCount} vale kaart peidetud
                  </span>
                )}
                <span className="badge" style={{
                  background:(parentStatusMeta[row.statusValue||'new']||parentStatusMeta.new).bg,
                  color:(parentStatusMeta[row.statusValue||'new']||parentStatusMeta.new).c
                }}>
                  {(parentStatusMeta[row.statusValue||'new']||parentStatusMeta.new).t}
                </span>
                <button
                  onClick={()=>setEditingParentId(current=>current===row.parent.id?'':row.parent.id)}
                  className="btn btn-ghost btn-sm">
                  <i className={`fa-solid ${editingParentId===row.parent.id?'fa-check':'fa-pen'}`}/>
                  {editingParentId===row.parent.id?'Valmis':'Muuda'}
                </button>
              </div>
            </div>

            {editingParentId===row.parent.id?(
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                <label style={{fontSize:'.76rem',fontWeight:800,color:'#42536A'}}>
                  Kontakti staatus
                  <select defaultValue={row.parent.parentContactStatus||'new'} onChange={e=>updateParent(row.parent,{parentContactStatus:e.target.value})}>
                    {Object.entries(parentStatusMeta).map(([key,meta])=><option key={key} value={key}>{meta.t}</option>)}
                  </select>
                </label>
                <label style={{fontSize:'.76rem',fontWeight:800,color:'#42536A'}}>
                  Suhtluskanal
                  <select defaultValue={row.parent.parentContactChannel||'phone'} onChange={e=>updateParent(row.parent,{parentContactChannel:e.target.value})}>
                    <option value="phone">Telefon</option>
                    <option value="email">E-post</option>
                    <option value="whatsapp">WhatsApp</option>
                    <option value="telegram">Telegram</option>
                    <option value="other">Muu</option>
                  </select>
                </label>
                <label style={{fontSize:'.76rem',fontWeight:800,color:'#42536A'}}>
                  Järgmine kontakt
                  <input type="date" defaultValue={row.parent.parentNextContactAt||''} onBlur={e=>updateParent(row.parent,{parentNextContactAt:e.target.value})}/>
                </label>
                <label style={{fontSize:'.76rem',fontWeight:800,color:'#42536A'}}>
                  Vastutaja
                  <input defaultValue={row.parent.parentContactOwner||''} placeholder="Kes suhtleb?" onBlur={e=>updateParent(row.parent,{parentContactOwner:e.target.value})}/>
                </label>
              </div>
            ):(
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:8,padding:12,borderRadius:12,background:'#F9F8F6',fontSize:'.78rem',color:'#42536A'}}>
                <div><strong>Kanal</strong><br/>{({phone:'Telefon',email:'E-post',whatsapp:'WhatsApp',telegram:'Telegram',other:'Muu'})[row.parent.parentContactChannel||'phone']}</div>
                <div><strong>Järgmine kontakt</strong><br/>{row.parent.parentNextContactAt?fmtDate(row.parent.parentNextContactAt):'Pole määratud'}</div>
                <div><strong>Vastutaja</strong><br/>{row.parent.parentContactOwner||'Pole määratud'}</div>
              </div>
            )}

            <div>
              <div style={{fontSize:'.72rem',fontWeight:800,letterSpacing:'.08em',textTransform:'uppercase',color:'#42536A',marginBottom:8}}>Lapsed</div>
              {row.childGroups.length===0&&(
                <div style={{padding:12,borderRadius:12,background:'#fff7f7',border:'1px solid #fecaca',color:'#991b1b',fontWeight:800}}>
                  Andmed puuduvad
                  {row.rawNames.length>0&&<div style={{fontSize:'.78rem',fontWeight:600,marginTop:4}}>Registreerimisel sisestatud: {row.rawNames.join(', ')}</div>}
                </div>
              )}
              {row.childGroups.map(child=>(
                <div key={normalizeText(child.name)||child.items[0]?.id} style={{border:'1px solid #e5e7eb',borderRadius:12,padding:10,marginBottom:8}}>
                  <div style={{fontWeight:800,marginBottom:7}}>{child.name||noData}</div>
                  <div style={{display:'flex',flexDirection:'column',gap:6}}>
                    {child.items.map(student=>(
                      <div key={student.id} style={{display:'grid',gridTemplateColumns:'1.1fr .8fr .9fr auto',gap:8,alignItems:'center',fontSize:'.8rem',color:'#42536A'}}>
                        <span>{student.subject||noData}</span>
                        <span>{student.level||'—'} → {student.targetLevel||'—'}</span>
                        <span>{student.teacher||noData}</span>
                        <button onClick={()=>openStudent(student)} className="btn btn-ghost btn-sm">Ava</button>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,fontSize:'.82rem',color:'#42536A'}}>
              <div><strong>Telefon:</strong><br/>{row.phone||noData}</div>
              <div><strong>Ootel arved:</strong><br/>{row.unpaid.length?`${row.unpaid.reduce((a,inv)=>a+(parseFloat(inv.amount)||0),0)} €`:'0 €'}</div>
            </div>
            {editingParentId===row.parent.id
              ? <textarea defaultValue={row.parent.parentContactNotes||''} placeholder="Mida lapsevanem ütles, millal tagasi helistada, kokkulepped..." onBlur={e=>updateParent(row.parent,{parentContactNotes:e.target.value})} style={{minHeight:74}}/>
              : <div style={{padding:'10px 12px',borderRadius:10,border:'1px solid rgba(28,43,58,.08)',fontSize:'.8rem',color:'#42536A'}}>
                  <strong>Märkmed:</strong> {row.parent.parentContactNotes||'Märkmeid pole.'}
                </div>
            }
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {row.phone&&<a className="btn btn-ghost btn-sm" href={`tel:${row.phone}`}><i className="fa-solid fa-phone"/> Helista</a>}
              {row.email&&<a className="btn btn-ghost btn-sm" href={`mailto:${row.email}`}><i className="fa-solid fa-envelope"/> E-post</a>}
              {isAdmin&&(
                <button onClick={()=>assignStudentToParent(row.parent,students)} className="btn btn-amber btn-sm">
                  <i className="fa-solid fa-link"/> Määra õpilane
                </button>
              )}
              {isAdmin&&(()=>{
                const alreadyStudent = row.parents.some(parentHasStudentRole);
                return (
                  <button
                    onClick={()=>alreadyStudent?notify?.('✓ Õpilase roll on juba olemas'):changeParentToStudent(row.parent)}
                    disabled={alreadyStudent}
                    className="btn btn-ghost btn-sm"
                    style={{color:alreadyStudent?'#64748b':'#2563eb',opacity:alreadyStudent?0.75:1}}>
                    <i className="fa-solid fa-user-graduate"/> {alreadyStudent?'Õpilase roll olemas':'Lisa õpilase roll'}
                  </button>
                );
              })()}
              {isAdmin&&row.rawNames.length>0&&row.linkedChildren.length===0&&(
                <button onClick={()=>createMissingParentStudents(row.parent)} className="btn btn-red btn-sm">
                  Loo / seo õpilane
                </button>
              )}
              {isAdmin&&(row.duplicateCount>0||row.hiddenStudentCount>0)&&(
                <button onClick={()=>mergeParentDuplicates(row)} className="btn btn-amber btn-sm">
                  Ühenda duplikaadid
                </button>
              )}
            </div>
          </div>
        ))}
        {parentRows.length===0&&(
          <div className="card" style={{gridColumn:'1/-1',padding:32,textAlign:'center',color:'#42536A'}}>
            Lapsevanemaid ei leitud.
          </div>
        )}
      </div>
    </div>
  );
}

// ── ÕPILASTE ANDMEBAAS ───────────────────────────────────────
function StudentsDatabaseView({
  filteredStudents,lessons,invoices,isAdmin,search,setSearch,stuFilter,setStuFilter,
  groupFilter,setGroupFilter,groupOptions,contactFilter,setContactFilter,studentSort,setStudentSort,openStudent,setEditStu,user,
  nName,setNName,nParentName,setNParentName,nEmail,setNEmail,nPhone,setNPhone,nLevel,setNLevel,nTarget,setNTarget,
  nSubject,setNSubject,nGrade,setNGrade,nGroup,setNGroup,nPkg,setNPkg,nTeach,setNTeach,addStudent,mergeStudentDuplicates,repairStudentOwnershipLinks,groupStudents,ungroupStudent
}) {
  const [showAddForm,setShowAddForm] = React.useState(false);
  const [groupMode,setGroupMode] = React.useState('table');
  const [teacherFocus,setTeacherFocus] = React.useState('');
  const [groupingMode,setGroupingMode] = React.useState(false);
  const [selectedForGroup,setSelectedForGroup] = React.useState([]);
  const [mergePrimaryByGroup,setMergePrimaryByGroup] = React.useState({});

  const toggleSelectForGroup = (student) => {
    setSelectedForGroup(prev=>
      prev.find(s=>s.id===student.id)
        ? prev.filter(s=>s.id!==student.id)
        : [...prev, student]
    );
  };

  // Build grouped view: students with same groupId shown together
  const studentGroups = React.useMemo(()=>{
    const groups = {};
    const ungrouped = [];
    filteredStudents.forEach(s=>{
      if(s.groupId){
        if(!groups[s.groupId]) groups[s.groupId]=[];
        groups[s.groupId].push(s);
      } else {
        ungrouped.push(s);
      }
    });
    // Return flat list but mark group members
    const result = [];
    const seenGroups = new Set();
    filteredStudents.forEach(s=>{
      if(!s.groupId){
        result.push({...s,_isGroup:false});
      } else if(!seenGroups.has(s.groupId)){
        seenGroups.add(s.groupId);
        const members = groups[s.groupId];
        result.push({...members[0],_isGroup:true,_groupMembers:members});
      }
    });
    return result;
  },[filteredStudents]);
  const teacherScope = canonicalTeacherName(user?.displayName);
  const NoData = ({inline=false}) => (
    <span style={{
      display:inline?'inline-flex':'flex',alignItems:'center',justifyContent:'center',
      minHeight:inline?24:34,padding:inline?'3px 8px':'7px 10px',borderRadius:10,
      background:'#fee2e2',border:'1px solid #fecaca',color:'#991b1b',
      fontWeight:800,fontSize:inline?'.72rem':'.78rem',boxShadow:'0 0 0 3px rgba(239,68,68,.08)'
    }}>Andmed puuduvad</span>
  );
  const teacherStudents = React.useMemo(()=>{
    if(!teacherFocus) return [];
    return filteredStudents.filter(s=>canonicalTeacherName(s.teacher)===teacherFocus);
  },[filteredStudents,teacherFocus]);
  const groupedStudents = React.useMemo(()=>{
    const titleFor = student => {
      if(groupMode==='group') return student.group || 'Grupita';
      if(groupMode==='level') return `${student.level||'Tase puudub'} → ${student.targetLevel||'Siht puudub'}`;
      if(groupMode==='subject') return student.subject || 'Õppeaine puudub';
      if(groupMode==='teacher') return student.teacher || 'Õpetaja puudub';
      return 'Kõik õpilased';
    };
    return Object.entries(filteredStudents.reduce((acc,student)=>{
      const title = titleFor(student);
      if(!acc[title]) acc[title]=[];
      acc[title].push(student);
      return acc;
    },{})).sort((a,b)=>a[0].localeCompare(b[0],'et'));
  },[filteredStudents,groupMode]);
  const contactMeta = {
    new:{bg:'#dbeafe',c:'#1d4ed8',t:'Uus'},
    contacted:{bg:'#fef3c7',c:'#92400e',t:'Võetud ühendust'},
    waiting:{bg:'#fee2e2',c:'#991b1b',t:'Ootab vastust'},
    scheduled:{bg:'#ede9fe',c:'#6d28d9',t:'Tund kokku lepitud'},
    active:{bg:'#dcfce7',c:'#166534',t:'Aktiivne õpilane'}
  };
  const duplicateGroups = React.useMemo(()=>{
    const grouped = filteredStudents.reduce((acc,student)=>{
      if(student.active===false) return acc;
      if(student.convertedToParent) return acc;
      if(student.mergedIntoStudentId) return acc;
      if(student.mergedAt && student.mergedIntoStudentName) return acc;
      if(student.groupId) return acc; // already grouped with other subjects — not a duplicate
      if(!normalizeText(student.name)) return acc;
      const key = studentProfileKey(student);
      if(!key) return acc;
      if(!acc[key]) acc[key]=[];
      acc[key].push(student);
      return acc;
    },{});
    return Object.values(grouped).filter(group=>group.length>1);
  },[filteredStudents]);
  return(
    <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div>
          <h1 style={{fontSize:'1.7rem'}}>Õpilaste andmebaas</h1>
          <div style={{fontSize:'.9rem',color:'#42536A',marginTop:4}}>
            Tabelivaade kiireks otsimiseks, filtreerimiseks ja profiili muutmiseks.
          </div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'flex-end'}}>
          <button onClick={()=>setShowAddForm(v=>!v)} className="btn btn-pine">
            <i className="fa-solid fa-user-plus"/> Lisa õpilane
          </button>
          {isAdmin&&(
            groupingMode
              ? <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  <span style={{fontSize:'.8rem',color:'#42536A',fontWeight:600}}>Valitud: {selectedForGroup.length}</span>
                  <button
                    disabled={selectedForGroup.length<2}
                    onClick={async()=>{await groupStudents(selectedForGroup);setGroupingMode(false);setSelectedForGroup([]);}}
                    className="btn btn-pine">
                    ✓ Grupeeri ({selectedForGroup.length})
                  </button>
                  <button
                    disabled={selectedForGroup.length<2}
                    onClick={async()=>{await mergeStudentDuplicates(selectedForGroup);setGroupingMode(false);setSelectedForGroup([]);}}
                    className="btn btn-amber">
                    Ühenda duplikaadid
                  </button>
                  <button onClick={()=>{setGroupingMode(false);setSelectedForGroup([]);}} className="btn btn-ghost">Tühista</button>
                </div>
              : <button onClick={()=>setGroupingMode(true)} className="btn btn-ghost">
                  <i className="fa-solid fa-layer-group"/> Vali kaardid
                </button>
          )}
          {isAdmin&&<button onClick={repairStudentOwnershipLinks} className="btn btn-ghost">
            <i className="fa-solid fa-link"/> Kontrolli kontoseoseid
          </button>}
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Otsi nime, õpetajat, e-posti…" style={{width:280,padding:'9px 14px'}}/>
          <select value={studentSort} onChange={e=>setStudentSort(e.target.value)} style={{width:'auto'}}>
            <option value="name_asc">Sort: nimi A-Z</option>
            <option value="name_desc">Sort: nimi Z-A</option>
            <option value="level_asc">Sort: tase A1-C1</option>
            <option value="level_desc">Sort: tase C1-A1</option>
            <option value="subject_asc">Sort: õppeaine</option>
            <option value="group_asc">Sort: grupp</option>
            <option value="teacher_asc">Sort: õpetaja</option>
          </select>
          <select value={groupMode} onChange={e=>setGroupMode(e.target.value)} style={{width:'auto'}}>
            <option value="table">Vaade: tabel</option>
            <option value="group">Vaade: grupid</option>
            <option value="level">Vaade: tasemed</option>
            <option value="subject">Vaade: õppeained</option>
            <option value="teacher">Vaade: õpetajad</option>
          </select>
          <select value={groupFilter} onChange={e=>setGroupFilter(e.target.value)} style={{width:'auto'}}>
            <option value="all">Kõik grupid</option>
            {groupOptions.map(group=><option key={group} value={group}>{group}</option>)}
          </select>
          <select value={contactFilter} onChange={e=>setContactFilter(e.target.value)} style={{width:'auto'}}>
            <option value="all">Kõik kontaktid</option>
            {CONTACT_STATUSES.map(status=><option key={status.id} value={status.id}>{status.label}</option>)}
          </select>
          <select value={stuFilter} onChange={e=>setStuFilter(e.target.value)} style={{width:'auto'}}>
            <option value="active">Aktiivsed</option>
            <option value="all">Kõik</option>
            <option value="inactive">Arhiveeritud</option>
          </select>
        </div>
      </div>

      {showAddForm&&(
        <div className="card" style={{padding:24}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,marginBottom:16,flexWrap:'wrap'}}>
            <h3>➕ Lisa uus õpilane</h3>
            <div style={{fontSize:'.82rem',color:'#42536A'}}>Siin lisatud õpilane ilmub kohe valitud õpetaja nimekirja.</div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(185px,1fr))',gap:10,marginBottom:12}}>
            <input value={nName} onChange={e=>setNName(e.target.value)} placeholder="Lapse nimi *"/>
            <input value={nParentName} onChange={e=>setNParentName(e.target.value)} placeholder="Vanema nimi"/>
            <input value={nEmail} onChange={e=>setNEmail(e.target.value)} type="email" placeholder="E-post"/>
            <input value={nPhone} onChange={e=>setNPhone(e.target.value)} placeholder="Telefon +372…"/>
            <select value={nLevel} onChange={e=>setNLevel(e.target.value)}>{LEVELS.map(l=><option key={l} value={l}>Tase: {l}</option>)}</select>
            <select value={nTarget} onChange={e=>setNTarget(e.target.value)}>{LEVELS.slice(1).map(l=><option key={l} value={l}>Siht: {l}</option>)}</select>
            <select value={nSubject} onChange={e=>setNSubject(e.target.value)}>
              {SUBJECTS.map(subject=><option key={subject} value={subject}>{subject}</option>)}
            </select>
            <select value={nGrade} onChange={e=>setNGrade(e.target.value)}>
              <option value="">Klass / vanus (valikuline)</option>
              {GRADES.map(g=><option key={g} value={g}>{g}</option>)}
            </select>
            <select value={nGroup} onChange={e=>setNGroup(e.target.value)}>
              <option value="">Grupp: määramata</option>
              {groupOptions.map(group=><option key={group} value={group}>{group}</option>)}
            </select>
            <input value={nPkg} onChange={e=>setNPkg(e.target.value)} type="number" placeholder="Paketi maht (nt. 10)"/>
            {(isAdmin||user?.role==='admin')
              ? <select value={nTeach} onChange={e=>setNTeach(e.target.value)}>{TEACHERS.map(t=><option key={t} value={t}>Õp: {t}</option>)}</select>
              : <input value={nTeach} readOnly style={{opacity:.7}}/>
            }
          </div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            <button onClick={addStudent} className="btn btn-pine">
              <i className="fa-solid fa-user-plus"/> Lisa õpilane
            </button>
            <button onClick={()=>setShowAddForm(false)} className="btn btn-ghost">Sulge</button>
          </div>
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12}}>
        <div className="card" style={{padding:'16px 18px'}}>
          <div style={{fontSize:'.74rem',color:'#42536A',fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}}>Õpilasi kokku</div>
          <div style={{fontSize:'1.6rem',fontWeight:700,marginTop:8}}>{filteredStudents.length}</div>
        </div>
        <div className="card" style={{padding:'16px 18px'}}>
          <div style={{fontSize:'.74rem',color:'#42536A',fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}}>Aktiivsed</div>
          <div style={{fontSize:'1.6rem',fontWeight:700,marginTop:8,color:'#2F5D50'}}>{filteredStudents.filter(s=>s.active!==false).length}</div>
        </div>
        <div className="card" style={{padding:'16px 18px'}}>
          <div style={{fontSize:'.74rem',color:'#42536A',fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}}>Paketid lõppemas</div>
          <div style={{fontSize:'1.6rem',fontWeight:700,marginTop:8,color:'#C9882A'}}>{filteredStudents.filter(s=>{
            const summary=legacyPackageSummary(s);
            return summary.total>0&&summary.remaining<=3;
          }).length}</div>
        </div>
        <div className="card" style={{padding:'16px 18px'}}>
          <div style={{fontSize:'.74rem',color:'#42536A',fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}}>Tasumata arved</div>
          <div style={{fontSize:'1.6rem',fontWeight:700,marginTop:8,color:'#991b1b'}}>{invoices.filter(i=>i.status==='Ootel').length}</div>
        </div>
      </div>

      {isAdmin&&duplicateGroups.length>0&&(
        <div className="card" style={{padding:18,border:'1px solid #fbbf24',background:'#fffbeb'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
            <div>
              <div style={{fontWeight:900,color:'#92400e'}}>Võimalikud õpilaste duplikaadid</div>
              <div style={{fontSize:'.82rem',color:'#42536A',marginTop:4}}>
                Ühenda sama lapse korduvad kaardid, et tunnid, kodutööd ja arved oleksid ühes kohas.
              </div>
            </div>
            <span className="badge" style={{background:'#fef3c7',color:'#92400e'}}>{duplicateGroups.length} gruppi</span>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:12}}>
            {duplicateGroups.slice(0,8).map(group=>{
              const groupKey=studentProfileKey(group[0]);
              const primaryId=mergePrimaryByGroup[groupKey]||group[0].id;
              return <div key={groupKey} style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,flexWrap:'wrap',background:'#fff',border:'1px solid rgba(146,64,14,.16)',borderRadius:12,padding:12}}>
                <div>
                  <strong>{group[0].name||'Nimi puudub'}</strong>
                  <span style={{color:'#42536A'}}> · {group[0].subject||'Õppeaine puudub'} · {group[0].teacher||'Õpetaja puudub'} · {group.length} kirjet</span>
                </div>
                <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                  <label style={{fontSize:'.72rem',fontWeight:800,color:'#42536A'}}>Põhikaart
                    <select value={primaryId} onChange={event=>setMergePrimaryByGroup(previous=>({...previous,[groupKey]:event.target.value}))} style={{marginLeft:6,width:'auto'}}>
                      {group.map(student=><option key={student.id} value={student.id}>{student.name||'Nimi puudub'} · {student.email||student.parentEmail||student.id}</option>)}
                    </select>
                  </label>
                  <button onClick={()=>mergeStudentDuplicates(group,primaryId)} className="btn btn-amber btn-sm">
                    Kontrolli ja ühenda
                  </button>
                </div>
              </div>;
            })}
          </div>
        </div>
      )}

      {teacherFocus&&(
        <div className="card" style={{padding:20,border:'1px solid rgba(47,93,80,.2)'}}>
          <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'center',marginBottom:12,flexWrap:'wrap'}}>
            <div>
              <div style={{fontSize:'.74rem',color:'#42536A',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}}>Õpetaja õpilased</div>
              <h3 style={{marginTop:4}}>{teacherFocus}</h3>
            </div>
            <button onClick={()=>setTeacherFocus('')} className="btn btn-ghost btn-sm">Sulge</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(210px,1fr))',gap:10}}>
            {teacherStudents.map(student=>(
              <button key={student.id} onClick={()=>openStudent(student)} style={{textAlign:'left',background:'#fff',border:'1px solid rgba(28,43,58,.1)',borderRadius:12,padding:12,cursor:'pointer'}}>
                <div style={{fontWeight:800,color:'#1C2B3A'}}>{student.name||<NoData inline/>}</div>
                <div style={{fontSize:'.78rem',color:'#42536A',marginTop:4}}>{student.subject||'—'} · {student.level||'—'} → {student.targetLevel||'—'}</div>
                <div style={{fontSize:'.74rem',color:'#42536A',marginTop:4}}>Grupp: {student.group||'—'}</div>
              </button>
            ))}
            {teacherStudents.length===0&&<NoData/>}
          </div>
        </div>
      )}

      {groupMode!=='table'&&(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:14}}>
          {groupedStudents.map(([title,items])=>(
            <div key={title} className="card" style={{padding:18}}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10,marginBottom:12}}>
                <div>
                  <h3 style={{fontSize:'1.05rem'}}>{title}</h3>
                  <div style={{fontSize:'.78rem',color:'#42536A',marginTop:4}}>{items.length} õpilast</div>
                </div>
                <span className="badge" style={{background:'rgba(47,93,80,.12)',color:'#2F5D50'}}>{items.length}</span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {items.map(student=>(
                  <div key={student.id} style={{display:'grid',gridTemplateColumns:'1fr auto',gap:10,alignItems:'center',padding:12,border:'1px solid rgba(28,43,58,.08)',borderRadius:12,background:'#fff'}}>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:800,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{student.name||<NoData inline/>}</div>
                      <div style={{fontSize:'.75rem',color:'#42536A',marginTop:4}}>
                        {student.parentName ? `Vanem: ${student.parentName}` : <NoData inline/>}
                      </div>
                      <div style={{fontSize:'.75rem',color:'#42536A',marginTop:4}}>
                        {student.subject||'—'} · {student.level||'—'} → {student.targetLevel||'—'} · {student.group||'—'}
                      </div>
                      <button onClick={()=>setTeacherFocus(canonicalTeacherName(student.teacher||''))} style={{marginTop:6,background:'none',border:'none',padding:0,cursor:'pointer',color:'#2F5D50',fontWeight:700,fontSize:'.76rem'}}>
                        {student.teacher||'Õpetaja puudub'}
                      </button>
                    </div>
                    <button onClick={()=>openStudent(student)} className="btn btn-ghost btn-sm">Ava</button>
                  </div>
                ))}
              </div>
            </div>
          ))}
          {groupedStudents.length===0&&<div className="card" style={{padding:24}}><NoData/></div>}
        </div>
      )}

      {groupMode==='table'&&<div className="card scroll" style={{padding:0,overflow:'hidden'}}>
        <div style={{overflowX:'auto'}} className="scroll">
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:1180}}>
            <thead>
              <tr style={{background:'#F9F8F6',borderBottom:'1px solid rgba(28,43,58,.08)'}}>
                {groupingMode&&<th style={{padding:'10px 8px',width:36}}/>}
                {['Õpilane','Kontakt','Kontaktistaatus','Õpe','Grupp','Õpetaja','Paketid','Tunnid','Arved','Staatus','ID','Tegevused'].map(head=>(
                  <th key={head} style={{textAlign:'left',padding:'14px 16px',fontSize:'.76rem',fontWeight:700,color:'#42536A',textTransform:'uppercase',letterSpacing:'.08em'}}>
                    {head}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {studentGroups.map(item=>{
                const student = item;
                const studentLessons = lessons.filter(l=>{
                  const matchesStudent = l.studentId===student.id || normalizeText(l.studentName)===normalizeText(student.name);
                  if(!matchesStudent) return false;
                  if(isAdmin) return true;
                  return canonicalTeacherName(l.teacher)===teacherScope;
                });
                const completedLessons = studentLessons.filter(l=>l.status==='Toimunud');
                const unpaidInvoices = invoices.filter(i=>i.studentId===student.id&&i.status==='Ootel');
                const packageSummary = legacyPackageSummary(student);
                const remaining = packageSummary.remaining;
                const avgGrade = completedLessons.length ? avg(completedLessons.map(l=>l.grade)) : '—';
                const lastLesson = [...studentLessons].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
                const contact = contactMeta[student.contactStatus||'new'] || contactMeta.new;
                const statusBadge = student.active===false
                  ? {bg:'#f3f4f6',c:'#6b7280',t:'Arhiveeritud'}
                  : packageSummary.invalid
                    ? {bg:'#fee2e2',c:'#991b1b',t:'Vajab parandust'}
                    : remaining<=2 && packageSummary.total>0
                      ? {bg:'#fef3c7',c:'#92400e',t:'Jääk madal'}
                      : {bg:'#dcfce7',c:'#166534',t:'Aktiivne'};

                const isSelected = selectedForGroup.find(s=>s.id===student.id);
                if(item._isGroup){
                  // Render grouped row with all subjects
                  return(
                    <tr key={student.id} style={{background:'rgba(47,93,80,.04)',borderLeft:'3px solid #2F5D50'}}>
                      {groupingMode&&<td style={{padding:'8px 10px',verticalAlign:'middle'}}>
                        <input type="checkbox" checked={!!isSelected} onChange={()=>toggleSelectForGroup(student)}/>

  const activeStudents = React.useMemo(()=>students.filter(s=>s.active!==false),[students]);
  const visibleGroups = React.useMemo(()=>
    [...(groups||[])].sort((a,b)=>(a.name||'').localeCompare(b.name||'','et'))
  ,[groups]);

  const createGroup = async()=>{
    const ok = await addGroup({
      name:groupName,
      teacher:groupTeacher,
      subject:groupSubject,
      level:groupLevel
    });
    if(ok){
      setGroupName('');
      setGroupTeacher('Pavel');
      setGroupSubject('Eesti keel');
      setGroupLevel('A1');
      setShowForm(false);
    }
  };

  const setDraft = (groupId, patch)=>{
    setLessonDrafts(prev=>({
      ...prev,
      [groupId]: {
        day: 'Mon',
        time: '16:00',
        startDate: today(),
        ...(prev[groupId]||{}),
        ...patch
      }
    }));
  };

  const submitGroupLesson = async(group)=>{
    const draft = {day:'Mon',time:'16:00',startDate:today(),...(lessonDrafts[group.id]||{})};
    await addGroupLesson(group,draft);
    setLessonDrafts(prev=>({...prev,[group.id]:{day:'Mon',time:'16:00',startDate:today()}}));

  const dayLabel = day=>{
    const idx = DAYS_ID.indexOf(day);

    const idx = DAYS_ID.indexOf(day);
    return idx>=0 ? DAYS_SHORT[idx] : day;

  const groupLessonIds = group=>(group.lessons||[]).map(lesson=>lesson.id);

    const saved = group.studentLessonMap?.[studentId];
    return Array.isArray(saved) ? saved : groupLessonIds(group);

  const attendsGroupLesson = (group,studentId,lessonId)=>assignedLessonIds(group,studentId).includes(lessonId);

// ── SKILLMAP UPDATER ──────────────────────────────────────────────
const scoreToDelta = pct => pct>=90?5:pct>=75?3:pct>=60?1:pct>=40?0:-3;

async function updateSkillMapFromResult(studentId, skillsToUpdate, score) {
  if(!studentId||!skillsToUpdate?.length||!score||score.total===0) return;
  const delta = scoreToDelta(score.pct);
  try {
    const studentRef = db.collection('students').doc(studentId);
    const snap = await studentRef.get();
    if(!snap.exists) return;
    const currentMap = snap.data().skillMap||{};
    const updates = {};
    skillsToUpdate.forEach(({skill_id})=>{
      if(!skill_id) return;
      const cur = currentMap[skill_id]??null;
      if(cur===null||cur===undefined) {
        updates[`skillMap.${skill_id}`] = Math.max(0,Math.min(100,score.pct));
      } else {
        updates[`skillMap.${skill_id}`] = Math.max(0,Math.min(100,cur+delta));
      }
    });
    if(!Object.keys(updates).length) return;
    await studentRef.update({...updates, skillMapLastUpdated:new Date().toISOString()});
    console.info(`[SkillMapUpdater] Updated ${Object.keys(updates).length} skills, delta=${delta}`);
  } catch(err) {
    console.warn('[SkillMapUpdater] Update failed (non-critical):', err);
  }
}

// ── WORKSHEET ASSIGN MODAL ────────────────────────────────────
function AssignWorksheetModal({lesson, students, user, onClose, notify}) {
  const [sel, setSel] = React.useState([]);
  const [dueDate, setDueDate] = React.useState('');
  const [note, setNote] = React.useState('');
  const [saving, setSaving] = React.useState(false);
  const [currLessons, setCurrLessons] = React.useState([]);
  const [pickedLesson, setPickedLesson] = React.useState(null);
  const [wsSearch, setWsSearch] = React.useState('');
  const isPicker = !!(lesson._pickForStudent);
  React.useEffect(()=>{ if(lesson._pickForStudent) setSel([lesson._pickForStudent]); },[]);
  React.useEffect(()=>{
    if(!isPicker) return;
    db.collection('curriculumLessons').limit(200).get()
      .then(snap=>setCurrLessons(snap.docs.map(d=>({id:d.id,...d.data()})).filter(l=>l.worksheetData?.blocks?.length).sort((a,b)=>(a.subject||'').localeCompare(b.subject||'')||(a.level||'').localeCompare(b.level||'')||(a.title||'').localeCompare(b.title||''))))
      .catch(()=>{});
  },[isPicker]);
  const effectiveLesson = pickedLesson || lesson;
  const toggle = sid => setSel(p => p.includes(sid) ? p.filter(x=>x!==sid) : [...p, sid]);
  const active = students.filter(s => s.active !== false);
  const save = async () => {
    if(!sel.length){alert('Vali vähemalt üks õpilane');return;}
    if(isPicker&&!pickedLesson){alert('Vali tööleht');return;}
    setSaving(true);
    const batch = db.batch();
    sel.forEach(sid => {
      const st = students.find(s => s.id === sid);
      const ref = db.collection('worksheetAssignments').doc();
      batch.set(ref, {
        lessonId: effectiveLesson.id||'',
        lessonTitle: effectiveLesson.title||'',
        subject: effectiveLesson.subject||'',
        level: effectiveLesson.level||'',
        topic: effectiveLesson.topic||'',
        worksheetData: effectiveLesson.worksheetData||null,
        studentId: sid,
        studentName: st?.name||'',
        assignedBy: user.uid,
        assignedByName: user.displayName||user.email||'',
        assignedAt: new Date().toISOString(),
        dueDate: dueDate||'',
        note: note||'',
        status: 'new',
        score: null,
        completedAt: null,
        answers: {}
      });
    });
    await batch.commit();
    setSaving(false);
    notify('✓ Tööleht määratud '+sel.length+' õpilasele');
    onClose();
  };
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(28,43,58,.55)',display:'flex',alignItems:'center',justifyContent:'center',padding:16,zIndex:260,backdropFilter:'blur(5px)'}}>
      <div style={{background:'#FBFAF8',borderRadius:20,maxWidth:500,width:'100%',maxHeight:'92vh',overflow:'auto',display:'flex',flexDirection:'column'}}>

          {isPicker&&<div>
