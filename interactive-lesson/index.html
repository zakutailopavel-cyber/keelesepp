<!doctype html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KeeleSepp · Minu ülesanded</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script defer src="/interactive-response-view.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header><a class="brand" href="/haldus/">Keele<span>Sepp</span></a><h1>Minu ülesanded</h1><button id="home">Ülesannete loend</button></header>
  <div id="preview-banner" hidden><strong>Õpilase vaate kontroll</strong><span id="preview-student"></span><span>Proovivastuseid ei salvestata ega saadeta.</span><button id="preview-exit">Välju kontrollvaatest</button></div>
  <main>
    <p id="status" role="status">Kontrollin sisselogimist…</p>
    <a id="signin" href="/haldus.html" hidden>Logi sisse</a>
    <section id="list"></section>
    <section id="lesson" hidden>
      <div class="lesson-heading"><div><p class="eyebrow">INTERAKTIIVNE TUND</p><h2 id="title"></h2></div><div class="progress-copy"><strong id="progress-count"></strong><span id="progress-title"></span></div></div>
      <progress id="progress" max="1" value="0"></progress>
      <article>
        <p class="activity-number" id="activity-number"></p>
        <h3 id="activity-title"></h3>
        <p id="prompt"></p>
        <div id="assets"></div>
        <div id="response"></div>
        <p id="review-answer"></p>
        <details id="teacher-guide" hidden><summary>Õpetaja juhised</summary><pre id="teacher-content"></pre></details>
      </article>
      <div class="player-actions"><button id="previous">← Eelmine</button><button id="next">Järgmine →</button></div>
      <details id="outline"><summary>Kõik ülesanded <span id="outline-count"></span></summary><nav id="steps" aria-label="Ülesanded"></nav></details>
      <p id="feedback"></p>
      <div class="actions"><button id="save">Salvesta vastused</button><button id="submit">Saada õpetajale</button><button id="reload">Laadi serverist uuesti</button></div>
      <section id="review" hidden><label>Tagasiside<textarea id="review-text" maxlength="10000"></textarea></label><button id="review-save">Saada tagasiside</button></section>
    </section>
  </main>
</body>
</html>
