<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="Otsustusskeem: täissihitis või osasihitis">
<title>Otsustusskeem: täissihitis või osasihitis</title>
<rect width="900" height="700" fill="#fff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E1E1E"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="450" cy="360" rx="420" ry="300" fill="#E8F9B0"/>
<text x="450" y="44" font-size="28" font-weight="700" text-anchor="middle" fill="#1E1E1E">Sihitis: keda? mida? — omastav või osastav?</text>
<rect x="40" y="60" width="470" height="76" rx="38" fill="#fff" stroke="#1E1E1E" stroke-width="3"/>
<text x="275" y="106" font-size="20" font-weight="700" text-anchor="middle" fill="#1E1E1E">Kas lauses on „ei”?</text>
<line x1="510" y1="100" x2="585" y2="100" stroke="#1E1E1E" stroke-width="3" marker-end="url(#ah)"/>
<text x="545" y="90" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">JAH</text>
<rect x="590" y="60" width="280" height="76" rx="14" fill="#fff" stroke="#1E1E1E" stroke-width="3"/>
<text x="730" y="92" font-size="20" font-weight="700" text-anchor="middle" fill="#1E1E1E">OSASTAV</text>
<text x="730" y="120" font-size="15" text-anchor="middle" fill="#1E1E1E">Ma ei osta leiba.</text>
<line x1="275" y1="136" x2="275" y2="186" stroke="#1E1E1E" stroke-width="3" marker-end="url(#ah)"/>
<text x="290" y="166" font-size="16" font-weight="700" text-anchor="start" fill="#1E1E1E">EI</text>
<rect x="40" y="190" width="470" height="76" rx="38" fill="#fff" stroke="#1E1E1E" stroke-width="3"/>
<text x="275" y="236" font-size="20" font-weight="700" text-anchor="middle" fill="#1E1E1E">Kas on arv või hulk? (2, 3, palju)</text>
<line x1="510" y1="230" x2="585" y2="230" stroke="#1E1E1E" stroke-width="3" marker-end="url(#ah)"/>
<text x="545" y="220" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">JAH</text>
<rect x="590" y="190" width="280" height="76" rx="14" fill="#fff" stroke="#1E1E1E" stroke-width="3"/>
<text x="730" y="222" font-size="20" font-weight="700" text-anchor="middle" fill="#1E1E1E">OSASTAV</text>
<text x="730" y="250" font-size="15" text-anchor="middle" fill="#1E1E1E">kaks raamatut, palju leiba</text>
<line x1="275" y1="266" x2="275" y2="316" stroke="#1E1E1E" stroke-width="3" marker-end="url(#ah)"/>
<text x="290" y="296" font-size="16" font-weight="700" text-anchor="start" fill="#1E1E1E">EI</text>
<rect x="40" y="320" width="470" height="76" rx="38" fill="#fff" stroke="#1E1E1E" stroke-width="3"/>
<text x="275" y="366" font-size="20" font-weight="700" text-anchor="middle" fill="#1E1E1E">Kas tegusõna on ootama, aitama …?</text>
<line x1="510" y1="360" x2="585" y2="360" stroke="#1E1E1E" stroke-width="3" marker-end="url(#ah)"/>
<text x="545" y="350" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">JAH</text>
<rect x="590" y="320" width="280" height="76" rx="14" fill="#fff" stroke="#1E1E1E" stroke-width="3"/>
<text x="730" y="352" font-size="20" font-weight="700" text-anchor="middle" fill="#1E1E1E">OSASTAV</text>
<text x="730" y="380" font-size="15" text-anchor="middle" fill="#1E1E1E">Ma ootan bussi.</text>
<line x1="275" y1="396" x2="275" y2="446" stroke="#1E1E1E" stroke-width="3" marker-end="url(#ah)"/>
<text x="290" y="426" font-size="16" font-weight="700" text-anchor="start" fill="#1E1E1E">EI</text>
<rect x="40" y="450" width="470" height="76" rx="38" fill="#fff" stroke="#1E1E1E" stroke-width="3"/>
<text x="275" y="496" font-size="20" font-weight="700" text-anchor="middle" fill="#1E1E1E">Kas tegevus kestab või on ainult osa?</text>
<line x1="510" y1="490" x2="585" y2="490" stroke="#1E1E1E" stroke-width="3" marker-end="url(#ah)"/>
<text x="545" y="480" font-size="16" font-weight="700" text-anchor="middle" fill="#1E1E1E">JAH</text>
<rect x="590" y="450" width="280" height="76" rx="14" fill="#fff" stroke="#1E1E1E" stroke-width="3"/>
<text x="730" y="482" font-size="20" font-weight="700" text-anchor="middle" fill="#1E1E1E">OSASTAV</text>
<text x="730" y="510" font-size="15" text-anchor="middle" fill="#1E1E1E">Ma loen raamatut. Ma joon kohvi.</text>
<line x1="275" y1="526" x2="275" y2="572" stroke="#1E1E1E" stroke-width="3" marker-end="url(#ah)"/>
<text x="290" y="556" font-size="16" font-weight="700" text-anchor="start" fill="#1E1E1E">EI</text>
<rect x="110" y="580" width="760" height="96" rx="14" fill="#C9F03D" stroke="#1E1E1E" stroke-width="3"/>
<text x="490" y="616" font-size="22" font-weight="700" text-anchor="middle" fill="#1E1E1E">OMASTAV — tegevus lõpeb, asi on terve</text>
<text x="490" y="648" font-size="17" text-anchor="middle" fill="#1E1E1E">Ma ostsin leiva. Ma lugesin raamatu läbi. (mitmus: nimetav — ostsin raamatud)</text>
</g>
</svg>
