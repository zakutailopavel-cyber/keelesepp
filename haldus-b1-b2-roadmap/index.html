<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KeeleSepp — B2 õppekava uuendamine</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#EEECE7;color:#1C2B3A;font-family:Arial,sans-serif}.card{max-width:560px;margin:12vh auto;background:#fff;border:1px solid #DDD8CF;border-radius:16px;padding:28px;box-shadow:0 10px 35px rgba(28,43,58,.08)}h1{margin:0 0 10px;font-size:1.45rem}p{line-height:1.55;color:#607086}.bar{height:7px;border-radius:99px;background:#EEEAE4;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:20%;background:#2F5D50;animation:load 1.2s ease-in-out infinite alternate}@keyframes load{to{width:100%}}.err{color:#922;background:#FBEAEA;padding:12px;border-radius:9px;margin-top:14px}.done{color:#245044;background:#E7F2ED;padding:12px;border-radius:9px;margin-top:14px}a{color:#2F5D50;font-weight:700}
</style>
</head>
<body><main class="card"><h1>B2 õppekava uuendamine</h1><p id="status">Paigutan B1→B2 õpitee olemasoleva <b>Eesti keel → B2</b> õppekava sisse. Eraldi õpitee vaadet enam ei kasutata.</p><div class="bar" id="bar"><i></i></div><div id="msg"></div></main>
<script>
(function(){
const cfg={apiKey:"AIzaSyAp8emBOh1fIqv72k_O5hkLkXVkfBt1al4",authDomain:"keelesepp-5136b.firebaseapp.com",projectId:"keelesepp-5136b",storageBucket:"keelesepp-5136b.firebasestorage.app",messagingSenderId:"674098517935",appId:"1:674098517935:web:e73d04a4ada67874da015a"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.firestore();
const status=document.getElementById('status'),msg=document.getElementById('msg'),bar=document.getElementById('bar');
function extra(l){const t=(l.tag||'').toLowerCase(),a=(l.title||'').toLowerCase();if(t.includes('диагност'))return 'Сделай диагностический лист: говорение, грамматика, небольшое чтение/функциональная задача и письмо; добавь критерии быстрой оценки.';if(t.includes('проверка')||t.includes('большая')||t.includes('финал')||a.includes('vahehindamine'))return 'Сделай проверочный лист на перенос навыка: устная часть, языковой блок, практическая ситуация и письмо, плюс короткий чек-лист оценки.';if(t.includes('граммат')||t.includes('интеграция'))return 'Дай короткий language box, 2–3 упражнения на точность и обязательный переход к использованию конструкции в собственной речи.';if(t.includes('лексика'))return 'Активируй лексику через изображения, сопоставление, микродиалоги и ситуации; заверши говорением и коротким письмом.';if(t.includes('письмо')||a.includes('kirjut'))return 'Сначала дай устную подготовку и план, затем полезные связки, после этого письменное задание с объёмом и самопроверкой.';if(t.includes('чтение')||a.includes('lugemine'))return 'Добавь текст соответствующей сложности, понимание, лексику в контексте, анализ позиции и обсуждение.';if(t.includes('дискус')||t.includes('аргум')||t.includes('логика'))return 'Добавь мнение, аргументы, примеры, контраргумент и вывод, а также мини-дискуссию.';return 'Сделай полноценный тематический лист: разминка, основная практика, говорение и письменное закрепление; всё ведёт к критерию успеха.'}
function prompt(m,l){return `Сгенерируй рабочий лист для языковой школы KeeleSepp by EP Koolitus. Формат: A4, вертикальный. Если материал не помещается качественно на одну страницу, сделай 2 страницы A4, но не уменьши текст до неудобного размера. Ученик один. Уровень: ${l.levelStage}. Сохраняй единый фирменный стиль серии KeeleSepp: светлый фон, чистая современная вёрстка, тёмно-сине-зелёные заголовки, мягкие акцентные цвета, аккуратные скруглённые блоки, нумерованные задания, взрослый и современный вид. На листе обязательно должны быть тематические иллюстрации, картинки или карикатуры, которые помогают понять задания и соответствуют теме урока; не используй детский клипарт. Все задания и весь основной текст рабочего листа должны быть на эстонском языке. Добавь заголовок темы, уровень, 5–7 пронумерованных заданий, достаточно места для ответов, говорения и письма. Тема/урок: «${l.title}». Модуль: «${m.title}». Цель: ${l.goal} Языковой фокус: ${l.focus} Практика: ${l.practice} Критерий успеха: ${l.success} Цель модуля: ${m.goal} На что обратить внимание преподавателю: ${m.attention} ${extra(l)} В конце добавь короткое закрепление или самопроверку.`}
async function loadRoadmap(){const manifest=await fetch('/data/keelesepp-b1-b2-roadmap.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Roadmap manifest '+r.status);return r.json()});const parts=await Promise.all(manifest.shards.map(url=>fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(url+' '+r.status);return r.json()})));return {...manifest,modules:parts.flatMap(part=>part.modules)}}
function payload(R,m,l,u){return{type:'lesson',title:l.title,description:'',subject:'Eesti keel',level:'B2',topic:String(m.number).padStart(2,'0')+'. '+m.title,order:l.number,curriculumId:R.id,curriculumTitle:'B2 õppekava · B1→B2 õpitee',sourceKey:l.sourceKey,roadmapLessonId:l.id,roadmapLessonNumber:l.number,roadmapModuleId:m.id,roadmapModuleNumber:m.number,roadmapModuleTitle:m.title,roadmapModuleGoal:m.goal,roadmapModuleAttention:m.attention,roadmapTag:l.tag,roadmapKind:l.kind,levelStage:l.levelStage,goal:l.goal,languageFocus:l.focus,practice:l.practice,successCriteria:l.success,worksheetPrompt:prompt(m,l),roadmapVersion:R.version,roadmapManaged:true,authorUid:u.uid,authorName:u.displayName||u.email||'',updatedAt:firebase.firestore.FieldValue.serverTimestamp()}}
async function migrate(u){const userDoc=await db.collection('users').doc(u.uid).get(),role=userDoc.exists?userDoc.data().role:'';if(!(role==='admin'||role==='teacher'||(u.email||'').toLowerCase()==='zakutailo.pavel@gmail.com'))throw new Error('Vaja on õpetaja või administraatori õigusi.');const R=await loadRoadmap(),items=R.modules.flatMap(m=>m.lessons.map(l=>({m,l})));if(items.length!==90)throw new Error('Roadmap peab sisaldama 90 tundi, leiti '+items.length);const batch=db.batch();for(const {m,l} of items){batch.set(db.collection('curriculumLessons').doc(l.id),payload(R,m,l,u),{merge:true})}await batch.commit();bar.style.display='none';status.innerHTML='Valmis. <b>90 tundi</b> on nüüd olemasoleva <b>Eesti keel → B2</b> õppekava sees.';msg.className='done';msg.innerHTML='Töölehti lisatakse edaspidi otse Õppekavades vastava tunni pliiatsi nupu kaudu. Avan Õppekavad…';window.sessionStorage.removeItem('keelesepp-b2-roadmap-import-attempt');setTimeout(()=>location.replace('/haldus-exercises/?tab=curriculum&subject=Eesti%20keel&level=B2'),900)}
auth.onAuthStateChanged(u=>{if(!u){bar.style.display='none';status.textContent='Logi esmalt CRM-i sisse.';msg.innerHTML='<a href="/haldus/">Ava CRM</a>';return}migrate(u).catch(e=>{bar.style.display='none';msg.className='err';msg.textContent='Uuendamine ebaõnnestus: '+e.message})});
})();
</script></body></html>
