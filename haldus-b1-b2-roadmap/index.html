<style>body{font:14px Arial,sans-serif;margin:0;background:#eeeae4;color:#1c2b3a}header{background:#1c2b3a;color:#fff;padding:16px 24px;display:flex;justify-content:space-between}header a{color:#fff}.wrap{max-width:1180px;margin:auto;padding:24px}.hero,.module{background:#fff;border:1px solid #ddd8cf;border-radius:14px;margin-bottom:14px}.hero{padding:20px}.hero h1{margin:0 0 8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #cfc9be;border-radius:8px;background:#fff;padding:8px 11px;font-weight:700;cursor:pointer}.primary{background:#2f5d50;color:#fff;border-color:#2f5d50}.gold{background:#c9882a;color:#fff;border-color:#c9882a}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#f6f4ef;border-radius:9px;padding:8px 11px}.search{width:100%;padding:10px;border:1px solid #d8d2c9;border-radius:9px;margin:12px 0}.mh{padding:14px 16px;background:#f6f4ef;cursor:pointer;display:flex;justify-content:space-between}.mg{color:#667;font-size:12px;margin-top:5px}.lessons{display:none}.module.open .lessons{display:block}.lesson{display:grid;grid-template-columns:55px 1fr 250px;border-top:1px solid #eee8df}.num{display:flex;align-items:center;justify-content:center;font-weight:800;color:#2f5d50;background:#f5faf8}.body,.side{padding:12px}.title{font-weight:800;margin-bottom:6px}.f{font-size:12px;line-height:1.45;margin:3px 0}.f b{color:#2f5d50}.side{border-left:1px solid #eee8df}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}.chip{font-size:11px;background:#efede8;border-radius:999px;padding:4px 7px}.ok{background:#e5f1ec;color:#245044}.prompt{font-size:11px;color:#667;max-height:48px;overflow:hidden;margin-bottom:8px}.files{margin-top:7px}.file{font-size:11px;background:#f2f0ec;padding:5px 7px;border-radius:6px;margin:4px 0;display:flex;gap:5px}.file a{flex:1;color:#245044;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file button{border:0;background:none;color:#a33}.upload input{display:none}.notice{display:none;padding:10px;border-radius:8px;margin:10px 0}.notice.show{display:block}.notice.ok{background:#e5f1ec}.notice.err{background:#f8dede;color:#822}.gate{max-width:500px;margin:80px auto;background:#fff;padding:25px;border-radius:12px;text-align:center}.hidden{display:none}@media(max-width:800px){.lesson{grid-template-columns:48px 1fr}.side{grid-column:1/-1;border-left:0;border-top:1px solid #eee}.wrap{padding:12px}}</style></head><body>
<header><b>KeeleSepp · B1→B2 õpitee</b><a href="/haldus-exercises/">← Õppevara</a></header><div id="gate" class="gate">Kontrollin ligipääsu…</div><main id="app" class="wrap hidden"><section class="hero"><h1>B1 → B2 õppekava</h1><p>18 moodulit · 90 tundi. Sünkrooni õpitee Õppekavadesse, kopeeri tunni prompt ja lisa valmis tööleht otse tunni juurde.</p><div class="actions"><button id="sync" class="btn primary">Sünkrooni Õppekavadesse</button><a class="btn" href="/haldus-exercises/">Ava Õppekavad</a></div><div id="notice" class="notice"></div><div class="stats"><span class="stat"><b id="st">90</b> tundi</span><span class="stat"><b id="ss">0</b> sünkroonitud</span><span class="stat"><b id="sf">0</b> faili</span></div><input id="q" class="search" placeholder="Otsi tunni numbri, teema või eesmärgi järgi"></section><div id="mods"></div></main>
<script>(function(){
const cfg={apiKey:"AIzaSyAp8emBOh1fIqv72k_O5hkLkXVkfBt1al4",authDomain:"keelesepp-5136b.firebaseapp.com",projectId:"keelesepp-5136b",storageBucket:"keelesepp-5136b.firebasestorage.app",messagingSenderId:"674098517935",appId:"1:674098517935:web:e73d04a4ada67874da015a"};if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore(),storage=firebase.storage();let R,U,D=new Map();const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(t,k='ok'){let n=$('notice');n.className='notice show '+k;n.textContent=t;setTimeout(()=>n.className='notice',6000)}function flat(){return R.modules.flatMap(m=>m.lessons.map(l=>({m,l})))}
function extra(l){let t=(l.tag||'').toLowerCase(),a=(l.title||'').toLowerCase();if(t.includes('диагност'))return 'Сделай диагностический лист: говорение, грамматика, небольшое чтение/функциональная задача и письмо; добавь критерии быстрой оценки.';if(t.includes('проверка')||t.includes('большая')||t.includes('финал')||a.includes('vahehindamine'))return 'Сделай проверочный лист на перенос навыка: устная часть, языковой блок, практическая ситуация и письмо, плюс короткий чек-лист оценки.';if(t.includes('граммат')||t.includes('интеграция'))return 'Дай короткий language box, 2–3 упражнения на точность и обязательный переход к использованию конструкции в собственной речи.';if(t.includes('лексика'))return 'Активируй лексику через изображения, сопоставление, микродиалоги и ситуации; заверши говорением и коротким письмом.';if(t.includes('письмо')||a.includes('kirjut'))return 'Сначала дай устную подготовку и план, затем полезные связки, после этого письменное задание с объёмом и самопроверкой.';if(t.includes('чтение')||a.includes('lugemine'))return 'Добавь текст соответствующей сложности, понимание, лексику в контексте, анализ позиции и обсуждение.';if(t.includes('дискус')||t.includes('аргум')||t.includes('логика'))return 'Добавь мнение, аргументы, примеры, контраргумент и вывод, а также мини-дискуссию.';return 'Сделай полноценный тематический лист: разминка, основная практика, говорение и письменное закрепление; всё ведёт к критерию успеха.'}
function prompt(m,l){return `Сгенерируй рабочий лист для языковой школы KeeleSepp by EP Koolitus. Формат A4, вертикальный; если не помещается — 2 страницы, без уменьшения текста. Ученик один. Уровень: ${l.levelStage}. Единый стиль KeeleSepp: светлый фон, современная чистая вёрстка, тёмно-сине-зелёные заголовки, мягкие акценты, скруглённые блоки, нумерованные задания, взрослый вид. Обязательно тематические иллюстрации, картинки или карикатуры, помогающие заданиям; без детского клипарта. Все задания и основной текст — на эстонском. 5–7 заданий и достаточно места для ответов. Тема: «${l.title}». Модуль: «${m.title}». Цель: ${l.goal} Фокус: ${l.focus} Практика: ${l.practice} Критерий успеха: ${l.success} Цель модуля: ${m.goal} Внимание преподавателя: ${m.attention} ${extra(l)} В конце — короткое закрепление или самопроверка.`}
async function load(){let x=await fetch('/data/keelesepp-b1-b2-roadmap.json',{cache:'no-store'}).then(r=>r.json()),p=await Promise.all(x.shards.map(u=>fetch(u,{cache:'no-store'}).then(r=>r.json())));return {...x,modules:p.flatMap(z=>z.modules)}}
function pay(m,l){return{type:'lesson',title:l.title,description:l.goal,subject:R.subject,level:R.level,topic:String(m.number).padStart(2,'0')+'. '+m.title,order:l.number,curriculumId:R.id,curriculumTitle:R.title,sourceKey:l.sourceKey,roadmapLessonId:l.id,roadmapLessonNumber:l.number,roadmapModuleId:m.id,roadmapModuleNumber:m.number,roadmapModuleTitle:m.title,roadmapModuleGoal:m.goal,roadmapModuleAttention:m.attention,roadmapTag:l.tag,roadmapKind:l.kind,levelStage:l.levelStage,goal:l.goal,languageFocus:l.focus,practice:l.practice,successCriteria:l.success,worksheetPrompt:prompt(m,l),roadmapVersion:R.version,roadmapManaged:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}}
async function refresh(){let s=await db.collection('curriculumLessons').where('curriculumId','==',R.id).get();D=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));draw()}
async function sync(){let b=$('sync');b.disabled=true;try{let x=flat(),refs=x.map(z=>db.collection('curriculumLessons').doc(z.l.id)),sn=await Promise.all(refs.map(r=>r.get())),bt=db.batch();x.forEach((z,i)=>{let p=pay(z.m,z.l);if(!sn[i].exists){p.authorUid=U.uid;p.authorName=U.displayName||U.email||'';p.createdAt=firebase.firestore.FieldValue.serverTimestamp()}bt.set(refs[i],p,{merge:true})});await bt.commit();await refresh();note('90 tundi sünkroonitud. Olemasolevaid töölehti ei kirjutatud üle.')}catch(e){note('Sünkroonimine ebaõnnestus: '+e.message,'err')}finally{b.disabled=false}}
async function ensure(m,l){if(D.has(l.id))return;let p=pay(m,l);p.authorUid=U.uid;p.authorName=U.displayName||U.email||'';p.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection('curriculumLessons').doc(l.id).set(p,{merge:true})}
async function upload(m,l,inp){if(!inp.files.length)return;try{await ensure(m,l);for(const f of inp.files){if(f.size>19*1024*1024)throw Error('Fail on üle 19 MB');let path='curriculum/'+l.id+'_'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),ref=storage.ref(path);await ref.put(f,{contentType:f.type||'application/octet-stream'});let url=await ref.getDownloadURL(),item={name:f.name,url,size:f.size,type:f.type||'',storagePath:path,kind:'worksheet',roadmapLessonId:l.id,uploadedAt:new Date().toISOString()};await db.collection('curriculumLessons').doc(l.id).update({files:firebase.firestore.FieldValue.arrayUnion(item),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}await refresh();note('Tööleht lisatud tunni '+l.number+' juurde.')}catch(e){note('Faili lisamine ebaõnnestus: '+e.message,'err')}finally{inp.value=''}}
async function rm(l,i){let d=D.get(l.id),f=(d?.files||[]).slice(),x=f[i];if(!x||!confirm('Eemaldada '+x.name+'?'))return;try{if(x.storagePath)try{await storage.ref(x.storagePath).delete()}catch(e){}f.splice(i,1);await db.collection('curriculumLessons').doc(l.id).update({files:f});await refresh()}catch(e){note(e.message,'err')}}
function stats(){let x=flat();$('st').textContent=x.length;$('ss').textContent=x.filter(z=>D.has(z.l.id)).length;$('sf').textContent=[...D.values()].reduce((n,d)=>n+(d.files?.length||0),0)}
function draw(){stats();let q=$('q').value.toLowerCase(),root=$('mods');root.innerHTML='';R.modules.forEach(m=>{let ls=m.lessons.filter(l=>!q||[l.number,l.title,l.goal,l.focus,l.tag,m.title].join(' ').toLowerCase().includes(q));if(!ls.length)return;let s=document.createElement('section');s.className='module'+(q?' open':'');s.innerHTML=`<div class="mh"><div><b>Moodul ${m.number}. ${esc(m.title)}</b><div class="mg">Tunnid ${esc(m.lessonRange)} · ${m.lessons.filter(l=>D.has(l.id)).length}/5 Õppekavades</div></div><span>▾</span></div><div class="lessons"></div>`;s.querySelector('.mh').onclick=()=>s.classList.toggle('open');let box=s.querySelector('.lessons');ls.forEach(l=>{let d=D.get(l.id),fs=d?.files||[],r=document.createElement('div');r.className='lesson';r.innerHTML=`<div class="num">${l.number}</div><div class="body"><div class="title">${esc(l.title)}</div><div class="f"><b>Eesmärk:</b> ${esc(l.goal)}</div><div class="f"><b>Fookus:</b> ${esc(l.focus)}</div><div class="f"><b>Praktika:</b> ${esc(l.practice)}</div><div class="f"><b>Edu:</b> ${esc(l.success)}</div></div><div class="side"><div class="chips"><span class="chip ${d?'ok':''}">${d?'Õppekavas':'Pole sünkroonitud'}</span><span class="chip">${esc(l.levelStage)}</span></div><div class="prompt">${esc(prompt(m,l))}</div><button class="btn copy">Kopeeri prompt</button> <label class="btn gold upload">Lisa tööleht<input type="file" multiple accept=".pdf,.doc,.docx,image/*"></label><div class="files">${fs.map((f,i)=>`<div class="file"><a target="_blank" href="${esc(f.url)}">${esc(f.name)}</a><button data-i="${i}">×</button></div>`).join('')}</div></div>`;r.querySelector('.copy').onclick=async()=>{let p=prompt(m,l);try{await navigator.clipboard.writeText(p);note('Prompt kopeeritud.')}catch(e){window.prompt('Kopeeri:',p)}};let inp=r.querySelector('input');inp.onchange=()=>upload(m,l,inp);r.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>rm(l,+b.dataset.i));box.appendChild(r)});root.appendChild(s)})}
async function init(u){U=u;try{let ud=await db.collection('users').doc(u.uid).get(),role=ud.exists?ud.data().role:'';if(!(role==='admin'||role==='teacher'||u.email?.toLowerCase()==='zakutailo.pavel@gmail.com'))throw Error('Vaja on õpetaja või administraatori õigusi.');R=await load();$('gate').classList.add('hidden');$('app').classList.remove('hidden');$('sync').onclick=sync;$('q').oninput=draw;await refresh()}catch(e){$('gate').textContent=e.message}}auth.onAuthStateChanged(u=>u?init(u):$('gate').innerHTML='Logi esmalt sisse: <a href="/haldus/">CRM</a>');})();</script></body></html>
