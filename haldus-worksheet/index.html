<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback} = React;
const auth=window._auth, db=window._db, storage=window._storage;
const {authFetch} = window.HaldusShared;

const uid=()=>Math.random().toString(36).slice(2,9);

// ── READ PREFILL FROM LOCALSTORAGE ────────────────────────────
// Called once at module level — reads and immediately clears localStorage
const _prefill=(()=>{
  try{
    const raw=localStorage.getItem('ws_prefill');
    if(raw){localStorage.removeItem('ws_prefill');return JSON.parse(raw);}
  }catch(e){}
  return null;
})();
const WS_DRAFT_KEY='keelesepp_ws_autodraft_v1';
const _autosavedDraft=(()=>{
  if(_prefill)return null;
  try{
    const raw=localStorage.getItem(WS_DRAFT_KEY);
    const parsed=raw?JSON.parse(raw):null;
    return parsed?.meta&&Array.isArray(parsed?.blocks)?parsed:null;
  }catch(e){return null;}
})();

// ── CONSTANTS ─────────────────────────────────────────────────
const BTYPES=[

  {key:'choice',           label:'Vali vastus',      icon:'fa-list-check',       color:'#6d28d9',bg:'rgba(109,40,217,.1)'},
  {key:'writing',          label:'Kirjutamine',      icon:'fa-pen-nib',          color:'#A96E1A',bg:'rgba(169,110,26,.1)'},
  {key:'match',            label:'Sobita paarid',    icon:'fa-link',             color:'#047857',bg:'rgba(4,120,87,.1)'},
  {key:'connect',          label:'Ühenda nooltega',  icon:'fa-bezier-curve',     color:'#0f766e',bg:'rgba(15,118,110,.1)'},
  {key:'order',            label:'Jarjesta sonad',   icon:'fa-shuffle',          color:'#2F5D50',bg:'rgba(47,93,80,.1)'},
  {key:'table',            label:'Tabel',            icon:'fa-table',            color:'#0e7490',bg:'rgba(14,116,144,.1)'},
  {key:'text',             label:'Tekst / juhis',    icon:'fa-align-left',       color:'#718096',bg:'rgba(113,128,150,.1)'},

  {key:'image',            label:'Pilt',             icon:'fa-image',            color:'#0f766e',bg:'rgba(15,118,110,.1)'},

  {key:'diagram',          label:'Skeem',             icon:'fa-diagram-project',  color:'#0f766e',bg:'rgba(15,118,110,.1)'},
  {key:'comic',            label:'Koomiks',           icon:'fa-masks-theater',    color:'#b45309',bg:'rgba(180,83,9,.1)'},
  {key:'error_correction', label:'Leia viga',        icon:'fa-spell-check',      color:'#dc2626',bg:'rgba(220,38,38,.1)'},
  {key:'transformation',   label:'Muuda lauset',     icon:'fa-right-left',       color:'#7c3aed',bg:'rgba(124,58,237,.1)'},
];
const BT=Object.fromEntries(BTYPES.map(b=>[b.key,b]));

const mkBlock=type=>{
  const base={id:uid(),type,instruction:'',size:'full',imageUrl:'',imagePos:'top',label:''};
  if(type==='fill')             return{...base,text:'Mina [elan] Tallinnas ja [töötan] koolis.'};
  if(type==='choice')           return{...base,questions:[{q:'Mis on Eesti pealinn?',opts:['Tallinn','Tartu','Pärnu','Narva'],correct:0}]};
  if(type==='writing')          return{...base,task:'Kirjuta lühike tekst teemal "Minu pere" (50-80 sona).',lines:8};
  if(type==='match')            return{...base,pairs:[{l:'koer',r:'собака'},{l:'kass',r:'кошка'},{l:'lind',r:'птица'},{l:'kala',r:'рыба'}]};
  if(type==='connect')          return{...base,pairs:[{l:'koer',r:'собака'},{l:'kass',r:'кошка'},{l:'lind',r:'птица'}]};
  if(type==='order')            return{...base,sentence:'Ma armastan oppida eesti keelt'};
  if(type==='table')            return{...base,headers:['Sona','Tolge','Naite'],rows:4};
  if(type==='text')             return{...base,content:'',bold:false};
  if(type==='reading')          return{...base,passage:'Sisesta lugemistekst...',questions:[{q:'',opts:['','','',''],correct:0}]};
  if(type==='image')            return{...base,caption:''};
  if(type==='image_label')      return{...base,caption:'Kirjuta numbrite juurde õiged nimetused.',showWordBank:true,items:[{answer:'pea',x:50,y:20},{answer:'käsi',x:24,y:52},{answer:'jalg',x:52,y:84}]};
  if(type==='dialogue')         return{...base,lines:[{speaker:'A',text:'Tere! Kuidas laheb?'},{speaker:'B',text:'[vastus]'},{speaker:'A',text:'[vastus]'}]};
  if(type==='diagram')          return{...base,title:'Kuidas protsess toimub?',layout:'flow',centerText:'Põhiteema',nodes:[{text:'Esimene samm',color:'pine',blank:false},{text:'Teine samm',color:'gold',blank:true},{text:'Tulemus',color:'blue',blank:false}]};
  if(type==='comic')            return{...base,title:'Lühike olukord',taskMode:'read',panels:[{character:'Anna',emoji:'🙂',scene:'Kool',text:'Tere! Kas sa aitad mind?',caption:'Algus',blank:false},{character:'Mark',emoji:'🤔',scene:'Kool',text:'Jah, muidugi.',caption:'Lahendus',blank:true}]};
  if(type==='error_correction') return{...base,sentences:[{wrong:'Ma lahen eile poodi.',correct:'Ma laksin eile poodi.'}]};
  if(type==='transformation')   return{...base,example:{from:'Ma lahen poodi.',to:'Ma ei lahe poodi.'},sentences:['Ta tootab koolis.','Me elame Tallinnas.','Nad raagivad eesti keelt.']};
  return base;
};

// ── IMAGE UPLOADER ────────────────────────────────────────────
function ImgUploader({value,onChange}){
  const ref=useRef();
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState('');
  const handle=async file=>{
    if(!file)return;
    if(file.size>8*1024*1024){setErr('Pilt on liiga suur (max 8MB)');return;}
    setBusy(true);setErr('');
    try{
      const r=storage.ref(`worksheet/${Date.now()}_${file.name}`);
      await r.put(file);
      const url=await r.getDownloadURL();
      onChange(url);
    }catch(e){
      const reader=new FileReader();
      reader.onload=ev=>onChange(ev.target.result);
      reader.onerror=()=>setErr('Pildi laadimine ebaõnnestus');
      reader.readAsDataURL(file);
    }
    setBusy(false);
  };
  return(
    <div>
      <div className="img-upload" onClick={()=>ref.current?.click()}>
        <input ref={ref} type="file" accept="image/*" onChange={e=>handle(e.target.files[0])}/>
        {busy
          ?<div style={{padding:'14px 0',textAlign:'center'}}><div className="sp-dark" style={{margin:'0 auto 6px'}}/><div style={{fontSize:'.72rem',color:'#7A7167'}}>Laeb...</div></div>
          :value
            ?<img src={value} className="img-thumb" alt=""/>
            :<div><i className="fa-solid fa-image" style={{fontSize:'1.4rem',color:'#B0A898',marginBottom:4,display:'block'}}/><div style={{fontSize:'.75rem',color:'#1C2B3A',fontWeight:600}}>Klõpsa pildi lisamiseks</div><div style={{fontSize:'.68rem',color:'#7A7167',marginTop:2}}>JPG, PNG — kuni 8MB</div></div>}
      </div>
      {err&&<div style={{fontSize:'.72rem',color:'#dc2626',marginTop:4,padding:'4px 7px',background:'rgba(220,38,38,.07)',borderRadius:5}}>{err}</div>}
      {value&&<button onClick={()=>{onChange('');setErr('');}} style={{background:'none',border:'none',color:'#dc2626',cursor:'pointer',fontSize:'.72rem',marginTop:4,display:'flex',alignItems:'center',gap:4}}><i className="fa-solid fa-trash" style={{fontSize:'.65rem'}}/> Eemalda pilt</button>}
    </div>
  );
}

// ── BLOCK EDITORS ─────────────────────────────────────────────
function FillEd({b,upd}){return(<><div className="field-lbl">Tekst (vastused nurksulgudes [vastus])</div><textarea value={b.text} onChange={e=>upd({text:e.target.value})} rows={4} placeholder="Ma [elan] Tallinnas."/><div style={{fontSize:'.7rem',color:'#718096',marginTop:4,padding:'5px 7px',background:'rgba(29,78,216,.06)',borderRadius:6}}>Süntaks: <code>Ma [elan] koolis.</code></div></>);}

  return(<>{qs.map((q,i)=>(
    <div key={i} style={{marginBottom:8,padding:9,borderRadius:8,background:'#F9F8F6',border:'0.5px solid rgba(28,43,58,.1)'}}>

}

function WritingEd({b,upd}){return(<><div className="field-lbl">Ülesande kirjeldus</div><textarea value={b.task} onChange={e=>upd({task:e.target.value})} rows={3}/><div className="field-lbl">Ridade arv: {b.lines||6}</div><input type="range" min={2} max={20} value={b.lines||6} onChange={e=>upd({lines:+e.target.value})} style={{width:'100%'}}/></>);}

function MatchEd({b,upd}){

function OrderEd({b,upd}){return(<><div className="field-lbl">Lause õiges järjekorras</div><input value={b.sentence} onChange={e=>upd({sentence:e.target.value})} placeholder="Ma armastan eesti keelt"/><div style={{fontSize:'.7rem',color:'#718096',marginTop:4}}>Sõnad kuvatakse segamini</div></>);}

function TableEd({b,upd}){
  const hdrs=(b.headers||['','','']).map(h=>h.trim()).filter(Boolean);

function parseFill(text){
  const parts=[];
  text.split(/\[([^\]]+)\]/g).forEach((c,i)=>parts.push(i%2===0?{t:'text',v:c}:{t:'blank',a:c}));
  return parts;
}

// ── RESIZABLE IMAGE ───────────────────────────────────────────
function ResizableImage({src,caption,initWidth,onResize}){
  const[width,setWidth]=useState(initWidth||null);
  const wrapRef=useRef(null);
  const drag=useRef({active:false,startX:0,startW:0});
  useEffect(()=>{
    const onMove=e=>{if(!drag.current.active)return;const delta=e.clientX-drag.current.startX;const newW=Math.max(60,Math.min(740,drag.current.startW+delta));if(wrapRef.current)wrapRef.current.style.width=newW+'px';};
    const onUp=e=>{if(!drag.current.active)return;drag.current.active=false;const delta=e.clientX-drag.current.startX;const newW=Math.max(60,Math.min(740,drag.current.startW+delta));setWidth(newW);onResize&&onResize(newW);document.body.style.cursor='';document.body.style.userSelect='';};
    window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
    return()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
  },[onResize]);
  if(!src)return<div style={{background:'#F0EEE9',borderRadius:6,height:120,display:'flex',alignItems:'center',justifyContent:'center',color:'#B0A898',fontSize:'.82rem'}}>Pilt puudub</div>;
  return(
    <div>
      <div ref={wrapRef} className="img-resizable-wrap" style={{width:width?width+'px':'100%'}}>

      </div>

// ── PREVIEW BLOCK ─────────────────────────────────────────────
function PreviewBlock({block,index,onChange}){
  const bt=BT[block.type];if(!bt)return null;
  const renderImg=pos=>{
    if(!block.imageUrl||(block.imagePos||'top')!==pos)return null;
    return<div style={{marginBottom:pos==='bottom'?0:10,marginTop:pos==='bottom'?10:0}}><ResizableImage src={block.imageUrl} caption={block.caption} initWidth={block.imgWidth||null} onResize={w=>onChange&&onChange({...block,imgWidth:w})}/></div>;
  };
  const content=()=>{
    if(block.type==='image')return<ResizableImage src={block.imageUrl} caption={block.caption} initWidth={block.imgWidth||null} onResize={w=>onChange&&onChange({...block,imgWidth:w})}/>;
    if(block.type==='text')return<p className="pb-text" style={{fontWeight:block.bold?700:400,fontSize:block.bold?'1rem':'.9rem',whiteSpace:'pre-wrap'}}>{block.content||<span style={{color:'#C0B8B0',fontStyle:'italic'}}>Tekst puudub</span>}</p>;
    if(block.type==='fill')return<div className="fill-line">{parseFill(block.text||'').map((p,i)=>p.t==='text'?<span key={i}>{p.v}</span>:<span key={i} className="fill-blank">&nbsp;</span>)}</div>;
    if(block.type==='choice')return(block.questions||[]).map((q,qi)=>(<div key={qi} style={{marginBottom:10}}><div className="ch-q">{qi+1}. {q.q||'Küsimus...'}</div><div className="ch-opts">{q.opts.filter(Boolean).map((o,oi)=>(<div key={oi} className="ch-opt"><div className="ch-circle"/><span>{o}</span></div>))}</div></div>));
    if(block.type==='writing')return<div><div className="wr-task">{block.task}</div>{Array.from({length:block.lines||6}).map((_,i)=><div key={i} className="wr-line"/>)}</div>;
    if(block.type==='match'){const shuffledRight=useMemo(()=>[...(block.pairs||[])].sort(()=>Math.random()-.5),[block.id,JSON.stringify((block.pairs||[]).map(p=>p.r))]);return<div><div className="match-cols"><div>{(block.pairs||[]).map((p,i)=><div key={i} className="match-item">{i+1}. {p.l}</div>)}</div><div>{shuffledRight.map((p,i)=><div key={i} className="match-item">{String.fromCharCode(65+i)}. {p.r}</div>)}</div></div><div className="match-answer-row">{(block.pairs||[]).map((_,i)=><span key={i} className="match-ans">{i+1} — ___</span>)}</div></div>;}
    if(block.type==='order'){const words=useMemo(()=>(block.sentence||'').split(' ').filter(Boolean).sort(()=>Math.random()-.5),[block.id,block.sentence]);return<div><div className="order-chips">{words.map((w,i)=><span key={i} className="order-chip">{w}</span>)}</div><div className="order-ans">Kirjuta õige järjestus: ___________________________________________________</div></div>;}
    if(block.type==='table'){const cd=block.cellData||{};return<table className="ws-tbl"><thead><tr>{(block.headers||[]).map((h,i)=><th key={i}>{h||`Veerg ${i+1}`}</th>)}</tr></thead><tbody>{Array.from({length:block.rows||4}).map((_,ri)=>(<tr key={ri}>{(block.headers||[]).filter(Boolean).map((_,ci)=><td key={ci}>{cd[ri+','+ci]||''}</td>)}</tr>))}</tbody></table>;}
    if(block.type==='reading')return<div><div className="pb-passage">{block.passage}</div>{(block.questions||[]).map((q,qi)=>(<div key={qi} style={{marginBottom:10}}><div className="ch-q">{qi+1}. {q.q||'Küsimus...'}</div><div className="ch-opts">{q.opts.filter(Boolean).map((o,oi)=>(<div key={oi} className="ch-opt"><div className="ch-circle"/><span>{o}</span></div>))}</div></div>))}</div>;
    if(block.type==='image_label')return<ImageLabelView block={block}/>;
    if(block.type==='connect')return<ConnectView block={block}/>;
    if(block.type==='diagram')return<DiagramView block={block}/>;
    if(block.type==='comic')return<ComicView block={block}/>;
    if(block.type==='dialogue'){
      const lns=block.lines||[];
      return(<div style={{border:'1px solid rgba(28,43,58,.1)',borderRadius:8,overflow:'hidden'}}>
        {lns.map((line,i)=>{
          const isA=line.speaker==='A'||line.speaker==='Õpetaja';
          const parts=(line.text||'').split(/(\[[^\]]*\])/g);
          const hasBlank=parts.some(p=>p.startsWith('['));
          return(<div key={i} style={{display:'flex',alignItems:'flex-start',gap:8,padding:'8px 12px',background:isA?'#F9F8F6':'#fff',borderBottom:i<lns.length-1?'1px solid rgba(28,43,58,.06)':'none'}}>
            <span style={{fontSize:'.72rem',fontWeight:700,color:isA?'#2F5D50':'#1d4ed8',minWidth:60,flexShrink:0,paddingTop:2}}>{line.speaker}:</span>
            <span style={{fontSize:'.88rem',color:'#1C2B3A',flex:1}}>
              {hasBlank?parts.map((p,pi)=>p.startsWith('[')?<span key={pi} style={{display:'inline-block',minWidth:80,borderBottom:'1.5px solid #1C2B3A',margin:'0 3px'}}>&nbsp;</span>:<span key={pi}>{p}</span>):line.text}
            </span>
          </div>);
        })}
      </div>);
    }
    if(block.type==='error_correction'){
      const sents=block.sentences||[];
      return(<div>{sents.map((s,i)=>(
        <div key={i} style={{marginBottom:10}}>
          <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:4}}>
            <span style={{fontSize:'.72rem',fontWeight:800,color:'#dc2626',minWidth:20,paddingTop:2}}>{i+1}.</span>
            <div>
              <div style={{fontSize:'.88rem',color:'#7A7167',textDecoration:'line-through',marginBottom:3}}>{s.wrong}</div>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <span style={{fontSize:'.72rem',color:'#7A7167',flexShrink:0}}>Parandus:</span>
                <div style={{flex:1,borderBottom:'1.5px solid #1C2B3A',minHeight:20}}/>
              </div>
            </div>
          </div>
        </div>
      ))}</div>);
    }
    if(block.type==='transformation'){
      const sents=block.sentences||[];
      return(<div>
        {block.example&&<div style={{padding:'7px 11px',borderRadius:7,background:'#F0EEE9',border:'1px solid rgba(28,43,58,.1)',marginBottom:12,fontSize:'.84rem',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <span style={{color:'#7A7167',fontSize:'.72rem',fontWeight:700}}>NÄIDE:</span>
          <span>{block.example.from}</span>
          <span style={{color:'#C9882A',fontSize:'1rem'}}>→</span>
          <span style={{color:'#2F5D50',fontWeight:600}}>{block.example.to}</span>
        </div>}
        {sents.map((s,i)=>(
          <div key={i} style={{marginBottom:9,display:'flex',alignItems:'flex-start',gap:8}}>
            <span style={{fontSize:'.72rem',fontWeight:700,color:'#718096',minWidth:20,paddingTop:2,flexShrink:0}}>{i+1}.</span>
            <div style={{flex:1}}>
              <div style={{fontSize:'.88rem',color:'#1C2B3A',marginBottom:4}}>{s}</div>
              <div style={{borderBottom:'1px solid rgba(28,43,58,.2)',minHeight:20}}/>
            </div>
          </div>
        ))}
      </div>);
    }
    return null;
  };
  const withImg=['image','image_label'].includes(block.type)?<div>{content()}</div>
    :block.imageUrl&&(block.imagePos||'top')==='right'
      ?<div style={{display:'flex',alignItems:'flex-start'}}><div style={{flex:1}}>{content()}</div><div style={{flexShrink:0,marginLeft:12}}><ResizableImage src={block.imageUrl} caption={null} initWidth={block.imgWidth||120} onResize={w=>onChange&&onChange({...block,imgWidth:w})}/></div></div>
      :<div>{renderImg('top')}{content()}{renderImg('bottom')}</div>;
  const colStyle=block.size==='half'?{width:'calc(50% - 10px)',display:'inline-block',verticalAlign:'top',marginRight:20}
    :block.size==='third'?{width:'calc(33.33% - 12px)',display:'inline-block',verticalAlign:'top',marginRight:18}:{};
  return(
    <div style={colStyle}>
      <div className="pb-wrap">
        <div className="pb-num-row">
          <span className="pb-num">{index}</span>
          <span className="pb-type-lbl" style={{color:bt.color}}>{block.label||bt.label}</span>
          {block.instruction&&<span style={{fontSize:'.73rem',color:'#718096',fontStyle:'italic'}}>— {block.instruction}</span>}
        </div>
        {withImg}
      </div>
      {block.size==='full'&&<hr className="pb-divider"/>}
    </div>
  );
}

// ── VOCABULARY ────────────────────────────────────────────────
function getVocabForLevel(level){
  const vocab=window._vocab;
  if(!vocab||!vocab[level])return[];
  const words=[];
  Object.entries(vocab[level]||{}).forEach(([type,list])=>{
    [...list].sort(()=>Math.random()-.5).slice(0,15).forEach(w=>words.push({word:w,type}));
  });

}

// ── AI GENERATE (IMPROVED) ────────────────────────────────────
function extractJsonObject(raw){
  let text=String(raw||'').trim();
  const fenced=text.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fenced) text=fenced[1].trim();
  const start=text.indexOf('{');
  if(start===-1)throw new Error('JSON object not found');

  let depth=0,inString=false,escape=false;
  for(let i=start;i<text.length;i++){
    const ch=text[i];
    if(inString){
      if(escape){escape=false;continue;}
      if(ch==='\\'){escape=true;continue;}
      if(ch==='"')inString=false;
      continue;
    }
    if(ch==='"'){inString=true;continue;}
    if(ch==='{')depth++;
    if(ch==='}'){
      depth--;
      if(depth===0)return text.slice(start,i+1);
    }
  }
  throw new Error('JSON object is incomplete');
}

function parseAIJson(raw,label='AI response'){
  const text=String(raw||'').trim();
  try{return JSON.parse(text);}
  catch(e1){
    try{return JSON.parse(extractJsonObject(text));}
    catch(e2){
      console.error(label+' parse error. Raw:',text.slice(0,1200));
      throw new Error('AI vastuse töötlemine ebaõnnestus: '+e2.message);
    }
  }
}

      const nodes=(b.nodes||[]).map((node,i)=>{const p=palette[node.color]||palette.pine;return`<div style="flex:1;min-width:110px;padding:10px 11px;border-radius:9px;border:1px solid #d7dce1;background:${p[0]};color:${p[1]};font-size:12px;font-weight:700;text-align:center">${node.blank?'________________':escapeHtml(node.text||`Samm ${i+1}`)}</div>`;});

      if(b.layout==='cycle')inner=title+`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px"><div style="grid-column:1/-1;justify-self:center;background:#1C2B3A;color:#fff;border-radius:999px;padding:7px 18px;font-size:12px;font-weight:800">${escapeHtml(b.centerText||'Põhiteema')}</div>${nodes.join('')}</div>`;
      else if(b.layout==='mindmap')inner=title+`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px"><div style="grid-column:1/-1;justify-self:center;background:#1C2B3A;color:#fff;border-radius:9px;padding:9px 20px;font-size:12px;font-weight:800">${escapeHtml(b.centerText||'Põhiteema')}</div>${nodes.join('')}</div>`;
      else inner=title+`<div style="display:flex;align-items:center;gap:7px">${nodes.map((node,i)=>node+(i<nodes.length-1?'<span style="color:#C9882A;font-weight:900">&#x2192;</span>':'')).join('')}</div>`;
    }
    else if(b.type==='comic'){
      inner=(b.title?`<div style="font-size:13px;font-weight:800;margin-bottom:9px">${escapeHtml(b.title)}</div>`:'')+`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:9px">${(b.panels||[]).map((panel,i)=>{const src=safeUrl(panel.imageUrl);return`<div style="border:1px solid #d7dce1;border-radius:10px;background:#F9F8F6;padding:10px;min-height:130px"><div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#7A7167;font-weight:700">${b.taskMode==='order'?'___':i+1}. ${escapeHtml(panel.scene||'Stseen')}</div>${src?`<img src="${src}" style="width:100%;height:90px;object-fit:cover;border-radius:7px;margin-top:6px"/>`:`<div style="font-size:28px;line-height:1;margin:8px 0 5px">${escapeHtml(panel.emoji||'🙂')}</div>`}<div style="font-size:10px;font-weight:800;color:#42536A">${escapeHtml(panel.character||'Tegelane')}</div><div style="background:#fff;border:1px solid #d7dce1;border-radius:10px;padding:7px 9px;margin-top:6px;font-size:11.5px;line-height:1.4">${b.taskMode==='complete'&&panel.blank!==false?'____________________________':escapeHtml(panel.text||'...')}</div>${panel.caption?`<div style="font-size:9.5px;color:#A96E1A;font-weight:700;margin-top:6px">${escapeHtml(panel.caption)}</div>`:''}</div>`;}).join('')}</div>`;
    }
    else if(b.type==='error_correction'){inner=(b.sentences||[]).map((s,i)=>`<div style="margin-bottom:12px;display:flex;align-items:flex-start;gap:9px"><span style="font-size:11px;font-weight:800;color:#dc2626;min-width:20px;padding-top:2px">${i+1}.</span><div style="flex:1"><div style="font-size:12.5px;color:#7A7167;text-decoration:line-through;margin-bottom:5px">${escapeHtml(s.wrong||'')}</div><div style="display:flex;align-items:center;gap:7px"><span style="font-size:11px;color:#7A7167;flex-shrink:0">Parandus:</span><div style="flex:1;border-bottom:1.5px solid #1C2B3A;min-height:20px"></div></div></div></div>`).join('');}
    else if(b.type==='transformation'){const ex=b.example;inner=(ex?`<div style="padding:8px 12px;border-radius:7px;background:#F0EEE9;border:1px solid rgba(28,43,58,.12);margin-bottom:14px;font-size:12.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap"><span style="color:#7A7167;font-size:11px;font-weight:700">NÄIDE:</span><span>${escapeHtml(ex.from||'')}</span><span style="color:#C9882A;font-size:1rem">&#x2192;</span><span style="color:#2F5D50;font-weight:600">${escapeHtml(ex.to||'')}</span></div>`:'')+(b.sentences||[]).map((s,i)=>`<div style="margin-bottom:10px;display:flex;align-items:flex-start;gap:9px"><span style="font-size:11px;font-weight:700;color:#718096;min-width:20px;padding-top:2px;flex-shrink:0">${i+1}.</span><div style="flex:1"><div style="font-size:12.5px;color:#1C2B3A;margin-bottom:5px">${escapeHtml(s)}</div><div style="border-bottom:1px solid rgba(28,43,58,.2);min-height:20px"></div></div></div>`).join('');}
    let imgTop='',imgBot='';
    if(b.imageUrl&&!['image','image_label'].includes(b.type)){const src=safeUrl(b.imageUrl);const width=safeWidth(b.imgWidth);const pos=b.imagePos||'top';const imgTag=src?`<div style="margin-bottom:${pos==='top'?10:0}px;margin-top:${pos==='bottom'?10:0}px;text-align:center"><img src="${src}" style="max-width:${width?width+'px':'100%'};max-height:180px;object-fit:contain;border-radius:5px"/></div>`:'';if(pos==='top')imgTop=imgTag;else if(pos==='bottom')imgBot=imgTag;}
    const visBlocks=blocks.filter(x=>BT_LABELS[x.type]);
    return`<div style="margin-bottom:22px;page-break-inside:avoid"><div style="display:flex;align-items:center;gap:8px;margin-bottom:7px"><span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#1C2B3A;color:#fff;font-size:10px;font-weight:800;flex-shrink:0">${num}</span><span style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:${color}">${label}</span>${b.instruction?`<span style="font-size:11px;font-style:italic;color:#718096"> — ${escapeHtml(b.instruction)}</span>`:''}</div>${imgTop}${inner}${imgBot}${num<visBlocks.length?'<div style="border:none;border-top:1px dashed rgba(28,43,58,.12);margin-top:16px"></div>':''}</div>`;
  };
  const metaRow=[meta.subject?`📚 ${escapeHtml(meta.subject)}`:'',meta.level?`📊 ${escapeHtml(meta.level)}`:'',meta.topic?`💬 ${escapeHtml(meta.topic)}`:'',meta.date?'📅 Kuupäev: ____________':'',meta.name?'Nimi: ___________________________':''].filter(Boolean).map(s=>`<span>${s}</span>`).join('');
  const blocksHtml=blocks.map(renderBlock).join('');
  const css=`@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans:wght@400;600;700&display=swap');*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'IBM Plex Sans',Arial,sans-serif;max-width:794px;margin:0 auto;padding:0;color:#1C2B3A;background:#E8E6E1;}.a4{background:#fff;padding:64px 72px 72px;min-height:1123px;}.sheet-hdr{margin-bottom:24px;padding-bottom:14px;border-bottom:2.5px solid #1C2B3A;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}.sheet-title{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:700;margin-bottom:5px;color:#1C2B3A;line-height:1.2;}.sheet-meta{font-size:11.5px;color:#718096;display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;}.score-box{border:1px solid #1C2B3A;border-radius:5px;padding:5px 12px;font-size:11.5px;font-weight:600;white-space:nowrap;flex-shrink:0;}@media print{body{background:#fff;}.a4{box-shadow:none;padding:32px 48px;}@page{size:A4;margin:15mm;}}`;
  return`<!DOCTYPE html><html lang="et"><head><meta charset="UTF-8"><title>${escapeHtml(meta.title||'Tööleht')}</title><style>${css}</style></head><body><div class="a4"><div class="sheet-hdr"><div><div class="sheet-title">${escapeHtml(meta.title||'Tööleht')}</div><div class="sheet-meta">${metaRow}</div></div>${meta.score?'<div class="score-box">Punkte: ___ / ___</div>':''}</div>${blocksHtml||'<div style="text-align:center;padding:60px 0;color:#B0A898;font-size:13px">Tööleht on tühi</div>'}</div></body></html>`;
}

// ── SAVE MODAL ────────────────────────────────────────────────
function SaveModal({meta,blocks,user,source,quality,lessonId,initialStatus,onSaved,onClose,notify}){
  const SUBJECTS=['Eesti keel','Inglise keel','Matemaatika'];
  const LEVELS_BY_SUBJECT={'Eesti keel':['A1','A2','B1','B2','C1','C2'],'Inglise keel':['A1','A2','B1','B2','C1','C2'],'Matemaatika':Array.from({length:12},(_,i)=>i+1+'. klass')};
  const[subject,setSubject]=useState(meta.subject||'Eesti keel');
  const[level,setLevel]=useState(meta.level||'B1');
  const sourceTopic=meta.topic||source?.topicName||'';
  const[topic,setTopic]=useState(sourceTopic);
  const[newTopic,setNewTopic]=useState(sourceTopic);
  const[saving,setSaving]=useState(false);
  const[loading,setLoading]=useState(false);
  const[lessons,setLessons]=useState([]);
  const[selectedLessonId,setSelectedLessonId]=useState('');
  const[topicMode,setTopicMode]=useState('existing');
  const[lessonMode,setLessonMode]=useState('existing');
  const[worksheetStatus,setWorksheetStatus]=useState(window.WorksheetWorkflow?.normalizeStatus(initialStatus||'draft')||'draft');
  const[allTopics,setAllTopics]=useState([]);
  const levels=LEVELS_BY_SUBJECT[subject]||[];
  useEffect(()=>{
    if(!subject||!level)return;setLoading(true);setTopic('');setLessons([]);setSelectedLessonId('');
    db.collection('curriculumLessons').where('subject','==',subject).where('level','==',level).get().then(snap=>{
      const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
      const topics=[...new Set(docs.map(d=>d.topic).filter(Boolean))].sort();
      setAllTopics(topics);
      const preferred=topics.find(candidate=>candidate.toLocaleLowerCase('et-EE')===sourceTopic.toLocaleLowerCase('et-EE'));
      if(preferred){setTopic(preferred);setTopicMode('existing');}
      else if(sourceTopic){setNewTopic(sourceTopic);setTopicMode('new');setLessonMode('new');}
      else if(topics.length>0){setTopic(topics[0]);setTopicMode('existing');}
      else setTopicMode('new');
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[subject,level]);
  useEffect(()=>{
    if(!topic||topicMode==='new')return;
    db.collection('curriculumLessons').where('subject','==',subject).where('level','==',level).where('topic','==',topic).get().then(snap=>{
      const docs=snap.docs.map(d=>({id:d.id,...d.data()}));setLessons(docs);
      const linkedSource=lessonId?docs.find(doc=>doc.id===lessonId):(source?docs.find(doc=>doc.sourceKey===`curriculum:${source.topicId}:${Number(source.lessonIndex)||0}`):null);
      if(linkedSource){setSelectedLessonId(linkedSource.id);setLessonMode('existing');}
      else if(source){setSelectedLessonId('');setLessonMode('new');}
      else if(docs.length>0){setSelectedLessonId(docs[0].id);setLessonMode('existing');}
      else setLessonMode('new');
    });
  },[topic,topicMode,subject,level]);
  const finalTopic=topicMode==='new'?newTopic.trim():topic;
  const finalMeta={...meta,subject,level,topic:finalTopic};
  const finalQuality=window.CurriculumWorkflow?.analyzeWorksheet(finalMeta,blocks)||quality;
  const[savedLessonId,setSavedLessonId]=useState('');
  const[savedWorksheetVersion,setSavedWorksheetVersion]=useState(0);
  const[step,setStep]=useState('save'); // 'save' | 'assign'
  const[students,setStudents]=useState([]);
  const[selStudents,setSelStudents]=useState([]);
  const[assignDue,setAssignDue]=useState('');
  const[assignNote,setAssignNote]=useState('');
  const[assigning,setAssigning]=useState(false);
  const[stuSearch,setStuSearch]=useState('');

  useEffect(()=>{
    if(step!=='assign') return;
    db.collection('students').where('active','!=',false).get()
      .then(snap=>setStudents(snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.active!==false)))
      .catch(()=>{});
  },[step]);

  const toggleStu=sid=>setSelStudents(p=>p.includes(sid)?p.filter(x=>x!==sid):[...p,sid]);
  const sourceFields=source?{
    sourceType:'curriculum_workspace',
    sourceKey:`curriculum:${source.topicId}:${Number(source.lessonIndex)||0}`,
    curriculumLanguageId:source.languageId||'',
    curriculumSubject:source.subject||'',
    curriculumLevel:source.level||'',
    curriculumTopicId:source.topicId||'',
    curriculumTopicName:source.topicName||'',
    curriculumLessonIndex:Number(source.lessonIndex)||0,
    curriculumLessonGoal:source.lessonGoal||'',
    curriculumSourceVersion:source.sourceVersion||''
  }:{};

  const save=async()=>{
    if(!finalTopic){alert('Vali teema või sisesta uus teema nimi');return;}setSaving(true);
    try{
      if(worksheetStatus==='published'&&!finalQuality?.ready)throw new Error('Avaldamiseks peab tööleht läbima kõik kvaliteedikontrolli punktid. Salvesta see mustandina või täienda sisu.');
      const record={title:finalMeta.title||'Tööleht',type:'material',description:'',subject,level,topic:finalTopic,...sourceFields};
      const validation=window.CurriculumWorkflow?.validateMaterialLevel(record);
      if(validation&&!validation.ok)throw new Error(validation.errors.join(' '));
      const now=new Date().toISOString();
      const worksheetData={meta:finalMeta,blocks};
      const worksheetQuality={percent:finalQuality?.percent||0,checkedAt:now,checks:finalQuality?.checks||[]};
      const isExisting=lessonMode==='existing'&&selectedLessonId;
      const lessonRef=isExisting?db.collection('curriculumLessons').doc(selectedLessonId):db.collection('curriculumLessons').doc();
      let nextVersion=1;
      await db.runTransaction(async tx=>{
        const snap=isExisting?await tx.get(lessonRef):null;
        const current=snap?.exists?snap.data():{};
        const legacyPublished=!current.worksheetStatus&&Array.isArray(current.worksheetData?.blocks)&&current.worksheetData.blocks.length>0;
        const currentVersion=Number(current.worksheetVersion)||(legacyPublished?1:0);
        nextVersion=window.WorksheetWorkflow?.nextVersion(currentVersion)||1;
        const worksheetFields=window.WorksheetWorkflow?.buildVersionFields({status:worksheetStatus,version:nextVersion,worksheetData,worksheetQuality,now})||{worksheetData,worksheetQuality,worksheetStatus,worksheetVersion:nextVersion,updatedAt:now};
        if(legacyPublished){
          if(worksheetStatus!=='published')Object.assign(worksheetFields,{publishedWorksheetData:current.worksheetData,publishedWorksheetQuality:current.worksheetQuality||{},publishedWorksheetVersion:1,publishedAt:current.updatedAt||current.createdAt||now});
          const legacyVersionRef=db.collection('worksheetVersions').doc(`${lessonRef.id}_v1`);
          const legacyMeta=current.worksheetData?.meta||{title:current.title,subject:current.subject,level:current.level,topic:current.topic};
          const legacyVersionRecord=window.WorksheetWorkflow?.buildVersionRecord({lessonId:lessonRef.id,status:'published',version:1,worksheetData:current.worksheetData,worksheetQuality:current.worksheetQuality||{},meta:legacyMeta,sourceFields,user:{uid:current.authorUid||'',displayName:current.authorName||'Legacy'},now:current.updatedAt||current.createdAt||now})||{lessonId:lessonRef.id,version:1,status:'published',worksheetData:current.worksheetData,createdAt:current.updatedAt||now};
          tx.set(legacyVersionRef,legacyVersionRecord);
        }
        const base=isExisting?{}:{...record,examPart:null,files:[],order:Number(source?.lessonIndex)||0,authorUid:user?.uid||'',authorName:user?.displayName||user?.email||'',createdAt:now.split('T')[0]};
        tx.set(lessonRef,{...base,...worksheetFields,...sourceFields},{merge:true});
        const versionRef=db.collection('worksheetVersions').doc(`${lessonRef.id}_v${nextVersion}`);
        const versionRecord=window.WorksheetWorkflow?.buildVersionRecord({lessonId:lessonRef.id,status:worksheetStatus,version:nextVersion,worksheetData,worksheetQuality,meta:finalMeta,sourceFields,user,now})||{lessonId:lessonRef.id,version:nextVersion,status:worksheetStatus,worksheetData,worksheetQuality,createdAt:now,createdBy:user?.uid||''};
        tx.set(versionRef,versionRecord);
      });
      const lid=lessonRef.id;
      setSavedLessonId(lid);
      setSavedWorksheetVersion(nextVersion);
      onSaved?.({lessonId:lid,version:nextVersion,status:worksheetStatus});
      if(worksheetStatus==='published'){
        notify(`✓ Töölehe versioon ${nextVersion} avaldatud!`);
        setStep('assign');
      }else{
        notify(`✓ Versioon ${nextVersion} salvestatud: ${window.WorksheetWorkflow?.STATUSES?.[worksheetStatus]?.label||worksheetStatus}`);
        onClose();
      }
    }catch(e){notify('Viga: '+(e.message||'Salvestamine ebaõnnestus'));}setSaving(false);
  };

  const assign=async()=>{
    if(!selStudents.length){onClose();return;}
    setAssigning(true);
    const batch=db.batch();
    selStudents.forEach(sid=>{
      const st=students.find(s=>s.id===sid);
      const ref=db.collection('worksheetAssignments').doc();
      batch.set(ref,{
        lessonId:savedLessonId||'',
        lessonTitle:finalMeta.title||'Tööleht',
        subject,level,topic:finalTopic,
        worksheetData:{meta:finalMeta,blocks},
        worksheetVersion:savedWorksheetVersion||1,
        worksheetStatus:'published',
        worksheetQuality:{percent:finalQuality?.percent||0,checkedAt:new Date().toISOString()},
        ...sourceFields,
        studentId:sid,
        studentName:st?.name||'',
        assignedBy:user?.uid||'',
        assignedByName:user?.displayName||user?.email||'',
        assignedAt:new Date().toISOString(),
        dueDate:assignDue||'',
        note:assignNote||'',
        status:'new',score:null,completedAt:null,answers:{}
      });
    });
    await batch.commit();
    setAssigning(false);
    notify('✓ Tööleht määratud '+selStudents.length+' õpilasele!');
    onClose();
  };
  return(
    <div className="sav-ov">
      <div className="sav-box">
        <div className="sav-head"><h2 style={{fontSize:'1rem',fontWeight:800}}>💾 Salvesta õppekavasse</h2><button onClick={onClose} className="btn btn-ghost btn-sm">✕</button></div>
        <div className="sav-body">
          <div style={{padding:'10px 13px',borderRadius:10,background:'rgba(47,93,80,.08)',border:'0.5px solid rgba(47,93,80,.2)',fontSize:'.84rem',fontWeight:600,color:'#2F5D50'}}>📄 {meta.title||'Tööleht'} · {blocks.length} plokki</div>
          <div style={{padding:'9px 12px',borderRadius:9,background:finalQuality?.ready?'#E7F4EE':'#FFF4E8',color:finalQuality?.ready?'#2F5D50':'#9A5B13',fontSize:'.78rem',fontWeight:700}}>{finalQuality?.ready?'✓ Tööleht läbis kvaliteedikontrolli':`⚠ Kvaliteedikontroll: ${finalQuality?.passed||0}/${finalQuality?.total||0}`}</div>
          <div>
            <div className="field-lbl">Olek</div>
            <div className="status-options">
              {Object.entries(window.WorksheetWorkflow?.STATUSES||{}).map(([key,item])=><button type="button" key={key} className={'status-option'+(worksheetStatus===key?' active':'')} onClick={()=>setWorksheetStatus(key)}><strong>{item.label}</strong><small>{item.description}</small></button>)}
            </div>
            {worksheetStatus==='published'&&!finalQuality?.ready&&<div style={{fontSize:'.7rem',color:'#9A5B13',marginTop:6}}>Avaldamiseks täida kõik kvaliteedikontrolli punktid.</div>}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            <div><div className="field-lbl">Õppeaine</div><select value={subject} onChange={e=>{setSubject(e.target.value);setLevel(LEVELS_BY_SUBJECT[e.target.value]?.[0]||'');}}>{SUBJECTS.map(s=><option key={s}>{s}</option>)}</select></div>
            <div><div className="field-lbl">Tase</div><select value={level} onChange={e=>setLevel(e.target.value)}>{levels.map(l=><option key={l}>{l}</option>)}</select></div>
          </div>
          <div>
            <div className="field-lbl" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span>1. Teema</span>{allTopics.length>0&&<div style={{display:'flex',gap:5}}><button onClick={()=>setTopicMode('existing')} className={'btn btn-sm '+(topicMode==='existing'?'btn-pine':'btn-ghost')} style={{fontSize:'.7rem',padding:'2px 8px'}}>Olemasolev</button><button onClick={()=>{setTopicMode('new');setLessonMode('new');}} className={'btn btn-sm '+(topicMode==='new'?'btn-pine':'btn-ghost')} style={{fontSize:'.7rem',padding:'2px 8px'}}>+ Uus</button></div>}</div>
            {loading?<div style={{fontSize:'.8rem',color:'#7A7167'}}>Laen...</div>
            :topicMode==='existing'&&allTopics.length>0
              ?<div style={{display:'flex',flexWrap:'wrap',gap:5}}>{allTopics.map(t=>(<button key={t} onClick={()=>setTopic(t)} style={{padding:'5px 11px',borderRadius:8,border:'1.5px solid '+(topic===t?'#2F5D50':'rgba(28,43,58,.1)'),background:topic===t?'rgba(47,93,80,.08)':'#fff',cursor:'pointer',fontSize:'.82rem',fontWeight:topic===t?700:400,color:topic===t?'#2F5D50':'#1C2B3A'}}>{t}</button>))}</div>
              :<input value={newTopic} onChange={e=>setNewTopic(e.target.value)} placeholder="Uue teema nimi..." autoFocus/>}
          </div>
          {(topic||newTopic)&&(<div>
            <div className="field-lbl" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><span>2. Kirje</span>{lessons.length>0&&<div style={{display:'flex',gap:5}}><button onClick={()=>setLessonMode('existing')} className={'btn btn-sm '+(lessonMode==='existing'?'btn-pine':'btn-ghost')} style={{fontSize:'.7rem',padding:'2px 8px'}}>Lisa olemasolevale</button><button onClick={()=>setLessonMode('new')} className={'btn btn-sm '+(lessonMode==='new'?'btn-pine':'btn-ghost')} style={{fontSize:'.7rem',padding:'2px 8px'}}>+ Uus kirje</button></div>}</div>
            {lessonMode==='existing'&&lessons.length>0
              ?<div style={{display:'flex',flexDirection:'column',gap:5,maxHeight:180,overflowY:'auto'}}>{lessons.map(l=>(<label key={l.id} style={{display:'flex',alignItems:'flex-start',gap:9,padding:'9px 12px',borderRadius:9,border:'1.5px solid '+(selectedLessonId===l.id?'#2F5D50':'rgba(28,43,58,.1)'),background:selectedLessonId===l.id?'rgba(47,93,80,.07)':'#fff',cursor:'pointer'}}><input type="radio" name="lesson" checked={selectedLessonId===l.id} onChange={()=>setSelectedLessonId(l.id)} style={{marginTop:3,flexShrink:0}}/><div><div style={{fontSize:'.85rem',fontWeight:700,color:'#1C2B3A'}}>{l.title}</div>{l.worksheetData&&<div style={{fontSize:'.68rem',color:'#C9882A',marginTop:2}}>⚠️ Tööleht olemas — asendatakse</div>}</div></label>))}</div>
              :<div style={{padding:'10px 12px',borderRadius:9,background:'rgba(28,43,58,.04)',border:'1px dashed rgba(28,43,58,.15)',fontSize:'.82rem',color:'#7A7167'}}>Luuakse uus kirje teemasse "{finalTopic}"</div>}
          </div>)}
        </div>
        {step==='assign'&&(
          <div style={{marginTop:12}}>
            <div style={{padding:'10px 13px',borderRadius:10,background:'rgba(47,93,80,.08)',border:'0.5px solid rgba(47,93,80,.2)',fontSize:'.84rem',fontWeight:600,color:'#2F5D50',marginBottom:12}}>

// ── PAGED PREVIEW ─────────────────────────────────────────────
function estimateBlockHeight(block){
  switch(block.type){
    case 'fill':return Math.max(80,(block.text||'').length*0.6+60);
    case 'choice':return 60+(block.questions||[]).length*90;
    case 'match':return 60+(block.pairs||[]).length*40;
    case 'order':return 140;
    case 'writing':return 70+(block.lines||6)*30;
    case 'text':return 60+(block.content||'').length*0.5;
    case 'reading':return 220+(block.questions||[]).length*90;
    case 'table':return 70+(block.rows||4)*34;
    case 'image':return 240;
    case 'image_label':return 320+(block.items||[]).length*22;
    case 'connect':return 90+(block.pairs||[]).length*38;
    case 'diagram':return 180+(block.nodes||[]).length*18;
    case 'comic':return 170+Math.ceil((block.panels||[]).length/2)*150;
    default:return 90;
  }
}

function PagedSheet({meta,blocks,onChangeBlock}){
  const HEADER_H=110,PAGE_H=995;
  const pages=[];let cur=[],h=HEADER_H;
  blocks.forEach(b=>{const bh=estimateBlockHeight(b)+28;if(h+bh>PAGE_H&&cur.length>0){pages.push(cur);cur=[b];h=bh;}else{cur.push(b);h+=bh;}});
  if(cur.length>0||pages.length===0)pages.push(cur);
  let gi=0;
  return(<>
    {pages.map((page,pi)=>(
      <React.Fragment key={pi}>
        {pi>0&&<div className="a4-page-break"><span className="a4-page-break-label">Lehekülg {pi+1}</span></div>}
        <div className="a4-sheet">
          {pi===0&&(<div className="sheet-hdr"><div><div className="sheet-title">{meta.title||'Pealkiri puudub'}</div><div className="sheet-meta-row">{meta.subject&&<span>📚 {meta.subject}</span>}{meta.level&&<span>📊 {meta.level}</span>}{meta.topic&&<span>💬 {meta.topic}</span>}{meta.date&&<span>📅 Kuupäev: ____________</span>}{meta.name&&<span>Nimi: ___________________________</span>}</div></div>{meta.score&&<div className="score-box">Punkte: ___ / ___</div>}</div>)}
          {pi===0&&blocks.length===0&&<div style={{textAlign:'center',padding:'56px 0',color:'#C0B8B0'}}><i className="fa-solid fa-layer-group" style={{fontSize:'2rem',opacity:.2,display:'block',marginBottom:10}}/><div style={{fontSize:'.86rem'}}>Lisa plokke vasakult paneelilt</div></div>}
          {page.map(b=>{gi++;return<PreviewBlock key={b.id} block={b} index={gi} onChange={onChangeBlock}/>;;})}
          {pages.length>1&&<div className="a4-page-num">{pi+1} / {pages.length}</div>}
        </div>
      </React.Fragment>
    ))}
  </>);
}

    pastRef.current=[...pastRef.current.slice(-39),cloneBlocks(blocks)];
    futureRef.current=[];
    setBlocks(next);setHistoryRev(r=>r+1);
  };
  const undoBlocks=()=>{
    const previous=pastRef.current.pop();if(!previous)return;
    futureRef.current=[cloneBlocks(blocks),...futureRef.current.slice(0,39)];
    setBlocks(previous);if(activeId&&!previous.some(b=>b.id===activeId))setActiveId(previous[0]?.id||null);setInsertAfterId(null);setHistoryRev(r=>r+1);
  };
  const redoBlocks=()=>{
    const next=futureRef.current.shift();if(!next)return;
    pastRef.current=[...pastRef.current.slice(-39),cloneBlocks(blocks)];
    setBlocks(next);setInsertAfterId(null);setHistoryRev(r=>r+1);
  };

                  <div className="template-list">{(window.WorksheetWorkflow?.TEMPLATES||[]).map(template=><button type="button" className="template-card" key={template.id} onClick={()=>applyTemplate(template.id)}><span className="template-icon"><i className={'fa-solid '+template.icon}/></span><span><strong>{meta.subject==='Inglise keel'?template.titleEn:template.titleEt}</strong><small>{template.description} · {template.types.length} tüüpi ülesandeid</small></span></button>)}</div>
                </>:<>
                  <div className="meta-box"><div className="meta-lbl">Visuaalsete ülesannete pank</div><div style={{fontSize:'.74rem',color:'#718096',lineHeight:1.45}}>Lisa valmis skeem, pildiülesanne või koomiks ühe klikiga. See lisatakse olemasoleva töö lõppu ega asenda sinu plokke.</div></div>
                  <div className="visual-filters">
                    <input className="wide" value={visualSearch} onChange={event=>setVisualSearch(event.target.value)} placeholder="Otsi: keha, kohvik, grammatika..." aria-label="Otsi visuaalset ülesannet"/>
                    <select value={visualSubject} onChange={event=>setVisualSubject(event.target.value)} aria-label="Visuaalse ülesande keel"><option value="all">Kõik keeled</option><option value="Eesti keel">Eesti keel</option><option value="Inglise keel">Inglise keel</option></select>
                    <select value={visualLevel} onChange={event=>setVisualLevel(event.target.value)} aria-label="Visuaalse ülesande tase"><option value="all">Kõik tasemed</option>{['A1','A2','B1','B2','C1','C2'].map(level=><option key={level} value={level}>{level}</option>)}</select>
                    <select value={visualAge} onChange={event=>setVisualAge(event.target.value)} aria-label="Visuaalse ülesande vanus"><option value="all">Kõik vanused</option><option value="child">Lapsed 7–10</option><option value="youth">Noored 11–17</option><option value="adult">Täiskasvanud</option></select>
                    <select value={visualType} onChange={event=>setVisualType(event.target.value)} aria-label="Visuaalse ülesande tüüp"><option value="all">Kõik tüübid</option><option value="image_label">Pildile märkimine</option><option value="diagram">Skeemid</option><option value="comic">Koomiksid</option><option value="connect">Nooled ja seosed</option></select>
                  </div>
                  <div className="visual-count">Leitud {visualPresets.length} valmis ülesannet</div>
                  <div className="template-list">{visualPresets.map(preset=>{const type=BT[preset.type]||BT.diagram;const english=(visualSubject==='all'?meta.subject:visualSubject)==='Inglise keel';return <button type="button" className="template-card visual-card" key={preset.id} onClick={()=>applyVisualPreset(preset.id)} style={{'--visual-bg':type.bg,'--visual-color':type.color}}><span className="template-icon"><i className={'fa-solid '+preset.icon}/></span><span className="visual-card-copy"><strong>{english?preset.titleEn:preset.titleEt}</strong><small>{english?preset.descriptionEn:preset.descriptionEt}</small><span className="visual-badges"><span className="visual-badge">{type.label}</span><span className="visual-badge">{preset.levels.join('–')}</span><span className="visual-badge">{preset.ages.includes('adult')?'7+':'7–17'}</span></span><span className="visual-add"><i className="fa-solid fa-plus"/> Lisa töölehele</span></span></button>;})}</div>
                  {!visualPresets.length&&<div className="visual-empty"><i className="fa-solid fa-filter-circle-xmark" style={{display:'block',fontSize:'1.3rem',marginBottom:7}}/>Nende filtritega valmis ülesannet ei leitud. Proovi teist taset või vanuserühma.</div>}
                </>}
              </div>
            )}

            {/* AI TAB */}
            {tab==='ai'&&(
              <div>
                <div className="ai-panel">
                  <div className="ai-title"><i className="fa-solid fa-wand-magic-sparkles"/> Genereeri AI-ga</div>
                  <div style={{marginBottom:8}}>
                    <div style={{fontSize:'.64rem',fontWeight:700,color:'rgba(255,255,255,.45)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:5}}>Tunni tüüp (valikuline)</div>
                    <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                      {[['','Vaba'],['uus_teema','🌱 Uus teema'],['kinnistamine','🔁 Kinnistamine'],['suuline','🗣️ Suuline'],['kirjalik','✍️ Kirjalik'],['kordamine','📋 Kordamine']].map(([k,l])=>(
                        <button key={k} className={'ai-lvl'+(aiLessonType===k?' active':'')} onClick={()=>{setAiLessonType(k);setAiPhase('');}} style={{fontSize:'.68rem'}}>{l}</button>
                      ))}
                    </div>
                  </div>
                  {aiLessonType&&DIDACTIC_TEMPLATES[aiLessonType]&&(
                    <div style={{marginBottom:8}}>
                      <div style={{fontSize:'.64rem',fontWeight:700,color:'rgba(255,255,255,.45)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:5}}>Tunni faas</div>
                      <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                        {Object.entries(DIDACTIC_TEMPLATES[aiLessonType]).map(([k,v])=>(
                          <button key={k} className={'ai-lvl'+(aiPhase===k?' active':'')} onClick={()=>setAiPhase(k)} style={{fontSize:'.67rem'}}>{v.label}</button>
                        ))}
                      </div>
                      {aiPhase&&DIDACTIC_TEMPLATES[aiLessonType]?.[aiPhase]&&(
                        <div style={{marginTop:6,padding:'6px 9px',background:'rgba(255,255,255,.07)',borderRadius:7,fontSize:'.72rem',color:'rgba(255,255,255,.55)',lineHeight:1.4}}>
                          💡 {DIDACTIC_TEMPLATES[aiLessonType][aiPhase].instruction}
                        </div>
                      )}
                    </div>
                  )}
                  <textarea className="ai-textarea" value={aiPrompt} onChange={e=>setAiPrompt(e.target.value)} rows={3} placeholder={"Tunni teema, nt:\n\"Tegusõnade pööramine olevikus\"\n\"Igapäevaelu kirjeldamine\""}/>
                  <textarea className="ai-textarea" value={aiExtraInstr} onChange={e=>setAiExtraInstr(e.target.value)} rows={2} placeholder="Lisajuhised AI-le (valikuline)..." style={{marginTop:6,fontSize:'.78rem',opacity:.85}}/>
                  {/* Source text / image mode */}
                  <div style={{marginTop:10,borderTop:'1px solid rgba(255,255,255,.12)',paddingTop:10}}>
                    <div style={{fontSize:'.64rem',fontWeight:700,color:'rgba(255,255,255,.45)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6}}>
                      Allikas (valikuline)
                    </div>
                    <div style={{display:'flex',gap:5,marginBottom:7}}>
                      <button className={'ai-lvl'+(aiSourceMode===''?' active':'')} onClick={()=>setAiSourceMode('')} style={{fontSize:'.68rem'}}>Teema</button>
                      <button className={'ai-lvl'+(aiSourceMode==='text'?' active':'')} onClick={()=>setAiSourceMode('text')} style={{fontSize:'.68rem'}}>📄 Tekst</button>
                      <button className={'ai-lvl'+(aiSourceMode==='image'?' active':'')} onClick={()=>setAiSourceMode('image')} style={{fontSize:'.68rem'}}>🖼️ Foto/pilt</button>
                    </div>
                    {aiSourceMode==='text'&&(
                      <textarea className="ai-textarea" value={aiSourceText} onChange={e=>setAiSourceText(e.target.value)} rows={4}
                        placeholder="Kleebi tekst, harjutusvihiku tekst, artikkel... AI teeb ülesanded selle põhjal."/>
                    )}
                    {aiSourceMode==='image'&&(
                      <div>
                        {aiImageBase64
                          ?<div style={{position:'relative',marginBottom:6}}>
                             <img src={'data:'+aiImageType+';base64,'+aiImageBase64} alt="" style={{width:'100%',maxHeight:120,objectFit:'cover',borderRadius:7,border:'1px solid rgba(255,255,255,.2)'}}/>
                             <button onClick={()=>{setAiImageBase64('');setAiImageType('');}} style={{position:'absolute',top:4,right:4,background:'rgba(0,0,0,.6)',border:'none',color:'#fff',borderRadius:'50%',width:22,height:22,cursor:'pointer',fontSize:'.72rem',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
                           </div>
                          :<label style={{display:'block',border:'1.5px dashed rgba(255,255,255,.25)',borderRadius:8,padding:'12px',textAlign:'center',cursor:'pointer'}}>
                             <input type="file" accept="image/*" style={{display:'none'}} onChange={async e=>{
                               const file=e.target.files[0];if(!file)return;
                               const reader=new FileReader();
                               reader.onload=ev=>{
                                 const b64=ev.target.result.split(',')[1];
                                 setAiImageBase64(b64);
                                 setAiImageType(file.type||'image/jpeg');
                               };
                               reader.readAsDataURL(file);
                             }}/>
                             <i className="fa-solid fa-image" style={{fontSize:'1.4rem',color:'rgba(255,255,255,.4)',display:'block',marginBottom:5}}/>
                             <div style={{fontSize:'.75rem',color:'rgba(255,255,255,.6)',fontWeight:600}}>Klõpsa pildi lisamiseks</div>
                             <div style={{fontSize:'.68rem',color:'rgba(255,255,255,.35)',marginTop:2}}>Harjutusraamat, tahvel, foto tekstiga</div>
                           </label>}
                      </div>
                    )}
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginTop:2}}>
                    <div className="ai-lvl-btns" style={{flex:1}}>
                      {['A1','A2','B1','B2','C1','C2'].map(l=>(
                        <button key={l} className={'ai-lvl'+(meta.level===l?' active':'')} onClick={()=>setMeta(m=>({...m,level:l}))}>{l}</button>
                      ))}
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:5,background:'rgba(255,255,255,.08)',borderRadius:8,padding:'4px 8px',flexShrink:0}}>
                      <span style={{fontSize:'.65rem',color:'rgba(255,255,255,.45)',fontWeight:700}}>BLOKKE</span>
                      <button onClick={()=>setAiBlockCount(c=>Math.max(1,c-1))} style={{background:'none',border:'none',color:'rgba(255,255,255,.5)',cursor:'pointer',fontSize:'.9rem',padding:'0 2px',lineHeight:1}}>−</button>
                      <span style={{fontSize:'.9rem',fontWeight:800,color:'#fff',minWidth:16,textAlign:'center'}}>{aiBlockCount}</span>
                      <button onClick={()=>setAiBlockCount(c=>Math.min(10,c+1))} style={{background:'none',border:'none',color:'rgba(255,255,255,.5)',cursor:'pointer',fontSize:'.9rem',padding:'0 2px',lineHeight:1}}>+</button>
                    </div>
                  </div>
                  <div style={{display:'flex',gap:7,marginTop:8}}>
                    <button onClick={runAI} disabled={aiLoading} className="btn btn-pine" style={{flex:1,justifyContent:'center',background:'#C9882A',color:'#fff'}}>
                      {aiLoading?<><div className="sp" style={{marginRight:6}}/> Genereerib...</>:<><i className="fa-solid fa-bolt"/> Genereeri</>}
                    </button>
                    <button onClick={runVocabAI} disabled={aiLoading||meta.subject!=='Eesti keel'} className="btn btn-pine" style={{flex:1,justifyContent:'center',background:'#2F5D50',color:'#fff'}} title={meta.subject==='Eesti keel'?'Kasuta EKI sõnavara':'EKI sõnavara on ainult eesti keele jaoks'}>
                      {aiLoading?<><div className="sp" style={{marginRight:6}}/> Genereerib...</>:<><i className="fa-solid fa-book"/> + Sõnavara</>}
                    </button>
                  </div>
                  <div style={{fontSize:'.68rem',color:'rgba(255,255,255,.35)',marginTop:6,textAlign:'center'}}>{meta.subject!=='Eesti keel'?'English CEFR profile active':window._vocab?'✓ EKI sõnavara laetud (10 564 sõna)':'⏳ Sõnavara laeb...'}</div>
                </div>
                <button onClick={()=>setTab('build')} className="btn btn-ghost" style={{width:'100%',justifyContent:'center'}}><i className="fa-solid fa-layer-group"/> Koosta käsitsi</button>
              </div>
            )}

            {/* META TAB */}
            {tab==='meta'&&(
              <div>
                <div className="meta-box">
                  <div className="meta-lbl">Tööleht</div>
                  <div className="field-lbl">Pealkiri</div>
                  <input value={meta.title} onChange={e=>setMeta(m=>({...m,title:e.target.value}))} style={{marginBottom:6}}/>
                  <div className="field-lbl">Õppeaine</div>
                  <select value={meta.subject} onChange={e=>setMeta(m=>({...m,subject:e.target.value}))} style={{marginBottom:6}}><option>Eesti keel</option><option>Inglise keel</option><option>Matemaatika</option></select>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
                    <div><div className="field-lbl">Tase</div><select value={meta.level} onChange={e=>setMeta(m=>({...m,level:e.target.value}))}>{['A1','A2','B1','B2','C1','C2'].map(l=><option key={l}>{l}</option>)}</select></div>
                    <div><div className="field-lbl">Teema</div><input value={meta.topic} onChange={e=>setMeta(m=>({...m,topic:e.target.value}))} placeholder="nt. Pere"/></div>
                  </div>
                </div>
                <div className="meta-box">
                  <div className="meta-lbl">Päise väljad</div>
                  {[['name','Nimi'],['score','Punkte'],['date','Kuupäev']].map(([k,l])=>(
                    <label key={k} style={{display:'flex',alignItems:'center',gap:7,marginBottom:7,fontSize:'.8rem',cursor:'pointer'}}><input type="checkbox" checked={meta[k]||false} onChange={e=>setMeta(m=>({...m,[k]:e.target.checked}))}/> {l}</label>
                  ))}
                </div>
              </div>
            )}

            {/* BUILD TAB */}
            {tab==='build'&&(
              <div>
                <div className="history-actions" data-history-revision={historyRev}>
                  <button type="button" className="btn btn-ghost btn-sm" onClick={undoBlocks} disabled={!pastRef.current.length} title="Võta viimane muudatus tagasi"><i className="fa-solid fa-rotate-left"/> Võta tagasi</button>
                  <button type="button" className="btn btn-ghost btn-sm" onClick={redoBlocks} disabled={!futureRef.current.length} title="Taasta tagasi võetud muudatus"><i className="fa-solid fa-rotate-right"/> Tee uuesti</button>
                  <button type="button" className="btn btn-ghost btn-sm" onClick={()=>{setActiveId(null);setInsertAfterId(null);}} disabled={!blocks.length} title="Sulge kõik plokid"><i className="fa-solid fa-down-left-and-up-right-to-center"/> Sulge</button>
                </div>
                <div style={{fontSize:'.66rem',fontWeight:700,color:'#7A7167',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:7}}>Lisa plokk</div>
                <div className="btype-grid">
                  {BTYPES.map(bt=>(<button key={bt.key} className="btype-btn" onClick={()=>addBlock(bt.key)}><div className="btype-icon" style={{background:bt.bg}}><i className={'fa-solid '+bt.icon} style={{color:bt.color}}/></div>{bt.label}</button>))}
                </div>
                {blocks.length===0
                  ?<div className="empty-bld"><i className="fa-solid fa-layer-group"/><p style={{fontSize:'.78rem'}}>Lisa plokke ülal</p></div>
                  :<div>
                    <div style={{fontSize:'.66rem',fontWeight:700,color:'#7A7167',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6}}>Plokid ({blocks.length}) — lohista järjekorra muutmiseks</div>
                    {blocks.map((block,idx)=>{
                      const bt=BT[block.type];const isActive=activeId===block.id;
                      return(
                        <div key={block.id} className={'block-item'+(isActive?' active':'')+(dragId===block.id?' dragging':'')+(dragOver===block.id?' drag-over':'')}
                          draggable onDragStart={e=>onDragStart(e,block.id)} onDragOver={e=>onDragOver(e,block.id)} onDrop={e=>onDrop(e,block.id)} onDragEnd={onDragEnd}>
                          <div className="bi-head" onClick={()=>setActiveId(isActive?null:block.id)}>
                            <span className="bi-drag"><i className="fa-solid fa-grip-vertical"/></span>
                            <span className="nbadge" style={{background:bt.color}}>{idx+1}</span>
                            <span className="bi-tag" style={{background:bt.bg,color:bt.color}}><i className={'fa-solid '+bt.icon} style={{fontSize:'.6rem'}}/>{bt.label}</span>
                            <span className="bi-preview">
                              {block.type==='fill'&&(block.text||'').replace(/\[([^\]]+)\]/g,'___')}
                              {block.type==='writing'&&block.task}
                              {block.type==='text'&&block.content}
                              {block.type==='order'&&block.sentence}
                              {block.type==='choice'&&(block.questions?.[0]?.q||'Valikvastus')}
                              {block.type==='match'&&`${block.pairs?.length||0} paari`}
                              {block.type==='table'&&(block.headers||[]).join(', ')}
                              {block.type==='reading'&&(block.passage||'').slice(0,35)+'...'}
                              {block.type==='image'&&(block.caption||'Pilt')}
                              {block.type==='image_label'&&`${block.items?.length||0} märgist`}
                              {block.type==='connect'&&`${block.pairs?.length||0} ühendust`}
                              {block.type==='diagram'&&(block.title||`${block.nodes?.length||0} osa`)}
                              {block.type==='comic'&&(block.title||`${block.panels?.length||0} kaadrit`)}
                            </span>
                            <div className="bi-actions" onClick={e=>e.stopPropagation()}>
                              <button className="bi-btn" onClick={()=>setInsertAfterId(insertAfterId===block.id?null:block.id)} title="Lisa plokk selle järele"><i className="fa-solid fa-plus"/></button>
                              <button className="bi-btn" onClick={()=>duplicateBlock(block.id)} title="Dubleeri"><i className="fa-solid fa-copy"/></button>
                              <button className="bi-btn" onClick={()=>moveBlock(block.id,-1)} title="Üles"><i className="fa-solid fa-chevron-up"/></button>
                              <button className="bi-btn" onClick={()=>moveBlock(block.id,1)} title="Alla"><i className="fa-solid fa-chevron-down"/></button>
                              <button className="bi-btn del" onClick={()=>delBlock(block.id)} title="Kustuta"><i className="fa-solid fa-trash"/></button>
                            </div>
                          </div>
                          {isActive&&<div onClick={e=>e.stopPropagation()}><BlockEditor block={block} onChange={data=>updBlock(block.id,data)} meta={meta} notify={notify}/></div>}
                          {insertAfterId===block.id&&<div className="insert-picker" onClick={e=>e.stopPropagation()}>{BTYPES.map(type=><button type="button" key={type.key} onClick={()=>addBlock(type.key,block.id)}><i className={'fa-solid '+type.icon} style={{color:type.color,marginRight:5}}/>{type.label}</button>)}</div>}
                        </div>
                      );
                    })}
                  </div>
                }
              </div>
            )}
          </div>
        </div>

        {/* RIGHT PANEL — A4 PREVIEW */}
        <div className="right-panel">
          <div className="toolbar-row">
            <span style={{fontSize:'.74rem',color:'#7A7167',marginRight:'auto'}}>{blocks.length} plokki{worksheetSignature!==lastSavedSignature?' · mustand salvestub automaatselt':' · salvestatud'}</span>
            <button onClick={exportPrint} className="btn btn-ghost btn-sm"><i className="fa-solid fa-print"/> Prindi / PDF</button>
            <button onClick={exportDL} className="btn btn-pine btn-sm"><i className="fa-solid fa-download"/> Laadi alla (.html)</button>
          </div>
          <div className="a4-wrap">
            <PagedSheet meta={meta} blocks={blocks} onChangeBlock={data=>updBlock(data.id,data)}/>
          </div>
          <div style={{height:40}}/>
        </div>
      </div>

      {showSave&&<SaveModal meta={meta} blocks={blocks} user={user} source={_prefill?.curriculum||null} quality={quality} lessonId={prefillLessonId} initialStatus={_prefill?.worksheetStatus||(prefillLessonId?'published':'draft')} onSaved={markSaved} onClose={()=>setShowSave(false)} notify={notify}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
