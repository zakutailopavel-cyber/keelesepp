<script>
(function(){
const lesson=window.KeeleSeppAdaptiveLessons?.['est-b1-city-problem-solving-01']; if(!lesson)return;
const scenes=window.KeeleSeppLessonScenes||{}; const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routeNames={support:'Toega',core:'Standard',advanced:'Edasijõudnu'}; const items=[];
lesson.diagnostic.items.forEach((x,i)=>items.push({kind:'diagnostic',stage:0,id:x.id,skillIds:x.skillIds||[],title:'Diagnostika',prompt:x.prompt,expected:x.expected,context:i===1?'Õpilane vajab võõralt inimeselt abi.':'Lase õpilasel vastata lõpuni ilma parandamata.',method:lesson.diagnostic.instruction}));
lesson.stages.forEach((s,si)=>(s.routes.core?.tasks||[]).forEach((t,ti)=>items.push({kind:'stage',stage:si+1,id:`${s.id}-${ti}`,stageId:s.id,title:s.title,taskIndex:ti,prompt:t})));
const state={index:0,route:'core',ratings:{},vocab:{},started:Date.now(),saving:false}; $('title').textContent=lesson.title; $('category').textContent=lesson.category;
const requestedStudentId=new URLSearchParams(location.search).get('studentId')||'';
function setSessionStatus(info={}){const el=$('session-status');const labels={preview:'Preview',loading:'Avan…',active:'Salvestan',restored:'Jätkatud',saved:'Salvestatud',completed:'Lõpetatud',signed_out:'Logi sisse',error:'Salvestusviga'};el.textContent=labels[info.mode]||info.mode||'Preview';el.title=info.message||'Õppimissessiooni salvestus';el.style.color=info.mode==='error'?'#9b2c2c':info.mode==='completed'||info.mode==='saved'?'#2d6957':'#6d7480'}
const sessionStore=window.KeeleSeppLearningSessionStore?.create({auth:window._auth,lesson,items,studentId:requestedStudentId,onStatus:setSessionStatus});
function variant(item){return item.kind==='stage'?(lesson.stages[item.stage-1].routes[state.route]||lesson.stages[item.stage-1].routes.core):null}
function task(item){if(item.kind==='diagnostic')return item.prompt;const v=variant(item),ts=v.tasks||[];return ts[Math.min(item.taskIndex,ts.length-1)]||item.prompt}
function expected(item){if(item.kind==='diagnostic')return item.expected;const s=lesson.stages[item.stage-1],v=variant(item);return v.expectedAnswerExamples?.[0]||v.success||s.checkpoint||'Jälgi kommunikatiivse eesmärgi täitmist.'}
function method(item){if(item.kind==='diagnostic')return item.method;return variant(item).teacherInstruction||'Kohanda toe hulka, kuid hoia eesmärk sama.'}
function routeFor(j){if(j==='help')return state.route==='advanced'?'core':'support';if(j==='easy')return state.route==='support'?'core':'advanced';return state.route}
function stageMeta(){return [{title:'0. Diagnostika',minutes:lesson.diagnostic.durationMinutes},...lesson.stages.map(s=>({title:s.title,minutes:s.minutes}))]}
function sceneFor(item){return scenes[item.id]||scenes[item.stageId]||scenes.default||null}
function renderScene(item){const sc=sceneFor(item),fig=$('scene'),img=$('scene-img'),fb=$('scene-fallback'); if(!sc){fig.classList.add('hidden');return} fig.classList.remove('hidden'); fb.classList.add('hidden');img.classList.remove('hidden'); img.alt=sc.alt||'Õppeolukorra illustratsioon'; img.onerror=()=>{img.classList.add('hidden');fb.classList.remove('hidden')}; img.src=sc.src+(sc.version?('?v='+encodeURIComponent(sc.version)):'')}
async function persistProgress(){if(!sessionStore)return;try{await sessionStore.saveProgress({index:state.index,route:state.route})}catch(error){showToast(error.message||'Edenemise salvestamine ebaõnnestus.',true)}}
function renderStages(item){$('stages').innerHTML=stageMeta().map((s,i)=>`<button class="stage ${i===item.stage?'active':''}" data-stage="${i}"><span class="num">${i+1}</span><span><b>${esc(s.title)}</b><small>${s.minutes||''} min</small></span></button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=async()=>{const n=items.findIndex(x=>x.stage===+b.dataset.stage);if(n>=0){state.index=n;render();await persistProgress()}})}
function render(){const item=items[state.index];$('activity').classList.remove('hidden');$('summary').classList.add('hidden');$('focus-title').textContent=item.title;$('focus-sub').textContent=item.kind==='diagnostic'?'Kiire lähteolukorra kontroll.':variant(item)?.teacherInstruction||'';$('task-label').textContent=item.kind==='diagnostic'?'Diagnostika':routeNames[state.route];$('prompt').textContent=task(item);$('situation').textContent=item.context||'';$('expected').textContent=expected(item);$('method').textContent=method(item);$('method').classList.add('hidden');$('count').textContent=`${state.index+1} / ${items.length}`;$('progress').style.width=`${((state.index+1)/items.length)*100}%`;$('route').textContent=routeNames[state.route];$('prev').disabled=state.index===0;$('next').textContent=state.index===items.length-1?'Kokkuvõte →':'Järgmine →';document.querySelectorAll('[data-judge]').forEach(b=>{b.classList.toggle('selected',state.ratings[item.id]===b.dataset.judge);b.disabled=state.saving});renderStages(item);renderScene(item)}
function openDrawer(title,html){$('drawer-title').textContent=title;$('drawer-body').innerHTML=html;$('drawer').classList.add('open')}
function showToast(message,error=false){$('toast').textContent=message;$('toast').style.color=error?'#9b2c2c':'#2d6957';$('toast').style.background=error?'#fff0ee':'#edf5f1';$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function renderWords(){openDrawer('Sõnavara',lesson.vocabulary.map(w=>`<div class="word"><div><b>${esc(w.word)}</b><small>${esc(w.translation)}<br>${esc(w.example||'')}</small></div><div><button class="weak" data-word="${esc(w.id)}" data-mark="weak">!</button><button class="known" data-word="${esc(w.id)}" data-mark="known">✓</button></div></div>`).join(''));document.querySelectorAll('[data-word]').forEach(b=>b.onclick=async()=>{if(state.saving)return;state.saving=true;b.disabled=true;try{if(sessionStore)await sessionStore.recordVocabulary({index:state.index,route:state.route,wordId:b.dataset.word,mark:b.dataset.mark});state.vocab[b.dataset.word]=b.dataset.mark;b.style.outline='2px solid #bd852d';showToast('Sõnavara hinnang salvestatud.')}catch(error){showToast(error.message||'Sõnavara hinnangu salvestamine ebaõnnestus.',true)}finally{state.saving=false;b.disabled=false}})}
function renderMore(){const item=items[state.index],sc=sceneFor(item);openDrawer('Õpetaja vaade',`<p><b>Tunni eesmärk</b><br>${esc(lesson.goal)}</p><p><b>Metoodiline juhend</b><br>${esc(method(item))}</p>${sc?`<p><b>Pildi eesmärk</b><br>${esc(sc.purpose||'Toetab olukorra mõistmist ja rääkimist.')}</p>`:''}`)}
function showSummary(){ $('activity').classList.add('hidden');$('summary').classList.remove('hidden');$('mastery').innerHTML=['vocabulary','grammar','speaking'].map(k=>`<div class="field"><label>${k}</label><input id="m-${k}" inputmode="numeric" placeholder="0–100"></div>`).join('')}
function composeHandoff(){const vals=['vocabulary','grammar','speaking'].map(k=>`${k}: ${$('m-'+k)?.value||'—'}`).join('\n');const weak=Object.entries(state.vocab).filter(([,v])=>v==='weak').map(([k])=>k).join(', ')||'—';const text=`${lesson.title}\n${vals}\nRasked sõnad: ${weak}\nMärkus: ${$('notes').value||'—'}`;$('handoff').textContent=text;return text}
function masteryScores(){return ['vocabulary','grammar','speaking'].reduce((out,key)=>{const value=$('m-'+key)?.value;if(value!==''&&value!==undefined)out[key]=value;return out},{})}
document.querySelectorAll('[data-judge]').forEach(b=>b.onclick=async()=>{if(state.saving)return;const item=items[state.index],j=b.dataset.judge,routeBefore=state.route,nextRoute=routeFor(j);state.saving=true;render();try{if(sessionStore)await sessionStore.recordJudgement({index:state.index,route:routeBefore,judgement:j,nextRoute});state.ratings[item.id]=j;state.route=nextRoute;showToast(j==='help'?'Tõend salvestatud. Järgmine samm annab rohkem tuge.':j==='easy'?'Tõend salvestatud. Järgmine samm tõstab väljakutset.':'Tõend salvestatud. Jätkame samal raskusel.')}catch(error){showToast(error.message||'Õpetaja hinnangu salvestamine ebaõnnestus.',true)}finally{state.saving=false;render()}});
$('prev').onclick=async()=>{if(state.index>0){state.index--;render();await persistProgress()}};$('next').onclick=async()=>{if(state.index<items.length-1){state.index++;render();await persistProgress()}else showSummary()};$('finish').onclick=showSummary;$('restart').onclick=async()=>{state.index=0;state.route='core';render();await persistProgress()};$('handoff-btn').onclick=async()=>{const text=composeHandoff();if(!sessionStore||!sessionStore.snapshot().persistent)return;const button=$('handoff-btn');button.disabled=true;button.textContent='Salvestan…';try{await sessionStore.complete({route:state.route,scores:masteryScores(),teacherNote:$('notes').value||'',handoffText:text});button.textContent='Salvestatud';showToast('Sessioon lõpetatud. Tõendid jäid ajalukku.')}catch(error){button.disabled=false;button.textContent='Koosta handoff';showToast(error.message||'Sessiooni lõpetamine ebaõnnestus.',true)}};$('help-btn').onclick=()=>$('method').classList.toggle('hidden');$('words-btn').onclick=renderWords;$('more-btn').onclick=renderMore;$('drawer-close').onclick=()=>$('drawer').classList.remove('open');setInterval(()=>$('elapsed').textContent=`${Math.floor((Date.now()-state.started)/60000)} / ${lesson.durationMinutes} min`,30000);
async function boot(){render();if(!sessionStore){setSessionStatus({mode:'preview',message:'Learning Session store puudub.'});return}try{const snap=await sessionStore.init({initialIndex:state.index,initialRoute:state.route});if(snap.session){state.index=Math.max(0,Math.min(items.length-1,Number(snap.session.currentIndex)||0));state.route=routeNames[snap.session.currentRoute]?snap.session.currentRoute:'core';if(snap.session.studentName)$('student').textContent=snap.session.studentName;const started=Date.parse(snap.session.startedAt||'');if(Number.isFinite(started))state.started=started;render()}}catch(error){showToast(error.message||'Õppimissessiooni avamine ebaõnnestus. Tund töötab preview-režiimis.',true)}}
boot();
})();
