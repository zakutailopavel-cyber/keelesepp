<script>
(function(){
const lesson=window.KeeleSeppAdaptiveLessons?.['est-b1-city-problem-solving-01'];
const workspaceCore=window.KeeleSeppLessonWorkspaceCore;
const sessionCore=window.KeeleSeppLearningSessionCore;
const skillEngine=window.KeeleSeppAdaptiveSkillEngine;
if(!lesson||!workspaceCore||!sessionCore||!skillEngine)return;
const scenes=window.KeeleSeppLessonScenes||{};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routeNames={support:'Toega',core:'Standard',advanced:'Edasijõudnu'};
const skillLabels={vocabulary:'Sõnavara',grammar:'Grammatika',speaking:'Rääkimine',reading:'Lugemine',listening:'Kuulamine',writing:'Kirjutamine'};
const workspaceNames={diagnostic:'Diagnostika',vocabulary:'Sõnavara',controlled_practice:'Harjutamine',scene:'Olukord',roleplay:'Rollimäng',transfer:'Ülekanne',assessment:'Lõppkontroll'};
const items=workspaceCore.buildItems(lesson);
const state={index:0,route:'core',routeBySkill:{},ratings:{},vocab:{},started:Date.now(),saving:false};
$('title').textContent=lesson.title;$('category').textContent=lesson.category;
const requestedStudentId=new URLSearchParams(location.search).get('studentId')||'';
function setSessionStatus(info={}){const el=$('session-status');const labels={preview:'Preview',loading:'Avan…',active:'Valmis',restored:'Jätkatud',saving:'Salvestan…',saved:'Salvestatud',completed:'Lõpetatud',signed_out:'Logi sisse',error:'Salvestusviga'};el.textContent=labels[info.mode]||info.mode||'Preview';el.title=info.message||'Õppimissessiooni salvestus';el.style.color=info.mode==='error'?'#9b2c2c':info.mode==='completed'||info.mode==='saved'?'#2d6957':'#6d7480'}
const sessionStore=window.KeeleSeppLearningSessionStore?.create({auth:window._auth,lesson,items,studentId:requestedStudentId,onStatus:setSessionStatus});
function showSavingStatus(message){if(sessionStore?.snapshot().persistent)setSessionStatus({mode:'saving',message})}
function itemSkillIds(item=items[state.index]){return sessionCore.skillIdsForItem({lesson,item})}
function effectiveRoute(item=items[state.index],fallback='core'){return skillEngine.routeForSkills({routeBySkill:state.routeBySkill,skillIds:itemSkillIds(item),fallback})}
function syncRoute(item=items[state.index],fallback='core'){state.route=effectiveRoute(item,fallback);return state.route}
function routeStateTitle(){const rows=Object.entries(skillEngine.normalizeRouteBySkill(state.routeBySkill));return rows.length?rows.map(([skill,route])=>`${skillLabels[skill]||skill}: ${routeNames[route]||route}`).join(' · '):'Oskusepõhine rada tekib hinnangute põhjal.'}
function seedLegacyCurrentRoute(item,route){const ids=itemSkillIds(item);if(ids.length&&!ids.some(id=>state.routeBySkill[id]))ids.forEach(id=>{state.routeBySkill[id]=skillEngine.normalizeRoute(route)})}
function stageMeta(){return [{title:'0. Diagnostika',minutes:lesson.diagnostic.durationMinutes},...lesson.stages.map(s=>({title:s.title,minutes:s.minutes}))]}
function currentModel(item){return workspaceCore.workspaceModel({lesson,item,currentRoute:state.route})}
function renderDiagnostic(model){return `<div class="diagnostic-box" data-workspace="diagnostic"><div class="workspace-head"><span class="workspace-badge">Diagnostika</span><span class="workspace-note">Ilma vihjete ja vastust paljastava pildita</span></div><div class="prompt">${esc(model.prompt)}</div><div class="micro">Lase õpilasel vastata lõpuni. Ära paranda enne vastuse lõppu.</div><div class="diagnostic-check"><span>Kuula tervet vastust</span><span>Ära näita sõnapanka</span><span>Hinda alles pärast sooritust</span></div><div class="rule">${esc(model.rule)}</div></div>`}
function renderVocabulary(model){const mode=model.route==='support'?'support':model.route==='advanced'?'advanced':'core';return `<div data-workspace="vocabulary"><div class="vocab-instruction"><div><div class="workspace-head"><span class="workspace-badge">Sõnavara</span><span class="workspace-note">Sõnakaardid, mitte olukorrapilt</span></div><div class="prompt">${esc(model.prompt)}</div></div><div class="vocab-counter">${model.words.length} aktiivset sõna</div></div><div class="vocab-grid">${model.words.map(word=>`<button class="vocab-card ${mode}" data-vocab-card="${esc(word.id)}" ${mode==='advanced'?'disabled':''}><b>${esc(word.word)}</b><span class="vocab-hidden"><small>${esc(word.translation)}</small><small>${esc(word.example)}</small></span></button>`).join('')}</div><div class="micro" style="margin-top:11px">${model.showTranslations?'Tugirajal on tõlge ja näide nähtavad.':'Vajadusel klõpsa kaardil, et õpetaja saaks ühe sõna toe avada.'}</div></div>`}
function renderPractice(model){return `<div data-workspace="controlled_practice"><div class="workspace-head"><span class="workspace-badge">Kontrollitud harjutamine</span><span class="workspace-note">Lauseehitus ja funktsioonid</span></div><div class="practice-board"><div class="practice-task"><h3>Ülesanne</h3><div class="prompt" style="font-size:1.35rem">${esc(model.prompt)}</div><div class="function-row"><span class="function-chip">probleem</span><span class="function-chip">küsimus</span><span class="function-chip">põhjus</span><span class="function-chip">lahendus</span></div><div class="answer-lines"><div class="answer-line"></div><div class="answer-line"></div><div class="answer-line"></div></div></div><div class="pattern-panel"><h3>${model.showPatterns?'Keelemallid':'Iseseisev moodustamine'}</h3>${model.showPatterns?`<div class="pattern-list">${model.patterns.slice(0,5).map(p=>`<div class="pattern"><b>${esc(p.label)}</b><br>${esc(p.pattern)}</div>`).join('')}</div>`:'<div class="micro">Edasijõudnu rajal lausemalle ei näidata. Õpilane valib konstruktsiooni ise.</div>'}</div></div></div>`}
function renderRoleplay(model){return `<div data-workspace="roleplay"><div class="workspace-head"><span class="workspace-badge">Rollimäng</span><span class="workspace-note">Kaks rolli, üks kommunikatiivne eesmärk</span></div><div class="role-grid"><div class="role-card student"><div class="role-kicker">Õpilase roll</div><h3>Lahenda olukord</h3><p>${esc(model.studentRole)}</p><div class="role-steps">${model.steps.map(step=>`<span>${esc(step)}</span>`).join('')}</div></div><div class="role-card teacher"><div class="role-kicker">Õpetaja roll</div><h3>Vasta loomulikult</h3><p>${esc(model.teacherRole)}</p></div></div></div>`}
function renderTransfer(model){return `<div class="transfer-box" data-workspace="transfer"><div class="transfer-kicker">UUS OLUKORD · ÜLEKANNE</div><div class="prompt">${esc(model.newSituation)}</div><div class="micro">Õpilane peab kasutama sama oskust uues kontekstis. Eelmise ülesande mudelit ei näidata.</div><div class="transfer-strip"><div><b>1. Mõista</b>Mis on uus probleem?</div><div><b>2. Tegutse</b>Küsi abi või paku lahendus.</div><div><b>3. Põhjenda</b>Miks see lahendus sobib?</div></div><div class="rule">${esc(model.rule)}</div></div>`}
function renderAssessment(model){return `<div class="assessment-box" data-workspace="assessment"><span class="workspace-badge">Lõppkontroll</span><div class="prompt">${esc(model.prompt)}</div><div class="micro">Sooritus enne tagasisidet. Vastusemudelit ja sõnapanka ei näidata.</div><div class="criteria">${model.criteria.map(c=>`<span>${esc(c)}</span>`).join('')}</div></div>`}
function renderScene(model,item){const scene=workspaceCore.sceneForWorkspace({scenes,item,type:model.type});return `<div data-workspace="scene"><div class="workspace-head"><span class="workspace-badge">Olukord</span></div><div class="prompt">${esc(model.prompt)}</div>${scene?`<figure class="scene"><img src="${esc(scene.src)}${scene.version?'?v='+encodeURIComponent(scene.version):''}" alt="${esc(scene.alt||'Õppeolukorra illustratsioon')}"></figure>`:'<div class="rule">Selle tegevuse jaoks ei ole eraldi olukorrapilti. Ära kasuta universaalset pilti lihtsalt tühja koha täitmiseks.</div>'}</div>`}
function renderWorkspace(item){const model=currentModel(item);const renderers={diagnostic:renderDiagnostic,vocabulary:renderVocabulary,controlled_practice:renderPractice,roleplay:renderRoleplay,transfer:renderTransfer,assessment:renderAssessment};$('workspace').innerHTML=(renderers[model.type]||((m)=>renderScene(m,item)))(model);$('expected').textContent=model.expected;$('expected-box').classList.toggle('hidden',model.showExpectedInitially===false||model.type==='diagnostic'||model.type==='assessment');$('method').textContent=model.teacherInstruction;$('method').classList.add('hidden');$('help-btn').textContent=model.type==='diagnostic'||model.type==='assessment'?'Õpetaja kontroll':'Õpetaja abi';document.querySelectorAll('[data-vocab-card]').forEach(card=>{card.onclick=()=>{if(card.classList.contains('advanced'))return;card.classList.toggle('revealed')}})}
async function persistProgress(){if(!sessionStore)return;try{await sessionStore.saveProgress({index:state.index,route:state.route})}catch(error){showToast(error.message||'Edenemise salvestamine ebaõnnestus.',true)}}
function renderStages(item){$('stages').innerHTML=stageMeta().map((s,i)=>`<button class="stage ${i===item.stage?'active':''}" data-stage="${i}"><span class="num">${i+1}</span><span><b>${esc(s.title)}</b><small>${s.minutes||''} min</small></span></button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=async()=>{if(state.saving)return;const n=items.findIndex(x=>x.stage===+b.dataset.stage);if(n>=0){state.index=n;syncRoute(items[n],'core');render();await persistProgress()}})}
function render(){const item=items[state.index],model=currentModel(item);$('activity').classList.remove('hidden');$('summary').classList.add('hidden');$('focus-title').textContent=item.title;$('focus-sub').textContent=workspaceNames[model.type]+' · '+(model.type==='diagnostic'?'kiire lähteolukorra kontroll':model.teacherInstruction||'');$('count').textContent=`${state.index+1} / ${items.length}`;$('progress').style.width=`${((state.index+1)/items.length)*100}%`;$('route').textContent=routeNames[state.route];$('route').title=routeStateTitle();$('prev').disabled=state.index===0||state.saving;$('next').disabled=state.saving;$('next').textContent=state.index===items.length-1?'Kokkuvõte →':'Järgmine →';document.querySelectorAll('[data-judge]').forEach(b=>{b.classList.toggle('selected',state.ratings[item.id]===b.dataset.judge);b.disabled=state.saving});renderStages(item);renderWorkspace(item)}
function openDrawer(title,html){$('drawer-title').textContent=title;$('drawer-body').innerHTML=html;$('drawer').classList.add('open')}
function showToast(message,error=false){$('toast').textContent=message;$('toast').style.color=error?'#9b2c2c':'#2d6957';$('toast').style.background=error?'#fff0ee':'#edf5f1';$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function syncWordButtons(wordId,mark,pending=false){document.querySelectorAll('[data-word]').forEach(button=>{if(button.dataset.word!==wordId)return;button.classList.toggle('selected',button.dataset.mark===mark);button.classList.toggle('pending',pending&&button.dataset.mark===mark);button.disabled=pending})}
function renderWords(){openDrawer('Sõnavara',lesson.vocabulary.map(w=>`<div class="word"><div><b>${esc(w.word)}</b><small>${esc(w.translation)}<br>${esc(w.example||'')}</small></div><div><button class="weak ${state.vocab[w.id]==='weak'?'selected':''}" data-word="${esc(w.id)}" data-mark="weak">!</button><button class="known ${state.vocab[w.id]==='known'?'selected':''}" data-word="${esc(w.id)}" data-mark="known">✓</button></div></div>`).join(''));document.querySelectorAll('[data-word]').forEach(b=>b.onclick=async()=>{if(state.saving)return;const wordId=b.dataset.word,mark=b.dataset.mark,previousMark=state.vocab[wordId];state.vocab[wordId]=mark;state.saving=true;showSavingStatus('Sõnavara tõendi salvestamine…');syncWordButtons(wordId,mark,true);try{if(sessionStore)await sessionStore.recordVocabulary({index:state.index,route:state.route,wordId,mark});showToast('Sõnavara hinnang salvestatud.')}catch(error){if(previousMark===undefined)delete state.vocab[wordId];else state.vocab[wordId]=previousMark;syncWordButtons(wordId,previousMark,false);showToast(error.message||'Sõnavara hinnangu salvestamine ebaõnnestus.',true)}finally{state.saving=false;syncWordButtons(wordId,state.vocab[wordId],false)}})}
function renderMore(){const item=items[state.index],model=currentModel(item);const routes=routeStateTitle();openDrawer('Õpetaja vaade',`<p><b>Tunni eesmärk</b><br>${esc(lesson.goal)}</p><p><b>Workspace</b><br>${esc(workspaceNames[model.type]||model.type)}</p><p><b>Oskusepõhised rajad</b><br>${esc(routes)}</p><p><b>Metoodiline juhend</b><br>${esc(model.teacherInstruction)}</p>`)}
function showSummary(){$('activity').classList.add('hidden');$('summary').classList.remove('hidden');$('mastery').innerHTML=['vocabulary','grammar','speaking'].map(k=>`<div class="field"><label>${k}</label><input id="m-${k}" inputmode="numeric" placeholder="0–100"></div>`).join('')}
function composeHandoff(){const vals=['vocabulary','grammar','speaking'].map(k=>`${k}: ${$('m-'+k)?.value||'—'}`).join('\n');const weak=Object.entries(state.vocab).filter(([,v])=>v==='weak').map(([k])=>k).join(', ')||'—';const routes=routeStateTitle();const text=`${lesson.title}\n${vals}\nRajad: ${routes}\nRasked sõnad: ${weak}\nMärkus: ${$('notes').value||'—'}`;$('handoff').textContent=text;return text}
function masteryScores(){return ['vocabulary','grammar','speaking'].reduce((out,key)=>{const value=$('m-'+key)?.value;if(value!==''&&value!==undefined)out[key]=value;return out},{})}
document.querySelectorAll('[data-judge]').forEach(b=>b.onclick=async()=>{if(state.saving)return;const item=items[state.index],j=b.dataset.judge,skillIds=itemSkillIds(item),previousRating=state.ratings[item.id],previousRoute=state.route,previousRouteBySkill={...state.routeBySkill};const decision=skillEngine.applyJudgement({routeBySkill:state.routeBySkill,skillIds,judgement:j,fallback:'core'});state.ratings[item.id]=j;state.routeBySkill=decision.routeBySkill;state.route=decision.effectiveAfter;state.saving=true;showSavingStatus('Õpetaja hinnangu salvestamine…');render();try{if(sessionStore){const snap=await sessionStore.recordJudgement({index:state.index,route:decision.effectiveBefore,judgement:j,nextRoute:decision.effectiveAfter,nextRouteBySkill:decision.nextBySkill});if(snap.session?.routeBySkill)state.routeBySkill=skillEngine.normalizeRouteBySkill(snap.session.routeBySkill);state.route=effectiveRoute(item,decision.effectiveAfter)}showToast(j==='help'?'Tõend salvestatud. Mõjutatud oskused saavad rohkem tuge.':j==='easy'?'Tõend salvestatud. Mõjutatud oskused saavad rohkem väljakutset.':'Tõend salvestatud. Oskusepõhised rajad jäävad samaks.')}catch(error){if(previousRating===undefined)delete state.ratings[item.id];else state.ratings[item.id]=previousRating;state.route=previousRoute;state.routeBySkill=previousRouteBySkill;showToast(error.message||'Õpetaja hinnangu salvestamine ebaõnnestus.',true)}finally{state.saving=false;render()}});
$('prev').onclick=async()=>{if(state.saving)return;if(state.index>0){state.index--;syncRoute(items[state.index],'core');render();await persistProgress()}};$('next').onclick=async()=>{if(state.saving)return;if(state.index<items.length-1){state.index++;syncRoute(items[state.index],'core');render();await persistProgress()}else showSummary()};$('finish').onclick=showSummary;$('restart').onclick=async()=>{state.index=0;syncRoute(items[0],'core');render();await persistProgress()};$('handoff-btn').onclick=async()=>{const text=composeHandoff();if(!sessionStore||!sessionStore.snapshot().persistent)return;const button=$('handoff-btn');button.disabled=true;button.textContent='Salvestan…';try{await sessionStore.complete({route:state.route,scores:masteryScores(),teacherNote:$('notes').value||'',handoffText:text});button.textContent='Salvestatud';showToast('Sessioon lõpetatud. Tõendid jäid ajalukku.')}catch(error){button.disabled=false;button.textContent='Koosta handoff';showToast(error.message||'Sessiooni lõpetamine ebaõnnestus.',true)}};
$('help-btn').onclick=()=>{const item=items[state.index],model=currentModel(item);$('method').classList.toggle('hidden');if(model.type==='diagnostic'||model.type==='assessment')$('expected-box').classList.toggle('hidden')};$('words-btn').onclick=renderWords;$('more-btn').onclick=renderMore;$('drawer-close').onclick=()=>$('drawer').classList.remove('open');setInterval(()=>$('elapsed').textContent=`${Math.floor((Date.now()-state.started)/60000)} / ${lesson.durationMinutes} min`,30000);
async function boot(){render();if(!sessionStore){setSessionStatus({mode:'preview',message:'Learning Session store puudub.'});return}try{const snap=await sessionStore.init({initialIndex:state.index,initialRoute:state.route});if(snap.session){state.index=Math.max(0,Math.min(items.length-1,Number(snap.session.currentIndex)||0));state.routeBySkill=skillEngine.normalizeRouteBySkill(snap.session.routeBySkill||{});const restoredRoute=routeNames[snap.session.currentRoute]?snap.session.currentRoute:'core';seedLegacyCurrentRoute(items[state.index],restoredRoute);state.route=effectiveRoute(items[state.index],restoredRoute);if(snap.session.studentName)$('student').textContent=snap.session.studentName;const started=Date.parse(snap.session.startedAt||'');if(Number.isFinite(started))state.started=started;render()}}catch(error){showToast(error.message||'Õppimissessiooni avamine ebaõnnestus. Tund töötab preview-režiimis.',true)}}
boot();
})();
</script>
</body>
</html>
