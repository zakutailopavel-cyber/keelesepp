eight:900}.stage.active .num{background:var(--gold);color:#fff}.stage b{display:block;font-size:.72rem}.stage small{display:block;color:var(--muted);font-size:.62rem;margin-top:2px}.main{padding:28px 34px 110px}.inner{max-width:1050px;margin:auto}.lesson-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px}.lesson-head h1{font-family:Georgia,serif;font-size:1.6rem;margin:0}.lesson-head p{margin:5px 0 0;color:var(--muted);font-size:.8rem}.count{margin-left:auto;font-size:.72rem;color:var(--muted);font-weight:800}.progress{height:4px;background:#e9e2d7;border-radius:99px;overflow:hidden;margin-bottom:18px}.progress span{display:block;height:100%;background:var(--gold);border-radius:99px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.content{padding:32px}.label{font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:900}.prompt{font-family:Georgia,serif;font-size:1.65rem;line-height:1.28;margin:10px 0 12px}.situation{color:#4d5968;line-height:1.55;font-size:.9rem}.scene{margin:22px 0;height:185px;border-radius:18px;background:linear-gradient(135deg,#f5ead7,#eef2ec);display:grid;place-items:center;font-size:3.1rem;border:1px solid #eee2cf}.teacher-line{display:flex;gap:10px;align-items:flex-start}.expected{flex:1;background:#f7f1e7;border-radius:14px;padding:14px 16px;font-size:.84rem;line-height:1.5}.expected b{display:block;margin-bottom:4px}.help-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-weight:800;color:var(--navy)}.method{margin-top:10px;background:#fff7e8;border:1px solid #ead4aa;border-radius:14px;padding:14px;font-size:.8rem;line-height:1.5}.judge{border-top:1px solid var(--line);padding:18px 24px 22px;background:#fff}.judge-title{text-align:center;font-size:.76rem;font-weight:850;margin-bottom:10px}.judge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.judge button{border:1px solid var(--line);background:#fff;border-radius:14px;min-height:72px;padding:10px}.judge b{display:block;font-size:.8rem}.judge small{display:block;color:var(--muted);font-size:.64rem;margin-top:4px}.judge .help.selected{background:#fff5e3;border-color:#d7a54c}.judge .ok.selected{background:var(--green2);border-color:#8ab4a6}.judge .easy.selected{background:#f2edf8;border-color:#b5a0ce}.nav{display:flex;justify-content:space-between;margin-top:14px}.nav button{border:0;border-radius:12px;padding:11px 16px;font-weight:850}.prev{background:#ece6dc;color:var(--navy)}.next{background:var(--navy);color:#fff}.toast{margin-top:10px;font-size:.75rem;color:var(--green);background:var(--green2);padding:10px 12px;border-radius:10px}.floating{position:fixed;right:24px;bottom:24px;display:flex;gap:9px;z-index:40}.float-btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:12px 15px;font-weight:850;box-shadow:0 10px 30px rgba(49,40,28,.13)}.drawer{position:fixed;top:0;right:0;width:min(390px,92vw);height:100vh;background:var(--paper);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(49,40,28,.14);z-index:60;transform:translateX(105%);transition:.22s;padding:22px;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;margin-bottom:14px}.drawer-head h2{margin:0;font-family:Georgia,serif}.drawer-head button{margin-left:auto;width:38px;height:38px}.word{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.word b{display:block}.word small{color:var(--muted)}.word button{border:0;border-radius:9px;width:32px;height:32px}.word button.weak{background:#fff0e7}.word button.known{background:var(--green2)}.summary{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow)}.mastery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:grid;gap:5px}.field label{font-size:.68rem;color:var(--muted);font-weight:800}.field input,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px}.handoff{margin-top:12px;background:var(--navy);color:#fff;padding:13px;border-radius:12px;white-space:pre-wrap;font:12px ui-monospace,monospace}.summary-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.summary-actions button{border:0;border-radius:10px;padding:10px 13px;font-weight:800}.ghost{background:#eee8de}.primary{background:var(--navy);color:#fff}@media(max-width:760px){.top{height:64px;padding:0 12px;gap:9px}.brand{font-size:1.08rem}.lesson-title b{font-size:.83rem}.lesson-title small,.timer,.route{display:none}.finish{padding:10px 12px;font-size:.76rem}.layout{display:block}.stages{border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;overflow-x:auto}.stages h2{display:none}.stage-list{display:flex;min-width:max-content}.stage{width:54px;padding:7px;display:block;text-align:center}.stage b,.stage small{display:none}.num{margin:auto}.main{padding:16px 12px 110px}.lesson-head h1{font-size:1.18rem}.lesson-head p{font-size:.72rem}.content{padding:20px 18px}.prompt{font-size:1.28rem}.scene{height:125px;font-size:2.2rem;margin:16px 0}.teacher-line{display:block}.help-btn{width:100%;margin-top:8px}.judge{padding:14px}.judge-grid{gap:6px}.judge button{min-height:62px;padding:7px 5px}.judge b{font-size:.72rem}.judge small{display:none}.floating{left:12px;right:12px;bottom:12px;justify-content:flex-end}.float-btn{padding:11px 13px}.mastery{grid-template-columns:1fr}}

</head><body>
<div class="app"><header class="top"><button class="back" onclick="history.back()">←</button><div class="brand">Keele<span>Sepp</span></div><div class="lesson-title"><b id="title">Adaptiivne tund</b><small><span id="student">Prototüübi õpilane</span> · B1 · <span id="category"></span></small></div><div class="spacer"></div><div class="timer" id="elapsed">0 / 60 min</div><div class="route" id="route">Standard</div><button class="finish" id="finish">Lõpeta tund</button></header>
<div class="layout"><aside class="stages"><h2>Tunni käik</h2><div class="stage-list" id="stages"></div></aside><main class="main"><div class="inner"><section id="activity"><div class="lesson-head"><div><h1 id="focus-title"></h1><p id="focus-sub"></p></div><div class="count" id="count"></div></div><div class="progress"><span id="progress"></span></div><article class="card"><div class="content"><div class="label" id="task-label"></div><div class="prompt" id="prompt"></div><div class="situation" id="situation"></div><div class="scene">🚌 &nbsp; 🧑‍🏫 💬 🧑</div><div class="teacher-line"><div class="expected"><b>Oodatav vastus / suund</b><div id="expected"></div></div><button class="help-btn" id="help-btn">Õpetaja abi</button></div><div class="method hidden" id="method"></div></div><div class="judge"><div class="judge-title">Kuidas õpilane hakkama sai?</div><div class="judge-grid"><button class="help" data-judge="help"><b>🤔 Vajab abi</b><small>rohkem tuge</small></button><button class="ok" data-judge="ok"><b>✅ Sai hakkama</b><small>sama raskus</small></button><button class="easy" data-judge="easy"><b>⭐ Liiga kerge</b><small>rohkem väljakutset</small></button></div></div></article><div class="nav"><button class="prev" id="prev">← Eelmine</button><button class="next" id="next">Järgmine →</button></div><div class="toast hidden" id="toast"></div></section><section class="summary hidden" id="summary"><h2>Tunni kokkuvõte</h2><p>Lisa ainult päriselt hinnatud oskused. Tühi väli ei tähenda nulli.</p><div class="mastery" id="mastery"></div><div class="field" style="margin-top:12px"><label>Märkus järgmisele õpetajale</label><textarea id="notes" rows="3"></textarea></div><div class="summary-actions"><button class="ghost" id="restart">Alusta uuesti</button><button class="primary" id="handoff-btn">Koosta handoff</button></div><div class="handoff" id="handoff">Handoff tekib siia.</div></section></div></main></div></div>
<div class="floating"><button class="float-btn" id="words-btn">Aa Sõnad</button><button class="float-btn" id="more-btn">⋯ Veel</button></div><aside class="drawer" id="drawer"><div class="drawer-head"><h2 id="drawer-title">Sõnavara</h2><button class="icon-btn" id="drawer-close">×</button></div><div id="drawer-body"></div></aside>
<script>(function(){const core=window.AdaptiveLessonCore,lesson=window.KeeleSeppAdaptiveLessons?.['est-b1-city-problem-solving-01'];if(!core||!lesson)return;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const routeNames={support:'Toega',core:'Standard',advanced:'Edasijõudnu'};const items=[];lesson.diagnostic.items.forEach((x,i)=>items.push({kind:'diagnostic',stage:0,id:x.id,title:'Diagnostika',prompt:x.prompt,expected:x.expected,context:i===1?'Õpilane vajab võõralt inimeselt abi.':'Lase õpilasel vastata lõpuni ilma parandamata.',method:lesson.diagnostic.instruction}));lesson.stages.forEach((s,si)=>(s.routes.core?.tasks||[]).forEach((t,ti)=>items.push({kind:'stage',stage:si+1,id:`${s.id}-${ti}`,stageId:s.id,title:s.title,taskIndex:ti,prompt:t})));const state={index:0,route:'core',ratings:{},vocab:{},started:Date.now()};$('title').textContent=lesson.title;$('category').textContent=lesson.category;function routeFor(r){if(r==='help')return state.route==='advanced'?'core':'support';if(r==='easy')return state.route==='support'?'core':'advanced';return state.route}function variant(item){return item.kind==='stage'?(lesson.stages[item.stage-1].routes[state.route]||lesson.stages[item.stage-1].routes.core):null}function task(item){if(item.kind==='diagnostic')return item.prompt;const v=variant(item),ts=v.tasks||[];return ts[Math.min(item.taskIndex,ts.length-1)]||item.prompt}function expected(item){if(item.kind==='diagnostic')return item.expected;const s=lesson.stages[item.stage-1],v=variant(item);return v.expectedAnswerExamples?.[0]||v.success||s.checkpoint||'Jälgi kommunikatiivse eesmärgi täitmist.'}function method(item){if(item.kind==='diagnostic')return item.method;return variant(item).teacherInstruction||'Kohanda toe hulka, kuid hoia eesmärk samana.'}function renderStages(){const current=items[state.index].stage;$('stages').innerHTML=[{title:'0. Diagnostika',minutes:lesson.diagnostic.durationMinutes},...lesson.stages].map((s,i)=>`<button class="stage ${i===current?'active':''}" data-stage="${i}"><span class="num">${i+1}</span><span><b>${esc(s.title)}</b><small>${s.minutes||'—'} min</small></span></button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{const n=items.findIndex(x=>x.stage===Number(b.dataset.stage));if(n>=0){state.index=n;render()}})}function render(){const item=items[state.index];$('route').textContent=routeNames[state.route];$('focus-title').textContent=item.title;$('focus-sub').textContent=item.kind==='diagnostic'?'Kiire lähteolukorra kontroll.':'Üks ülesanne korraga.';$('count').textContent=`${state.index+1} / ${items.length}`;$('progress').style.width=`${(state.index+1)/items.length*100}%`;$('task-label').textContent=item.kind==='diagnostic'?'Diagnostika':'Praegune ülesanne';$('prompt').textContent=task(item);$('situation').textContent=item.kind==='diagnostic'?item.context:`Tunni eesmärk: ${lesson.goal}`;$('expected').textContent=expected(item);$('method').innerHTML=`<b>Õpetaja abi</b><br>${esc(method(item))}`;$('method').classList.add('hidden');document.querySelectorAll('[data-judge]').forEach(b=>b.classList.toggle('selected',state.ratings[item.id]===b.dataset.judge));$('prev').disabled=state.index===0;$('prev').style.opacity=state.index===0?'.4':'1';$('next').textContent=state.index===items.length-1?'Kokkuvõte →':'Järgmine →';$('toast').classList.add('hidden');renderStages()}document.querySelectorAll('[data-judge]').forEach(b=>b.onclick=()=>{const item=items[state.index],before=state.route;state.ratings[item.id]=b.dataset.judge;state.route=routeFor(b.dataset.judge);render();$('toast').textContent=before===state.route?'Raskus jääb samaks.':`Järgmine samm: ${routeNames[state.route]}.`;$('toast').classList.remove('hidden')});$('help-btn').onclick=()=> $('method').classList.toggle('hidden');$('prev').onclick=()=>{if(state.index>0){state.index--;render()}};$('next').onclick=()=>{if(state.index<items.length-1){state.index++;render()}else showSummary()};function openDrawer(title,html){$('drawer-title').textContent=title;$('drawer-body').innerHTML=html;$('drawer').classList.add('open')}function renderWords(){return lesson.vocabulary.map(w=>`<div class="word"><span><b>${esc(w.word)}</b><small>${esc(w.translation)}</small></span><button class="${state.vocab[w.id]||''}" data-word="${w.id}">${state.vocab[w.id]==='weak'?'!':state.vocab[w.id]==='known'?'✓':'○'}</button></div>`).join('')}function bindWords(){document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const cur=state.vocab[b.dataset.word];state.vocab[b.dataset.word]=cur==='weak'?'known':cur==='known'?'':'weak';$('drawer-body').innerHTML=renderWords();bindWords()})}$('words-btn').onclick=()=>{openDrawer('Sõnavara',renderWords());bindWords()};$('more-btn').onclick=()=>openDrawer('Õpetajale',`<p><b>Tunni eesmärk</b><br>${esc(lesson.goal)}</p><p><b>Metoodiline põhimõte</b><br>${esc(lesson.teacherBrief?.principle||'')}</p><p><b>Väldi</b><br>${esc(lesson.teacherBrief?.doNotDo||'')}</p>`);$('drawer-close').onclick=()=>$('drawer').classList.remove('open');function showSummary(){$('activity').classList.add('hidden');$('summary').classList.remove('hidden')}$('finish').onclick=showSummary;$('mastery').innerHTML=core.SKILLS.map(s=>`<div class="field"><label>${s}</label><input data-mastery="${s}" type="number" min="0" max="100" placeholder="—"></div>`).join('');$('handoff-btn').onclick=()=>{const mastery={};document.querySelectorAll('[data-mastery]').forEach(i=>{if(i.value!=='')mastery[i.dataset.mastery]=Number(i.value)});const vocabulary=lesson.vocabulary.map(w=>({word:w.word,status:state.vocab[w.id]||'unassessed'})).filter(x=>x.status!=='unassessed');$('handoff').textContent=JSON.stringify(core.buildTeacherHandoff({lesson:{key:lesson.id,title:lesson.title},student:{id:'prototype-student',name:'Prototüübi õpilane'},route:state.route,mastery,vocabulary,notes:$('notes').value}),null,2)};$('restart').onclick=()=>location.reload();function tick(){const m=Math.floor((Date.now()-state.started)/60000);$('elapsed').textContent=`${m} / ${lesson.durationMinutes} min`}tick();setInterval(tick,30000);render()})();</script></body></html>
