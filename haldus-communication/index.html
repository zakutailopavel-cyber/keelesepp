<!DOCTYPE html>
<html lang="et" style="color-scheme:light only">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KeeleSepp — Kommunikatsioon</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ee;color:#172033;font-family:"IBM Plex Sans",system-ui,sans-serif}
body.embedded{background:transparent}.top{height:64px;background:#fff;border-bottom:1px solid #e8e5df;display:flex;align-items:center;padding:0 24px;gap:18px;position:sticky;top:0;z-index:10}
.brand{font-family:Fraunces,Georgia,serif;font-size:1.35rem}.brand span{color:#c9882a}.top a{color:#42536a;text-decoration:none;font-weight:600;font-size:.86rem}.top .spacer{flex:1}
.page{max-width:1180px;margin:0 auto;padding:26px}.embedded .page{max-width:none;padding:8px 10px 18px}
.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.eyebrow{font-size:.68rem;letter-spacing:.11em;font-weight:800;color:#7b8797;text-transform:uppercase}.hero h1{font-size:1.85rem;margin:5px 0 4px}.hero p{margin:0;color:#667085;font-size:.9rem}.pill{border-radius:999px;background:#eaf4f1;color:#245348;padding:7px 11px;font-size:.75rem;font-weight:700}
.shell{display:grid;grid-template-columns:350px minmax(0,1fr);min-height:650px;background:#fff;border:1px solid #e5e2dc;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px rgba(23,32,51,.06)}
.left{border-right:1px solid #ece9e3;display:flex;flex-direction:column;min-width:0}.toolbar{padding:14px;border-bottom:1px solid #ece9e3}.search{display:flex;align-items:center;gap:8px;border:1px solid #dfe3e8;border-radius:11px;padding:9px 11px;background:#fafafa}.search input{border:0;outline:0;background:transparent;width:100%;font:inherit}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.filters button{border:1px solid #e0e4e8;background:#fff;border-radius:999px;padding:6px 9px;font-size:.72rem;font-weight:700;color:#516070;cursor:pointer}.filters button.active{background:#1c2b3a;color:#fff;border-color:#1c2b3a}
.list{overflow:auto;max-height:580px}.conversation{width:100%;border:0;border-bottom:1px solid #f0ede8;background:#fff;display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:12px 14px;text-align:left;cursor:pointer}.conversation:hover{background:#faf9f7}.conversation.active{background:#eef4ff}.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#edf1f5;color:#1c2b3a;font-weight:800}.conversation strong{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation small{display:block;color:#7a8491;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.unread{background:#2563eb;color:#fff;border-radius:999px;min-width:22px;height:22px;padding:0 7px;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800}
.empty{padding:30px 18px;text-align:center;color:#7b8797}.chat{display:flex;flex-direction:column;min-width:0}.chat-head{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid #ece9e3}.chat-head .meta{min-width:0}.chat-head strong{display:block}.chat-head small{color:#778291}.channel{margin-left:auto;border-radius:999px;padding:5px 9px;font-size:.7rem;font-weight:800}.channel.facebook{background:#eaf1ff;color:#1d4ed8}.channel.instagram{background:#faedf7;color:#9d174d}.channel.internal{background:#eef7f3;color:#266253}
.stream{flex:1;padding:20px;overflow:auto;background:#fbfaf8;min-height:470px;max-height:520px}.msg{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 12px}.msg.own{align-items:flex-end}.bubble{max-width:min(78%,620px);background:#fff;border:1px solid #e6e2dc;border-radius:14px 14px 14px 4px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.msg.own .bubble{background:#1c2b3a;color:#fff;border-color:#1c2b3a;border-radius:14px 14px 4px 14px}.bubble p{margin:0;white-space:pre-wrap;word-break:break-word;line-height:1.4}.bubble span{display:block;font-size:.68rem;font-weight:700;opacity:.68;margin-bottom:4px}.bubble time{display:block;font-size:.64rem;opacity:.6;margin-top:5px;text-align:right}
.composer{border-top:1px solid #ece9e3;padding:13px 15px;background:#fff}.composer textarea{width:100%;resize:vertical;min-height:68px;max-height:180px;border:1px solid #dfe3e8;border-radius:12px;padding:10px 12px;font:inherit;outline:none}.composer textarea:focus{border-color:#7690ad;box-shadow:0 0 0 3px rgba(73,109,147,.1)}.composer-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}.composer small{color:#7d8793}.btn{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#1c2b3a;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{margin-bottom:14px;padding:10px 12px;border:1px solid #f0d28c;background:#fff9e8;border-radius:11px;color:#7b5a12;font-size:.78rem}.error{padding:10px 12px;background:#fff0f0;color:#9f2424;border:1px solid #f3c5c5;border-radius:10px;margin-bottom:12px}.loading{min-height:400px;display:flex;align-items:center;justify-content:center;color:#667085}
@media(max-width:820px){.page{padding:14px}.shell{grid-template-columns:1fr}.left{border-right:0}.list{max-height:260px}.stream{min-height:360px}.hero{flex-direction:column}.top{padding:0 14px}.conversation{grid-template-columns:38px 1fr auto}.avatar{width:38px;height:38px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
if(new URLSearchParams(location.search).get('embedded')==='1') document.body.classList.add('embedded');
firebase.initializeApp({
  apiKey:"AIzaSyAp8emBOh1fIqv72k_O5hkLkXVkfBt1al4",
  authDomain:"keelesepp-5136b.firebaseapp.com",
  projectId:"keelesepp-5136b",
  storageBucket:"keelesepp-5136b.firebasestorage.app",
  messagingSenderId:"674098517935",
  appId:"1:674098517935:web:e73d04a4ada67874da015a"
});
const auth=firebase.auth(), db=firebase.firestore();
const META_URL='https://us-central1-keelesepp-5136b.cloudfunctions.net/metaMessagingApi';

function clean(v){return String(v||'').trim()}
function channelOf(m){const v=clean(m.channel||m.source).toLowerCase();if(['facebook','messenger','facebook_messenger'].includes(v))return'facebook';if(['instagram','instagram_direct','ig'].includes(v))return'instagram';return'internal'}
function conversationId(m){const ch=channelOf(m), explicit=clean(m.conversationId);if(explicit){if(ch==='internal'||explicit.startsWith(ch+':'))return explicit;return ch+':'+explicit}const studentId=clean(m.studentId);if(ch==='internal'&&studentId)return studentId;const ext=clean(m.externalThreadId);if(ext)return ch+':'+ext;if(studentId)return ch+':student:'+studentId;const name=clean(m.studentName).toLowerCase();if(name)return'legacy:'+name;return m.id?ch+':message:'+m.id:''}
function toIso(v){if(v&&typeof v.toDate==='function')return v.toDate().toISOString();return clean(v)}
function initials(name){return clean(name).split(/\s+/).filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'?'}
function fmt(v){const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('et-EE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function channelLabel(ch){return ch==='facebook'?'Facebook':ch==='instagram'?'Instagram':'KeeleSepp'}
function buildConversations(messages,userUid){
  const map=new Map();
  [...messages].sort((a,b)=>toIso(a.createdAt||a.date).localeCompare(toIso(b.createdAt||b.date))).forEach(m=>{
    const id=conversationId(m);if(!id)return;const ch=channelOf(m);
    const row=map.get(id)||{id,channel:ch,studentId:clean(m.studentId),externalThreadId:clean(m.externalThreadId),name:ch==='internal'?(m.studentName||m.fromName||'Vestlus'):(m.externalSenderName||m.studentName||m.fromName||'Vestlus'),teacher:m.teacher||'',messages:[],unread:0,lastAt:''};
    row.messages.push(m);row.studentId||=clean(m.studentId);row.externalThreadId||=clean(m.externalThreadId);row.teacher||=m.teacher||'';row.lastAt=toIso(m.createdAt||m.date);if(!m.read&&m.fromUid!==userUid)row.unread++;map.set(id,row);
  });
  return [...map.values()].sort((a,b)=>b.lastAt.localeCompare(a.lastAt));
}

function App(){
  const [profile,setProfile]=React.useState(null),[loading,setLoading]=React.useState(true),[messages,setMessages]=React.useState([]),[students,setStudents]=React.useState([]);
  const [selected,setSelected]=React.useState(''),[query,setQuery]=React.useState(''),[filter,setFilter]=React.useState('all'),[text,setText]=React.useState(''),[sending,setSending]=React.useState(false),[error,setError]=React.useState('');
  React.useEffect(()=>auth.onAuthStateChanged(async user=>{if(!user){setProfile(null);setLoading(false);return}try{const snap=await db.collection('users').doc(user.uid).get();setProfile({uid:user.uid,email:user.email,displayName:user.displayName||user.email,...(snap.exists?snap.data():{})})}catch(e){setError(e.message)}finally{setLoading(false)}}),[]);
  const roles=React.useMemo(()=>{const r=[];if(profile?.role)r.push(profile.role);if(Array.isArray(profile?.roles))r.push(...profile.roles);return [...new Set(r)]},[profile]);
  const isAdmin=roles.includes('admin')||String(profile?.email||'').toLowerCase()==='zakutailo.pavel@gmail.com';
  const isStaff=isAdmin||roles.includes('teacher');
  React.useEffect(()=>{if(!profile||!isStaff)return;const u1=db.collection('messages').onSnapshot(s=>setMessages(s.docs.map(d=>({id:d.id,...d.data()}))),e=>setError(e.message));const u2=db.collection('students').onSnapshot(s=>setStudents(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{});return()=>{u1();u2()}},[profile?.uid,isStaff]);
  const visibleMessages=React.useMemo(()=>{if(isAdmin)return messages;if(!profile)return[];const allowed=new Set(students.filter(s=>s.teacherUid===profile.uid||clean(s.teacher).toLowerCase()===clean(profile.displayName).toLowerCase()).map(s=>s.id));return messages.filter(m=>channelOf(m)==='internal'&&(allowed.has(m.studentId)||clean(m.teacher).toLowerCase()===clean(profile.displayName).toLowerCase()))},[messages,students,isAdmin,profile]);
  const conversations=React.useMemo(()=>buildConversations(visibleMessages,profile?.uid||''),[visibleMessages,profile?.uid]);
  const filtered=React.useMemo(()=>conversations.filter(c=>(filter==='all'||c.channel===filter)&&c.name.toLowerCase().includes(query.trim().toLowerCase())),[conversations,filter,query]);
  const active=conversations.find(c=>c.id===selected)||filtered[0]||null;
  React.useEffect(()=>{if(!active||!profile)return;const unread=active.messages.filter(m=>m.id&&!m.read&&m.fromUid!==profile.uid);if(!unread.length)return;const batch=db.batch();unread.forEach(m=>batch.update(db.collection('messages').doc(m.id),{read:true}));batch.commit().catch(()=>{})},[active?.id,profile?.uid,active?.unread]);
  async function send(e){e.preventDefault();if(!active||!text.trim()||sending)return;setSending(true);setError('');try{
    const body=text.trim();
    if(active.channel==='internal'){
      const student=students.find(s=>s.id===active.studentId);
      const createdAt=new Date().toISOString();
      await db.collection('messages').add({channel:'internal',conversationId:active.studentId,studentId:active.studentId,studentName:active.name,teacher:active.teacher||student?.teacher||'',text:body,fromUid:profile.uid,fromName:profile.displayName||profile.email||'Kasutaja',fromRole:isAdmin?'admin':'teacher',createdAt,date:createdAt.slice(0,10),read:false});
    }else{
      if(!isAdmin)throw new Error('Facebooki ja Instagrami vestlustele saab vastata ainult administraator.');
      const token=await auth.currentUser.getIdToken();
      const response=await fetch(META_URL+'/reply',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({channel:active.channel,conversationId:active.id,recipientId:active.externalThreadId,text:body})});
      const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Meta vastuse saatmine ebaõnnestus.');
    }
    setText('');
  }catch(err){setError(err.message||'Sõnumi saatmine ebaõnnestus.')}finally{setSending(false)}}
  if(loading)return <div className="loading">Laen kommunikatsiooni…</div>;
  if(!profile)return <div className="loading">Logi esmalt KeeleSepa haldusesse sisse.</div>;
  if(!isStaff)return <div className="loading">Kommunikatsioon on töötajate tööriist.</div>;
  const totalUnread=conversations.reduce((sum,c)=>sum+c.unread,0);
  return <React.Fragment>
    {!document.body.classList.contains('embedded')&&<header className="top"><div className="brand">Keele<span>Sepp</span></div><a href="/haldus/">← Haldus</a><div className="spacer"></div><small>{profile.displayName||profile.email}</small></header>}
    <main className="page">
      <div className="hero"><div><div className="eyebrow">Suhtlus</div><h1>Kommunikatsioon</h1><p>KeeleSepa, Facebooki ja Instagrami vestlused ühes kohas.</p></div><div className="pill">{totalUnread} lugemata</div></div>
      {isAdmin&&<div className="notice"><b>Meta kanalid:</b> Facebooki ühendus on aktiveeritud. Instagrami avalik kasutus sõltub Meta App Review kinnitamisest; arenduskontodega võib kanal töötada piiratud režiimis.</div>}
      {error&&<div className="error">{error}</div>}
      <section className="shell">
        <aside className="left">
          <div className="toolbar"><div className="search"><i className="fa-solid fa-magnifying-glass"></i><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Otsi vestlust"/></div>
          <div className="filters">{[['all','Kõik'],['internal','KeeleSepp'],['facebook','Facebook'],['instagram','Instagram']].map(([id,label])=><button key={id} className={filter===id?'active':''} onClick={()=>setFilter(id)}>{label}</button>)}</div></div>
          <div className="list">{filtered.length?filtered.map(c=><button key={c.id} className={'conversation '+(active?.id===c.id?'active':'')} onClick={()=>setSelected(c.id)}><span className="avatar">{initials(c.name)}</span><span><strong>{c.name}</strong><small>{channelLabel(c.channel)} · {c.messages.at(-1)?.text||'Vestlus'}</small></span>{c.unread>0?<span className="unread">{c.unread}</span>:<i className="fa-solid fa-check-double" style={{color:'#9aa3ad',fontSize:12}}></i>}</button>):<div className="empty">Vestlusi ei leitud.</div>}</div>
        </aside>
        <div className="chat">{active?<React.Fragment>
          <header className="chat-head"><span className="avatar">{initials(active.name)}</span><div className="meta"><strong>{active.name}</strong><small>{active.messages.length} sõnumit{active.teacher?' · '+active.teacher:''}</small></div><span className={'channel '+active.channel}>{channelLabel(active.channel)}</span></header>
          <div className="stream">{active.messages.map(m=><div className={'msg '+(m.fromUid===profile.uid?'own':'')} key={m.id}><div className="bubble"><span>{m.fromName||channelLabel(active.channel)}</span><p>{m.text}</p><time>{fmt(toIso(m.createdAt||m.date))}</time></div></div>)}</div>
          <form className="composer" onSubmit={send}>{active.channel!=='internal'&&!isAdmin?<div className="empty" style={{padding:8}}>Välistele kanalitele saab vastata administraator.</div>:<React.Fragment><textarea maxLength={active.channel==='internal'?4000:2000} value={text} onChange={e=>setText(e.target.value)} placeholder="Kirjuta sõnum…"></textarea><div className="composer-row"><small>{text.length}/{active.channel==='internal'?4000:2000}</small><button className="btn primary" disabled={!text.trim()||sending}>{sending?'Saadan…':'Saada'} <i className="fa-solid fa-paper-plane"></i></button></div></React.Fragment>}</form>
        </React.Fragment>:<div className="empty" style={{margin:'auto'}}>Vestlusi veel ei ole.</div>}</div>
      </section>
    </main>
  </React.Fragment>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
