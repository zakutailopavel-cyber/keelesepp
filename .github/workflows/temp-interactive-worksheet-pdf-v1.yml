name: temp-interactive-worksheet-pdf-v1

on:
  push:
    branches:
      - feat/interactive-worksheet-pdf-v1
    paths:
      - .github/workflows/temp-interactive-worksheet-pdf-v1.yml
      - scripts/patch_interactive_worksheet_pdf_v1.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interactive-worksheet-pdf-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply PDF worksheet patch
        run: python scripts/patch_interactive_worksheet_pdf_v1.py
      - name: Create and run regression test
        shell: bash
        run: |
          cat > interactive-worksheet-pdf-v1.test.js <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const html = fs.readFileSync('haldus-exercises/index.html','utf8');
          test('PDF worksheets render locally with PDF.js and support page-aware overlays',()=>{
            assert.match(html,/pdf\.min\.js/);
            assert.match(html,/pdfjsLib\.getDocument\(file\.url\)/);
            assert.match(html,/page:pageNum/);
            assert.match(html,/visibleElements=elements\.filter/);
            assert.match(html,/pdfPageCount/);
            assert.match(html,/Muuda interaktiivseks/);
          });
          test('PDF interaction does not introduce paid AI APIs',()=>{
            const slice=html.slice(html.indexOf('INTERACTIVE WORKSHEET V1'), html.indexOf('LIVE LESSON HISTORY'));
            assert.doesNotMatch(slice,/api\.openai\.com|google vision|deepl api|azure cognitive/i);
          });
          EOF
          node --test interactive-worksheet-v1.test.js interactive-worksheet-pdf-v1.test.js
      - name: Persist generated files via GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feat/interactive-worksheet-pdf-v1
        shell: bash
        run: |
          set -euo pipefail
          put_file () {
            local path="$1"
            local message="$2"
            local sha
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${BRANCH}" --jq '.sha' 2>/dev/null || true)
            local content
            content=$(base64 -w 0 "$path")
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                -f message="$message" -f content="$content" -f sha="$sha" -f branch="$BRANCH" >/dev/null
            else
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                -f message="$message" -f content="$content" -f branch="$BRANCH" >/dev/null
            fi
          }
          put_file haldus-exercises/index.html "Interactive worksheet PDF v1: page-aware PDF.js overlays"
          put_file interactive-worksheet-pdf-v1.test.js "test: cover PDF interactive worksheets"
      # retry after draw-guard pattern fix
