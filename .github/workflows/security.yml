name: Security

# npm audit: reporting only for now. It never fails the run; findings appear as a warning and in the run summary.
# gitleaks and zizmor: a finding makes their job red. No branch protection exists, so red does not block a merge.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "crm-v2/package-lock.json"
      - "functions/package-lock.json"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ZIZMOR_VERSION: 1.31.1
  ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        dir: [crm-v2, functions]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (reporting only, does not fail the run)
        env:
          DIR: ${{ matrix.dir }}
        run: |
          status=0
          npm audit --omit=dev --audit-level=critical > audit.txt 2>&1 || status=$?
          cat audit.txt
          {
            echo "### npm audit: $DIR"
            echo '```'
            tail -n 40 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=npm audit ($DIR)::Critical findings or audit error, see the log. Reporting only for now."
          fi

  gitleaks:
    # The commits of the pull request only. Older history was scanned once by hand (docs/PROJECT_STATE.md, 2026-11-01).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (release binary, checksum pinned)
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          rm gitleaks.tar.gz
      - name: Scan the commits of this pull request (values are redacted in the log)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git . --no-banner --redact=100 --verbose \
            --config .gitleaks.toml --log-opts="${BASE_SHA}..${HEAD_SHA}"

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor (release binary, checksum pinned)
        run: |
          curl -fsSL -o zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf zizmor.tar.gz -C "$RUNNER_TEMP/bin" zizmor
          rm zizmor.tar.gz
      - name: Audit workflows and Dependabot config (fails on high severity)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/bin/zizmor" --no-progress --min-severity=medium .github || true
          "$RUNNER_TEMP/bin/zizmor" --no-progress --format=github --min-severity=high .github
