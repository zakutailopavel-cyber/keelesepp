name: Apply Õppevara full-page preview

on:
  push:
    branches:
      - codex/oppevara-visual-navigation-v1
    paths:
      - .github/workflows/apply-oppevara-full-page-preview.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/oppevara-visual-navigation-v1
          fetch-depth: 0

      - name: Apply preview refinement
        run: python3 scripts/apply-oppevara-full-page-preview.py

      - name: Run focused Õppevara tests
        run: node --test curriculum-ui.test.js learning-library-core.test.js worksheet-integration-ui.test.js unified-teacher-workspace-v1.test.js oppevara-visual-navigation-v1.test.js

      - name: Check whitespace
        run: git diff --check

      - name: Smoke local preview endpoint
        run: |
          python3 -m http.server 4173 >/tmp/oppevara-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS 'http://127.0.0.1:4173/haldus-exercises/?preview=library' >/tmp/oppevara-preview.html; then
              break
            fi
            sleep 0.25
          done
          grep -q 'ws-file-page-image' /tmp/oppevara-preview.html
          grep -q 'ws-file-page-pdf' /tmp/oppevara-preview.html
          grep -q 'ws-file-preview-box' /tmp/oppevara-preview.html

      - name: Remove temporary patch files
        run: rm -f scripts/apply-oppevara-full-page-preview.py .github/workflows/apply-oppevara-full-page-preview.yml

      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: render worksheet files as full pages'
          git push origin HEAD:codex/oppevara-visual-navigation-v1
