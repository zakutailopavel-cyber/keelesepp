name: temp-oppevara-visual-navigation-v1

on:
  push:
    branches:
      - codex/oppevara-visual-navigation-v1

permissions:
  contents: write

jobs:
  patch-test-preview:
    if: ${{ !contains(github.event.head_commit.message, '[oppevara-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/oppevara-visual-navigation-v1

      - name: Apply bounded patch
        run: python3 scripts/apply-oppevara-visual-navigation-v1.py

      - name: Run focused Node tests
        shell: bash
        run: |
          set -o pipefail
          node --test curriculum-ui.test.js learning-library-core.test.js worksheet-integration-ui.test.js unified-teacher-workspace-v1.test.js oppevara-visual-navigation-v1.test.js | tee /tmp/oppevara-node-tests.txt

      - name: Check diff whitespace
        run: git diff --check

      - name: Start localhost preview
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/oppevara-http.log 2>&1 &
          echo $! >/tmp/oppevara-http.pid
          for i in {1..20}; do
            if curl -fsS 'http://127.0.0.1:4173/haldus-exercises/?preview=library' >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/oppevara-http.log
          exit 1

      - name: Install temporary browser driver
        shell: bash
        run: |
          mkdir -p /tmp/oppevara-pw
          npm install --prefix /tmp/oppevara-pw playwright@1.55.0
          /tmp/oppevara-pw/node_modules/.bin/playwright install chromium

      - name: Visual and console smoke
        shell: bash
        run: |
          cat >/tmp/oppevara-pw/smoke.js <<'NODE'
          const { chromium } = require('/tmp/oppevara-pw/node_modules/playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on('console',msg=>{ if(msg.type()==='error') errors.push(msg.text()); });
            page.on('pageerror',err=>errors.push(err.message));
            await page.goto('http://127.0.0.1:4173/haldus-exercises/?preview=library',{waitUntil:'networkidle'});
            await page.locator('.top-tab.active').waitFor();
            const active=(await page.locator('.top-tab.active').innerText()).trim();
            if(!active.includes('Õppekavad')) throw new Error('Default tab is not Õppekavad: '+active);
            const labels=await page.locator('.top-tab').allInnerTexts();
            const curriculumIndex=labels.findIndex(x=>x.includes('Õppekavad'));
            const libraryIndex=labels.findIndex(x=>x.includes('Raamatukogu'));
            if(curriculumIndex<0||libraryIndex<0||curriculumIndex>=libraryIndex) throw new Error('Top tab order is wrong');

            await page.locator('.subj-card',{hasText:'Eesti keel'}).click();
            await page.locator('.level-chip',{hasText:'B1'}).click();
            await page.locator('.lesson-sheet-preview').first().waitFor();
            await page.screenshot({path:'/tmp/oppevara-b1.png',fullPage:true});
            const b1Info=await page.locator('.lesson-sheet-preview .lesson-sheet-info').first().innerText();
            if(!b1Info.includes('ülesandeplokk')) throw new Error('B1 block-count preview missing');
            await page.locator('.lesson-sheet-preview').first().click();
            await page.locator('.ws-prev-ov').waitFor();
            await page.locator('.ws-prev-head button',{hasText:'Sulge'}).click();

            await page.locator('.bc-link',{hasText:'Kõik ained'}).click();
            await page.locator('.subj-card',{hasText:'Eesti keel'}).click();
            await page.locator('.level-chip',{hasText:'B2'}).click();
            await page.locator('.lesson-sheet-preview').first().waitFor();
            const b2Info=await page.locator('.lesson-sheet-preview .lesson-sheet-info').first().innerText();
            if(!b2Info.includes('Töölehe lähteülesanne')) throw new Error('B2 source-task label missing');
            await page.screenshot({path:'/tmp/oppevara-b2.png',fullPage:true});
            await page.locator('.lesson-sheet-preview').first().click();
            await page.locator('.ws-prev-ov').waitFor();

            await page.goto('http://127.0.0.1:4173/haldus-exercises/?preview=library&tab=library',{waitUntil:'networkidle'});
            const libraryActive=(await page.locator('.top-tab.active').innerText()).trim();
            if(!libraryActive.includes('Raamatukogu')) throw new Error('?tab=library did not keep library active');

            const actionable=errors.filter(text=>!text.includes('Failed to load resource')&&!text.includes('favicon'));
            fs.writeFileSync('/tmp/oppevara-console.txt',errors.join('\n'));
            if(actionable.length) throw new Error('Browser console errors: '+actionable.join(' | '));
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
          node /tmp/oppevara-pw/smoke.js

      - name: Record validation results
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            '__NODE_TEST_RESULT__':'PASS — required 5-file Node suite',
            '__DIFF_CHECK_RESULT__':'PASS',
            '__BROWSER_RESULT__':'PASS — localhost ?preview=library; default Õppekavad, explicit library deep link, B1/B2 mini-preview → WorksheetPreviewModal, no actionable console errors'
          }
          for path in [Path('docs/PROJECT_STATE.md'),Path('docs/HANDOFF_OPPEVARA_VISUAL_NAVIGATION_V1.md')]:
            text=path.read_text(encoding='utf-8')
            for old,new in replacements.items(): text=text.replace(old,new)
            path.write_text(text,encoding='utf-8')
          PY
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: oppevara-visual-navigation-v1-smoke
          path: |
            /tmp/oppevara-b1.png
            /tmp/oppevara-b2.png
            /tmp/oppevara-console.txt
            /tmp/oppevara-node-tests.txt

      - name: Commit validated product files and remove temporary machinery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-oppevara-visual-navigation-v1.py .github/workflows/temp-oppevara-visual-navigation-v1.yml
          sed -i 's/[[:space:]]*$//' docs/HANDOFF_OPPEVARA_VISUAL_NAVIGATION_V1.md
          git add haldus-exercises/index.html oppevara-visual-navigation-v1.test.js docs/PROJECT_STATE.md ARCHITECTURE.md docs/HANDOFF_OPPEVARA_VISUAL_NAVIGATION_V1.md
          git diff --cached --check
          git commit -m 'feat: improve Õppevara visual navigation [oppevara-final]'
          git push origin HEAD:codex/oppevara-visual-navigation-v1
