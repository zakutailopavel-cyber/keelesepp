name: CRM v2 CI

on:
  pull_request:
    paths:
      - 'crm-v2/**'
      - 'e2e/layout/**'
      - 'e2e/playwright.layout.config.cjs'
      - '.github/workflows/crm-v2-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'crm-v2/**'
      - 'e2e/layout/**'
      - 'e2e/playwright.layout.config.cjs'
      - '.github/workflows/crm-v2-ci.yml'

permissions:
  contents: read

concurrency:
  group: crm-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crm-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Report bundle size (warning only)
        continue-on-error: true
        run: node scripts/bundle-size-report.mjs

  sheet-layout:
    # the student's phone view of a worksheet in a real browser (docs/WORKSHEET_PHONE_VIEW.md): no emulators, no network
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            crm-v2/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: npm --prefix crm-v2 ci && npm --prefix e2e ci

      - name: Install the browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Check every block at phone, tablet and desktop sizes
        working-directory: e2e
        run: npx playwright test -c playwright.layout.config.cjs
