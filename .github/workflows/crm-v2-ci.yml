name: CRM v2 CI

on:
  pull_request:
    paths:
      - 'crm-v2/**'
      - '.github/workflows/crm-v2-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'crm-v2/**'
      - '.github/workflows/crm-v2-ci.yml'

permissions:
  contents: read

concurrency:
  group: crm-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crm-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
