name: Temporary B2 roadmap integration patch

on:
  push:
    branches:
      - fix/b2-roadmap-integration-deeplink
    paths:
      - .github/workflows/temp-b2-roadmap-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/b2-roadmap-integration-deeplink
          fetch-depth: 0
      - name: Patch curriculum integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('haldus-exercises/index.html')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "  const[tab,setTab]=useState('library');",
              """  const[tab,setTab]=useState(()=>{\n    const params=new URLSearchParams(window.location.search);\n    const requested=params.get('tab');\n    return ['library','curriculum','exercises','stats','history'].includes(requested)?requested:'library';\n  });""",
              'tab deep link init'
          )

          replace_once(
              "  const isTeacher=user?.role==='teacher'||user?.role==='admin'||user?.email==='zakutailo.pavel@gmail.com';",
              """  const isTeacher=user?.role==='teacher'||user?.role==='admin'||user?.email==='zakutailo.pavel@gmail.com';\n\n  useEffect(()=>{\n    const url=new URL(window.location.href);\n    url.searchParams.set('tab',tab);\n    if(tab!=='curriculum'){\n      url.searchParams.delete('subject');\n      url.searchParams.delete('level');\n      url.searchParams.delete('topic');\n    }\n    window.history.replaceState({},'',url.pathname+url.search);\n  },[tab]);""",
              'tab url sync'
          )

          replace_once(
              "  const[nav,setNav]=useState(null); // null | {subject} | {subject,level,topic}",
              """  const[nav,setNav]=useState(()=>{\n    const params=new URLSearchParams(window.location.search);\n    const subject=params.get('subject');\n    const level=params.get('level');\n    const topic=params.get('topic');\n    if(!subject)return null;\n    if(!level)return {subject};\n    return {subject,level,topic:topic||''};\n  }); // null | {subject} | {subject,level,topic}""",
              'curriculum nav deep link init'
          )

          replace_once(
              """  const activeTopic=nav?.topic||null;\n\n  const topics=subject?[...new Set(lessons.filter(l=>l.subject===subject.key&&l.level===nav.level&&!l.examPart).map(l=>l.topic).filter(Boolean))]:[];""",
              """  const activeTopic=nav?.topic||null;\n\n  useEffect(()=>{\n    const url=new URL(window.location.href);\n    url.searchParams.set('tab','curriculum');\n    if(nav?.subject)url.searchParams.set('subject',nav.subject);else url.searchParams.delete('subject');\n    if(nav?.level)url.searchParams.set('level',nav.level);else url.searchParams.delete('level');\n    if(nav?.topic)url.searchParams.set('topic',nav.topic);else url.searchParams.delete('topic');\n    window.history.replaceState({},'',url.pathname+url.search);\n  },[nav]);\n\n  useEffect(()=>{\n    if(LOCAL_LIBRARY_PREVIEW||!isTeacher||subject?.key!=='Eesti keel'||level!=='B2')return;\n    const b2Lessons=lessons.filter(l=>l.subject==='Eesti keel'&&l.level==='B2'&&!l.__subjectPlaceholder);\n    if(b2Lessons.length===0)return;\n    const roadmapCount=b2Lessons.filter(l=>l.roadmapManaged).length;\n    if(roadmapCount>=90)return;\n    const key='keelesepp-b2-roadmap-import-attempt';\n    if(window.sessionStorage.getItem(key))return;\n    window.sessionStorage.setItem(key,'1');\n    window.location.assign('/haldus-b1-b2-roadmap/');\n  },[subject?.key,level,isTeacher,lessons]);\n\n  const topics=subject?[...new Set(lessons.filter(l=>l.subject===subject.key&&l.level===nav.level&&!l.examPart).map(l=>l.topic).filter(Boolean))]:[];""",
              'curriculum url sync and roadmap ensure'
          )

          replace_once(
              "function TopicView({subject,level,activeTopic,topics,allLessons,isTeacher,onSelectTopic,onAdd,onEdit,onDelete,onRenameTopic,onDeleteTopic,onAddTopic,onPreviewWorksheet,onConductLesson}){",
              "function TopicView({subject,level,activeTopic,topics,allLessons,isTeacher,onSelectTopic,onAdd,onEdit,onDelete,onRenameTopic,onDeleteTopic,onAddTopic,onPreviewWorksheet,onConductLesson,onCopyPrompt}){",
              'topic view copy prompt prop'
          )

          replace_once(
              "                       {lesson.files?.length>0&&<div className=\"file-row\">{lesson.files.map((f,i)=><FileChip key={i} file={f}/>)}</div>}",
              """                       {lesson.roadmapManaged&&(\n                         <div style={{background:'rgba(47,93,80,.055)',border:'1px solid rgba(47,93,80,.12)',borderRadius:9,padding:'8px 10px',margin:'6px 0',fontSize:'.76rem',lineHeight:1.45,color:'#42536A'}}>\n                           <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:5}}>\n                             {lesson.levelStage&&<span style={{fontSize:'.66rem',fontWeight:800,padding:'2px 7px',borderRadius:999,background:'rgba(47,93,80,.11)',color:'#2F5D50'}}>{lesson.levelStage}</span>}\n                             {lesson.roadmapTag&&<span style={{fontSize:'.66rem',fontWeight:700,padding:'2px 7px',borderRadius:999,background:'rgba(201,136,42,.11)',color:'#A96E1A'}}>{lesson.roadmapTag}</span>}\n                           </div>\n                           {lesson.goal&&<div><strong>Eesmärk:</strong> {lesson.goal}</div>}\n                           {lesson.languageFocus&&<div><strong>Keelefookus:</strong> {lesson.languageFocus}</div>}\n                           {lesson.practice&&<div><strong>Praktika:</strong> {lesson.practice}</div>}\n                           {lesson.successCriteria&&<div><strong>Edu kriteerium:</strong> {lesson.successCriteria}</div>}\n                         </div>\n                       )}\n                       {lesson.files?.length>0&&<div className=\"file-row\">{lesson.files.map((f,i)=><FileChip key={i} file={f}/>)}</div>}""",
              'roadmap details card'
          )

          replace_once(
              """                       {lesson.phaseData&&onConductLesson&&(\n                         <button onClick={()=>onConductLesson(lesson)} className=\"btn btn-pine btn-sm\">""",
              """                       {isTeacher&&lesson.roadmapManaged&&lesson.worksheetPrompt&&onCopyPrompt&&(\n                         <button onClick={()=>onCopyPrompt(lesson.worksheetPrompt)} className=\"btn btn-ghost btn-sm\" style={{color:'#A96E1A',borderColor:'rgba(201,136,42,.28)',fontWeight:700}}>\n                           <i className=\"fa-solid fa-copy\"/> Kopeeri prompt\n                         </button>\n                       )}\n                       {isTeacher&&lesson.roadmapManaged&&(\n                         <button onClick={()=>onEdit(lesson)} className=\"btn btn-ghost btn-sm\" style={{color:'#2F5D50',borderColor:'rgba(47,93,80,.25)',fontWeight:700}}>\n                           <i className=\"fa-solid fa-paperclip\"/> Lisa tööleht\n                         </button>\n                       )}\n                       {lesson.phaseData&&onConductLesson&&(\n                         <button onClick={()=>onConductLesson(lesson)} className=\"btn btn-pine btn-sm\">""",
              'roadmap lesson actions'
          )

          replace_once(
              """          onPreviewWorksheet={onPreviewWorksheet}\n          onConductLesson={onConductLesson}""",
              """          onPreviewWorksheet={onPreviewWorksheet}\n          onCopyPrompt={text=>{\n            navigator.clipboard.writeText(text)\n              .then(()=>notify('✓ Töölehe prompt kopeeritud'))\n              .catch(()=>notify('⚠ Prompti ei saanud kopeerida'));\n          }}\n          onConductLesson={onConductLesson}""",
              'copy prompt handler'
          )

          path.write_text(text)

          migration = Path('haldus-b1-b2-roadmap/index.html')
          mtext = migration.read_text()
          old = "msg.innerHTML='Töölehti lisatakse edaspidi otse Õppekavades vastava tunni pliiatsi nupu kaudu. Avan Õppekavad…';setTimeout(()=>location.replace('/haldus-exercises/?tab=curriculum&subject=Eesti%20keel&level=B2'),900)"
          new = "msg.innerHTML='Töölehti lisatakse edaspidi otse Õppekavades vastava tunni pliiatsi nupu kaudu. Avan Õppekavad…';window.sessionStorage.removeItem('keelesepp-b2-roadmap-import-attempt');setTimeout(()=>location.replace('/haldus-exercises/?tab=curriculum&subject=Eesti%20keel&level=B2'),900)"
          if mtext.count(old) != 1:
              raise SystemExit(f'migration session reset: expected exactly 1 match, found {mtext.count(old)}')
          migration.write_text(mtext.replace(old, new, 1))

          checks = [
              "requested=params.get('tab')",
              "keelesepp-b2-roadmap-import-attempt",
              "Kopeeri prompt",
              "Lisa tööleht",
              "Edu kriteerium"
          ]
          final = path.read_text()
          for check in checks:
              if check not in final:
                  raise SystemExit(f'missing expected patch marker: {check}')
          PY
      - name: Validate patch
        run: |
          git diff --check
          grep -q "requested=params.get('tab')" haldus-exercises/index.html
          grep -q "roadmapCount>=90" haldus-exercises/index.html
          grep -q "Kopeeri prompt" haldus-exercises/index.html
          grep -q "sessionStorage.removeItem('keelesepp-b2-roadmap-import-attempt')" haldus-b1-b2-roadmap/index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add haldus-exercises/index.html haldus-b1-b2-roadmap/index.html
          git commit -m "fix: finish B2 roadmap curriculum integration"
          git push origin HEAD:fix/b2-roadmap-integration-deeplink
