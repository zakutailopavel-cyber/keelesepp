name: temp-a2-b1-roadmap

on:
  push:
    branches:
      - feat/a2-b1-roadmap-oppekavad
    paths:
      - .github/workflows/temp-a2-b1-roadmap.yml

permissions:
  contents: read

jobs:
  test-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/a2-b1-roadmap-oppekavad
      - name: Validate A2-B1 roadmap
        run: node a2-b1-roadmap.test.js
