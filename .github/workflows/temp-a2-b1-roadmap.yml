name: temp-a2-b1-roadmap

on:
  push:
    branches:
      - feat/a2-b1-roadmap-oppekavad
    paths:
      - .github/workflows/temp-a2-b1-roadmap.yml

permissions:
  contents: write

jobs:
  install-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/a2-b1-roadmap-oppekavad
      - name: Install A2-B1 roadmap assets
        shell: bash
        run: |
          echo '[... ELLIPSIZATION ...]' | base64 -d > /tmp/a2b1.tgz
          tar -xzf /tmp/a2b1.tgz -C .
          node a2-b1-roadmap.test.js
      - name: Commit roadmap assets
        shell: bash
        run: |
          git config user.name 'zakutailopavel-cyber'
          git config user.email 'zakutailo.pavel@gmail.com'
          git add data/keelesepp-a2-b1-roadmap*.json haldus-a2-b1-roadmap/index.html a2-b1-roadmap.test.js
          git commit -m 'Add A2 to B1 roadmap to B1 curriculum'
          git push origin HEAD:feat/a2-b1-roadmap-oppekavad
