name: temp-visual-worksheet-doc-reconcile

on:
  push:
    branches:
      - agent/visual-worksheet-student-v1
    paths:
      - .github/workflows/temp-visual-worksheet-doc-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-worksheet-student-v1
      - name: Reconcile project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/PROJECT_STATE.md')
          s=p.read_text(encoding='utf-8')
          old="""Validation: PASS — root library/interactive/visual worksheet Node contracts; focused CRM worksheet/homework Vitest; `crm-v2` production build; `git diff --check`.

Known limitation: visual field placement depends on the teacher-authored overlay coordinates; this slice does not
perform OCR/AI field detection. PDF student rendering remains a follow-up after #144 is reconciled.

Exactly one next safe step: review one real two-page image worksheet in the Vercel preview from teacher assignment
through student completion and teacher submission view before merge.
"""
          new="""Validation: PASS — root library/interactive/visual worksheet Node contracts; focused CRM worksheet/homework Vitest; `crm-v2` production build; `git diff --check`. The repository-wide CRM `npm test` remains red on unrelated existing UI tests; a temporary baseline probe reproduced the same broad-suite failure on current `main` under Node 22 and Node 24 and was removed after confirmation.

Known limitations: visual field placement depends on teacher-authored overlay coordinates; this slice does not
perform OCR/AI field detection. PDF student rendering remains a follow-up after #144 is reconciled. The root
Vercel project previews the teacher/root surface, while the separate `keelesepp-crm-v2` project is not GitHub-linked,
so no authenticated student-portal browser E2E is claimed for this draft.

Exactly one next safe step: use one real two-page raster worksheet in an authenticated staging/local flow — teacher
assigns it, student types/saves/submits, then teacher opens the same submitted pages with the answers — before merge.
"""
          if old not in s:
              raise SystemExit('Student Visual Worksheet validation section changed unexpectedly')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
      - name: Commit documentation reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md
          git commit -m "docs: reconcile visual worksheet validation state"
          git push origin HEAD:agent/visual-worksheet-student-v1
