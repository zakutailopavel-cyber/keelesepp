  push:
    branches: [main]
    paths:
      - "firebase.json"
      - "firestore.rules"
      - "storage.rules"
      - "functions/**"
      - "crm-v2/**"
      - "haldus.html"
      - "tingimused.html"
      - "terms-registration-ui.test.js"
      - "initial-assessment-core.js"
      - "initial-assessment-core.test.js"
      - "initial-assessment-ui.test.js"
      - "student-portal-scope-ui.test.js"
      - "haldus-learning-profile/**"
      - "learning-profile-core.js"
      - "learning-profile-core.test.js"
      - "learning-profile-evidence-store.js"
      - "learning-profile-evidence-store.test.js"
      - "learning-profile-ui.test.js"
      - "learning-profile-routing.test.js"
      - "curriculum-goal-core.js"
      - "curriculum-goal-core.test.js"
      - "curriculum-goals/**"
      - "haldus-adaptive-lesson/**"
      - "adaptive-lessons/**"
      - "adaptive-lesson-core.js"
      - "adaptive-lesson-core.test.js"
      - "adaptive-vocabulary-lesson.test.js"
      - "adaptive-skill-engine.js"
      - "adaptive-skill-engine.test.js"
      - "lesson-cloud-store.js"
      - "lesson-block-templates.js"
      - "lesson-builder-ux-core.js"
      - "lesson-builder-ux-core.test.js"
      - "lesson-authoring-presentation.js"
      - "tests/lesson-builder/**"
      - "lesson-authoring-core.js"
      - "lesson-authoring-core.test.js"
      - "lesson-authoring-preview.js"
      - "haldus-lesson-builder/**"
      - "activity-contract-core.js"
      - "activity-contract-core.test.js"
      - "lesson-workspace-core.js"
      - "lesson-workspace-core.test.js"
      - "learning-session-core.js"
      - "learning-session-core.test.js"
      - "learning-session-store.js"
      - "learning-session-ui.test.js"
      - "haldus-teacher-home/**"
      - "teacher-home-core.js"
      - "teacher-home-core.test.js"
      - "teacher-home-ui.test.js"
      - "vercel.json"
      - ".github/workflows/financial-core-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Run unit tests
        run: npm test --prefix functions
      - name: Run CRM, accounting, calendar and learning tests
        run: node --test haldus-quality.test.js calendar-core.test.js learning-library-core.test.js live-classroom-core.test.js staff-activity.test.js staff-time-core.test.js accounting-ledger-core.test.js teacher-scope-ui.test.js terms-registration-ui.test.js initial-assessment-core.test.js initial-assessment-ui.test.js student-portal-scope-ui.test.js learning-profile-core.test.js learning-profile-evidence-store.test.js learning-profile-ui.test.js learning-profile-routing.test.js curriculum-goal-core.test.js adaptive-lesson-core.test.js adaptive-vocabulary-lesson.test.js real-curriculum-lesson.test.js adaptive-skill-engine.test.js activity-contract-core.test.js lesson-authoring-core.test.js lesson-builder-ux-core.test.js lesson-workspace-core.test.js learning-session-core.test.js learning-session-ui.test.js teacher-home-core.test.js teacher-home-ui.test.js
      - name: Install isolated Builder browser test dependencies
        run: npm ci --prefix tests/lesson-builder --ignore-scripts
      - name: Run Builder browser behavior tests
        run: npm test --prefix tests/lesson-builder
      - name: Check browser JavaScript syntax
        run: |
          node --check lesson-cloud-store.js
          node --check haldus-lesson-builder/cloud.js
          node --check haldus-quality.js
          node --check calendar-core.js
          node --check learning-library-core.js
          node --check learning-profile-core.js
          node --check learning-profile-evidence-store.js
          node --check curriculum-goal-core.js
          node --check curriculum-goals/b1-city.js
          node --check adaptive-lesson-core.js
          node --check adaptive-lessons/est-b1-city-vocabulary.js
          node --check adaptive-skill-engine.js
          node --check lesson-block-templates.js
          node --check lesson-builder-ux-core.js
          node --check lesson-authoring-presentation.js
          node --check lesson-authoring-core.js
          node --check lesson-authoring-preview.js
          node --check haldus-lesson-builder/app.js
          node --check activity-contract-core.js
          node --check lesson-workspace-core.js
          node --check learning-session-core.js
          node --check learning-session-store.js
          node --check teacher-home-core.js
          node --check live-classroom-core.js
          node --check live-classroom.js
          node --check staff-activity.js
          node --check staff-time-core.js
          node --check accounting-ledger-core.js
          node --check initial-assessment-core.js
      - name: Run emulator integration tests
        run: >-
          npx --yes firebase-tools@15.22.3 emulators:exec
          --only auth,firestore,functions
          --project demo-keelesepp-finance
          --log-verbosity QUIET
          "npm --prefix functions run test:emulator && node --test functions/lesson-drafts-emulator.integration.js"