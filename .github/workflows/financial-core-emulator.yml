name: Financial Core emulator

on:
  pull_request:
    paths:
      - "firebase.json"
      - "firestore.rules"
      - "storage.rules"
      - "functions/**"
      - "haldus.html"
      - "tingimused.html"
      - "terms-registration-ui.test.js"
      - "haldus-calendar-v3.html"
      - "haldus-calendar.html"
      - "haldus-shared.js"
      - "initial-assessment-core.js"
      - "initial-assessment-core.test.js"
      - "initial-assessment-ui.test.js"
      - "student-portal-scope-ui.test.js"
      - "staff-activity.js"
      - "staff-time-core.js"
      - "staff-time-core.test.js"
      - "accounting-ledger-core.js"
      - "accounting-ledger-core.test.js"
      - "calendar-core.js"
      - "calendar-core.test.js"
      - "haldus-quality.js"
      - "haldus-quality.test.js"
      - "haldus-exercises/**"
      - "learning-library-core.js"
      - "learning-library-core.test.js"
      - "haldus-learning-profile/**"
      - "learning-profile-core.js"
      - "learning-profile-core.test.js"
      - "learning-profile-evidence-store.js"
      - "learning-profile-evidence-store.test.js"
      - "learning-profile-ui.test.js"
      - "learning-profile-routing.test.js"
      - "haldus-adaptive-lesson/**"
      - "adaptive-lessons/**"
      - "adaptive-lesson-core.js"
      - "adaptive-lesson-core.test.js"
      - "learning-session-core.js"
      - "learning-session-core.test.js"
      - "learning-session-store.js"
      - "learning-session-ui.test.js"
      - "vercel.json"
      - "live-classroom.html"
      - "live-classroom.css"
      - "live-classroom.js"
      - "live-classroom-core.js"
      - "live-classroom-core.test.js"
      - ".github/workflows/financial-core-emulator.yml"
  push:
    branches: [main]
    paths:
      - "firebase.json"
      - "firestore.rules"
      - "storage.rules"
      - "functions/**"
      - "crm-v2/**"
      - "haldus.html"
      - "tingimused.html"
      - "terms-registration-ui.test.js"
      - "initial-assessment-core.js"
      - "initial-assessment-core.test.js"
      - "initial-assessment-ui.test.js"
      - "student-portal-scope-ui.test.js"
      - "haldus-learning-profile/**"
      - "learning-profile-core.js"
      - "learning-profile-core.test.js"
      - "learning-profile-evidence-store.js"
      - "learning-profile-evidence-store.test.js"
      - "learning-profile-ui.test.js"
      - "learning-profile-routing.test.js"
      - "haldus-adaptive-lesson/**"
      - "adaptive-lessons/**"
      - "adaptive-lesson-core.js"
      - "adaptive-lesson-core.test.js"
      - "learning-session-core.js"
      - "learning-session-core.test.js"
      - "learning-session-store.js"
      - "learning-session-ui.test.js"
      - "vercel.json"
      - ".github/workflows/financial-core-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Run unit tests
        run: npm test --prefix functions
      - name: Run CRM, accounting, calendar and learning tests
        run: node --test haldus-quality.test.js calendar-core.test.js learning-library-core.test.js live-classroom-core.test.js staff-activity.test.js staff-time-core.test.js accounting-ledger-core.test.js teacher-scope-ui.test.js terms-registration-ui.test.js initial-assessment-core.test.js initial-assessment-ui.test.js student-portal-scope-ui.test.js learning-profile-core.test.js learning-profile-evidence-store.test.js learning-profile-ui.test.js learning-profile-routing.test.js learning-session-core.test.js learning-session-ui.test.js
      - name: Check browser JavaScript syntax
        run: |
          node --check haldus-quality.js
          node --check calendar-core.js
          node --check learning-library-core.js
          node --check learning-profile-core.js
          node --check learning-profile-evidence-store.js
          node --check learning-session-core.js
          node --check learning-session-store.js
          node --check live-classroom-core.js
          node --check live-classroom.js
          node --check staff-activity.js
          node --check staff-time-core.js
          node --check accounting-ledger-core.js
          node --check initial-assessment-core.js
      - name: Run emulator integration tests
        run: >-
          npx --yes firebase-tools@15.22.3 emulators:exec
          --only auth,firestore,functions
          --project demo-keelesepp-finance
          --log-verbosity QUIET
          "npm --prefix functions run test:emulator"