      - "adaptive-lessons/**"
      - "adaptive-lesson-core.js"
      - "adaptive-lesson-core.test.js"
      - "adaptive-vocabulary-lesson.test.js"
      - "adaptive-skill-engine.js"
      - "adaptive-skill-engine.test.js"
      - "lesson-cloud-store.js"
      - "lesson-block-templates.js"
      - "lesson-builder-ux-core.js"
      - "lesson-builder-ux-core.test.js"
      - "lesson-authoring-presentation.js"
      - "tests/lesson-builder/**"
