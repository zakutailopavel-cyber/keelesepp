name: Apply whiteboard release

on:
  push:
    branches:
      - feature/whiteboard-production
    paths:
      - .github/workflows/apply-whiteboard-release.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/whiteboard-production
          fetch-depth: 0

      - name: Reconstruct audited release files
        run: python3 .release/apply_whiteboard_release.py

      - name: Validate whiteboard JavaScript and Vercel config
        run: |
          python3 -m json.tool vercel.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          html = Path('haldus-whiteboard/index.html').read_text(encoding='utf-8')
          script = html.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/whiteboard-inline.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/whiteboard-inline.js
          git diff --check

      - name: Commit release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add haldus.html firestore.rules haldus-whiteboard/index.html
          if git diff --cached --quiet; then
            echo "No release changes to commit"
            exit 0
          fi
          git commit -m "feat: add collaborative student whiteboard"
          git push origin HEAD:feature/whiteboard-production
