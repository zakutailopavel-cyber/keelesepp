<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KeeleSepp · Tunni illustratsioonid</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<style>
:root{--cream:#f8f3e9;--paper:#fffdfa;--navy:#172a3d;--muted:#6d7480;--gold:#bd852d;--green:#2d6957;--line:#e8e0d3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px 60px}.brand{font-family:Georgia,serif;font-size:1.55rem;font-weight:800;margin-bottom:24px}.brand span{color:var(--gold)}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 48px rgba(49,40,28,.08)}h1{font-family:Georgia,serif;margin:0 0 8px;font-size:1.75rem}.sub{color:var(--muted);line-height:1.5;margin-bottom:22px}.grid{display:grid;gap:14px}.field{display:grid;gap:6px}.field label{font-size:.78rem;font-weight:800}.field input{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 13px;color:var(--navy)}.path{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:#f3efe8;border-radius:10px;padding:10px;overflow-wrap:anywhere}.preview{display:none;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#efe8da}.preview img{display:block;width:100%;height:auto}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:850;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#eee8de;color:var(--navy)}.status{margin-top:14px;padding:12px;border-radius:12px;background:#f3efe8;line-height:1.45}.ok{background:#edf5f1;color:#245044}.bad{background:#fff0e7;color:#8a3d22}@media(max-width:600px){.wrap{padding:18px 12px 40px}.card{padding:18px}h1{font-size:1.45rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Keele<span>Sepp</span></div>
  <div class="card">
    <h1>Tunni illustratsiooni üleslaadimine</h1>
    <div class="sub">Fail salvestatakse Firebase Storage'isse stabiilse scene ID järgi. Lesson Mode kasutab sama scene ID-d ning ei hoia pilti HTML-is ega JavaScriptis.</div>
    <div class="grid">
      <div class="field"><label>Scene ID</label><input id="sceneId" value="bus-delay-01"></div>
      <div class="field"><label>Lesson ID</label><input id="lessonId" value="est-b1-city-problem-solving-01"></div>
      <div class="field"><label>Fail</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></div>
      <div class="field"><label>Storage path</label><div class="path" id="path"></div></div>
      <div class="preview" id="preview"><img id="previewImg" alt="Valitud tunni illustratsioon"></div>
    </div>
    <div class="actions"><button class="btn primary" id="upload">Laadi Firebase Storage'isse</button><button class="btn secondary" id="copy" type="button">Kopeeri URL</button></div>
    <div class="status" id="status">Ootan Firebase'i autentimist…</div>
  </div>
</div>
<script>
(function(){
  const cfg={apiKey:'AIzaSyAp8emBOh1fIqv72k_O5hkLkXVkfBt1al4',authDomain:'keelesepp-5136b.firebaseapp.com',projectId:'keelesepp-5136b',storageBucket:'keelesepp-5136b.firebasestorage.app',messagingSenderId:'674098517935',appId:'1:674098517935:web:e73d04a4ada67874da015a'};
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  const auth=firebase.auth(), storage=firebase.storage();
  const $=id=>document.getElementById(id); let lastUrl='';
  function storagePath(){const lesson=$('lessonId').value.trim();const scene=$('sceneId').value.trim();return `lesson-scenes/${lesson}/${scene}.jpg`;}
  function refreshPath(){$('path').textContent=storagePath();}
  $('lessonId').oninput=refreshPath;$('sceneId').oninput=refreshPath;refreshPath();
  auth.onAuthStateChanged(user=>{if(user){$('status').className='status ok';$('status').textContent=`Sisse logitud: ${user.email||user.uid}. Valige pilt ja laadige see Storage'isse.`;}else{$('status').className='status bad';$('status').textContent='Firebase kasutaja ei ole sisse logitud. Ava see leht samas CRM brauseris, kus administraator/õpetaja on juba sisse logitud.';}});
  $('file').onchange=()=>{const f=$('file').files[0];if(!f)return;const u=URL.createObjectURL(f);$('previewImg').src=u;$('preview').style.display='block';};
  $('upload').onclick=async()=>{const user=auth.currentUser,f=$('file').files[0];if(!user){$('status').className='status bad';$('status').textContent='Üleslaadimiseks peab Firebase kasutaja olema sisse logitud.';return}if(!f){$('status').className='status bad';$('status').textContent='Valige kõigepealt pildifail.';return}if(f.size>5*1024*1024){$('status').className='status bad';$('status').textContent='Pilt on liiga suur. Maksimaalne suurus on 5 MB.';return}const path=storagePath();$('upload').disabled=true;$('status').className='status';$('status').textContent='Laadin üles…';try{const ref=storage.ref(path);await ref.put(f,{contentType:f.type||'image/jpeg',customMetadata:{sceneId:$('sceneId').value.trim(),lessonId:$('lessonId').value.trim()}});lastUrl=await ref.getDownloadURL();$('status').className='status ok';$('status').textContent=`Valmis. Scene on Firebase Storage'is: ${path}`;}catch(e){console.error(e);$('status').className='status bad';$('status').textContent=`Üleslaadimine ebaõnnestus: ${e.message||e.code}`;}finally{$('upload').disabled=false}};
  $('copy').onclick=async()=>{if(!lastUrl){$('status').className='status bad';$('status').textContent='URL tekib pärast edukat üleslaadimist.';return}await navigator.clipboard.writeText(lastUrl);$('status').className='status ok';$('status').textContent='Firebase download URL kopeeritud.';};
})();
</script>
</body></html>
