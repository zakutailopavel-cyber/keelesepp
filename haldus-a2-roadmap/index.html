<!doctype html>
<html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KeeleSepp — A2 õppekava paigaldamine</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#EEECE7;color:#1C2B3A;font-family:Arial,sans-serif}.card{max-width:560px;margin:12vh auto;background:#fff;border:1px solid #DDD8CF;border-radius:16px;padding:28px;box-shadow:0 10px 35px rgba(28,43,58,.08)}h1{margin:0 0 10px;font-size:1.45rem}p{line-height:1.55;color:#607086}.bar{height:7px;border-radius:99px;background:#EEEAE4;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:20%;background:#2F5D50;animation:load 1.2s ease-in-out infinite alternate}@keyframes load{to{width:100%}}.err{color:#922;background:#FBEAEA;padding:12px;border-radius:9px;margin-top:14px}.done{color:#245044;background:#E7F2ED;padding:12px;border-radius:9px;margin-top:14px}a{color:#2F5D50;font-weight:700}</style></head>
<body><main class="card"><h1>A2 õppekava paigaldamine</h1><p id="status">Paigutan <b>100 A2 õppetundi</b> olemasolevasse <b>Eesti keel → A2</b> õppekavasse. Stabiilsed tunni-ID-d võimaldavad sama paigaldust turvaliselt korrata.</p><div class="bar" id="bar"><i></i></div><div id="msg"></div></main>
<script>(function(){
const cfg={apiKey:"AIzaSyAp8emBOh1fIqv72k_O5hkLkXVkfBt1al4",authDomain:"keelesepp-5136b.firebaseapp.com",projectId:"keelesepp-5136b",storageBucket:"keelesepp-5136b.firebasestorage.app",messagingSenderId:"674098517935",appId:"1:674098517935:web:e73d04a4ada67874da015a"};if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore();const status=document.getElementById('status'),msg=document.getElementById('msg'),bar=document.getElementById('bar');
function extra(l){const k=(l.kind||'').toLowerCase();if(k==='assessment')return 'Сделай контроль переноса навыка: не только формы, но и реальная коммуникативная задача. Добавь короткий чек-лист оценки.';if(k==='grammar')return 'Сначала дай контекст и замечание закономерности, затем контролируемую практику и обязательный перенос в собственную речь.';if(k==='listening')return 'Добавь задачу до прослушивания, два прослушивания с разными целями и короткую реакцию после.';if(k==='reading')return 'Добавь практический текст A2, поиск цели и ключевой информации, затем короткую устную реакцию.';if(k==='writing')return 'Дай адресата и цель, опору-план, полезные фразы, объём и самопроверку.';return 'Сделай практический A2-лист с понятным контекстом, управляемой практикой и самостоятельным использованием.'}
function prompt(m,l){return `Сгенерируй рабочий лист для языковой школы KeeleSepp by EP Koolitus. Формат A4, вертикальный. Ученик один. Уровень A2. Основной язык заданий — эстонский. Тема: «${l.title}». Модуль: «${m.title}». Цель: ${l.goal} Языковой/коммуникативный фокус: ${l.focus} Практика: ${l.practice} Критерий успеха: ${l.success} Методика: контекст → замечание → практика → самостоятельное применение. ${extra(l)} Не упрощай материал ниже A2.`}
async function loadRoadmap(){const manifest=await fetch('/data/keelesepp-a2-roadmap.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Roadmap manifest '+r.status);return r.json()});const parts=await Promise.all(manifest.shards.map(url=>fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(url+' '+r.status);return r.json()})));return {...manifest,modules:parts.flatMap(part=>part.modules)}}
function payload(R,m,l,u){return{type:'lesson',title:l.title,subject:'Eesti keel',level:'A2',topic:String(m.number).padStart(2,'0')+'. '+m.title,order:l.number,curriculumId:R.id,curriculumTitle:R.title,sourceKey:l.sourceKey,roadmapLessonId:l.id,roadmapLessonNumber:l.number,roadmapModuleId:m.id,roadmapModuleNumber:m.number,roadmapModuleTitle:m.title,roadmapModuleGoal:m.goal,roadmapModuleAttention:m.attention,roadmapTag:l.tag,roadmapKind:l.kind,levelStage:l.levelStage,goal:l.goal,languageFocus:l.focus,practice:l.practice,successCriteria:l.success,skills:l.skills||[],worksheetPrompt:prompt(m,l),contactMinutes:R.lessonMinutes||60,roadmapVersion:R.version,roadmapManaged:true,authorUid:u.uid,authorName:u.displayName||u.email||'',updatedAt:firebase.firestore.FieldValue.serverTimestamp()}}
async function migrate(u){const userDoc=await db.collection('users').doc(u.uid).get(),role=userDoc.exists?userDoc.data().role:'';if(!(role==='admin'||role==='teacher'||(u.email||'').toLowerCase()==='zakutailo.pavel@gmail.com'))throw new Error('Vaja on õpetaja või administraatori õigusi.');const R=await loadRoadmap(),items=R.modules.flatMap(m=>m.lessons.map(l=>({m,l})));if(R.id!=='est-a2-curriculum-v1'||R.level!=='A2'||R.modules.length!==20||items.length!==100)throw new Error('A2 õppekava struktuur ei vasta 20 mooduli / 100 tunni lepingule.');for(let n=5;n<=100;n+=5){if(items[n-1]?.l?.kind!=='assessment')throw new Error('Kontrollpunkt puudub tunnis '+n)}const batch=db.batch();for(const {m,l} of items){batch.set(db.collection('curriculumLessons').doc(l.id),payload(R,m,l,u),{merge:true})}await batch.commit();bar.style.display='none';status.innerHTML='Valmis. <b>100 A2 õppetundi</b> on nüüd Õppekavades.';msg.className='done';msg.textContent='Avan A2 õppekava…';window.sessionStorage.removeItem('keelesepp-a2-roadmap-import-attempt');setTimeout(()=>location.replace('/haldus-exercises/?tab=curriculum&subject=Eesti%20keel&level=A2'),900)}
auth.onAuthStateChanged(u=>{if(!u){bar.style.display='none';status.textContent='Logi esmalt CRM-i sisse.';msg.innerHTML='<a href="/haldus/">Ava CRM</a>';return}migrate(u).catch(e=>{bar.style.display='none';msg.className='err';msg.textContent='Uuendamine ebaõnnestus: '+e.message})});})();</script></body></html>
